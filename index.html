irst antibiotic to cure tuberculosis, a disease that had killed millions. For this contribution he was awarded the Nobel Prize in Medicine in 1952. Streptomycin saved millions of tuberculosis patients around the world, and opened the era of antibiotics against deadly bacterial diseases."}, "changed": ["source_url", "source_label", "citations", "media_urls", "source_label_en", "location", "people", "deed_type", "actor_type", "beneficiary", "audit", "summary_short", "summary_short_en"], "m_before": {"citations": 2, "domains": 1, "images": 1, "people": 0, "videos": 0, "location": 0, "honors": 0, "chars": 365, "std": 17}, "m_after": {"citations": 8, "domains": 5, "images": 9, "people": 6, "videos": 1, "location": 1, "honors": 0, "chars": 365, "std": 33}, "std_total": 46, "failing": [36, 42, 43, 44, 48, 49, 57, 62, 64, 65, 66, 67, 77]}, {"id": "41f71ed3-5aae-4f2f-a35a-3cb64a9a1283", "title": "עזר מציון הקימה מאגר מח עצם אחרי שמשה סחייק מת בלי תורם", "year": 1998, "before": {"id": "41f71ed3-5aae-4f2f-a35a-3cb64a9a1283", "title": "עזר מציון מפעילה את מאגר מח העצם היהודי הגדול בעולם", "description": "עזר מציון, שנוסדה ב-1979 בידי חנניה צ'ולק, מפעילה את מאגר תורמי מח העצם היהודי הגדול בעולם. המאגר הוקם ב-1998 בידי ד\"ר ברכה זיסר ובעלה מוטי ז\"ל, אחרי שהתמודדו ב-1991 עם מחלת הלוקמיה של בעלה ולא נמצא לו תורם מתאים. מבצע הגיוס הראשון היה ב-1996 עבור משה סחייק ז\"ל וגייס 5,000 תורמים; שנתיים אחר כך קם המאגר. מ-2005 כל מתגייס לצה\"ל יכול להצטרף במסגרת פרויקט \"מתגייסים לחיים\", וכך חצי מן הרשומים הצטרפו ביום גיוסם. נכון ליולי 2026 המאגר כולל למעלה מ-1,302,613 תורמים פוטנציאליים, וסייע ב-6,652 השתלות מצילות חיים עבור מרכזי השתלה ב-50 מדינות. כ-70% מן החולים בישראל מקבלים היום את התרומה מתורם מקומי, לעומת ממוצע עולמי של 50%. כל שירותי הארגון ניתנים בחינם, בסיוע כ-30,000 מתנדבים ב-60 סניפים ברחבי הארץ (לפי דיווח הארגון). על מכלול פעילותה הוענק לעזר מציון פרס ישראל לשנת תשס\"ח (2008) לתרומה מיוחדת לחברה ולמדינה. בסרטון נפגש רוי הקטן עם נועם, האיש שתרם לו מח עצם והציל את חייו.", "category": "חסד", "year": 1998, "media_type": "video_embed", "media_url": "https://www.youtube.com/watch?v=RDqJBLJ3_as", "source_url": "https://www.ezermizion.org/bone-marrow-registry/", "source_label": "אתר עזר מציון — מאגר מח העצם", "submitted_by": null, "status": "approved", "created_at": "2026-07-26 23:11:06.272063+00", "citations": [{"quote": "the world's largest Jewish bone marrow donor registry", "locator": "Times of Israel, 29 May 2020 — כתבה על שליח ההשתלות מישל זריאן, מפי ברכה זיסר, מנהלת עזר מציון", "locator_en": "Times of Israel, 29 May 2020 — a report on transplant courier Michel Zerian, quoting Bracha Zisser, director of Ezer Mizion", "source_url": "https://www.timesofisrael.com/70-days-in-airports-an-israeli-courier-keeping-global-organ-transplants-alive/", "source_label": "טיימס אוף ישראל, מאי 2020", "source_label_en": "Times of Israel, May 2020"}, {"quote": "המאגר הלאומי לתורמי מח עצם בעזר מציון, חצה לראשונה את מיליון הישראלים החברים בו והוא המאגר הגדול ביותר בעולם ביחס לאוכלוסייה. מאגר התרומות שנוסד בשנת 1998 עומד מאחורי 3,466 השתלות מח עצם", "locator": "ynet, 27 בינואר 2020 — ענבר טויזר, במסיבת עיתונאים לרגל חציית קו המיליון, בהשתתפות שר הבריאות ליצמן ושר הביטחון בנט", "quote_en": "The national bone marrow donor registry at Ezer Mizion has crossed one million Israeli members for the first time and is the largest registry in the world relative to population. The donor registry, founded in 1998, stands behind 3,466 bone marrow transplants", "locator_en": "ynet, 27 January 2020 — Inbar Tuizer, at a press conference marking the crossing of the one-million mark, attended by Health Minister Litzman and Defense Minister Bennett", "source_url": "https://www.ynet.co.il/articles/0,7340,L-5667184,00.html", "source_label": "ynet, ינואר 2020 — ענבר טויזר", "source_label_en": "Ynet (Hebrew), Jan 2020 — Inbar Tvizer"}, {"quote": "מאגר מח העצם חצה לראשונה את קו מיליון הרשומים, והפך למאגר הגדול ביותר בעולם ביחס לאוכלוסייה. המאגר הוא גם הצעיר ביותר בעולם", "locator": "N12/mako, 27 בינואר 2020 — דיווח 'החדשות 12'", "quote_en": "The bone marrow registry has crossed the one-million-registrants mark for the first time, becoming the largest registry in the world relative to population. The registry is also the youngest in the world", "locator_en": "N12/mako, 27 January 2020 — a 'Channel 12 News' report", "source_url": "https://www.mako.co.il/news-israel/2020_q1/Article-f27b2dbf2a6ef61026.htm", "source_label": "N12 (מאקו), ינואר 2020", "source_label_en": "N12 (Mako), Jan 2020"}, {"quote": "Israeli organization Ezer Mizion has already saved almost 5,000 lives through their Jewish bone marrow database of over 1.2 million potential donors", "locator": "ynetnews (Emily Schrader) — כתבה על מרי פולטין; מפי ד\"ר ברכה זיסר", "locator_en": "ynetnews (Emily Schrader) — an article on Mary Poultin; quoting Dr. Bracha Zisser", "source_url": "https://www.ynetnews.com/health_science/article/rkfv5cbz2", "source_label": "Ynetnews — מדע ובריאות", "source_label_en": "Ynetnews — Health & Science"}, {"quote": "In 1998, Dr. Zisser and Ezer Mizion created the first Jewish database of donors in Israel to assist Jewish individuals in need internationally and increase the odds of finding matching donors for patients in need.", "locator": "ynetnews (Emily Schrader) — סיפור ההקמה; בעלה של זיסר, מרדכי, חלה בלוקמיה ב-1991", "locator_en": "ynetnews (Emily Schrader) — the founding story; Zisser's husband, Mordechai, fell ill with leukemia in 1991", "source_url": "https://www.ynetnews.com/health_science/article/rkfv5cbz2", "source_label": "Ynetnews — מדע ובריאות", "source_label_en": "Ynetnews — Health & Science"}, {"quote": "The Ezer Mizion bone marrow registry has been instrumental in saving 2,200 lives, of which 1,100 were saved through IDF donations.", "locator": "The Jerusalem Post, 21 September 2016 — Greer Fay Cashman, על עשור לשיתוף הפעולה עם צה\"ל", "locator_en": "The Jerusalem Post, 21 September 2016 — Greer Fay Cashman, on a decade of cooperation with the IDF", "source_url": "https://www.jpost.com/Business-and-Innovation/Health-and-Science/Ezer-Mizion-IDF-mark-a-decade-of-partnership-468282", "source_label": "ג'רוזלם פוסט, ספטמבר 2016", "source_label_en": "The Jerusalem Post, Sep 2016"}, {"quote": "2008 Ezer Mizion lifetime achievement & special contribution to society and the State", "locator": "Jewish Virtual Library — רשימת מקבלי פרס ישראל (PDF), עמ' של שנת 2008", "locator_en": "Jewish Virtual Library — list of Israel Prize laureates (PDF), the 2008 page", "source_url": "https://jewishvirtuallibrary.org/jsource/images/israel/Israelprize.pdf", "source_label": "Jewish Virtual Library — רשימת פרס ישראל", "source_label_en": "Jewish Virtual Library — Israel Prize list (PDF)"}, {"quote": "Since its founding in 1979, Ezer Mizion has grown to become one of the largest non-profit organizations in Israel, benefiting over 750,000 people every year. Ezer Mizion was founded in 1979 by Chananya Chollak. Ezer Mizion has 60 branches throughout Israel, with 30,000 volunteers.", "locator": "אתר עזר מציון — About; נשלף 9.8.2026; לפי דיווח הארגון", "locator_en": "Ezer Mizion website — About; retrieved 9 Aug 2026; as reported by the organization", "source_url": "https://ezermizion.org/about-ezer-mizion-israel", "source_label": "אתר עזר מציון — אודות", "source_label_en": "Ezer Mizion — About Us"}, {"quote": "Today, Ezer Mizion's Bone Marrow Registry is the largest Jewish registry in the world.", "locator": "אתר עזר מציון; נשלף 9.8.2026; לפי דיווח הארגון", "locator_en": "Ezer Mizion website; retrieved 9 Aug 2026; as reported by the organization", "source_url": "https://www.ezermizion.org/bone-marrow-registry/", "source_label": "אתר עזר מציון — מאגר מח העצם", "source_label_en": "Ezer Mizion — Bone Marrow Registry"}, {"quote": "Since the establishment in 1998, Ezer Mizion's Bone Marrow Donor Registry has handled thousands of search requests from dozens of transplant centers in 50 countries around the world. Ezer Mizion's Bone Marrow Registry has facilitated 6,652 lifesaving transplants, saving the lives of patients throughout the world and sparing thousands of people untold anguish.", "locator": "אתר עזר מציון; נשלף 9.8.2026; לפי דיווח הארגון", "locator_en": "Ezer Mizion website; retrieved 9 Aug 2026; as reported by the organization", "source_url": "https://www.ezermizion.org/bone-marrow-registry/", "source_label": "אתר עזר מציון — מאגר מח העצם", "source_label_en": "Ezer Mizion — Bone Marrow Registry"}, {"quote": "As of July 1, 2026, the Bone Marrow Registry has grown to include more than 1,302,613 potential donors!", "locator": "אתר עזר מציון; נשלף 9.8.2026; לפי דיווח הארגון", "locator_en": "Ezer Mizion website; retrieved 9 Aug 2026; as reported by the organization", "source_url": "https://www.ezermizion.org/bone-marrow-registry/", "source_label": "אתר עזר מציון — מאגר מח העצם", "source_label_en": "Ezer Mizion — Bone Marrow Registry"}, {"quote": "בשנת 1996 התקיים מבצע גיוס התרומות הראשון לתורמי מח עצם במסגרתו גויסו 5,000 התורמים הראשונים לטובת משה סחייק ז\"ל. שנתיים לאחר מכן, הקימו מוטי ז\"ל וד\"ר ברכה זיסר יחד עם עמותת \"עזר מציון\" את המאגר.", "locator": "ynet, 27 בינואר 2020 — ענבר טויזר", "quote_en": "In 1996, the first bone marrow donor recruitment drive was held, during which the first 5,000 donors were recruited for the benefit of the late Moshe Sahayek. Two years later, the late Moti and Dr. Bracha Zisser, together with the 'Ezer Mizion' association, established the registry.", "locator_en": "ynet, 27 January 2020 — Inbar Tuizer", "source_url": "https://www.ynet.co.il/articles/0,7340,L-5667184,00.html", "source_label": "ynet, ינואר 2020 — ענבר טויזר", "source_label_en": "Ynet (Hebrew), Jan 2020 — Inbar Tvizer"}, {"quote": "כמחצית מהתורמים הפוטנציאלים הצטרפו ביום גיוסם לצה\"ל, הדבר מתרחש מאז שנת 2005 עם חתימת הסכם שיתוף הפעולה \"מתגייסים לחיים\" בין צה\"ל לבין המאגר.", "locator": "ynet, 27 בינואר 2020 — ענבר טויזר", "quote_en": "About half of the potential donors joined on the day they were drafted into the IDF. This has been happening since 2005, following the signing of the 'Enlisting for Life' cooperation agreement between the IDF and the registry.", "locator_en": "ynet, 27 January 2020 — Inbar Tuizer", "source_url": "https://www.ynet.co.il/articles/0,7340,L-5667184,00.html", "source_label": "ynet, ינואר 2020 — ענבר טויזר", "source_label_en": "Ynet (Hebrew), Jan 2020 — Inbar Tvizer"}, {"quote": "כ-70% מהחולים בארץ כיום מקבלים תרומת מח עצם מתורם הרשום בישראל, זאת לעומת הממוצע העולמי העומד על כ-50% מהחולים שמקבלים תרומה מהמאגר המקומי.", "locator": "ynet, 27 בינואר 2020 — ענבר טויזר", "quote_en": "About 70% of patients in Israel today receive bone marrow donations from a donor registered in Israel, compared to the global average of about 50% of patients who receive donations from the local registry.", "locator_en": "ynet, 27 January 2020 — Inbar Tuizer", "source_url": "https://www.ynet.co.il/articles/0,7340,L-5667184,00.html", "source_label": "ynet, ינואר 2020 — ענבר טויזר", "source_label_en": "Ynet (Hebrew), Jan 2020 — Inbar Tvizer"}, {"note": "trimmed: the Israel Prize sentence is not adjacent in the article; it is sourced separately from the Jewish Virtual Library citation", "quote": "Ezer Mizion, established in 1979, runs the world's largest Jewish Bone Marrow Donor Registry.", "locator": "ויקיפדיה — הובאה בסוף לצורך השלמה בלבד; שנת 1979 ופרס ישראל 2008 מגובים בציטוטים 7 ו-8 לעיל ממקורות עצמאיים", "locator_en": "Wikipedia — cited last, for completeness only; the year 1979 and the 2008 Israel Prize are backed by citations 7 and 8 above, from independent sources", "source_url": "https://en.wikipedia.org/wiki/Ezer_Mizion", "source_label": "ויקיפדיה האנגלית — Ezer Mizion", "source_label_en": "Wikipedia — Ezer Mizion"}], "act": "הקמה והפעלה של מאגר תורמי מח העצם היהודי הגדול בעולם, שמאתר תורמים מתאימים לחולי לוקמיה ומחלות דם ומספק את כל שירותיו ללא תשלום.", "ripple": "6,652 השתלות מח עצם יצאו לפועל בזכות המאגר, וחולים שלא נמצאה להם התאמה במקום אחר בעולם קיבלו סיכוי לחיים. המאגר הישראלי הפך לגדול בעולם ביחס לאוכלוסייה, ו-70% מהחולים בישראל מקבלים כיום תרומה מתורם מקומי (לעומת 50% במדינות אחרות). הארגון זכה בפרס ישראל תשס\"ח (2008) לתרומה מיוחדת לחברה ולמדינה, לצד הסוכנות היהודית, ויצו, נעמת, אמונה, פרח, מועצת תנועות הנוער והתאחדות התעשיינים.", "title_reasoning": "הכותרת נשארת כפי שהיא (הנחיית batch-2.md: 'הכותרת נשארת'). מאומתת ממקור עיתונאי עצמאי — Times of Israel, מאי 2020 — 'the world's largest Jewish bone marrow donor registry', מפי מנהלת המאגר ברכה זיסר. הפועל 'מפעילה' (הווה) מתאים כי הפעולה נמשכת. שנת המעשה שונתה מ-1979 (ייסוד עזר מציון) ל-1998 (ייסוד המאגר עצמו) — לפי הכותרת, המעשה הוא המאגר, לא הארגון.", "media_urls": ["https://www.youtube.com/watch?v=RDqJBLJ3_as", "https://upload.wikimedia.org/wikipedia/commons/7/7b/Ezer_Mizion_ambulance.jpg"], "title_en": "Ezer Mizion Operates the World's Largest Jewish Bone Marrow Registry", "description_en": "Ezer Mizion, founded in 1979 by Chananya Chollak, operates the world's largest Jewish bone marrow donor registry. The registry itself was established in 1998 by Dr. Bracha Zisser and her late husband Moti, after his 1991 leukemia diagnosis for which no matching donor was found. The first donor drive was held in 1996 for Moshe Schayek, enrolling 5,000 donors; the formal registry was launched two years later. Since 2005, IDF recruits can join on induction day through the \"Enlisting for Life\" partnership, and roughly half of all registered donors signed up on that day. As of July 2026, the registry includes over 1,302,613 potential donors and has facilitated 6,652 lifesaving transplants for transplant centers in 50 countries. Some 70% of Israeli patients today receive their transplant from a local donor, versus a global average of 50%. All services are provided free of charge, with approximately 30,000 volunteers across 60 branches in Israel (per the organization's own report). For its overall work Ezer Mizion received the 2008 Israel Prize for lifetime achievement and special contribution to society and the State. In the video, young Roy meets Noam, the man who donated bone marrow and saved his life.", "act_en": "Establishment and operation of the world's largest Jewish bone marrow donor registry, matching donors to leukemia and blood disease patients, with all services provided free of charge.", "ripple_en": "6,652 bone marrow transplants have been facilitated through the registry, giving patients who found no match elsewhere a chance at life. Israel's registry is the largest in the world per capita, and 70% of Israeli patients now receive a transplant from a local donor (versus 50% in other countries). The organization received the 2008 Israel Prize for lifetime achievement and special contribution to society, alongside the Jewish Agency, WIZO, Na'amat, Emunah, Perach, the Youth Movements Council, and the Manufacturers Association of Israel.", "source_label_en": "Ezer Mizion — Bone Marrow Registry", "categories": null, "location": null, "people": null, "deed_type": null, "actor_type": null, "beneficiary": null, "audit": null, "dedup": null, "origin_story": null, "origin_story_en": null, "aftermath": null, "aftermath_en": null, "recognition": null, "recognition_en": null, "honors": null}, "after": {"id": "41f71ed3-5aae-4f2f-a35a-3cb64a9a1283", "title": "עזר מציון הקימה מאגר מח עצם אחרי שמשה סחייק מת בלי תורם", "description": "המאגר הלאומי לתורמי מח עצם שמפעילה עמותת עזר מציון: מאגר של יותר ממיליון ישראלים שנבדקו גנטית, שמתוכו מאתרים תורם מתאים לחולי לוקמיה ומחלות דם קשות — בישראל ובעשרות מרכזי השתלה בעולם. הוא נוסד ב-1998, שנתיים אחרי מבצע גיוס שנכשל, וחצה את מיליון הרשומים בינואר 2020.", "category": "חסד", "year": 1998, "media_type": "image", "media_url": "https://upload.wikimedia.org/wikipedia/commons/a/ac/Bracha_Zisser_1.jpg", "source_url": "https://www.ezermizion.org/bone-marrow-registry/", "source_label": "עזר מציון — מאגר תורמי מח העצם (אתר הארגון)", "submitted_by": null, "status": "approved", "created_at": "2026-07-26 2 fter a recruitment drive that failed, it crossed one million registrants in January 2020.", "act_en": "Building and running a national bone marrow donor registry: recruiting volunteers, HLA-typing every registrant, and locating a genetically matched donor for a patient — for transplant centers in Israel and dozens of countries. The registry handles thousands of search requests from transplant centers in 50 countries, is affiliated with the American NMDP and is an accredited member of the WMDA, the global standards body for registries.", "ripple_en": "According to Ezer Mizion, the registry has facilitated 6,652 lifesaving transplants; ynet reported 3,466 transplants as of January 2020. The impact also shows in the ratio: WMDA data indicate about 70% of Israeli patients now receive a donation from a donor registered in Israel, against a global average of roughly 50%, and imported donations have fallen by about half. At the million-milestone press conference three donor-recipient pairs met — Irit Yaari, who recovered from myelofibrosis, met her donor Mor Elhadad; Doron Nissim, transplanted at Sheba, met Mira Lavi, who had donated to him.", "source_label_en": "Ezer Mizion — Bone Marrow Registry (organization site)", "categories": null, "location": {"lat": 32.087, "lng": 34.8875, "city": "פתח תקווה", "basis": "שיוך המחברים בשני מאמרי PubMed רושם את המאגר כ-\"Ezer Mizion Bone Marrow Donor Registry, Petach Tikva, Israel\". מטה עזר מציון עצמה בבני ברק; לא הומצאה כתובת רחוב.", "country": "ישראל", "precision": "city"}, "people": [{"name_en": "Dr. Bracha Zisser", "name_he": "ד\"ר ברכה זיסר", "role_en": "Co-founder and director of the registry; director of Ezer Mizion's cancer support services", "role_he": "מייסדת-שותפה ומנהלת המאגר; מנהלת שירותי התמיכה בחולי סרטן של עזר מציון"}, {"name_en": "Moti Zisser", "name_he": "מוטי זיסר", "role_en": "Co-founder of the registry in 1998 (referred to in ynet as the late Moti Zisser)", "role_he": "מייסד-שותף של המאגר ב-1998 (נזכר בכתבת ynet roup": "מסיבת העיתונאים, 27 בינואר 2020 — תורמים פוגשים את מי שהצילו", "credit": "צילום: מוטי קמחי, ynet", "license": "© ynet — שימוש הוגן לצורך תיעוד האירוע", "verified": "HEAD 200, content-type image/jpeg", "caption_en": "The press conference marking the crossing of one million registered donors, attended by the health and defense ministers and the president of the World Marrow Donor Association", "caption_he": "מסיבת העיתונאים לרגל חציית קו מיליון התורמים הרשומים, בהשתתפות שרי הבריאות והביטחון ונשיא ארגון המאגרים העולמי", "source_page": "https://www.ynet.co.il/health/article/rkkjc7ncU"}], "lead_image_basis": "verified_portrait"}, "dedup": {"note": "לא נמצא ערך כפול. הערך הקיים עם אותו id הוא המעש הזה עצמו ונבנה מחדש מאפס. שכן קרוב ברשימה: \"הורים שאיבדו את בנם לסרטן הקימו את זכרון מנחם\" — גם הוא עוסק בחולי סרטן ובתרומות מח עצם, אך מדובר בארגון אחר, מייסדים אחרים ומעש אחר. אין מיזוג.", "duplicate": false, "checked_against": "deed-registry.md (כ-200 ערכים)"}, "origin_story": "ב-1996 פנה משה סחייק, צעיר שנזקק נואשות להשתלת מח עצם, לעזר מציון בבקשה לעזרה במציאת תורם מתאים. מחלקת התמיכה בחולי סרטן של העמותה סייעה למשפחתו לארגן מבצע גיוס תורמים. 5,000 איש נבדקו — ולא נמצאה אף התאמה. סחייק מת. אתר עזר מציון מנסח את זה בפשטות: \"no match was found among the 5,000 people who participated in the drive. Sadly, the young man died\" — ומוסיף שהוא הותיר מורשת שאפשרה לעשרות חולים אחרים לחיות, כי מן הכישלון הזה נולד המאגר. שנתיים לאחר מכן, ב-1998, הקימו מוטי ז\"ל וד\"ר ברכה זיסר יחד עם עמותת עזר מציון את המאגר הלאומי לתורמי מח עצם. עזר מציון עצמה נוסדה ב-1979 בידי חנניה צ'ולק כארגון תמיכה רפואית.", "origin_story_en": "In 1996 Moshe Schayek, a young man desperate for a bone marrow transplant, turned to Ezer Mizion for help finding a matching donor. The association's Cancer Support Division helped his family coordinate a donor drive. Five thousand people were tested — and no match was found. Schayek died. Ezer Mizion's own account is blunt: \"no match was found among the 5,000 people who participated in the drive. Sadly, the young man died\" — adding that he left a legacy that enabled dozens of other sick people to live, because the registry was born out of that failure. Two years later, in 1998, Moti Zisser z\"l and Dr. Bracha Zisser founded the national bone marrow donor registry together with Ezer Mizion. Ezer Mizion itself was founded in 1979 by Chananya Chollak as a medical support organization.", "aftermath": "המאגר גדל בעיקר דרך צה\"ל: מאז 2005, עם חתימת הסכם \"מתגייסים לחיים\", מצטרפים מתגייסים טריים למאגר ביום הגיוס בבדיקת רוק פשוטה. עד ינואר 2020 הצטרפו כך 576,766 ישראלים — כמחצית מחברי המאגר. בספטמבר 2016 ציינו עזר מציון וצה\"ל עשור לשותפות, אז עמד המספר על 2,200 חיים שניצלו, מהם 1,100 בזכות תרומות של חיילים. בינואר 2020 חצה המאגר את המיליון והפך, לפי נתוני WMDA, לגדול בעולם ביחס לאוכלוסייה; שליש מהתורמים בו מתחת לגיל 25, לעומת 14% בממוצע העולמי. בדיווח עזר מציון מ-1 ביולי 2026 עמד המאגר על יותר מ-1,302,613 תורמים פוטנציאליים. המאגר הפך גם לנכס מדעי: מאמר ב-HLA (2023) מדווח שבין ינואר 2018 ליוני 2021 גייס המאגר 223,960 תורמים, מיפה את כולם בריצוף דור חדש, וזיהה 122 אללים חדשים של HLA שלא היו רשומים במאגר העולמי — כלומר המאגר תורם ידע לגנטיקה, לא רק תאים.", "aftermath_en": "The registry grew mainly through the IDF: since the 2005 \"Enlisting for Life\" agreement, new recruits join on induction day via a simple saliva test. By January 2020, 576,766 Israelis had joined that way — about half the registry. In September 2016 Ezer Mizion and the IDF marked a decade of partnership, at which point 2,200 lives had been saved, 1,100 of them through IDF donations. In January 2020 the registry crossed one million and became, per WMDA data, the world's largest relative to population; a third of its donors are under 25, against a 14% global average. Ezer Mizion reported more than 1,302,613 potential donors as of July 1, 2026. The registry also became a scientific asset: a 2023 paper in HLA reports that between January 2018 and June 2021 it recruited 223,960 donors, typed them all by next-generation sequencing, and identified 122 novel HLA alleles absent from the global reference database — the registry contributes knowledge to genetics, not only cells.", "recognition": "ההוקרה כאן ארגונית ולא אישית. עזר מציון כולה זכתה בפרס ישראל לשנת תשס\"ח (2008) — המרכז הרפואי שניידר, מקור בלתי-תלוי בארגון, מציין אותה כ\"זוכת פרס ישראל לשנת תשס\"ח\". הפרס ניתן לעמותה על מכלול פעילותה, לא למאגר מח העצם ולא למקימיו בנפרד. ההוקרה הפומבית שכן נקשרה למאגר היא אירוע ספטמבר 2016 בבית הנשיא לציון עשור לשותפות עם צה\"ל, שבו צולמה ד\"ר ברכה זיסר לצד הנשיא ראובן ריבלין — טקס, לא פרס. לא נמצא בחיפוש שלי פרס אישי, קתדרה או מינוי שהוענקו לברכה או למוטי זיסר על הקמת המאגר.", "recognition_en": "Recognition here is organizational, not personal. Ezer Mizion as a whole won the Israel Prize for 5768 (2008) — Schneider Children's Medical Center, a source independent of the organization, describes it as \"winner of the Israel Prize for 5768\". The prize was awarded to the association for its work as a whole, not to the bone marrow registry or its founders separately. The public recognition that did attach to the registry was the September 2016 event at the President's Residence marking a decade of IDF partnership, where Dr. Bracha Zisser was photographed beside President Reuven Rivlin — a ceremony, not a prize. My search found no personal prize, chair or appointment given to Bracha or Moti Zisser for founding the registry.", "honors": [{"note": "אומת מול מרכז שניידר, מקור בלתי-תלוי בארגון. gov.il החזיר 403 ולא שימש; ויקיפדיה אינה מקור (כלל 2).", "year": 2008, "source": "https://www.schneider.org.il/?CategoryID=305&ArticleID=2595", "name_en": "Israel Prize for 5768 (2008)", "name_he": "פרס ישראל לשנת תשס\"ח (2008)", "recipient": "עמותת עזר מציון (הארגון כולו, לא המאגר בנפרד)"}], "summary_short": "ב-1996 פנה משה סחייק, צעיר שנזקק נואשות להשתלת מח עצם, לעזר מציון כדי שיעזרו לו למצוא תורם. 5,000 איש נבדקו במבצע הגיוס שאורגן למענו, אף אחד מהם לא התאים, והוא מת. שנתיים אחר כך הקימו מוטי זיסר ז\"ל וד\"ר ברכה זיסר, יחד עם עמותת עזר מציון, את המאגר הלאומי לתורמי מח עצם שנולד מאותו כישלון. המאגר גדל בעיקר דרך צה\"ל: מאז 2005 מצטרפים אליו מתגייסים ביום הגיוס בבדיקת רוק פשוטה, וכך הגיעו כמחצית מהרשומים בו. בינואר 2020 הוא חצה את המיליון והפך, לפי נתוני ארגון המאגרים העולמי, לגדול בעולם ביחס לאוכלוסייה. באותה מסיבת עיתונאים נפגשו שלושה זוגות של תורמים ונתרמים, בהם אירית יערי, שהחלימה ממיאלופיברוזיס, והתורמת שלה מור אלחדד.", "summary_short_en": "In 1996 Moshe Schayek, a young man desperate for a bone marrow transplant, turned to Ezer Mizion to help him find a donor. Five thousand people were tested in the drive organized for him, not one of them matched, and he died. Two years later Moti Zisser z\"l and Dr Bracha Zisser, together with the Ezer Mizion association, founded the national bone marrow donor registry that was born out of that failure. The registry grew mainly through the IDF: since 2005 recruits join it on induction day with a simple saliva test, and that is how about half of its registrants arrived. In January 2020 it crossed one million and became, according to the world registry organization's data, the largest in the world relative to population. At that press conference three donor-recipient pairs met, among them Irit Yaari, who recovered from myelofibrosis, and her donor Mor Elhadad."}, "changed": ["title", "description", "media_type", "media_url", "source_label", "citations", "act", "ripple", "title_reasoning", "media_urls", "title_en", "description_en", "act_en", "ripple_en", "source_label_en", "location", "people", "deed_type", "actor_type", "beneficiary", "audit", "dedup", "origin_story", "origin_story_en", "aftermath", "aftermath_en", "recognition", "recognition_en", "honors", "summary_short", "summary_short_en"], "m_before": {"citations": 15, "domains": 8, "images": 1, "people": 0, "videos": 0, "location": 0, "honors": 0, "chars": 1381, "std": 19}, "m_after": {"citations": 17, "domains": 6, "i ed", "media_url": "https://www.youtube.com/watch?v=HFOvAnpiwYA", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10450639/", "source_label": "Journal of Global Health (מאמר אקדמי שפיט)", "submitted_by": null, "status": "approved", "created_at": "2026-06-19 19:24:32.485844+00", "citations": [{"quote": "On 8 February, the Israel Defense Forces' delegation, consisting of 140 members equipped with 17 tons of medical supplies and the capabilities of a level 3 field hospital, landed in Kahramanmaraş", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10450639/", "source_label": "Journal of Global Health, Nitecki et al. 2023", "source_label_en": "Journal of Global Health, Nitecki et al. 2023"}, {"quote": "In one week, 470 patients received treatment, 150 of whom were children, including individuals rescued after being trapped over 100 hours under rubble. Additionally, the Israeli team performed 10 surgical procedures.", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10450639/", "source_label": "Journal of Global Health, Nitecki et al. 2023", "source_label_en": "Journal of Global Health, Nitecki et al. 2023"}], "act": "משלחת צה\"ל נחתה בקהרמאנמרש עם בית-חולים שדה שלם, ימים אחרי שהאדמה רעדה", "ripple": "470 בני אדם — מוסלמים טורקים, כורדים ופליטים סורים — קיבלו טיפול רפואי מציל-חיים מידיים ישראליות, רחוק מכל מצלמה", "title_reasoning": "המקור (Journal of Global Health) אומר מילה-במילה: משלחת צה\"ל של 140 איש הקימה בית-חולים שדה רמה 3, ו-470 פצועים טופלו בשבוע כולל אנשים שחולצו אחרי 100+ שעות מתחת להריסות. בחרתי לכלול את שתי הפעולות (הקמה + חילוץ) כי יחד הן מספרות את הסיפור — תשתית והצלה ידנית. השארתי את המספר 470 ל-ripple ולא לכותרת (כותרת צריכה תמונה, לא מספר). 'מתחת להריסות' = הפרט שמכה.", "media_urls": [], "title_en": "The IDF Established a Field Hospital in Turkey and Rescued Casualties from the Rubble", "description_en": "After the catastrophic earthquake in Turkey and Syria on February 6, 2023, an IDF delegation of 140 crew members with 17 tons of medical equipment established a Level 3 field hospital in the city of Kahramanmaraş. In one week, 470 patients were treated, including 150 children, among them people rescued after more than 100 hours trapped beneath the rubble.", "act_en": "An IDF delegation landed in Kahramanmaraş with a fully operational field hospital, days after the earthquake struck.", "ripple_en": "470 people — Turkish Muslims, Kurds, and Syrian refugees — received life-saving medical care from Israeli hands, far from any camera.", "source_label_en": "Journal of Global Health (peer-reviewed academic article)", "categories": null, "location": null, "people": null, "deed_type": null, "actor_type": null, "beneficiary": null, "audit": null, "dedup": null, "origin_story": null, "origin_story_en": null, "aftermath": null, "aftermath_en": null, "recognition": null, "recognition_en": null, "honors": null}, "after": {"id": "f0ca86ec-0a88-4963-b340-ad2e4f790c2b", "title": "צה\"ל פתח מחדש בית-חולים נטוש בקהרמאנמרש וטיפל ב-470 פצועי רעידת האדמה", "description": "ב-6 בפברואר 2023, ב-4:17 לפנות בוקר, רעידת אדמה בעוצמה 7.8 החריבה את דרום-מזרח טורקיה וחלקים מסוריה והותירה יותר מ-50 אלף הרוגים. משלחת הרפואה הישראלית — כ-140 עד 150 איש: רופאים, אחיות, מנתחים, מרדימים, טכנאי רנטגן ומעבדה, פרמדיקים ואנשי לוגיסטיקה רפואית ממשרד הבריאות וממד\"א — נחתה בקהרמאנמרש ב-8 בפברואר עם 17 טונות ציוד רפואי ועם יכולות של בית-חולים שדה ברמה 3. התוכנית הייתה להקים בית-חולים עצמאי, ללא תשתית מקומית. בשטח התברר משהו אחר: בית-החולים הציבורי נג'יפ פאזל, דקות נסיעה מאתרי ההרס, עמד ריק — רוב הצוות והמאושפזים פונו או נמלטו — אך החשמל והמים בו עדיין פעלו. אחרי שמהנדסי צוות החילוץ הישראלי אישרו שהמבנה בטוח, המשלחת פתחה את בית-החולים מחדש בתוך 24 שעות והפעילה בו ארבע מחלקות: חדר מיון, טיפול נמרץ בן שש מיטות, חמישה חדרי ניתוח ומחלקת אשפוז בת 60 מיטות. בשבוע אחד טופלו 470 פצועים, מהם כ-150 ילדים וכ-50 מטופלי שיניים, בהם אנשים שחולצו לאחר יותר מ-100 שעות מתחת להריסות, ובוצעו 10 ניתוחים. הממשלה הטורקית גייסה במקביל צוותים רפואיים מכל טורקיה, ונוצרו צוותים מעורבים ישראליים-טורקיים שטיפלו בארבע שפות — טורקית, אנגלית, עברית וערבית.", "category": "חסד", "year": 2023, "media_type": "image", "media_url": "https://upload.wikimedia.org/wikipedia/commons/a/a5/Olive_Branches_Search_and_Rescue_Delegation%2C_February_2023_%28IDF_4%29.jpeg", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10450639/", "source_label": "Journal of Global Health — מאמר שפיט מאת חברי המשלחת, ניצקי, אוחיון ואלמוג, 2023", "submitted_by": null, "status": "approved", "created_at": "2026-06-19 19:24:32.485844+00", "citations": [{"quote": "On 8 February, the Israel Defense Forces' delegation, consisting of 140 members equipped with 17 tons of medical supplies and the capabilities of a level 3 field hospital", "locator": "פסקת הפתיחה, אחרי המשפט על תגובת הסיוע העולמית; DOI 10.7189/jogh.13.03049", "quote_en": "On 8 February, the Israel Defense Forces' delegation, consisting of 140 members equipped with 17 tons of medical supplies and the capabilities of a level 3 field hospital", "published": "2023-08-25", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10450639/", "source_label": "Journal of Global Health, כרך 13, מאמר 03049, ניצקי, אוחיון ואלמוג", "source_label_en": "Journal of Global Health, vol. 13, art. 03049, Nitecki, Ohayon & Almog"}, {"quote": "Realising the potential of this facility and following approval of its safety by engineers from the Israeli Search and Rescue team, our personnel re-opened the hospital and operated four departments: the emergency department (ED), a six-bed intensive care unit (ICU), the facility's five operating rooms and a 60-bed inpatient service. In one week, 470 patients received treatment, 150 of whom were children, including individuals rescued after being trapped over 100 hours under rubble.", "locator": "הפסקה המתארת את בית-החולים נג'יפ פאזל, מיד אחרי התיאור של המבנה שנעזב; DOI 10.7189/jogh.13.03049", "quote_en": "Realising the potential of this facility and following approval of its safety by engineers from the Israeli Search and Rescue team, our personnel re-opened the hospital and operated four departments: the emergency department (ED), a six-bed intensive care unit (ICU), the facility's five operating rooms and a 60-bed inpatient service. In one week, 470 patients received treatment, 150 of whom were children, including individuals rescued after being trapped over 100 hours under rubble.", "published": "2023-08-25", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10450639/", "source_label": "Journal of Global Health, כרך 13, מאמר 03049", "source_label_en": "Journal of Global Health, vol. 13, art. 03049"}, {"quote": "in a span of merely a week, the local hospital returned almost fully to its pre-disaster capacity, re-opening a second inpatient floor, staffing the entire ER department, and even treating patients it would not normally treat, such as trauma and paediatric patients. This allowed our humanitarian aid delegation to leave, after passing the baton to the Turkish teams, with the assurance of continuity of care", "locator": "הפסקה הפותחת ב-\"Finally, leaving a disaster area can create ethical dilemmas\"", "quote_en": "in a span of merely a week, the local hospital returned almost fully to its pre-disaster capacity, re-opening a second inpatient floor, staffing the entire ER department, and even treating patients it would not normally treat, such as trauma and paediatric patients. This allowed our humanitarian aid delegation to leave, after passing the baton to the Turkish teams, with the assurance of continuity of care", "published": "2023-08-25", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10450639/", "source_label": "Journal of Global Health, כרך 13, מאמר 03049 — פסקת הסיכום על עזיבת אזור האסון", "source_label_en": "Journal of Global Health, vol. 13, art. 03049 — concluding paragraph on leaving the disaster area"}, {"quote": "As in past natural disasters, the Israeli government, in coordination with the Israel Defense Forces Home Front Command, organized a medical delegation of 142 personnel. The Israeli medical delegation arrived in Turkey on February 8, 2023, and decided to integrate with an existing hospital in the city of Kahramanmaras", "locator": "תקציר המאמר, משפטים 2–3; עמ' 417–420, DOI 10.5055/jem.0870", "quote_en": "As in past natural disasters, the Israeli government, in coordination with the Israel Defense Forces Home Front Command, organized a medical delegation of 142 personnel. The Israeli medical delegation arrived in Turkey on February 8, 2023, and decided to integrate with an existing hospital in the city of Kahramanmaras", "published": "2025-06-01", "source_url": "https://wmpllc.org/ojs/index.php/jem/article/view/3855", "source_label": "Journal of Emergency Management, אלפרט ואח', \"If you rebuild it, they will come\", כרך 23 גיליון 3", "source_label_en": "Journal of Emergency Management, Alpert et al., \"If you rebuild it, they will come\", vol. 23 no. 3"}, {"quote": "The hospital had been left with a skeleton staff. From February 9, 2023, through February 14, 2023, the Israeli team helped bring the Necip Fazil City Hospital back to working capacity.", "locator": "תקציר המאמר, משפטים 4–5; עמ' 417–420", "quote_en": "The hospital had been left with a skeleton staff. From February 9, 2023, through February 14, 2023, the Israeli team helped bring the Necip Fazil City Hospital back to working capacity.", "published": "2025-06-01", "source_url": "https://wmpllc.org/ojs/index.php/jem/article/view/3855", "source_label": "Journal of Emergency Management, אלפרט ואח', כרך 23 גיליון 3", "source_label_en": "Journal of Emergency Management, Alpert et al., vol. 23 no. 3"}, {"quote": "However, the biggest accomplishment was helping rehabilitate the ED and overall the hospital so that groups of volunteer Turkish physicians could continue their operation.", "locator": "תקציר המאמר, משפט אחרון", "quote_en": "However, the biggest accomplishment was helping rehabilitate the ED and overall the hospital so that groups of volunteer Turkish physicians could continue their operation.", "published": "2025-06-01", "source_url": "https://wmpllc.org/ojs/index.php/jem/article/view/3855", "source_label": "Journal of Emergency Management, אלפרט ואח' — המשפט האחרון בתקציר", "source_label_en": "Journal of Emergency Management, Alpert et al. — final sentence of the abstract"}, {"quote": "The delegation assisted in the reopening of a local hospital after it had been abandoned during the earthquake, and is set to provide medical treatment to injured in the area.", "locator": "פסקה שנייה בכתבה, article-731197 — דיווח בן-הזמן, יומיים אחרי הנחיתה", "quote_en": "The delegation assisted in the reopening of a local hospital after it had been abandoned during the earthquake, and is set to provide medical treatment to injured in the area.", "published": "2023-02-10", "source_url": "https://www.jpost.com/middle-east/article-731197", "source_label": "ג'רוזלם פוסט, \"IDF workers re-open hospital to treat wounded after Turkey earthquake\"", "source_label_en": "The Jerusalem Post, \"IDF workers re-open hospital to treat wounded after Turkey earthquake\""}, {"quote": "Approximately 140 doctors and nurses are working at the hospital, including a pharmacist, an X-ray technician, a laboratory technician, paramedics and medical logistics personnel.", "locator": "פסקת הרכב הצוות, אחרי הפסקה על השימוש בחדרי המיון וחדרי הניתוח", "quote_en": "Approximately 140 doctors and nurses are working at the hospital, including a pharmacist, an X-ray technician, a laboratory technician, paramedics and medical logistics personnel.", "published": "2023-02-10", "source_url": "https://www.jpost.com/middle-east/article-731197", "source_label": "ג'רוזלם פוסט, article-731197", "source_label_en": "The Jerusalem Post, article-731197"}, {"quote": "Since we arrived here, we have provided treatment to more than 250 patients, not only from the earthquake, but also from chronic diseases and who could not find a hospital to visit.", "locator": "ציטוט ישיר של ד\"ר מוקלד בגוף הכתבה; מאת Mustafa M. M. Haboush", "quote_en": "Since we arrived here, we have provided treatment to more than 250 patients, not only from the earthquake, but also from chronic diseases and who could not find a hospital to visit.", "published": "2023-02-13", "source_url": "https://www.aa.com.tr/en/environment/doctors-from-israel-continue-treating-earthquake-victims-in-turkiye/2818017", "source_label": "סוכנות אנדולו (טורקיה), מפי ד\"ר ריימון מוקלד מהמשלחת הישראלית", "source_label_en": "Anadolu Agency (Türkiye), quoting Dr. Raymon Mokalled of the Israeli delegation"}, {"quote": "Turkish medical teams came to the hospital in the past two days, and started working together to treat the injured.", "locator": "פסקת שיתוף הפעולה עם הצוותים הטורקיים, בסוף הכתבה", "quote_en": "Turkish medical teams came to the hospital in the past two days, and started working together to treat the injured.", "published": "2023-02-13", "source_url": "https://www.aa.com.tr/en/environment/doctors-from-israel-continue-treating-earthquake-victims-in-turkiye/2818017", "source_label": "סוכנות אנדולו (טורקיה) — עדות טורקית בת-הזמן על העבודה המשותפת", "source_label_en": "Anadolu Agency (Türkiye) — contemporaneous Turkish account of the joint work"}, {"quote": "A certificate of appreciation from Turkish President Recep Tayyip Erdogan was presented on Tuesday to the commander of the Israel Defense Forces' National Rescue Unit, Col. (Ret.) Golan Vach, who commanded Israel's rescue mission that helped locate survivors and provide aid during the recent earthquake in southern Turkey.", "locator": "משפט פתיחה של גוף הכתבה (articleBody)", "quote_en": "A certificate of appreciation from Turkish President Recep Tayyip Erdogan was presented on Tuesday to the commander of the Israel Defense Forces' National Rescue Unit, Col. (Ret.) Golan Vach, who commanded Israel's rescue mission that helped locate survivors and provide aid during the recent earthquake in southern Turkey.", "published": "2023-04-26", "source_url": "https://www.jns.org/turkish-president-honors-israeli-rescue-workers-who-saved-lives-after-earthquake/", "source_label": "JNS — המקור היחיד שנמצא להכרה רשמית, וגם הוא לזרוע החילוץ ולא למשלחת הרפואה", "source_label_en": "JNS — the only source found for official recognition, and it concerns the rescue arm, not the medical delegation"}, {"quote": "The IDF sent 230 medical and emergency response experts to set up a field hospital in Kahramanmaraş, in addition to a 150-member Home Front Command team.", "locator": "פסקה שלישית בגוף הכתבה", "quote_en": "The IDF sent 230 medical and emergency response experts to set up a field hospital in Kahramanmaraş, in addition to a 150-member Home Front Command team.", "published": "2023-04-26", "source_url": "https://www.jns.org/turkish-president-honors-israeli-rescue-workers-who-saved-lives-after-earthquake/", "source_label": "JNS — מספר חלוק על גודל המשלחת (ראה disputes)", "source_label_en": "JNS — a divergent figure for the delegation's size (see disputes)"}], "act": "המשלחת לא הקימה אוהלים בשדה — היא פתחה מחדש את בית-החולים הטורקי הנטוש בתוך 24 שעות מנחיתתה, והפעילה בו מיון, טיפול נמרץ, חמישה חדרי ניתוח ומחלקת אשפוז.", "ripple": "470 בני אדם — טורקים מוסלמים, כורדים ופליטים סורים שנקלעו לטורקיה בזמן הרעש — קיבלו טיפול מציל-חיים במקום מוכר להם, בבית-החולים של השכונה שלהם, ולא באוהל זר. חלקם הובאו מתחת להריסות אחרי יותר מ-100 שעות. הצוותים המעורבים דיברו טורקית, אנגלית, עברית וערבית, וכשהיה מנתח מוחות ישראלי או רופא ילדים טורקי מתאים יותר למקרה — הוא שקיבל את המטופל. לפי חברי המשלחת, דווקא העבודה בתוך המוסד המקומי היא שהקנתה למשלחת את אמון הקהילה \"in a complex political reality\".", "title_reasoning": "הכותרת הקודמת (\"הקים בית-חולים שדה\") אינה שורדת בדיקה מול המקור הראשי. המאמר השפיט של חברי המשלחת עצמם מתאר במפורש שהתוכנית להקים בית-חולים שדה עצמאי נזנחה בשטח: המשלחת מצאה בית-חולים ציבורי טורקי עומד ריק, ופתחה אותו מחדש. לכן כל מילה בכותרת נבדקה: \"פתח מחדש\" (JOGH: \"our personnel re-opened the hospital\"; ג'רוזלם פוסט: \"the reopening of a local hospital after it had been abandoned\"), \"נטוש\" (JOGH: \"had been left vacant\"; JEM: \"left with a skeleton staff\"), \"קהרמאנמרש\" (כל חמשת המקורות), \"470\" (JOGH ו-JEM, אותו מספר בשני מאמרים שפיטים בלתי תלויים). המספר בכותרת זהה למספר בתיאור ובציטוטים. 11 מילים, בלי סימן קריאה ובלי סופרלטיב.", "media_urls": ["https://upload.wikimedia.org/wikipedia/commons/a/a5/Olive_Branches_Search_and_Rescue_Delegation%2C_February_2023_%28IDF_4%29.jpeg", "https://upload.wikimedia.org/wikipedia/commons/1/16/Olive_Branches_Search_and_Rescue_Delegation%2C_February_2023_%28IDF_13%29.jpeg", "https://upload.wikimedia.org/wikipedia/commons/5/57/Olive_Branches_Search_and_Rescue_Delegation%2C_February_2023_%28IDF_28%29.jpeg", "https://upload.wikimedia.org/wikipedia/commons/e/e9/Olive_Branches_Search_and_Rescue_Delegation%2C_February_2023_%28IDF_80%29.jpeg", "https://upload.wikimedia.org/wikipedia/commons/f/f7/Olive_Branches_Search_and_Rescue_Delegation%2C_February_2023_%28IDF_58%29.jpeg", "https://upload.wikimedia.org/wikipedia/commons/6/61/Olive_Branches_Search_and_Rescue_Delegation%2C_February_2023_%28IDF_68%29.jpeg"], "title_en": "The IDF reopened an abandoned hospital in Kahramanmaraş and treated 470 earthquake casualties", "description_en": "On 6 February 2023, at 4:17 am local time, a magnitude 7.8 earthquake devastated southeastern Turkey and parts of Syria, leaving more than 50,000 dead. The Israeli medical delegation — some 140 to 150 people: physicians, nurses, surgeons, anaesthetists, X-ray and laboratory technicians, paramedics and medical logistics staff drawn from the IDF, the Health Ministry and Magen David Adom — landed in Kahramanmaraş on 8 February with 17 tons of medical supplies and the capabilities of a level 3 field hospital. The plan was to run a self-sufficient hospital requiring nothing from the local community. Reality was different: the Necip Fazıl public hospital, minutes from the destruction sites, stood empty — most of its staff and inpatients had been evacuated or had fled — yet it still had working electricity and running water. After engineers from the Israeli Search and Rescue team certified the building safe, the delegation reopened the hospital within 24 hours and ran four departments: an emergency department, a six-bed intensive care unit, the facility's five operating rooms and a 60-bed inpatient service. In one week 470 patients were treated, among them about 150 children and some 50 dental patients, including people rescued after more than 100 hours under rubble; ten operations were performed. In parallel the Turkish government mobilised medical staff from across Türkiye, producing mixed Israeli-Turkish teams that delivered care in four languages — Turkish, English, Hebrew and Arabic.", "act_en": "The delegation did not pitch tents in a field — it reopened the abandoned Turkish hospital within 24 hours of landing, and ran its emergency department, intensive care unit, five operating rooms and inpatient ward.", "ripple_en": "470 people — Turkish Muslims, Kurds and Syrian refugees who happened to be in Turkey when the earthquake struck — received life-saving care in a place familiar to them, the hospital of their own neighbourhood, rather than in a foreign tent. Some were brought in from under the rubble after more than 100 hours. The mixed teams worked in Turkish, English, Hebrew and Arabic, and when an Israeli neurosurgeon or a Turkish paediatrician was the better fit for a case, that person took the patient. According to the delegation's members, it was precisely working inside the local institution that earned them the community's trust \"in a complex political reality.\"", "source_label_en": "Journal of Global Health — peer-reviewed paper by delegation members Nitecki, Ohayon & Almog, 2023", "categories": null, "location": {"lat": 37.5858, "lng": 36.9371, "city": "קהרמאנמרש", "site": "בית-החולים העירוני וד\"ר ריימון מוקלד — רופאים ערבים-ישראלים במשלחת, שדיברו ערבית עם פליטים סורים בבית-חולים טורקי. זווית שלמה שאין לה מספיק מקורות כרגע."], "domains_covered": ["pmc.ncbi.nlm.nih.gov", "wmpllc.org", "jpost.com", "aa.com.tr", "jns.org"], "image_provenance": [{"url": "https://upload.wikimedia.org/wikipedia/commons/a/a5/Olive_Branches_Search_and_Rescue_Delegation%2C_February_2023_%28IDF_4%29.jpeg", "year": 2023, "group": null, "source": "ויקישיתוף (Wikimedia Commons)", "caption_en": "The Israeli medical delegation photographed beneath the Turkish ACİL SERVİS — \"Emergency Service\" — sign of the Necip Fazıl hospital in Kahramanmaraş. The sign is the whole story: this was not a tent pitched in a field but an existing Turkish public hospital, abandoned in the earthquake and reopened.", "caption_he": "משלחת הרפואה הישראלית מצטלמת מתחת לשלט הטורקי ACİL SERVİS — \"חדר מיון\" — של בית-החולים נג'יפ פאזל בקהרמאנמרש. השלט הוא כל הסיפור: זה לא אוהל שהוקם בשדה אלא בית-חולים ציבורי טורקי קיים, שננטש ברעידת האדמה ונפתח מחדש. התמונה עומדת לבדה כי היא היחידה שמראה את המבנה שהמעש כולו נסוב סביבו.", "source_url": "https://commons.wikimedia.org/wiki/File:Olive_Branches_Search_and_Rescue_Delegation,_February_2023_(IDF_4).jpeg", "photographer": "דובר צה\"ל (IDF Spokesperson's Unit)", "published_in": "ויקישיתוף, רישיון CC BY-SA 3.0; צולם בין 8 ל-15 בפברואר 2023"}, {"url": "https://upload.wikimedia.org/wikipedia/commons/1/16/Olive_Branches_Search_and_Rescue_Delegation%2C_February_2023_%28IDF_13%29.jpeg", "year": 2023, "group": "בית-החולים שחזר לפעול", "source": "ויקישיתוף (Wikimedia Commons)", "caption_en": "Treatment in the hospital's emergency department. The team's shirts read \"IDF Field Hospital\", while the bedding carries the crest of the Turkish Health Ministry — both sides in a single frame.", "caption_he": "טיפול במטופל בחדר המיון של בית-החולים. על חולצות הצוות כתוב \"בית חולים שדה צה\"ל / IDF Field Hospital\", והמצעים שעל המיטה נושאים את סמל משרד הבריאות הטורקי — שני הצדדים בפריים אחד.", "source_url": "https://commons.wikimedia.org/wiki/File:Olive_Branches_Search_and_Rescue_Delegation,_February_2023_(IDF_13).jpeg", "photographer": "דובר צה\"ל (IDF Spokesperson's Unit)", "published_in": "ויקישיתוף, רישיון CC BY-SA 3.0; צולם בין 8 ל-15 בפברואר 2023"}, {"url": "https://upload.wikimedia.org/wikipedia/commons/5/57/Olive_Branches_Search_and_Rescue_Delegation%2C_February_2023_%28IDF_28%29.jpeg", "year": 2023, "group": "בית-החולים שחזר לפעול", "source": "ויקישיתוף (Wikimedia Commons)", "caption_en": "An Israeli physician with an Israeli flag on his coat stands at a patient's bedside alongside staff in different scrubs — the mixed Israeli-Turkish team the delegation described, in which every shift included personnel from both sides and one or two translators.", "caption_he": "רופא ישראלי עם דגל ישראל על החלוק עומד ליד מיטת חולה לצד אנשי צוות בסקראבס שונים — הצוות המעורב הישראלי-טורקי שתיארו חברי המשלחת, שבו כל משמרת כללה אנשי שני הצדדים ומתורגמן או שניים.", "source_url": "https://commons.wikimedia.org/wiki/File:Olive_Branches_Search_and_Rescue_Delegation,_February_2023_(IDF_28).jpeg", "photographer": "דובר צה\"ל (IDF Spokesperson's Unit)", "published_in": "ויקישיתוף, רישיון CC BY-SA 3.0; צולם בין 8 ל-15 בפברואר 2023"}, {"url": "https://upload.wikimedia.org/wikipedia/commons/e/e9/Olive_Branches_Search_and_Rescue_Delegation%2C_February_2023_%28IDF_80%29.jpeg", "year": 2023, "group": "בית-החולים שחזר לפעול", "source": "ויקישיתוף (Wikimedia Commons)", "caption_en": "Delegation members organising equipment and consumables in a room of the Turkish hospital. The cabinet is labelled \"TEMİZ\" (\"clean\") and the wall carries protocols in Turkish — the Israelis working inside someone else's institution, not one they built.", "caption_he": "אנשי המשלחת מסדרים ציוד וחומרים מתכלים בחדר של בית-החולים הטורקי. על הארון תווית \"TEMİZ\" (\"נקי\") ועל הקיר נהלים בטורקית — הישראלים עובדים בתוך מוסד זר, לא במקום שהקימו בעצמם.", "source_url": "https://commons.wikimedia.org/wiki/File:Olive_Branches_Search_and_Rescue_Delegation,_February_2023_(IDF_80).jpeg", "photographer": "דובר צה\"ל (IDF Spokesperson's Unit)", "published_in": "ויקישיתוף, רישיון CC BY-SA 3.0; צולם בין 8 ל-15 בפברואר 2023"}, {"url": "https://upload.wikimedia.org/wikipedia/commons/f/f7/Olive_Branches_Search_and_Rescue_Delegation%2C_February_2023_%28IDF_58%29.jpeg", "year": 2023, "group": "המשלחת והציוד", "source": "ויקישיתוף (Wikimedia Commons)", "caption_en": "A crane lowers a pallet of medical equipment from Israel at the delegation's camp, against the snow-covered mountains of Kahramanmaraş. This is part of the 17 tons flown in with the team.", "caption_he": "מנוף מוריד משטח ארגזי ציוד רפואי מישראל אל מחנה המשלחת, על רקע ההרים המושלגים של קהרמאנמרש. אלה חלק מ-17 הטונות שהוטסו יחד עם הצוות.", "source_url": "https://commons.wikimedia.org/wiki/File:Olive_Branches_Search_and_Rescue_Delegation,_February_2023_(IDF_58).jpeg", "photographer": "דובר צה\"ל (IDF Spokesperson's Unit)", "published_in": "ויקישיתוף, רישיון CC BY-SA 3.0; צולם בין 8 ל-15 בפברואר 2023"}, {"url": "https://upload.wikimedia.org/wikipedia/commons/6/61/Olive_Branches_Search_and_Rescue_Delegation%2C_February_2023_%28IDF_68%29.jpeg", "year": 2023, "group": "המשלחת והציוד", "source": "ויקישיתוף (Wikimedia Commons)", "caption_en": "A group portrait of the entire Israeli delegation at camp, beneath the Israeli and Turkish flags flying side by side. The group includes rescue personnel in orange overalls — both arms of Operation Olive Branches, medical and search-and-rescue.", "caption_he": "תמונה קבוצתית של המשלחת הישראלית כולה במחנה, מתחת לדגל ישראל ולדגל טורקיה המונפים זה לצד זה. הקבוצה כוללת גם אנשי חילוץ בסרבלים כתומים — שתי הזרועות של מבצע \"ענפי זית\", הרפואית והחילוצית.", "source_url": "https://commons.wikimedia.org/wiki/File:Olive_Branches_Search_and_Rescue_Delegation,_February_2023_(IDF_68).jpeg", "photographer": "דובר צה\"ל (IDF Spokesperson's Unit)", "published_in": "ויקישיתוף, רישיון CC BY-SA 3.0; צולם בין 8 ל-15 בפברואר 2023"}], "lead_image_basis": "contemporary_artifact"}, "dedup": {"note": "נבדק מול 201 הכותרות ברשימת הרישום שסופקה בתדריך (כלל 81). לא נמצאה כפילות.", "merged_from": [], "is_duplicate": false, "near_matches_read_in_full": ["חיילי צה\"ל חילצו 19 ניצולים מהריסות טורקיה — ילד בן עשר בין הניצולים — אותו מבצע (\"ענפי זית\"), אך הזרוע השנייה: משלחת החילוץ של פיקוד העורף, לא משלחת הרפואה. שני המקורות השפיטים כאן עוסקים אך ורק בבית-החולים. אין מיזוג; יש להוסיף הפניה הדדית בין שני הדפים.", "מתנדבי זאקה ולוחמי פיקוד העורף מגיעים לטורקיה — שלושה ימים בדרכים סבוכות — גוף אחר (זק\"א) ומשימה אחרת (הגעה וחילוץ).", "צוות ישראלי חילץ ילדה בת 10 מהריסות רעידת האדמה בטורקיה 1999 — אירוע אחר לחלוטין, 24 שנים קודם.", "ישראל הקימה ביפן / בנפאל / בהאיטי / באוקראינה בתי-חולים שדה — מבצעים נפרדים במדינות אחרות; דווקא ההשוואה אליהם היא מה שמייחד את המעש הזה, שבו לא הוקם בית-חולים שדה אלא הופעל מחדש מוסד מקומי."]}, "origin_story": "רעידת האדמה של 6 בפברואר 2023 פגעה במדינה שהייתה לה מערכת בריאות משלה — וזה בדיוק מה שהפך את המשימה לחריגה. משלחות בית-החולים השדה של צה\"ל התאמנו במשך שנים לפעול כיחידה עצמאית לחלוטין, ורוב משימותיהן היו במדינות שבהן כמעט לא הייתה תשתית רפואית. הפעם, כפי שכותבים חברי המשלחת עצמם במאמר שפיט, \"this mission was among the first to dispatch into an upper-middle-income country that previously had its own medical infrastructure\". הממשלה הישראלית, בתיאום עם פיקוד העורף, ארגנה משלחת רפואית של 142 איש שנחתה ב-8 בפברואר. \"The plan was to operate a field hospital without support or utilities from the affected community, yet we soon realised that aid was required in a model we have never practised before\" — מה שהוליד את המעשה לא היה מכשיר ולא רעיון, אלא בית מבנה ריק: בית-החולים הציבורי נג'יפ פאזל, שנעזב על ידי כמעט כל צוותו ומאושפזיו, ניזוק רק במעט מבנית, ועדיין היה מחובר לחשמל ולמים. המשלחת ויתרה על התוכנית שהתאמנה עליה ובחרה במקום זאת להחיות מוסד טורקי קיים.", "origin_story_en": "The 6 February 2023 earthquake struck a country that already had a health system of its own — and that is precisely what made the mission unusual. The IDF's field hospital delegations had trained for years to operate as a fully self-sufficient unit, and most of their missions had been in countries with almost no medical infrastructure. This time, as the delegation's own members write in a peer-reviewed paper, \"this mission was among the first to dispatch into an upper-middle-income country that previously had its own medical infrastructure.\" The Israeli government, in coordination with the Home Front Command, organised a 142-person medical delegation that landed on 8 February. \"The plan was to operate a field hospital without support or utilities from the affected community, yet we soon realised that aid was required in a model we have never practised before.\" What gave birth to this deed was not a device or an idea but an empty building: the Necip Fazıl public hospital, abandoned by nearly all its staff and inpatients, only lightly damaged structurally, and still connected to power and water. The delegation dropped the plan it had trained for and chose instead to revive an existing Turkish institution.", "aftermath": "המשלחת עזבה ב-14–15 בפברואר 2023, אחרי שישה עד שבעה ימי פעילות קלינית. מה שנשאר לא היה מבנה ישראלי אלא בית-חולים טורקי מתפקד: \"in a span of merely a week, the local hospital returned almost fully to its pre-disaster capacity, re-opening a second inpatient floor, staffing the entire ER department, and even treating patients it would not normally treat, such as trauma and paediatric patients\". לפני האסון בית-החולים כלל לא נתן שירותי ילדים, טראומה או גינקולוגיה. הטורקים גייסו רופאים מתנדבים מכל המדינה, ולפי המאמר השני של צוות המיון \"the biggest accomplishment was helping rehabilitate the ED and overall the hospital so that groups of volunteer Turkish physicians could continue their operation\". הישראלים עזבו רק אחרי מה שהם מכנים העברת שרביט — \"after passing the baton to the Turkish teams, with the assurance of continuity of care\". חברי המשלחת פרסמו את הלקחים בשני כתבי-עת שפיטים (2023 ו-2025) כמודל עבודה משולבת למשלחות סיוע עתידיות.", "aftermath_en": "The delegation left on 14–15 February 2023, after six to seven days of clinical operation. What remained was not an Israeli structure but a functioning Turkish hospital: \"in a span of merely a week, the local hospital returned almost fully to its pre-disaster capacity, re-opening a second inpatient floor, staffing the entire ER department, and even treating patients it would not normally treat, such as trauma and paediatric patients.\" Before the disaster the hospital had provided no paediatric, trauma or gynaecological care at all. Turkey mobilised volunteer physicians from across the country, and according to the second paper by the emergency department team, \"the biggest accomplishment was helping rehabilitate the ED and overall the hospital so that groups of volunteer Turkish physicians could continue their operation.\" The Israelis left only after what they call a handover — \"after passing the baton to the Turkish teams, with the assurance of continuity of care.\" The delegation's members published their lessons in two peer-reviewed journals (2023 and 2025) as a collaborative model for future relief missions.", "recognition": "לא רלוונטי — אנשי משלחת הרפואה לא קיבלו שכר, פרס או הכרה אישית על המשימה, וחזרו ליחידותיהם ולבתי-החולים שבהם הם עובדים. אף אחד מחמשת המקורות שנבדקו אינו מזכיר עיטור, מלגה או תגמול לחבר צוות רפואי כלשהו. ההכרה הרשמית היחידה שתועדה מטורקיה ניתנה לזרוע אחרת של אותו מבצע ולא למשלחת הרפואית: באפריל 2023 העניק נשיא טורקיה רג'פ טאיפ ארדואן תעודת הוקרה לאל\"מ (מיל') גולן ואך, מפקד יחידת החילוץ הלאומית, על משימת החילוץ. מה שכן קיבלו הרופאים הוא במה מקצועית: שני מאמרים שפיטים שבהם הם מתעדים בשמם את הלקחים.", "recognition_en": "Not applicable — the members of the medical delegation received no pay, prize or personal recognition for the mission, and returned to their units and to the hospitals where they work. None of the five sources checked mentions a decoration, grant or reward for any medical team member. The only documented official recognition from Turkey went to a different arm of the same operation, not to the medical delegation: in April 2023 Turkish President Recep Tayyip Erdogan presented a certificate of appreciation to Col. (Ret.) Golan Vach, commander of the National Rescue Unit, for the rescue mission. What the doctors did receive was a professional platform: two peer-reviewed papers in which they document the lessons under their own names.", "honors": [], "summary_short": "בית-החולים הציבורי נג'יפ פאזל בקהרמאנמרש עמד ריק דקות נסיעה מאתרי ההרס: רוב הצוות והמאושפזים פונו או נמלטו, אבל החשמל והמים בו עדיין פעלו. משלחת הרפואה הישראלית, שנחתה שם ב-8 בפברואר 2023 עם 17 טונות ציוד רפואי, יומיים אחרי רעידת אדמה בעוצמה 7.8, התאמנה שנים בדיוק על ההפך — בית-חולים שדה עצמאי לגמרי, שאינו מבקש מהקהילה הפגועה לא חשמל ולא מים. היא ויתרה על התוכנית שהתאמנה עליה, ואחרי שמהנדסי צוות החילוץ הישראלי אישרו שהמבנה בטוח פתחה את בית-החולים הטורקי מחדש בתוך 24 שעות. 470 בני אדם — טורקים, כורדים ופליטים סורים, בהם כ-150 ילדים ואנשים שחולצו אחרי יותר ממאה שעות מתחת להריסות — קיבלו טיפול בבית-החולים של השכונה שלהם, ולא באוהל זר. בצוותים המעורבים דיברו טורקית, אנגלית, עברית וערבית, וכשרופא ילדים טורקי התאים למקרה יותר ממנתח מוחות ישראלי — הוא שקיבל את המטופל. כעבור שבוע עזבו הישראלים, ומה שנשאר לא היה מבנה ישראלי אלא בית-חולים טורקי שחזר כמעט למלוא כושרו, ואפילו טיפל בילדים ובפצועי טראומה — מה שלא נתן שם לפני האסון. איש מהם לא קיבל עיטור או פרס; הם חזרו לבתי-החולים שבהם הם עובדים, ופרסמו שני מאמרים שפיטים כדי שהמודל ישמש גם משלחות סיוע עתידיות.", "summary_short_en": "The Necip Fazıl public hospital in Kahramanmaraş stood empty, minutes from the destruction sites: most of its staff and inpatients had been evacuated or had fled, yet its electricity and water were still running. The Israeli medical delegation, which landed there on 8 February 2023 with 17 tons of medical supplies, two days after a magnitude 7.8 earthquake, had trained for years for exactly the opposite — a fully self-sufficient field hospital that asks the stricken community for neither power nor water. It dropped the plan it had trained for, and once engineers from the Israeli Search and Rescue team certified the building safe, it reopened the Turkish hospital within 24 hours. 470 people — Turks, Kurds and Syrian refugees, among them about 150 children and patients pulled out after more than a hundred hours under the rubble — were treated in the hospital of their own neighbourhood, not in a foreign tent. The mixed teams worked in Turkish, English, Hebrew and Arabic, and when a Turkish paediatrician suited a case better than an Israeli neurosurgeon, that was who took the patient. A week later the Israelis left, and what remained was not an Israeli structure but a Turkish hospital back almost at full capacity, even treating children and trauma casualties — care it had not provided there before the disaster. None of them received a decoration or a prize; they went back to the hospitals where they work and published two peer-reviewed papers so the model could serve future relief missions."}, "changed": ["title", "description", "media_type", "media_url", "source_label", "citations", "act", "ripple", "title_reasoning", "media_urls", "title_en", "description_en", "act_en", "ripple_en", "source_label_en", "location", "people", "deed_type", "actor_type", "beneficiary", "audit", "dedup", "origin_story", "origin_story_en", "aftermath", "aftermath_en", "recognition", "recognition_en", "honors", "summary_short", "summary_short_en"], "m_before": {"citations": 2, "domains": 1, "images": 0, "people": 0, "videos": 0, "location": 0, "honors": 0, "chars": 432, "std": 16}, "m_after": {"citations": 12, "domains": 5, "images": 6, "people": 8, "videos": 0, "location": 1, "honors": 0, "chars": 4059, "std": 46}, "std_total": 46, "failing": []}]}</script>
<script id="decisions-data" type="application/json">[]</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const DECISIONS = JSON.parse(document.getElementById('decisions-data').textContent);
let cur = 0, mode = 'both';
document.getElementById('stamp').textContent = 'עודכן ' + DATA.built.replace('T',' ').replace('+00:00',' UTC');

const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const host = u => { try { return new URL(u).hostname.replace(/^www\./,''); } catch(e){ return ''; } };

function tabs(){
  document.getElementById('tabs').innerHTML = DATA.deeds.map((d,i)=>
    `<button class="${i===cur?'on':''}" data-i="${i}">${esc(d.title.slice(0,42))}</button>`).join('');
}
function score(){
  const d = DATA.deeds[cur];
  const rows = [['מקורות','citations'],['דומיינים','domains'],['תמונות','images'],
                ['סרטונים','videos'],['אנשים','people'],['מיקום','location'],
                ['כבוד','honors'],['תווים','chars']];
  const sb = d.m_before.std||0, sa = d.m_after.std||0, st = d.std_total;
  const stdTile = `<div class="tile"><div class="lbl">תקן${d.failing.length?
      ` · נכשל ב-${d.failing.join(', ')}`:' · עובר הכל'}</div>
    <div class="val" style="color:${sa===st?'var(--good)':'var(--warn)'}">${sa}/${st}
    ${sa>sb?`<span class="up">+${sa-sb}</span>`:''}<span class="was">היה ${sb}</span></div></div>`;
  document.getElementById('score').innerHTML = stdTile + rows.map(([lbl,k])=>{
    const b = d.m_before[k]||0, a = d.m_after[k]||0;
    const up = a>b ? `<span class="up">+${a-b}</span>` : '';
    return `<div class="tile"><div class="lbl">${lbl}</div>
      <div class="val">${a}${up}<span class="was">היה ${b}</span></div></div>`;
  }).join('');
}
function sect(key, label, changed, inner){
  const flag = changed.includes(key) ? '<span class="chg">שונה</span>' : '';
  return `<section><div class="k">${label}${flag}</div>${inner}</section>`;
}
function txt(v){ return v ? `<div class="txt">${esc(v)}</div>` : `<div class="empty">— ריק —</div>`; }

function pane(d, side){
  const r = side==='after' ? d.after : d.before;
  const ch = side==='after' ? d.changed : [];
  const prov = ((r.audit||{}).image_provenance)||[];
  const provOf = u => prov.find(p=>p.url===u) || null;
  const isVid = u => /youtube\.com|youtu\.be|vimeo\.com/.test(u);
  const imgs = (r.media_urls||[]).filter(u=>!isVid(u));
  const mediaVids = (r.media_urls||[]).filter(isVid);
  const imgHtml = imgs.length ? `<div class="imgs">` + imgs.map(u=>{
      const p = provOf(u);
      return `<figure><a href="${esc(u)}" target="_blank"><img loading="lazy" src="${esc(u)}"></a>
        <figcaption>${p&&p.caption_he?esc(p.caption_he):'<span class="empty">ללא כיתוב</span>'}
        ${p&&p.credit?`<span class="cred">${esc(p.credit)}${p.shot_when?' · '+esc(p.shot_when):''}</span>`:''}
        ${p&&p.warning?`<span class="flag">⚠ ${esc(p.warning)}</span>`:''}</figcaption></figure>`;
    }).join('') + `</div>` : `<div class="empty">— אין תמונות —</div>`;

  const cits = (r.citations||[]);
  const citHtml = cits.length ? `<ol class="src">` + cits.map(c=>
      `<li><span class="lbl">${esc(c.source_label||host(c.source_url))}</span>
       <a href="${esc(c.source_url)}" target="_blank">↗</a>
       ${c.quote?`<span class="q">"${esc(c.quote)}"</span>`:''}
       <span class="meta">${esc(host(c.source_url))}${c.published?' · '+esc(c.published):''}${c.locator?' · '+esc(c.locator):''}</span></li>`
    ).join('') + `</ol>` : `<div class="empty">— אין מקורות —</div>`;

  const meta = (((r.audit||{}).videos)||[]);
  const ytid = u => (u.match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{11})/)||[])[1]||'';
  const vidHtml = mediaVids.length ? mediaVids.map(u=>{
      const v = meta.find(m=>ytid(m.url)===ytid(u)) || {};
      const id = ytid(u);
      return `<div class="vid"><div style="display:flex;gap:11px;align-items:flex-start">
       ${id?`<a href="${esc(u)}" target="_blank"><img src="https://i.ytimg.com/vi/${id}/mqdefault.jpg"
          style="width:112px;height:63px;object-fit:cover;border-radius:7px;display:block"></a>`:''}
       <div style="flex:1;min-width:0">
        <div class="t"><a href="${esc(u)}" target="_blank">${esc(v.title||u)}</a></div>
        <div class="c">${esc(v.channel||'')}${v.transcript?' · תמליל: '+esc(v.transcript):
          '<span style="color:#b25000"> · ללא כיתוב מקור</span>'}</div>
       </div></div></div>`;
    }).join('') : `<div class="empty">— אין סרטונים —</div>`;

  const loc = r.location;
  const locHtml = loc ? `<div class="txt">${esc([loc.city,loc.country].filter(Boolean).join(', '))}
      <span class="empty" style="font-style:normal;color:#a1a1a6">· דיוק: ${esc(loc.precision||'')}</span></div>` :
      `<div class="empty">— אין מיקום —</div>`;

  const ppl = (r.people||[]);
  const pplHtml = ppl.length ? `<div class="pills">` + ppl.map(p=>
      `<span class="pill">${esc(p.name_he||p.name_en)}${p.role_he?' — '+esc(p.role_he):''}</span>`).join('') + `</div>`
    : `<div class="empty">— לא מזוהים —</div>`;

  const tags = [].concat(r.deed_type||[], r.beneficiary||[], r.actor_type?[r.actor_type]:[]);
  const tagHtml = tags.length ? `<div class="pills">`+tags.map(t=>`<span class="pill">${esc(t)}</span>`).join('')+`</div>`
    : `<div class="empty">— ריק —</div>`;

  const honors = (r.honors||[]);
  const honorsHtml = honors.length ? `<ul class="honors">` + honors.map(h=>
      `<li>${h.source?`<a href="${esc(h.source)}" target="_blank">${esc(h.what)}</a>`:esc(h.what)}${h.year?` <span class="empty" style="font-style:normal;color:#a1a1a6">· ${esc(String(h.year))}</span>`:''}</li>`
    ).join('') + `</ul>` : `<div class="empty">— אין —</div>`;

  const label = side==='after' ? 'אחרי' : 'לפני';
  const sub = side==='after' ? 'המצב החי באתר' : 'כפי שהיה לפני המעבר';
  return `<div class="pane ${side==='after'?'a':'b'}">
    <h2>${label}<em>${sub}</em></h2>
    <div class="body">
      ${sect('title','כותרת',ch,txt(r.title))}
      ${sect('summary_short','תקציר — מה שנפתח ראשון',ch,txt(r.summary_short))}
      ${sect('description','תיאור',ch,txt(r.description))}
      ${sect('origin_story','איך זה התחיל',ch,txt(r.origin_story))}
      ${sect('act','מה נעשה',ch,txt(r.act))}
      ${sect('ripple','ההשפעה',ch,txt(r.ripple))}
      ${sect('aftermath','מה קרה אחר כך',ch,txt(r.aftermath))}
      ${sect('recognition','מה קיבלו על זה',ch,txt(r.recognition))}
      ${sect('honors','כבוד על שמם ('+(r.honors||[]).length+')',ch,honorsHtml)}
      ${sect("media_urls","תמונות ("+imgs.length+")",ch,imgHtml)}
      ${sect("audit","סרטונים ("+mediaVids.length+")",ch,vidHtml)}
      ${sect('citations','מקורות ('+cits.length+')',ch,citHtml)}
      ${sect('location','מיקום',ch,locHtml)}
      ${sect('people','אנשים',ch,pplHtml)}
      ${sect('deed_type','סיווג',ch,tagHtml)}
    </div></div>`;
}

function render(){
  tabs(); score();
  const d = DATA.deeds[cur];
  const cols = document.getElementById('cols');
  cols.className = 'cols' + (mode==='both' ? '' : ' single');
  cols.innerHTML = mode==='both' ? pane(d,'before')+pane(d,'after')
                 : mode==='before' ? pane(d,'before') : pane(d,'after');
  const mine = DECISIONS.filter(x=>x.deed_id===d.id);
  document.getElementById('decisions').innerHTML = mine.length ? '<h1 style="font-size:17px">החלטות שממתינות לך</h1>' +
    mine.map(x=>`<div class="decide"><h3>${esc(x.title)}</h3><p>${esc(x.body)}</p>
      ${x.options?`<div class="opts">${x.options.map(o=>
        `<div>${o.img?`<img src="${esc(o.img)}">`:''}<div class="k" style="margin-top:6px">${esc(o.label)}</div>
         <div class="txt" style="font-size:13.5px">${esc(o.text||'')}</div></div>`).join('')}</div>`:''}
      </div>`).join('') : '';
}
document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return; cur=+b.dataset.i; render(); window.scrollTo({top:0,behavior:'smooth'});
});
document.querySelector('.modes').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  mode=b.dataset.mode;
  document.querySelectorAll('.modes button').forEach(x=>x.classList.toggle('on',x===b));
  render();
});
render();
</script>
</body></html>
