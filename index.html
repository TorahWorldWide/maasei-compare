<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מעשי ישראל — לפני ואחרי</title>
<style>
:root{
  --bg:#f5f5f7; --card:#fff; --ink:#1d1d1f; --dim:#6e6e73; --line:#e3e3e6;
  --before:#a1a1a6; --after:#0071e3; --good:#1d8a4e; --warn:#b25000;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:20;background:rgba(245,245,247,.86);
  backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
h1{font-size:20px;font-weight:600;margin:14px 0 10px;letter-spacing:-.01em}
h1 small{font-weight:400;color:var(--dim);font-size:13px;margin-inline-start:8px}
nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:999px;padding:7px 14px;font-size:13.5px;cursor:pointer;transition:.15s}
nav button:hover{border-color:#c9c9cf}
nav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{max-width:1180px;margin:0 auto;padding:20px 18px 60px}
.scoreboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-bottom:22px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile .lbl{font-size:11.5px;color:var(--dim);letter-spacing:.02em}
.tile .val{font-size:22px;font-weight:600;margin-top:4px;display:flex;align-items:baseline;gap:7px}
.tile .was{font-size:13px;color:var(--before);font-weight:400}
.tile .up{font-size:12px;color:var(--good);font-weight:500}
.modes{display:flex;gap:6px;margin:0 0 16px}
.modes button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:9px;
  padding:6px 13px;font-size:13px;cursor:pointer;color:var(--dim)}
.modes button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.cols.single{grid-template-columns:1fr}
.pane{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.pane>h2{margin:0;padding:12px 18px;font-size:13px;font-weight:600;letter-spacing:.03em;
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.pane.b>h2{color:var(--before)} .pane.a>h2{color:var(--after)}
.pane>h2 em{font-style:normal;font-size:11.5px;color:var(--dim);font-weight:400}
.body{padding:6px 18px 18px}
section{padding:14px 0;border-bottom:1px solid #f0f0f2}
section:last-child{border-bottom:0}
.k{font-size:11.5px;color:var(--dim);letter-spacing:.03em;margin-bottom:6px;
  display:flex;align-items:center;gap:7px}
.chg{background:#e8f2ff;color:var(--after);border-radius:5px;padding:1px 6px;font-size:10.5px}
.txt{font-size:15px;white-space:pre-wrap}
.empty{color:#c4c4c8;font-size:14px;font-style:italic}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
figure{margin:0}
figure img{width:100%;height:104px;object-fit:cover;border-radius:10px;background:#eaeaec;display:block;
  border:1px solid var(--line)}
figcaption{font-size:11.5px;color:var(--dim);margin-top:5px;line-height:1.45}
figcaption .cred{color:#a1a1a6;font-size:10.5px;display:block;margin-top:2px}
figcaption .flag{color:var(--warn);display:block;margin-top:2px}
ol.src{margin:0;padding-inline-start:20px;font-size:13.5px}
ol.src li{margin-bottom:11px}
ol.src .lbl{font-weight:500}
ol.src .q{color:var(--dim);display:block;margin-top:2px}
ol.src .meta{color:#a1a1a6;font-size:11.5px;display:block;margin-top:2px}
a{color:var(--after);text-decoration:none}
a:hover{text-decoration:underline}
.vid{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.vid .t{font-size:14px;font-weight:500}
.vid .c{font-size:11.5px;color:var(--dim);margin-top:3px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:#f2f2f4;border-radius:7px;padding:3px 9px;font-size:12.5px;color:#3a3a3c}
.decide{background:#fff;border:1px solid var(--line);border-left:3px solid var(--warn);
  border-radius:14px;padding:16px 18px;margin-bottom:14px}
.decide h3{margin:0 0 6px;font-size:15px}
.decide p{margin:0 0 8px;font-size:14px;color:#3a3a3c}
.decide .opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.decide .opts img{width:100%;height:150px;object-fit:contain;background:#f2f2f4;border-radius:10px}
@media(max-width:820px){
  .cols{grid-template-columns:1fr}
  .decide .opts{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>מעשי ישראל — לפני ואחרי <small id="stamp"></small></h1>
  <nav id="tabs"></nav>
</div></header>
<main>
  <div class="scoreboard" id="score"></div>
  <div class="modes">

    <button data-mode="before">רק לפני</button>
    <button data-mode="after">רק אחרי</button>
  </div>
  <div class="cols" id="cols"></div>
  <div id="decisions" style="margin-top:34px"></div>
</main>

שפחות ניצלו ממאסר ומשריפה, וקהילות יהודיות באיטליה ובאימפריה העות'מאנית התחזקו בזכות הפליטים שהגיעו.", "title_reasoning": "מי (דונה גרסיה), מה עשתה (רשת מילוט), למי (מאות אנוסים), מפני מה (האינקוויזיציה). כל מילה נשענת על הציטוט.", "media_urls": ["https://upload.wikimedia.org/wikipedia/commons/9/9c/Gracianasimedal.jpg", "https://upload.wikimedia.org/wikipedia/commons/9/9e/PikiWiki_Israel_11851_dona_gracia_lookout_tiberias.jpg"], "title_en": "Dona Gracia Mendes Nasi Builds an Escape Network That Saves Hundreds of Conversos from the Inquisition", "description_en": "A 16th-century Jewish businesswoman of Portuguese origin who managed an international trading house. She used her family's trade network to smuggle hundreds of Conversos out of Spain and Portugal and beyond the reach of the Inquisition. She also funded printing houses and Jewish communities in Constantinople.", "act_en": "From Antwerp, she built a far-reaching escape network that brought hundreds of Conversos from Spain and Portugal to lands of refuge", "ripple_en": "Hundreds of families were saved from imprisonment and burning, and Jewish communities in Italy and the Ottoman Empire were strengthened by the refugees who arrived", "source_label_en": "English Wikipedia, entry: Dona Gracia Mendes Nasi", "categories": null, "location": null, "people": null, "deed_type": null, "actor_type": null, "beneficiary": null, "audit": null, "dedup": null}, "after": {"id": "81bfe740-07d5-4bea-860d-03cb8f27dc68", "title": "דונה גרסיה מנדס נסי מקימה רשת מילוט שהצילה מאות אנוסים מהאינקוויזיציה", "description": "ביאטריס דה לונה נולדה בפורטוגל בסביבות 1510, בת לדור הראשון של אנוסי פורטוגל: משפחתה נמנתה עם מגורשי ספרד שבחרו ב-1492 לעבור לפורטוגל במקום להתנצר, וב-1497 הוטבלו שם בכפייה יחד עם הקהילה היהודית המקומית. שם המשפחה המקורי היה \"נשיא\", והוחלף ל\"דה לונה\" עם ההמרה. בגיל שמונה עשרה נישאה לפרנסיסקו מנדס, בנקאי בליסבון שסחר גם באבנים יקרות ובתבלינים; משנתאלמנה באמצע שנות השלושים של המאה ה-16 הפכה לשותפה מלאה של גיסה דיוגו באנטוורפן, ועם מותו ב-1543 עמדה לבדה בראש בית מנדס. היא סחרה בעיקר בצמר, בפלפל, בתבואה, בבגדים ובמוצרי טקסטיל, ושליטת המשפחה בסחר התבלינים אפשרה לבית העסק להלוות כספים למלכי אנגליה, גרמניה, פורטוגל וטורקיה. דרכה שלה עברה באנטוורפן (1536), בוונציה — שם הלשינו עליה שהיא יהודייה, נכסי מנדס הוקפאו והיא נכלאה עד שחרורה ב-1549 — ובפירארה, שם הסירה את המסווה הנוצרי וחזרה לשם נשיא, ומשם לקושטא בשנים 1552–1553 דרך רגוזה (דוברובניק). לצד בית המסחר עמדה בראש ארגון יהודי מחתרתי, ובקושטא מימנה מלומדים, רבנים, הוצאת ספרים ותרגומי מקרא.", "category": "היסטורי", "year": 1537, "media_type": "image", "media_url": "https://upload.wikimedia.org/wikipedia/commons/9/9c/Gracianasimedal.jpg", "source_url": "https://jwa.org/encyclopedia/article/nasi-dona-gracia", "source_label": "האנציקלופדיה שלווי/היימן לנשים יהודיות, ערך \"דונה גרציה נשיא\" מאת פרופ' מרים בודיאן, ארכיון הנשים היהודיות (JWA)", "submitted_by": null, "status": "approved", "created_at": "2026-07-31 23:12:41.635027+00", "citations": [{"lang": "en", "quote": "A lengthy passage of the book describes Gracia Nasi’s dedicated efforts to aid conversos fleeing Portugal and resettling in Italy or the Ottoman Empire.", "locator": "סעיף 'Charitable Activities in Ferrara' — הפסקה על ספרו של שמואל אושקי 'תנחומות לתלאות ישראל'", "published": "2009-02-27", "source_url": "https://jwa.org/encyclopedia/article/nasi-dona-gracia", "source_label": "האנציקלופדיה שלווי/היימן לנשים יהודיות, ערך \"דונה גרציה נשיא\" מאת פרופ' מרים בודיאן, ארכיון הנשים היהודיות (JWA)", "source_label_en": "Miriam Bodian, \"Doña Gracia Nasi\", Shalvi/Hyman Encyclopedia of Jewish Women, Jewish Women's Archive"}, {"lang": "en", "quote": "Gracia’s extensive business contacts hid a network of escape routes throughout Europe. While she traded spices and gems, her business agents also ferried secret Jews across borders along with this merchandise.", "locator": "סעיף 'Gracia used her extensive business contacts to help other Jews escape', שתי הפסקאות הראשונות", "published": "2018-12-20", "source_url": "https://aish.com/dona-gracia-nasi-the-spanish-inquisitions-underground-railroad/", "source_label": "אייש: \"דונה גרציה נשיא ומסילת הברזל התת-קרקעית של האינקוויזיציה הספרדית\", מאת ד\"ר איווט אלט מילר", "source_label_en": "Dr. Yvette Alt Miller, \"Dona Gracia Nasi & the Spanish Inquisition's Underground Railroad\", Aish"}, {"lang": "he", "quote": "בינתיים, נתגבשה קבוצה מרשימה של אנוסים, אשר היא גם סייעה להם לברוח מחצי האי באמצעים מחתרתיים.", "locator": "הפסקה על המעבר לאנטוורפן ב-1536, מיד אחרי המשפט על פיזור הממון המשפחתי", "quote_en": "Meanwhile, an impressive group of conversos had coalesced, whom she also helped to flee the [Iberian] peninsula by underground means.", "published": "2023-12-26", "source_url": "https://schechter.ac.il/article/dona-gracia/", "source_label": "מכון שכטר למדעי היהדות: \"דונה גרציה נשיא (1569-1510): אשת חזון\", מאת פרופ' רינה לוין מלמד", "published_note": "og:updated_time מהדף עצמו — מכון שכטר אינו מפרסם תאריך פרסום מקורי", "source_label_en": "Prof. Renée Levine Melammed, \"Doña Gracia Nasi (1510-1569): A Woman of Vision\", Schechter Institute of Jewish Studies"}, {"lang": "he", "quote": "היא התמודדה עם אפיפיורים וקיסרים, עם מלכים ורוזנים, מינתה ראשי ישיבות, הבריחה יהודים אנוסים למקום מבטחים, והשפיעה על שווקים בינלאומיים.", "locator": "סעיף 'הציונית הראשונה', הפסקה הפותחת", "quote_en": "She contended with popes and emperors, with kings and counts, appointed heads of yeshivas, smuggled converso Jews to safety, and influenced international markets.", "published": "2010-11-04", "source_url": "https://www.globes.co.il/news/article.aspx?did=1000598862", "source_label": "גלובס: \"האישה שקנתה את טבריה\", מאת זהרה רון", "source_label_en": "Zohara Ron, \"The Woman Who Bought Tiberias\", Globes"}, {"lang": "en", "quote": "Due to the persecutions of the Inquisition and the Catholic Church, many conversos moved to the city of Antwerp in modern day Belgium, and from there sought to illegally make their way to the Ottoman Empire so they could practice Judaism freely again.", "locator": "פסקת הפתיחה, מיד אחרי המשפט על היותה 'the richest woman in the world in the 16th century'", "published": "2025-01-30", "source_url": "https://blog.nli.org.il/en/dona_gracia/", "source_label": "הבלוג של הספרייה הלאומית של ישראל: \"האם היהודייה שהביסה את הקיסר קרל החמישי\"", "source_label_en": "The Librarians, National Library of Israel blog: \"The Jewish Mother Who Defeated Emperor Charles V\""}, {"id": "ej-tiberias", "source_url": "https://www.jewishvirtuallibrary.org/joseph-nasi", "source_label": "אנציקלופדיה יודאיקה, ערך \"יוסף נשיא\" (Jewish Virtual Library)", "quote": "As early as 1558 or 1559, Doña Gracia obtained from the sultan various concessions in Tiberius, then in ruins, probably with the intention of founding a yeshivah there. In 1561 Joseph obtained confirmation and extension of this grant, giving him plenary authority in Tiberias and seven nearby villages in consideration of an annual payment. In the winter of 1564–65 the rebuilding of the ruined walls of Tiberias was completed, ensuring a certain degree of physical security. This was the only practical attempt to establish some sort of Jewish political center in Palestine between the fourth and 19th centuries.", "quote_en": null, "locator": "גוף הערך, הפסקה על טבריה", "published": "2007", "lang": "en"}, {"id": "ej-never-visited", "source_url": "https://www.jewishvirtuallibrary.org/joseph-nasi", "source_label": "אנציקלופדיה יודאיקה, ערך \"יוסף נשיא\" (Jewish Virtual Library)", "quote": "it is certain in any case that he never visited his domain", "quote_en": null, "locator": "גוף הערך, המשך הפסקה על טבריה", "published": "2007", "lang": "en"}, {"id": "ej-ancona", "source_url": "https://www.jewishvirtuallibrary.org/joseph-nasi", "source_label": "אנציקלופדיה יודאיקה, ערך \"יוסף נשיא\" (Jewish Virtual Library)", "quote": "In 1556 he joined her in organizing the blockade of the port of Ancona to avenge the persecution of the Marranos there.", "quote_en": null, "locator": "גוף הערך, הפסקה על שנותיו הראשונות של יוסף נשיא בקושטא", "published": "2007", "lang": "en"}, {"id": "ej-provenance", "source_url": "https://www.jewishvirtuallibrary.org/joseph-nasi", "source_label": "אנציקלופדיה יודאיקה, ערך \"יוסף נשיא\" (Jewish Virtual Library)", "quote": "Source: Encyclopaedia Judaica. © 2007 The Gale Group.", "quote_en": null, "locator": "שורת הייחוס בתחתית העמוד – מקור הערך ותאריך הזכויות", "published": "2007", "lang": "en"}, {"id": "wwh-instructions", "source_url": "https://www.encyclopedia.com/women/encyclopedias-almanacs-transcripts-and-maps/nasi-gracia-mendes-1510-1569", "source_label": "Women in World History: A Biographical Encyclopedia, ערך \"נשיא, גרציה מנדס\" (Gale, encyclopedia.com)", "quote": "Nasi provided the refugees with detailed instructions, identifying which roads to avoid, where to find accommodations, and where emergency assistance could be secured. Before setting out, the refugees were provided with money and the names and addresses of Mendes agents, who reported on local conditions at various stages of the journey. Through the vast Mendes banking empire, Gracia also insured the safe transfer of refugees' assets to their points of destination.", "quote_en": null, "locator": "גוף הערך, הפסקה על רשת הבריחה", "published": null, "lang": "en"}, {"id": "wwh-antwerp", "source_url": "https://www.encyclopedia.com/women/encyclopedias-almanacs-transcripts-and-maps/nasi-gracia-mendes-1510-1569", "source_label": "Women in World History: A Biographical Encyclopedia, ערך \"נשיא, גרציה מנדס\" (Gale, encyclopedia.com)", "quote": "Antwerp rapidly became a way station for Jews in transit to havens of safety in Italy, Palestine, and the Ottoman Empire.", "quote_en": null, "locator": "גוף הערך, הפסקה על אנטוורפן", "published": null, "lang": "en"}, {"id": "wwh-loans", "source_url": "https://www.encyclopedia.com/women/encyclopedias-almanacs-transcripts-and-maps/nasi-gracia-mendes-1510-1569", "source_label": "Women in World History: A Biographical Encyclopedia, ערך \"נשיא, גרציה מנדס\" (Gale, encyclopedia.com)", "quote": "the family's dominance of the spice trade allowed them to extend loans to the monarchs of England, Germany, Portugal, and Turkey", "quote_en": null, "locator": "גוף הערך, הפסקה על עסקי בית מנדס", "published": null, "lang": "en"}, {"id": "wwh-boycott-partial", "source_url": "https://www.encyclopedia.com/women/encyclopedias-almanacs-transcripts-and-maps/nasi-gracia-mendes-1510-1569", "source_label": "Women in World History: A Biographical Encyclopedia, ערך \"נשיא, גרציה מנדס\" (Gale, encyclopedia.com)", "quote": "Initially, the boycott was strongly felt in Ancona. Many bankruptcies occurred among Christian merchants, and there was a severe shortage of Turkish goods. However, trade slowly increased in subsequent months, as Jewish traders began to defect.", "quote_en": null, "locator": "גוף הערך, הפסקה על תוצאות החרם", "published": null, "lang": "en"}, {"id": "wwh-no-cargo", "source_url": "https://www.encyclopedia.com/women/encyclopedias-almanacs-transcripts-and-maps/nasi-gracia-mendes-1510-1569", "source_label": "Women in World History: A Biographical Encyclopedia, ערך \"נשיא, גרציה מנדס\" (Gale, encyclopedia.com)", "quote": "No cargo owned by the Mendes family, however, ever passed through the port of Ancona again.", "quote_en": null, "locator": "גוף הערך, סיום הפסקה על החרם", "published": null, "lang": "en"}, {"id": "wwh-tiberias-1565", "source_url": "https://www.encyclopedia.com/women/encyclopedias-almanacs-transcripts-and-maps/nasi-gracia-mendes-1510-1569", "source_label": "Women in World History: A Biographical Encyclopedia, ערך \"נשיא, גרציה מנדס\" (Gale, encyclopedia.com)", "quote": "In 1565, Nasi obtained special permission from Suleiman to build a new Jewish settlement at Tiberias, in Palestine.", "quote_en": null, "locator": "גוף הערך, הפסקה על טבריה", "published": null, "lang": "en"}, {"id": "wwh-tiberias-1561-box", "source_url": "https://www.encyclopedia.com/women/encyclopedias-almanacs-transcripts-and-maps/nasi-gracia-mendes-1510-1569", "source_label": "Women in World History: A Biographical Encyclopedia, ערך \"נשיא, גרציה מנדס\" (Gale, encyclopedia.com)", "quote": "With Inquisition established in Portugal, relocated to Antwerp (1536); relocated to Venice (1545), denounced and imprisoned by Venetian authorities; released from prison (1549); relocated to Ferrara (1550) and became a declared Jew; with family, moved to Istanbul(1553); organized a trade boycott of Ancona in retaliation for the deaths of 24 Jews (1556); obtained special permission from Suleiman to build a new Jewish settlement at Tiberias (1561).", "quote_en": null, "locator": "כרטיס הביוגרפיה בראש הערך (ציר החיים)", "published": null, "lang": "en"}, {"id": "wwh-ferrara-bible", "source_url": "https://www.encyclopedia.com/women/encyclopedias-almanacs-transcripts-and-maps/nasi-gracia-mendes-1510-1569", "source_label": "Women in World History: A Biographical Encyclopedia, ערך \"נשיא, גרציה מנדס\" (Gale, encyclopedia.com)", "quote": "Her best-known act of sponsorship was the translation and publication of the Ferrara Bible.", "quote_en": null, "locator": "גוף הערך, הפסקה על חסותה על ספרים", "published": null, "lang": "en"}, {"id": "wwh-name", "source_url": "https://www.encyclopedia.com/women/encyclopedias-almanacs-transcripts-and-maps/nasi-gracia-mendes-1510-1569", "source_label": "Women in World History: A Biographical Encyclopedia, ערך \"נשיא, גרציה מנדס\" (Gale, encyclopedia.com)", "quote": "Gracia's family name was Nasi; with their conversion to Christianity, the family changed it to de Luna.", "quote_en": null, "locator": "כרטיס הביוגרפיה בראש הערך (\"Name variations\")", "published": null, "lang": "en"}, {"id": "wwh-marriage", "source_url": "https://www.encyclopedia.com/women/encyclopedias-almanacs-transcripts-and-maps/nasi-gracia-mendes-1510-1569", "source_label": "Women in World History: A Biographical Encyclopedia, ערך \"נשיא, גרציה מנדס\" (Gale, encyclopedia.com)", "quote": "married Francisco Mendes, in 1528, in Lisbon, Portugal (died 1536); children: Reyna Mendes.", "quote_en": null, "locator": "כרטיס הביוגרפיה בראש הערך", "published": null, "lang": "en"}, {"id": "wwh-venice-prison", "source_url": "https://www.encyclopedia.com/women/encyclopedias-almanacs-transcripts-and-maps/nasi-gracia-mendes-1510-1569", "source_label": "Women in World History: A Biographical Encyclopedia, ערך \"נשיא, גרציה מנדס\" (Gale, encyclopedia.com)", "quote": "In 1545, Nasi was imprisoned by Venetian authorities, and all of the Mendes family assets were frozen.", "quote_en": null, "locator": "גוף הערך, הפסקה על ונציה", "published": null, "lang": "en"}, {"id": "wwh-underground", "source_url": "https://www.encyclopedia.com/women/encyclopedias-almanacs-transcripts-and-maps/nasi-gracia-mendes-1510-1569", "source_label": "Women in World History: A Biographical Encyclopedia, ערך \"נשיא, גרציה מנדס\" (Gale, encyclopedia.com)", "quote": "head of an underground Jewish organization", "quote_en": null, "locator": "משפט הפתיחה של הערך", "published": null, "lang": "en"}, {"id": "wwh-title", "source_url": "https://www.encyclopedia.com/women/encyclopedias-almanacs-transcripts-and-maps/nasi-gracia-mendes-1510-1569", "source_label": "Women in World History: A Biographical Encyclopedia, ערך \"נשיא, גרציה מנדס\" (Gale, encyclopedia.com)", "quote": "Women in World History", "quote_en": null, "locator": "שם היצירה שממנה נלקח הערך (Gale)", "published": null, "lang": "en"}, {"id": "miz-network", "source_url": "https://mizrachi.org/hamizrachi/dona-gracia-nasi-a-16th-century-religious-zionist/", "source_label": "World Mizrachi – HaMizrachi: \"Doña Gracia Nasi: a 16th Century Religious Zionist\"", "quote": "Nevertheless, she began to use her resources to design an underground network that helped hundreds of crypto-Jews flee Spain and Portugal. The Mendes family business owned trading ships that traveled between Lisbon and Antwerp, and soon enough these ships were carrying Jewish fugitives in addition to spices and bullion. Once the crypto-Jews arrived in Antwerp, Beatrice provided instructions and money to cross the treacherous range of the Alps to the port city of Venice. From there, transportation was arranged to bring them to the Ottoman Empire – including the holy land of Israel.", "quote_en": null, "locator": "גוף המאמר, הפסקה על רשת המחתרת", "published": "2022-04-04", "lang": "en"}, {"id": "miz-museum", "source_url": "https://mizrachi.org/hamizrachi/dona-gracia-nasi-a-16th-century-religious-zionist/", "source_label": "World Mizrachi – HaMizrachi: \"Doña Gracia Nasi: a 16th Century Religious Zionist\"", "quote": "Today the Doña Gracia hotel and museum is located in Tiberias, welcoming visitors to the land to which she yearned to return.", "quote_en": null, "locator": "פסקת הסיום של המאמר", "published": "2022-04-04", "lang": "en"}, {"id": "miz-tiberias", "source_url": "https://mizrachi.org/hamizrachi/dona-gracia-nasi-a-16th-century-religious-zionist/", "source_label": "World Mizrachi – HaMizrachi: \"Doña Gracia Nasi: a 16th Century Religious Zionist\"", "quote": "In the 1560s, Gracia Nasi and her nephew, Joseph Nasi, who served in the sultan’s court, sought to establish a settlement in Tiberias with the goal of creating a place of refuge for Jews. Sultan Suleiman the Magnificent granted Joseph Nasi permission to settle Tiberias, and by 1566, a thriving community of Jews were living there.", "quote_en": null, "locator": "גוף המאמר, הפסקה על טבריה", "published": "2022-04-04", "lang": "en"}, {"id": "posen-bible", "source_url": "https://www.posenlibrary.com/entry/dedication-gracia-nasi-ferrara-bible", "source_label": "ספריית פוזן לתרבות ולציוויליזציה יהודית – ההקדשה לדונה גרציה נשיא בתנ\"ך פירארה (1553)", "quote": "In Ferrara, Italy, where many conversos fleeing the Iberian Peninsula found refuge, the first full Spanish translation of the Old Testament in Latin characters was published by the translator Abraham ben Solomon Usque and typographer Yom Tob ben Levi Athias (who also funded the endeavor).", "quote_en": null, "locator": "הערת ההקשר של העורכים לפריט", "published": "2023", "lang": "en"}, {"id": "posen-purpose", "source_url": "https://www.posenlibrary.com/entry/dedication-gracia-nasi-ferrara-bible", "source_label": "ספריית פוזן לתרבות ולציוויליזציה יהודית – ההקדשה לדונה גרציה נשיא בתנ\"ך פירארה (1553)", "quote": "The translation, intended largely for New Christians who wanted to revert to Judaism but lacked a knowledge of Hebrew, drew heavily on Spanish Jewish translation traditions, thus creating a bridge between the past in Spain and contemporary reality.", "quote_en": null, "locator": "הערת ההקשר של העורכים לפריט", "published": "2023", "lang": "en"}, {"id": "posen-two-versions", "source_url": "https://www.posenlibrary.com/entry/dedication-gracia-nasi-ferrara-bible", "source_label": "ספריית פוזן לתרבות ולציוויליזציה יהודית – ההקדשה לדונה גרציה נשיא בתנ\"ך פירארה (1553)", "quote": "Two versions were printed, one for Jewish audiences, dedicated to Doña Gracia Nasi, the financier of this press, and the other, with a dedication to the Duke of Ferrara, intended for a Christian audience.", "quote_en": null, "locator": "הערת ההקשר של העורכים לפריט", "published": "2023", "lang": "en"}, {"id": "posen-dedication", "source_url": "https://www.posenlibrary.com/entry/dedication-gracia-nasi-ferrara-bible", "source_label": "ספריית פוזן לתרבות ולציוויליזציה יהודית – ההקדשה לדונה גרציה נשיא בתנ\"ך פירארה (1553)", "quote": "It would not seem proper, most magnificent Lady, that now we are about to print the Bible in our Spanish tongue, translated from the Hebrew word for word—so rare a work never before known until our day, it should be offered to persons whose favor could not help it, but to one so noble and magnanimous that it would adorn her nobility.", "quote_en": null, "locator": "טקסט ההקדשה עצמו מתוך תנ\"ך פירארה, 1553 (מקור בן הזמן)", "published": "2023", "lang": "en"}, {"id": "usque-consolacam", "source_url": "https://www.encyclopedia.com/religion/encyclopedias-almanacs-transcripts-and-maps/usque-samuel", "source_label": "אנציקלופדיה יודאיקה, ערך \"אושקי, שמואל\" (encyclopedia.com)", "quote": "Written in limpid Portuguese prose, the Consolaçam was dedicated to the great patroness of Jewish art and culture, Doña Gracia *Nasi. Its avowed purpose was to persuade Marrano refugees from Spain and Portugal, and perhaps also those Marranos who were still in those two countries, to return wholeheartedly to Judaism.", "quote_en": null, "locator": "גוף הערך, הפסקה על \"נחמה לצרות ישראל\"", "published": null, "lang": "en"}, {"id": "anc-100", "source_url": "https://halakhaoftheday.org/2022/06/27/dona-gracia-mendes-and-the-boycott-to-ancona-1556/", "source_label": "Halakha of the Day – \"Doña Gracia (Part 4) and the Jewish Boycott against Ancona, Italy\"", "quote": "Nearly 100 anusim were imprisoned by the Inquisition and threatened with being burned or sold into slavery if they did not renounce their Jewish faith.", "quote_en": null, "locator": "גוף המאמר, הרקע לפרשת אנקונה", "published": "2022-06-27", "lang": "en"}, {"id": "anc-24", "source_url": "https://halakhaoftheday.org/2022/06/27/dona-gracia-mendes-and-the-boycott-to-ancona-1556/", "source_label": "Halakha of the Day – \"Doña Gracia (Part 4) and the Jewish Boycott against Ancona, Italy\"", "quote": "24 anusim, who openly lived as Jews, adamantly refused conversion (even a fictitious one) and were burned at stake in an auto de fe of the Inquisition.", "quote_en": null, "locator": "גוף המאמר, הרקע לפרשת אנקונה", "published": "2022-06-27", "lang": "en"}, {"id": "anc-sultan-letter", "source_url": "https://halakhaoftheday.org/2022/06/27/dona-gracia-mendes-and-the-boycott-to-ancona-1556/", "source_label": "Halakha of the Day – \"Doña Gracia (Part 4) and the Jewish Boycott against Ancona, Italy\"", "quote": "On March 9, 1556, at the behest of Doña Gracia, Sultan Suleiman wrote to the pope demanding the release of the imprisoned men, whom he called his subjects since he granted them Ottoman citizenship from afar.", "quote_en": null, "locator": "גוף המאמר, הפסקה על התערבות הסולטן", "published": "2022-06-27", "lang": "en"}, {"id": "anc-boycott", "source_url": "https://halakhaoftheday.org/2022/06/27/dona-gracia-mendes-and-the-boycott-to-ancona-1556/", "source_label": "Halakha of the Day – \"Doña Gracia (Part 4) and the Jewish Boycott against Ancona, Italy\"", "quote": "Doña Gracia managed to declare a boycott of the port of Ancona. No ship of her company or of companies that had relations with her company could embark or disembark in Ancona. The port to use would be from now on Pesaro, or the already famous port of Venice.", "quote_en": null, "locator": "גוף המאמר, הפסקה על הכרזת החרם", "published": "2022-06-27", "lang": "en"}, {"id": "anc-first-jewish", "source_url": "https://halakhaoftheday.org/2022/06/27/dona-gracia-mendes-and-the-boycott-to-ancona-1556/", "source_label": "Halakha of the Day – \"Doña Gracia (Part 4) and the Jewish Boycott against Ancona, Italy\"", "quote": "Although this was not the first economic boycott in the renaissance, it was the first organized by the Jews.", "quote_en": null, "locator": "גוף המאמר, הערכת החרם", "published": "2022-06-27", "lang": "en"}, {"id": "hod-1558", "source_url": "https://halakhaoftheday.org/2017/05/16/dona-gracia-mendes-and-a-jewish-state-in-tiberias-1558-1564/", "source_label": "Halakha of the Day – \"Doña Gracia Mendes and a Jewish State in Tiberias (1558-1564)\"", "quote": "In the year 1558 Suleiman gave Doña Gracia the concession of the city and appointed Yosef Nasí as “The Lord of Tiberias”", "quote_en": null, "locator": "גוף המאמר, הפסקה על הזיכיון", "published": "2017-05-16", "lang": "en"}, {"id": "hod-1561-walls", "source_url": "https://halakhaoftheday.org/2017/05/16/dona-gracia-mendes-and-a-jewish-state-in-tiberias-1558-1564/", "source_label": "Halakha of the Day – \"Doña Gracia Mendes and a Jewish State in Tiberias (1558-1564)\"", "quote": "In 1561 Yosef Nasí together with Rabbi Yosef Ben Aderet began the construction of the walls", "quote_en": null, "locator": "גוף המאמר, הפסקה על בניית החומות", "published": "2017-05-16", "lang": "en"}, {"id": "sch-birth", "source_url": "https://schechter.edu/dona-gracia-nasi-1510-1569-a-conversa-of-import/", "source_label": "מכון שכטר למדעי היהדות – פרופ' רנה לוין מלמד, \"Dona Gracia Nasi (1510-1569): A Conversa of Import\"", "quote": "Beatriz de Luna was born into the Nasi family, a family of Spanish exiles who chose to emigrate to neighboring Portugal in 1492 rather than to submit to conversion to Catholicism.", "quote_en": null, "locator": "גוף המאמר, פסקה שנייה", "published": "2011-06-13", "lang": "en"}, {"id": "sch-1497", "source_url": "https://schechter.edu/dona-gracia-nasi-1510-1569-a-conversa-of-import/", "source_label": "מכון שכטר למדעי היהדות – פרופ' רנה לוין מלמד, \"Dona Gracia Nasi (1510-1569): A Conversa of Import\"", "quote": "the exiles were forcibly converted in 1497 together with the local Portuguese Jewish community", "quote_en": null, "locator": "גוף המאמר, פסקה שנייה", "published": "2011-06-13", "lang": "en"}, {"id": "sch-marriage", "source_url": "https://schechter.edu/dona-gracia-nasi-1510-1569-a-conversa-of-import/", "source_label": "מכון שכטר למדעי היהדות – פרופ' רנה לוין מלמד, \"Dona Gracia Nasi (1510-1569): A Conversa of Import\"", "quote": "At eighteen, Gracia married well, presumably the result of an arranged match to Francisco/Meir Mendes of the Benvenistes, also a family of Spanish exiles. He successfully managed a bank in Lisbon and dealt in precious stones and spices", "quote_en": null, "locator": "גוף המאמר, הפסקה על נישואיה", "published": "2011-06-13", "lang": "en"}, {"id": "sch-antwerp", "source_url": "https://schechter.edu/dona-gracia-nasi-1510-1569-a-conversa-of-import/", "source_label": "מכון שכטר למדעי היהדות – פרופ' רנה לוין מלמד, \"Dona Gracia Nasi (1510-1569): A Conversa of Import\"", "quote": "In 1536, she took her remaining family (daughter, sister and two nephews) to Antwerp, a wise decision since the Portuguese Inquisition began to show signs of life. Knowing that Antwerp was a temporary stop because it was under Spanish rule, she distributed the family fortune in various locales; in the meantime, she gained a loyal core of converso agents whom she had helped flee the Peninsula by means of an underground network.", "quote_en": null, "locator": "גוף המאמר, הפסקה על אנטוורפן", "published": "2011-06-13", "lang": "en"}, {"id": "sch-venice", "source_url": "https://schechter.edu/dona-gracia-nasi-1510-1569-a-conversa-of-import/", "source_label": "מכון שכטר למדעי היהדות – פרופ' רנה לוין מלמד, \"Dona Gracia Nasi (1510-1569): A Conversa of Import\"", "quote": "she was arrested while in Venice and released", "quote_en": null, "locator": "גוף המאמר, הפסקה על המסע מזרחה", "published": "2011-06-13", "lang": "en"}, {"id": "sch-goods", "source_url": "https://schechter.edu/dona-gracia-nasi-1510-1569-a-conversa-of-import/", "source_label": "מכון שכטר למדעי היהדות – פרופ' רנה לוין מלמד, \"Dona Gracia Nasi (1510-1569): A Conversa of Import\"", "quote": "She dealt mainly in wool, pepper, grain, cloth and textiles.", "quote_en": null, "locator": "גוף המאמר, הפסקה על עסקיה", "published": "2011-06-13", "lang": "en"}, {"id": "sch-ragusa", "source_url": "https://schechter.edu/dona-gracia-nasi-1510-1569-a-conversa-of-import/", "source_label": "מכון שכטר למדעי היהדות – פרופ' רנה לוין מלמד, \"Dona Gracia Nasi (1510-1569): A Conversa of Import\"", "quote": "When she left for Constantinople, it is via Ragusa (Dubrovnik) in 1552 because she had arranged for storage of her merchandise there.", "quote_en": null, "locator": "גוף המאמר, הפסקה על המעבר לקושטא", "published": "2011-06-13", "lang": "en"}, {"id": "sch-firman", "source_url": "https://schechter.edu/dona-gracia-nasi-1510-1569-a-conversa-of-import/", "source_label": "מכון שכטר למדעי היהדות – פרופ' רנה לוין מלמד, \"Dona Gracia Nasi (1510-1569): A Conversa of Import\"", "quote": "She petitions the sultan for a firman (contract) to create a new independent Jewish settlement in Tiberias, aiming for a realistic economy based on agriculture, industry and export.", "quote_en": null, "locator": "גוף המאמר, הפסקה על טבריה", "published": "2011-06-13", "lang": "en"}, {"id": "sch-death", "source_url": "https://schechter.edu/dona-gracia-nasi-1510-1569-a-conversa-of-import/", "source_label": "מכון שכטר למדעי היהדות – פרופ' רנה לוין מלמד, \"Dona Gracia Nasi (1510-1569): A Conversa of Import\"", "quote": "dreaming of building a Jewish homeland where she hoped to move, but did not succeed due to her death in 1569", "quote_en": null, "locator": "פסקת הסיום של המאמר", "published": "2011-06-13", "lang": "en"}, {"id": "sch-curriculum", "source_url": "https://schechter.edu/dona-gracia-nasi-1510-1569-a-conversa-of-import/", "source_label": "מכון שכטר למדעי היהדות – פרופ' רנה לוין מלמד, \"Dona Gracia Nasi (1510-1569): A Conversa of Import\"", "quote": "Israel’s Ministry of Education proudly introduced a “Dona Gracia” unit into the school system so that every Israeli student would become acquainted with this impressive figure in Jewish history.", "quote_en": null, "locator": "פסקת הפתיחה של המאמר", "published": "2011-06-13", "lang": "en"}, {"id": "sch-author", "source_url": "https://schechter.edu/dona-gracia-nasi-1510-1569-a-conversa-of-import/", "source_label": "מכון שכטר למדעי היהדות – פרופ' רנה לוין מלמד, \"Dona Gracia Nasi (1510-1569): A Conversa of Import\"", "quote": "Prof. Renée Levine Melammed", "quote_en": null, "locator": "שורת המחבר בראש המאמר (דיקנית בית הספר לתארים מתקדמים במכון שכטר)", "published": "2011-06-13", "lang": "en"}, {"id": "schhe-2010", "source_url": "https://schechter.ac.il/article/dona-gracia/", "source_label": "מכון שכטר למדעי היהדות – \"דונה גרציה נשיא (1510-1569): אשת חזון\"", "quote": "בשנת 2010 צוין יום הולדתה ה-500 של אחת הנשים הבולטות ביותר בהיסטוריה של עם ישראל, דונה גרציה נשיא. כתוצאה מכך, הכריז משרד החינוך בגאווה על חניכתה של יחידת לימוד בנושא דונה גרציה בבתי הספר", "quote_en": "In 2010 the 500th birthday of one of the most prominent women in the history of the Jewish people, Doña Gracia Nasi, was marked. As a result, the Ministry of Education proudly announced the inauguration of a study unit on Doña Gracia in the schools", "locator": "פסקת הפתיחה של המאמר", "published": null, "lang": "he"}, {"id": "schhe-goods", "source_url": "https://schechter.ac.il/article/dona-gracia/", "source_label": "מכון שכטר למדעי היהדות – \"דונה גרציה נשיא (1510-1569): אשת חזון\"", "quote": "היא עסקה בעיקר בסחר בצמר, בפלפל, בתבואה, בבגדים ובמוצרי טקסטיל.", "quote_en": "She dealt mainly in trade in wool, pepper, grain, clothing and textile products.", "locator": "גוף המאמר, הפסקה על עסקיה", "published": null, "lang": "he"}, {"id": "schhe-firman", "source_url": "https://schechter.ac.il/article/dona-gracia/", "source_label": "מכון שכטר למדעי היהדות – \"דונה גרציה נשיא (1510-1569): אשת חזון\"", "quote": "היא עתרה לסולטן התורכי בבקשה שיעניק לה חוזה, המאפשר לה להקים התיישבות יהודית עצמאית בעיר טבריה", "quote_en": "She petitioned the Turkish sultan to grant her a contract allowing her to establish an independent Jewish settlement in the city of Tiberias", "locator": "גוף המאמר, הפסקה על טבריה", "published": null, "lang": "he"}, {"id": "iaa-lease", "source_url": "https://www.israeliarchaeology.org/%D7%9E%D7%91%D7%98-%D7%94%D7%99%D7%A1%D7%98%D7%95%D7%A8%D7%99-%D7%95%D7%A2%D7%9B%D7%A9%D7%95%D7%95%D7%99-%D7%A2%D7%9C-%D7%9E%D7%A2%D7%A8%D7%9B%D7%AA-%D7%94%D7%91%D7%99%D7%A6%D7%95%D7%A8%D7%99%D7%9D/", "source_label": "המכון הישראלי לארכיאולוגיה – ד\"ר שלי-אן פלג, \"מבט היסטורי ועכשווי על מערכת הביצורים בטבריה\"", "quote": "מקורות היסטוריים מן המאה ה- 16 מתארים כי אשת העסקים העשירה דונה גרציה חכרה את טבריה מן הסולטן העות'מאני בשנות ה-60 של אותה מאה כדי ליישב בה יהודים מאירופה.", "quote_en": "Historical sources from the 16th century describe how the wealthy businesswoman Doña Gracia leased Tiberias from the Ottoman sultan in the 1560s in order to settle Jews from Europe there.", "locator": "גוף המאמר, הפרק ההיסטורי על ביצורי טבריה", "published": "2022-02-24", "lang": "he"}, {"id": "iaa-her-wall", "source_url": "https://www.israeliarchaeology.org/%D7%9E%D7%91%D7%98-%D7%94%D7%99%D7%A1%D7%98%D7%95%D7%A8%D7%99-%D7%95%D7%A2%D7%9B%D7%A9%D7%95%D7%95%D7%99-%D7%A2%D7%9C-%D7%9E%D7%A2%D7%A8%D7%9B%D7%AA-%D7%94%D7%91%D7%99%D7%A6%D7%95%D7%A8%D7%99%D7%9D/", "source_label": "המכון הישראלי לארכיאולוגיה – ד\"ר שלי-אן פלג, \"מבט היסטורי ועכשווי על מערכת הביצורים בטבריה\"", "quote": "מכאן ברור שתוואי החומה נקבע לפני זמנו של דאהר אל-עומר, ביוזמתה ובמימון של דונה גרציה בשנות ה- 60 של המאה ה- 16.", "quote_en": "It is therefore clear that the line of the wall was set before the time of Dahir al-Umar, on the initiative and with the funding of Doña Gracia in the 1560s.", "locator": "גוף המאמר, המסקנה מן הממצא הארכיאולוגי", "published": "2022-02-24", "lang": "he"}, {"id": "iaa-survey", "source_url": "https://www.israeliarchaeology.org/%D7%9E%D7%91%D7%98-%D7%94%D7%99%D7%A1%D7%98%D7%95%D7%A8%D7%99-%D7%95%D7%A2%D7%9B%D7%A9%D7%95%D7%95%D7%99-%D7%A2%D7%9C-%D7%9E%D7%A2%D7%A8%D7%9B%D7%AA-%D7%94%D7%91%D7%99%D7%A6%D7%95%D7%A8%D7%99%D7%9D/", "source_label": "המכון הישראלי לארכיאולוגיה – ד\"ר שלי-אן פלג, \"מבט היסטורי ועכשווי על מערכת הביצורים בטבריה\"", "quote": "רק בשנים 2012-2013 בוצע סקר שימור בעיר ואז הוכרזו שרידי הביצורים כמונומנטים.", "quote_en": "Only in 2012-2013 was a conservation survey carried out in the city, and then the remains of the fortifications were declared monuments.", "locator": "גוף המאמר, הפרק על מצב השימור", "published": "2022-02-24", "lang": "he"}, {"id": "iaa-towers", "source_url": "https://www.israeliarchaeology.org/%D7%9E%D7%91%D7%98-%D7%94%D7%99%D7%A1%D7%98%D7%95%D7%A8%D7%99-%D7%95%D7%A2%D7%9B%D7%A9%D7%95%D7%95%D7%99-%D7%A2%D7%9C-%D7%9E%D7%A2%D7%A8%D7%9B%D7%AA-%D7%94%D7%91%D7%99%D7%A6%D7%95%D7%A8%D7%99%D7%9D/", "source_label": "המכון הישראלי לארכיאולוגיה – ד\"ר שלי-אן פלג, \"מבט היסטורי ועכשווי על מערכת הביצורים בטבריה\"", "quote": "שרידי הביצורים שנותרו עומדים על תילם כוללים בעיקר את המגדלים העגולים ששולבו בחומה הדרומית וחלק מן הקירות.", "quote_en": "The remains of the fortifications still standing consist mainly of the round towers incorporated into the southern wall and part of the walls.", "locator": "גוף המאמר, תיאור השרידים", "published": "2022-02-24", "lang": "he"}, {"id": "iaa-dahir", "source_url": "https://www.israeliarchaeology.org/%D7%9E%D7%91%D7%98-%D7%94%D7%99%D7%A1%D7%98%D7%95%D7%A8%D7%99-%D7%95%D7%A2%D7%9B%D7%A9%D7%95%D7%95%D7%99-%D7%A2%D7%9C-%D7%9E%D7%A2%D7%A8%D7%9B%D7%AA-%D7%94%D7%91%D7%99%D7%A6%D7%95%D7%A8%D7%99%D7%9D/", "source_label": "המכון הישראלי לארכיאולוגיה – ד\"ר שלי-אן פלג, \"מבט היסטורי ועכשווי על מערכת הביצורים בטבריה\"", "quote": "במפעל הבנייה שערך דאהר אל-עומר במאה ה- 18, הוא למעשה שיקום וחיזוק את החומה הקודמת שיזמה ומימנה דונה גרציה.", "quote_en": "In the building project carried out by Dahir al-Umar in the 18th century, he in fact restored and reinforced the earlier wall that Doña Gracia initiated and financed.", "locator": "גוף המאמר, המסקנה מן הממצא הארכיאולוגי", "published": "2022-02-24", "lang": "he"}, {"id": "tib-museum-palace", "source_url": "https://www.visit-tiberias.com/index.php?dir=site&page=places&op=item&cs=505", "source_label": "אתר התיירות של עיריית טבריה – מוזיאון \"הבית של דונה גרציה\"", "quote": "לבקר בארמון ספרדי משוחזר ברוח המאה ה-16", "quote_en": "To visit a reconstructed Spanish palace in the spirit of the 16th century", "locator": "עמוד המוזיאון, רשימת \"מה אפשר לעשות במקום\"", "published": null, "lang": "he"}, {"id": "tib-museum-dolls", "source_url": "https://www.visit-tiberias.com/index.php?dir=site&page=places&op=item&cs=505", "source_label": "אתר התיירות של עיריית טבריה – מוזיאון \"הבית של דונה גרציה\"", "quote": "להתלבש בבגדי נסיכות ומלכים תיאטרליים, להנות מתערוכת בובות ומיצירה אור-קולית.", "quote_en": "To dress up in theatrical princess and king costumes, to enjoy a doll exhibition and an audio-visual work.", "locator": "עמוד המוזיאון, רשימת \"מה אפשר לעשות במקום\"", "published": null, "lang": "he"}, {"id": "tib-museum-tours", "source_url": "https://www.visit-tiberias.com/index.php?dir=site&page=places&op=item&cs=505", "source_label": "אתר התיירות של עיריית טבריה – מוזיאון \"הבית של דונה גרציה\"", "quote": "בכל יום (כולל שבת) מתקיימים ארבעה סיורים בשעות: 10:00, 12:00, 14:00, 16:00", "quote_en": "Every day (including Shabbat) four tours are held at: 10:00, 12:00, 14:00, 16:00", "locator": "עמוד המוזיאון, פרטי ביקור", "published": null, "lang": "he"}, {"id": "tib-museum-address", "source_url": "https://www.visit-tiberias.com/index.php?dir=site&page=places&op=item&cs=505", "source_label": "אתר התיירות של עיריית טבריה – מוזיאון \"הבית של דונה גרציה\"", "quote": "רחוב הפרחים 3, טבריה", "quote_en": "3 HaPrachim Street, Tiberias", "locator": "עמוד המוזיאון, שדה הכתובת", "published": null, "lang": "he"}, {"id": "tib-street", "source_url": "https://www.visit-tiberias.com/index.php?dir=site&page=places&op=item&cs=265", "source_label": "אתר התיירות של עיריית טבריה – \"החומה העתיקה ומצודת טבריה\"", "quote": "המצודה ממוקמת במעלה רחוב דונה גרציה המקביל לרחוב הראשי הנקרא אלחדיף", "quote_en": "The citadel is located up Doña Gracia Street, which runs parallel to the main street called Elhadeff", "locator": "עמוד \"החומה העתיקה ומצודת טבריה\", פסקת התיאור", "published": null, "lang": "he"}, {"id": "tib-street-addr", "source_url": "https://www.visit-tiberias.com/index.php?dir=site&page=places&op=item&cs=265", "source_label": "אתר התיירות של עיריית טבריה – \"החומה העתיקה ומצודת טבריה\"", "quote": "רחוב דונה גראציה, טבריה", "quote_en": "Doña Gracia Street, Tiberias", "locator": "עמוד \"החומה העתיקה ומצודת טבריה\", שדה הכתובת", "published": null, "lang": "he"}, {"id": "dg-museum", "source_url": "https://www.donagracia.com/museum", "source_label": "\"הבית של דונה גרציה\", עמוד המוזיאון באתר הרשמי", "quote": "המוזיאון במלון \"ה it. The medallion was struck in Ferrara around 1551. On the stamp's tab – a view of Tiberias, based on the engraving by the Dutch painter Cornelis de Bruyn from 1681.", "locator": "העמוד על הבול, הפסקה המסבירה את עיצוב הבול", "published": null, "lang": "he"}, {"id": "phil-tiberias", "source_url": "http://israelphilately.org.il/article.asp?id=439", "source_label": "התאחדות בולאי ישראל – \"רחל ינאית בן צבי ודונה גרציה נשיא\"", "quote": "אחת מיוזמותיה המפורסמות ביותר של דונה גרציה היא תוכנית בנייתה מחדש של טבריה. היא קיבלה מן השולטן זיכיון על טבריה ועל כמה כפרים הסמוכים לה", "quote_en": "One of Doña Gracia's most famous initiatives is her plan to rebuild Tiberias. She received from the sultan a concession over Tiberias and several villages near it", "locator": "העמוד על הבול, הפסקה הביוגרפית על דונה גרציה", "published": null, "lang": "he"}, {"id": "boolim-date", "source_url": "https://boolim.co.il/he-stamps/he-regular-stamps/he-1215-dona-gracia-nasi", "source_label": "קטלוג בולי ישראל – בול 1215 \"דונה גרציה (נשיא)\"", "quote": "02/12/1991", "quote_en": "02/12/1991", "locator": "כרטיס הפריט, שדה \"תאריך הופעה\" של בול 1215", "published": null, "lang": "he"}, {"id": "boolim-tab", "source_url": "https://boolim.co.il/he-stamps/he-regular-stamps/he-1215-dona-gracia-nasi", "source_label": "קטלוג בולי ישראל – בול 1215 \"דונה גרציה (נשיא)\"", "quote": "היא האישה שעזרה לך... בשעת מצוקתך... (שמואל אושקי)", "quote_en": "She is the woman who helped you... in your hour of distress... (Samuel Usque)", "locator": "כרטיס הפריט, שדה \"כיתוב על שובל\" של בול 1215", "published": null, "lang": "he"}, {"id": "tarbutil-medal", "source_url": "https://tarbutil.cet.ac.il/lexicon/%D7%93%D7%95%D7%A0%D7%94-%D7%92%D7%A8%D7%A6%D7%99%D7%94/", "source_label": "תרבות.il (מטח) – לקסיקון לתרבות ישראל, ערך \"דונה גרציה\"", "quote": "כאות הוקרה, לימים טבעה מדינת ישראל לכבודה מדליה שנשאה את דיוקן פניה ואת תואר הכבוד לו זכתה – \"גראציה נשיא\".", "quote_en": "As a token of appreciation, the State of Israel later struck a medal in her honor bearing her portrait and the title of honor she was given – \"Gracia Nasi\".", "locator": "גוף הערך, פסקת הסיום", "published": null, "lang": "he"}, {"id": "tarbutil-wall", "source_url": "https://tarbutil.cet.ac.il/lexicon/%D7%93%D7%95%D7%A0%D7%94-%D7%92%D7%A8%D7%A6%D7%99%D7%94/", "source_label": "תרבות.il (מטח) – לקסיקון לתרבות ישראל, ערך \"דונה גרציה\"", "quote": "בחודש כסלו שנת שכ\"ה (1564) נשלם בניין החומה בטבריה.", "quote_en": "In the month of Kislev 5325 (1564) the construction of the wall in Tiberias was completed.", "locator": "גוף הערך, הפסקה על טבריה", "published": null, "lang": "he"}, {"id": "piki-lookout", "source_url": "https://www.pikiwiki.org.il/image/view/11851/", "source_label": "פיקיוויקי – דף התמונה \"מצפה דונה גרציה בטבריה\" (צילום: ד\"ר אבישי טייכר)", "quote": "מצפה דונה גרציה בטבריה", "quote_en": "Doña Gracia Lookout in Tiberias", "locator": "דף התמונה, שדה שם התמונה (מספר תמונה 11851)", "published": null, "lang": "he"}, {"id": "piki-location", "source_url": "https://www.pikiwiki.org.il/image/view/11851/", "source_label": "פיקיוויקי – דף התמונה \"מצפה דונה גרציה בטבריה\" (צילום: ד\"ר אבישי טייכר)", "quote": "הכניסה הצפונית ליער שוויץ", "quote_en": "The northern entrance to Switzerland Forest", "locator": "דף התמונה, שדה \"מקום\"", "published": null, "lang": "he"}, {"id": "piki-photographer", "source_url": "https://www.pikiwiki.org.il/image/view/11851/", "source_label": "פיקיוויקי – דף התמונה \"מצפה דונה גרציה בטבריה\" (צילום: ד\"ר אבישי טייכר)", "quote": "צילום:ד\"ר אבישי טייכר, מתוך אתר פיקיויקי", "quote_en": "Photo: Dr. Avishai Teicher, from the PikiWiki site", "locator": "דף התמונה, שדה \"נוסח הקרדיט הדרוש\" (תאריך הצילום 7.2.2011)", "published": null, "lang": "he"}], "act": "רשת המילוט נשענה על תשתית הסחר של בית מנדס. ספינות המשפחה שהפליגו בין ליסבון לאנטוורפן נשאו, לצד תבלינים ומתכות יקרות, גם אנוסים נמלטים, ואנטוורפן הפכה במהירות לתחנת מעבר ליהודים בדרכם אל מקומות מקלט באיטליה, בארץ ישראל ובאימפריה העות'מאנית. הבורחים קיבלו הוראות מפורטות: באילו דרכים לא לעבור, היכן ללון והיכן אפשר להשיג עזרה בשעת חירום. לפני היציאה חולקו להם כסף ורשימת שמות וכתובות של סוכני מנדס, שדיווחו על התנאים בכל תחנה בדרך; דרך רשת הבנקאות של המשפחה הועבר גם רכושם של הפליטים אל יעדם, כדי שלא יגיעו מחוסרי כול. מאנטוורפן המשיכו הנמלטים במעבר הקשה על פני האלפים אל ונציה, ומשם סודרה עבורם הסעה אל האימפריה העות'מאנית, ובכללה ארץ ישראל. עמד לרשותה גרעין נאמן של סוכנים אנוסים שהיא עצמה סייעה להם קודם לכן להימלט מחצי האי האיברי. המחיר היה גם אישי: בוונציה הולשנה כיהודייה, כל נכסי בית מנדס הוקפאו והיא ישבה בכלא בשנים 1545–1549.", "ripple": "מאות אנוסים ניצלו ממאסר ומשריפה, וקהילות יהודיות באיטליה ובאימפריה העות'מאנית התחזקו בזכות הפליטים שהגיעו. ב-1553 מימנה בפירארה את בית הדפוס שהוציא את \"תנ\"ך פירארה\" — התרגום השלם הראשון של המקרא לספרדית באותיות לטיניות, מעשה ידי המתרגם אברהם בן שלמה אושקי והמדפיס יום טוב בן לוי אתיאס — שנועד בעיקר לנוצרים חדשים שביקשו לשוב ליהדות ולא ידעו עברית; נדפסו שתי גרסאות, וזו שיועדה לקוראים יהודים הוקדשה לה. באותה שנה הקדיש לה שמואל אושקי את \"נחמה לצרות ישראל\", חיבור בפורטוגזית שנועד לשכנע אנוסים לשוב ליהדות בלב שלם. ב-1556, לאחר שהאינקוויזיציה באנקונה כלאה כמאה אנוסים ושרפה עשרים וארבעה מהם באוטו דה פה, הושג ביוזמתה מכתב מהסולטן סולימאן אל האפיפיור (9 במרס 1556) ובו דרישה לשחרר את הכלואים, והוכרז חרם על נמל אנקונה שהסיט את הסחר לפסארו ולוונציה — החרם הכלכלי המאורגן הראשון מטעם יהודים. הצלחתו הייתה חלקית: תחילה נפגעה אנקונה קשות, אך הסחר התאושש כשסוחרים יהודים חזרו בהם — ובכל זאת מטען של בית מנדס לא עבר עוד בנמל אנקונה. על טבריה חלוקים המקורות: לפי האנציקלופדיה יודאיקה כבר ב-1558 או 1559 קיבלה דונה גרציה מהסולטן זיכיונות בטבריה החרבה, ואילו ב-1561 קיבל אחיינה יוסף נשיא אישור והרחבה של הזיכיון — סמכות מלאה בטבריה ובשבעה כפרים סמוכים תמורת תשלום שנתי; מקורות אחרים נוקבים ב-1558 כשנת הזיכיון שניתן לה ומינויו של יוסף ל\"אדון טבריה\", ואחרים דוחים את ההיתר עד 1565. מחקר ארכיאולוגי ישראלי מייחס דווקא לה את יוזמת בניית החומה ואת מימונה. בחורף 1564–1565, בחודש כסלו שכ\"ה, הושלמה בניית החומה; יוסף נשיא מעולם לא ביקר בנחלתו, ודונה גרציה נפטרה ב-1569 מבלי שהגיעה אליה. זה היה הניסיון המעשי היחיד להקים מרכז מדיני יהודי כלשהו בארץ ישראל בין המאה הרביעית למאה ה-19. שרידי החומה עומדים בטבריה עד היום — בעיקר המגדלים העגולים שבחומה הדרומית; דאהר אל-עומר במאה ה-18 לא בנה חומה חדשה אלא שיקם וחיזק את זו שהיא יזמה ומימנה, ורק בשנים 2012–2013 נערך סקר שימור והשרידים הוכרזו מונומנטים. בטבריה של היום קרוי על שמה רחוב דונה גרציה, העולה אל החומה העתיקה והמצודה; בכניסה הצפונית ליער שוויץ ניצב \"מצפה דונה גרציה\"; וברחוב הפרחים 3 פועל מוזיאון חי במלון \"הבית של דונה גרציה\", ובו ארמון ספרדי משוחזר ברוח המאה ה-16, תערוכת בובות וכתבים על דונה גרציה ותקופתה, מיצג אור-קולי וסיורים מודרכים מדי יום. מדינת ישראל הנפיקה ב-2 בדצמבר 1991 בול הנושא את דיוקנה על פי מדליון שהוטבע בפירארה בסביבות 1551, ובשובל הבול נוף טבריה על פי תחריט של הצייר ההולנדי קורנליוס דה ברוין מ-1681 וציטוט מדברי שמואל אושקי; לימים נטבעה לכבודה גם מדליה מטעם מדינת ישראל, וב-2010, במלאת 500 שנה להולדתה, הכניס משרד החינוך יחידת לימוד על דונה גרציה לבתי הספר.", "title_reasoning": "מי (דונה גרסיה), מה עשתה (רשת מילוט), למי (מאות אנוסים), מפני מה (האינקוויזיציה). כל מילה נשענת על הציטוט.", "media_urls": ["https://upload.wikimedia.org/wikipedia/commons/9/9c/Gracianasimedal.jpg", "https://upload.wikimedia.org/wikipedia/commons/a/a8/Nezi.jpg", "https://upload.wikimedia.org/wikipedia/commons/d/d6/Consolasam_samuel_usque.jpg", "https://upload.wikimedia.org/wikipedia/commons/d/d1/Ferrara_Bible.jpg", "https://upload.wikimedia.org/wikipedia/commons/7/7c/Genesis_ferrara_bible.jpg", "https://upload.wikimedia.org/wikipedia/commons/f/fa/Inquisition_and_the_Jews_Tiberias.JPG", "https://upload.wikimedia.org/wikipedia/commons/e/e9/PikiWiki_Israel_77873_dona_gracia_wall_in_tiberias.jpg", "https://upload.wikimedia.org/wikipedia/commons/9/9e/PikiWiki_Israel_11851_dona_gracia_lookout_tiberias.jpg", "https://upload.wikimedia.org/wikipedia/commons/0/0c/Dona_Gracia_Hotel_and_Museum_Tiberias_01.jpg", "https://www.youtube.com/watch?v=Rq30Ikq4S20", "https://www.youtube.com/watch?v=i8nrvAyiXkI", "https://www.youtube.com/watch?v=pDYqIH8LP5o"], "title_en": "Dona Gracia Mendes Nasi Builds an Escape Network That Saves Hundreds of Conversos from the Inquisition", "description_en": "Beatriz de Luna was born in Portugal around 1510, into the first generation of Portuguese conversos: her family were Spanish exiles who in 1492 chose to move to Portugal rather than convert, and in 1497 were forcibly baptized there together with the local Jewish community. The family's original name was Nasi; it was changed to de Luna at the conversion. At eighteen she married Francisco Mendes, a Lisbon banker who also dealt in precious stones and spices. Widowed in the mid-1530s, she became a full partner of her brother-in-law Diogo in Antwerp, and on his death in 1543 stood alone at the head of the House of Mendes. She dealt mainly in wool, pepper, grain, cloth and textiles, and the family's dominance of the spice trade let the firm extend loans to the monarchs of England, Germany, Portugal and Turkey. Her own route ran through Antwerp (1536); Venice, where she was denounced as a Jew, the Mendes assets were frozen and she was imprisoned until her release in 1549; Ferrara, where she dropped the Christian facade and resumed the name Nasi; and on to Constantinople in 1552-1553 via Ragusa (Dubrovnik). Alongside the trading house she headed an underground Jewish organization, and in Constantinople she funded scholars, rabbis, book publishing and Bible translations.", "act_en": "The escape network rested on the trading infrastructure of the House of Mendes. Family ships sailing between Lisbon and Antwerp carried Jewish fugitives alongside spices and bullion, and Antwerp quickly became a way station for Jews in transit to havens in Italy, the Land of Israel and the Ottoman Empire. Refugees were given detailed instructions: which roads to avoid, where to find lodging, and where emergency assistance could be secured. Before setting out they were given money and the names and addresses of Mendes agents, who reported on local conditions at each stage of the journey; through the family's banking network their assets were also transferred safely to their destinations, so they would not arrive destitute. From Antwerp they crossed the treacherous Alps to Venice, and from there transportation was arranged onward to the Ottoman Empire, including the Land of Israel. She had at her disposal a loyal core of converso agents whom she herself had earlier helped flee the Iberian Peninsula. The cost was personal too: in Venice she was denounced as a Jew, all the Mendes assets were frozen and she sat in prison from 1545 to 1549.", "ripple_en": "Hundreds of conversos were saved from prison and the stake, and Jewish communities in Italy and the Ottoman Empire were strengthened by the refugees who arrived. In 1553, in Ferrara, she financed the press that produced the Ferrara Bible - the first full Spanish translation of the Old Testament in Latin characters, by the translator Abraham ben Solomon Usque and the typographer Yom Tob ben Levi Athias - intended largely for New Christians who wanted to return to Judaism but had no Hebrew. Two versions were printed, and the one for Jewish readers was dedicated to her. That same year Samuel Usque dedicated to her his Consolação, a Portuguese work meant to persuade conversos to return wholeheartedly to Judaism. In 1556, after the Inquisition in Ancona imprisoned nearly 100 conversos and burned 24 of them at an auto-da-fe, a letter was obtained at her behest from Sultan Suleiman to the pope (9 March 1556) demanding the prisoners' release, and a boycott of the port of Ancona was declared that diverted trade to Pesaro and Venice - the first economic boycott organized by Jews. Its success was partial: Ancona was hit hard at first, but trade recovered as Jewish traders defected - yet no Mendes cargo ever passed through Ancona again. On Tiberias the sources disagree: according to the Encyclopaedia Judaica, as early as 1558 or 1559 Doña Gracia obtained concessions in the ruined city from the sultan, while in 1561 her nephew Joseph Nasi obtained confirmation and extension of the grant - plenary authority in Tiberias and seven nearby villages for an annual payment; other sources give 1558 for her concession and Joseph's appointment as 'Lord of Tiberias', and others push the permission to 1565. Israeli archaeological research credits the initiative and funding of the wall to her. In the winter of 1564-65, in the month of Kislev 5325, the wall was completed; Joseph Nasi never visited his domain, and Doña Gracia died in 1569 without reaching it. This was the only practical attempt to establish a Jewish political center in the Land of Israel between the fourth and the 19th centuries. The remains of the wall still stand in Tiberias - mainly the round towers of the southern wall; Dahir al-Umar in the 18th century did not build a new wall but restored and reinforced hers, and only in 2012-2013 was a conservation survey carried out and the remains declared monuments. In today's Tiberias, Doña Gracia Street, which climbs to the old wall and the citadel, is named for her; the Doña Gracia Lookout stands at the northern entrance to Switzerland Forest; and at 3 HaPrachim Street a living museum operates inside the 'House of Doña Gracia' hotel, with a reconstructed 16th-century Spanish palace, an exhibition of dolls and writings about her and her period, an audio-visual display and guided tours every day. On 2 December 1991 Israel issued a stamp bearing her portrait after a medallion struck in Ferrara around 1551, with a view of Tiberias on the tab based on a 1681 engraving by the Dutch painter Cornelis de Bruyn and a quotation from Samuel Usque; a medal was later struck in her honor by the State of Israel; and in 2010, on the 500th anniversary of her birth, the Ministry of Education introduced a study unit on Doña Gracia into the schools.", "source_label_en": "Miriam Bodian, \"Doña Gracia Nasi\", Shalvi/Hyman Encyclopedia of Jewish Women, Jewish Women's Archive", "categories": null, "location": {"lat": 51.2194, "lng": 4.4025, "city": "אנטוורפן", "note": "אנטוורפן היא נקודת הפיקוד של רשת המילוט — 'Starting in Antwerp, she began to develop an escape network' (הציטוט שכבר היה בשורה), ושכטר וספריית הלאומי מאשרים שמשם הופעלה ההברחה. המעש עצמו חוצה יבשות (ליסבון → אנטוורפן → מעבר האלפים → ונציה/פרארה → קונסטנטינופול), ולכן precision גבוה מ-city יהיה המצאה. אין למקורות כתובת.", "city_en": "Antwerp", "country": "בלגיה", "precision": "city", "country_en": "Belgium"}, "people": [{"aka_en": "Beatriz de Luna Miques", "aka_he": "ביאטריס דה לונה", "name_en": "Doña Gracia Mendes Nasi", "name_he": "דונה גרציה נשיא", "role_he": "ראש רשת המילוט; בעלת בית המסחר מנדס"}, {"name_en": "Diogo Mendes", "name_he": "דיוגו מנדס", "role_he": "גיסה ושותפה באנטוורפן; לפי הביוגרפית אנדרה ברוקס — מי שסיפק לבורחים ניירות והוראות המשך"}, {"aka_en": "João Micas", "name_en": "Joseph Nasi", "name_he": "יוסף נשיא", "role_he": "אחיינה ויד ימינה; שותף לחרם אנקונה ולפרויקט טבריה"}, {"name_en": "Samuel Usque", "name_he": "", "role_he": "בן-הזמן שתיעד את מאמצי החילוץ שלה בספרו 'תנחומות לתלאות ישראל' (פרארה 1553) — המקור הראשוני שעליו נשענים החוקרים"}], "deed_type": ["חסד וצדקה", "זכויות אדם"], "actor_type": "אדם יחיד", "beneficiary": ["לזרים"], "audit": {"at": "2026-08-10T10:00:13+00:00", "by": "standard-pass/opus-5", "state": "complete", "videos": [{"url": "https://www.youtube.com/watch?v=Rq30Ikq4S20", "why": "סרטון-על: שיחה של מוזיאון המורשת היהודית בניו יורק עם אנדרה אליון ברוקס, הביוגרפית של דונה גרציה. זה המקום היחיד שבו שמעתי את מפעילי הרשת מתוארים מתוך המסמכים — ברוקס מתארת את דיוגו מנדס כמי שנתן לבורחים את הניירות וההוראות וקוראת לזה במפורש 'רשת בריחה'. הסיפור המלא, מפי מי שחקרה אותו בארכיונים.", "title": "A Righteous Woman: Doña Gracia Mendes Nasi", "master": true, "channel": "Museum of Jewish Heritage", "transcript": "ok", "transcript_sourc  the entire world.", "act_en": null, "ripple_en": null, "source_label_en": "Wikipedia — Jonas Salk", "categories": null, "location": null, "people": null, "deed_type": null, "actor_type": null, "beneficiary": null, "audit": null, "dedup": null}, "after": {"id": "a8f55761-7678-4400-bf6c-33976755cabc", "title": "יונאס סאלק ויתר על הפטנט לחיסון הפוליו", "description": "ד\"ר יונאס סאלק, רופא יהודי-אמריקאי, פיתח ב-1955 את החיסון הראשון נגד שיתוק ילדים (פוליו) שהותיר בארצות הברית לבדה כ-58,000 חולים בשנה ערב החיסון, אלפי הרוגים ורבבות נכים. כששאלו אותו למי שייך הפטנט, ענה: \"לאנשים. אין פטנט. האם היית מפטנט את השמש?\". הוויתור הציל מיליונים והנגיש את החיסון לעולם כולו בחינם.", "category": "חסד", "year": 1955, "media_type": "image", "media_url": "", "source_url": "https://www.who.int/news-room/spotlight/history-of-vaccination/history-of-polio-vaccination", "source_label": "ארגון הבריאות העולמי — היסטוריה של החיסון לפוליו", "submitted_by": null, "status": "approved", "created_at": "2026-06-19 00:00:01+00", "citations": [{"lang": "en", "quote": "Six pharmaceutical companies were licensed to produce IPV, and Salk did not profit from sharing the formulation or production processes.", "locator": "סעיף 'The first polio vaccine' — הפסקה על נגישות שוויונית לחיסון", "published": "2022", "source_url": "https://www.who.int/news-room/spotlight/history-of-vaccination/history-of-polio-vaccination", "source_label": "ארגון הבריאות העולמי — היסטוריה של החיסון לפוליו"}, {"lang": "en", "quote": "In a 1955 interview, when asked who owned the patent for IPV, he replied: “Well, the people, I would say. There is no patent. Could you patent the sun?”", "locator": "סעיף 'The first polio vaccine' — המשפט האחרון לפני התמונה של אלברט סייבין", "published": "2022", "source_url": "https://www.who.int/news-room/spotlight/history-of-vaccination/history-of-polio-vaccination", "source_label": "ארגון הבריאות העולמי — היסטוריה של החיסון לפוליו"}, {"lang": "en", "quote": "Jonas Salk’s decision not to patent the vaccine—famously stating, “Could you patent the sun?”—ensured its widespread distribution.", "locator": "הפסקה על ההכרזה באן ארבור, 12 באפריל 1955", "published": "2025-04-11", "source_url": "https://www.salk.edu/news-release/the-day-polio-met-its-match-celebrating-70-years-of-the-salk-vaccine/", "source_label": "מכון סאלק למחקר ביולוגי — 70 שנה לחיסון סאלק"}, {"lang": "en", "quote": "The attorneys concluded that the vaccine didn’t meet the novelty requirements for a patent, and the application would fail.", "locator": "הפסקה על מסמכי הארכיון שחשפה ג'יין ס' סמית'", "published": "2014-04-14", "source_url": "https://slate.com/technology/2014/04/the-real-reasons-jonas-salk-didnt-patent-the-polio-vaccine.html", "source_label": "Slate — The real reasons Jonas Salk didn't patent the polio vaccine"}, {"lang": "en", "quote": "Within one year, the deaths attributed to polio declined by 50 per cent, and this downward trend continues to the present when polio has been totally eradicated in most of the world.", "locator": "פסקת המבוא, לפני רשימת המסמכים הארכיוניים", "published": "2019", "source_url": "https://www.eisenhowerlibrary.gov/research/online-documents/jonas-salk-and-polio-vaccine", "source_label": "ספריית הנשיא אייזנהאואר (NARA) — Jonas Salk and the Polio Vaccine"}, {"lang": "he", "quote": "בראיון הכנראה מפורסם ביותר שלו, כאשר נשאל על ידי העיתונאי המוכר והבכיר אדוארד מורו (Edward R. Murrow) \"למי שייך החיסון?\", ענה סאלק: \"ובכן, לאנשים, הייתי אומר. אין פטנט. אפשר לרשום פטנט על השמש?\".", "locator": "גוף הכתבה, הפסקה שלפני הכותרת 'לרשום פטנט על השמש'", "quote_en": "In what is probably his most famous interview, when the well-known senior journalist Edward R. Murrow asked him \"Who owns the vaccine?\", Salk answered: \"Well, the people, I would say. There is no patent. Could you patent the sun?\".", "published": "2020-11-22", "source_url": "https://www.calcalist.co.il/local/articles/0,7340,L-3875012,00.html", "source_label": "כלכליסט — המערב הפרוע: יש חיסון ויש כסף, אז למה לא כולם יקבלו אותו"}, {"lang": "he", "quote": "מאוחר יותר נחשף שעורכי דין מטעם הקרן הלאומית לשיתוק ילדים דווקא כן שקלו לרשום פטנט על החיסון, כנראה כדי למנוע ממפעלים לייצר את החיסון באופן חובבני ולא מקצועי.", "locator": "סעיף 'לרשום פטנט על השמש'", "quote_en": "It was later revealed that lawyers on behalf of the National Foundation for Infantile Paralysis did in fact consider patenting the vaccine, apparently in order to prevent factories from producing it in an amateurish and unprofessional manner.", "published": "2020-11-22", "source_url": "https://www.calcalist.co.il/local/articles/0,7340,L-3875012,00.html", "source_label": "כלכליסט — המערב הפרוע: יש חיסון ויש כסף, אז למה לא כולם יקבלו אותו"}], "act": "באפריל 1955 הוכרז באן ארבור שבמישיגן כי החיסון שפיתח ד\"ר יונה סאלק נגד שיתוק ילדים בטוח ויעיל. כששאל אותו העיתונאי אדוארד מורו למי שייך הפטנט, ענה סאלק: “ובכן, לאנשים, הייתי אומר. אין פטנט. אפשר לרשום פטנט על השמש?” שש חברות תרופות קיבלו רישיון לייצר את החיסון, וסאלק לא הרוויח דבר משיתוף הנוסחה ותהליכי הייצור.", "ripple": "בתוך שנה אחת ירדו מקרי המוות מפוליו בכ-50%, ובארצות הברית צנח מספר המקרים השנתי מכ-58,000 ערב החיסון לכ-5,600 ב-1957. מאוחר יותר נחשף שגם עורכי הדין של הקרן הלאומית לשיתוק ילדים סברו שהחיסון אינו עומד בדרישת החדשנות לפטנט — אך סאלק עצמו סירב להפוך אותו לקניין פרטי, והחיסון הונגש לעולם.", "title_reasoning": "", "media_urls": ["https://upload.wikimedia.org/wikipedia/commons/e/eb/Salk_headlines.jpg", "https://upload.wikimedia.org/wikipedia/commons/b/b6/Salk_Thank_You.jpg", "https://upload.wikimedia.org/wikipedia/commons/c/ca/SalkatPitt.jpg", "https://upload.wikimedia.org/wikipedia/commons/1/13/PittPolioVaccineCoL.jpg", "https://upload.wikimedia.org/wikipedia/commons/7/72/Salk_Ike_55.jpg", "https://upload.wikimedia.org/wikipedia/commons/2/21/Ben_Gurion_-_Jonas_Salk_-_Jerusalem_1959.jpg", "https://upload.wikimedia.org/wikipedia/commons/1/10/Stamp_US_1957.jpg", "https://upload.wikimedia.org/wikipedia/commons/9/95/Jonas_Salk_Congressional_Gold_Medal.jpg", "https://upload.wikimedia.org/wikipedia/commons/1/13/Jonas_Salk_1988.jpg", "https://www.youtube.com/watch?v=erHXKP386Nk", "https://www.youtube.com/watch?v=Z3R8QP7EZJA"], "title_en": "Jonas Salk Gave Up the Patent for the Polio Vaccine", "description_en": "Dr. Jonas Salk, a Jewish-American physician, developed in 1955 the first vaccine against polio — a disease that paralyzed hundreds of thousands of children every year. When asked who owned the patent, he replied: \"The people. There is no patent. Could you patent the sun?\" His decision to forgo the patent saved millions of lives and made the vaccine freely available to the entire world.", "act_en": "In April 1955, Ann Arbor, Michigan announced that Dr. Jonas Salk's polio vaccine was safe and effective. Asked by journalist Edward R. Murrow who owned the patent, Salk answered: “Well, the people, I would say. There is no patent. Could you patent the sun?” Six pharmaceutical companies were licensed to produce it, and Salk did not profit from sharing the formulation or the production processes.", "ripple_en": "Within one year, deaths attributed to polio fell by about 50 percent; in the United States annual cases dropped from roughly 58,000 before the vaccine to about 5,600 by 1957. It later emerged that lawyers for the National Foundation for Infantile Paralysis had also concluded the vaccine would not meet the novelty requirement for a patent — but Salk himself refused to make it private property, and the vaccine reached the world.", "source_label_en": "Wikipedia — Jonas Salk", "categories": null, "location": {"lat": 42.28, "lng": -83.74, "city": "אן ארבור, מישיגן", "city_en": "Ann Arbor, Michigan", "country": "ארצות הברית", "precision": "city", "country_en": "United States"}, "people": [{"name_en": "Jonas Salk", "name_he": "יונה סאלק"}, {"name_en": "Edward R. Murrow", "name_he": "אדוארד מורו"}], "deed_type": ["חסד וצדקה", "רפואה והצלת חיים"], "actor_type": "אדם יחיד", "beneficiary": ["לאנושות כולה"], "audit":        ${c.quote?`<span class="q">"${esc(c.quote)}"</span>`:''}
       <span class="meta">${esc(host(c.source_url))}${c.published?' · '+esc(c.published):''}${c.locator?' · '+esc(c.locator):''}</span></li>`
    ).join('') + `</ol>` : `<div class="empty">— אין מקורות —</div>`;

  const meta = (((r.audit||{}).videos)||[]);
  const ytid = u => (u.match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{11})/)||[])[1]||'';
  const vidHtml = mediaVids.length ? mediaVids.map(u=>{
      const v = meta.find(m=>ytid(m.url)===ytid(u)) || {};
      const id = ytid(u);
      return `<div class="vid"><div style="display:flex;gap:11px;align-items:flex-start">
       ${id?`<a href="${esc(u)}" target="_blank"><img src="https://i.ytimg.com/vi/${id}/mqdefault.jpg"
          style="width:112px;height:63px;object-fit:cover;border-radius:7px;display:block"></a>`:''}
       <div style="flex:1;min-width:0">
        <div class="t"><a href="${esc(u)}" target="_blank">${esc(v.title||u)}</a></div>
        <div class="c">${esc(v.channel||'')}${v.transcript?' · תמליל: '+esc(v.transcript):
          '<span style="color:#b25000"> · ללא כיתוב מקור</span>'}</div>
       </div></div></div>`;
    }).join('') : `<div class="empty">— אין סרטונים —</div>`;

  const loc = r.location;
  const locHtml = loc ? `<div class="txt">${esc([loc.city,loc.country].filter(Boolean).join(', '))}
      <span class="empty" style="font-style:normal;color:#a1a1a6">· דיוק: ${esc(loc.precision||'')}</span></div>` :
      `<div class="empty">— אין מיקום —</div>`;

  const ppl = (r.people||[]);
  const pplHtml = ppl.length ? `<div class="pills">` + ppl.map(p=>
      `<span class="pill">${esc(p.name_he||p.name_en)}${p.role_he?' — '+esc(p.role_he):''}</span>`).join('') + `</div>`
    : `<div class="empty">— לא מזוהים —</div>`;

  const tags = [].concat(r.deed_type||[], r.beneficiary||[], r.actor_type?[r.actor_type]:[]);
  const tagHtml = tags.length ? `<div class="pills">`+tags.map(t=>`<span class="pill">${esc(t)}</span>`).join('')+`</div>`
    : `<div class="empty">— ריק —</div>`;

  const label = side==='after' ? 'אחרי' : 'לפני';
  const sub = side==='after' ? 'המצב החי באתר' : 'כפי שהיה לפני המעבר';
  return `<div class="pane ${side==='after'?'a':'b'}">
    <h2>${label}<em>${sub}</em></h2>
    <div class="body">
      ${sect('title','כותרת',ch,txt(r.title))}
      ${sect('description','תיאור',ch,txt(r.description))}
      ${sect('act','מה נעשה',ch,txt(r.act))}
      ${sect('ripple','ההשפעה',ch,txt(r.ripple))}
      ${sect("media_urls","תמונות ("+imgs.length+")",ch,imgHtml)}
      ${sect("audit","סרטונים ("+mediaVids.length+")",ch,vidHtml)}
      ${sect('citations','מקורות ('+cits.length+')',ch,citHtml)}
      ${sect('location','מיקום',ch,locHtml)}
      ${sect('people','אנשים',ch,pplHtml)}
      ${sect('deed_type','סיווג',ch,tagHtml)}
    </div></div>`;
}

function render(){
  tabs(); score();
  const d = DATA.deeds[cur];
  const cols = document.getElementById('cols');
  cols.className = 'cols' + (mode==='both' ? '' : ' single');
  cols.innerHTML = mode==='both' ? pane(d,'before')+pane(d,'after')
                 : mode==='before' ? pane(d,'before') : pane(d,'after');
  const mine = DECISIONS.filter(x=>x.deed_id===d.id);
  document.getElementById('decisions').innerHTML = mine.length ? '<h1 style="font-size:17px">החלטות שממתינות לך</h1>' +
    mine.map(x=>`<div class="decide"><h3>${esc(x.title)}</h3><p>${esc(x.body)}</p>
      ${x.options?`<div class="opts">${x.options.map(o=>
        `<div>${o.img?`<img src="${esc(o.img)}">`:''}<div class="k" style="margin-top:6px">${esc(o.label)}</div>
         <div class="txt" style="font-size:13.5px">${esc(o.text||'')}</div></div>`).join('')}</div>`:''}
      </div>`).join('') : '';
}
document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return; cur=+b.dataset.i; render(); window.scrollTo({top:0,behavior:'smooth'});
});
document.querySelector('.modes').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  mode=b.dataset.mode;
  document.querySelectorAll('.modes button').forEach(x=>x.classList.toggle('on',x===b));
  render();
});
render();
</script>
</body></html>
