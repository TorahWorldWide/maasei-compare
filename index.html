unication_System%2C_Inventors_Hedy_Kiesler_Markey_and_George_Antheil_-_DPLA_-_128f022cfd9421aa10de72958a7edf90_%28page_33%29.jpg", "group": "התביעה השביעית — זו שנדחתה", "credit": "הארכיון הלאומי של ארצות הברית, סניף קנזס סיטי (National Archives at Kansas City); מזהה ארכיוני NAID 167820368; הופץ דרך DPLA וויקישיתוף. נחלת הכלל (No Copyright – United States).", "source": "https://commons.wikimedia.org/wiki/File:Patent_Case_File_No._2,292,387,_Secret_Communication_System,_Inventors_Hedy_Kiesler_Markey_and_George_Antheil_-_DPLA_-_128f022cfd9421aa10de72958a7edf90_(page_33).jpg", "shot_when": "1941", "caption_he": "עמוד התביעות שבו נראית התביעה השביעית מחוקה בקו אדום — התביעה היחידה שניסחה את העיקרון הכללי של החלפת תדר בו-זמנית לפי דפוס שרירותי, וזו שנמחקה מן הפטנט."}, {"url": "https://upload.wikimedia.org/wikipedia/commons/e/e2/Patent_Case_File_No._2%2C292%2C387%2C_Secret_Communication_System%2C_Inventors_Hedy_Kiesler_Markey_and_George_Antheil_-_DPLA_-_128f022cfd9421aa10de72958a7edf90_%28page_38%29.jpg", "group": "התביעה השביעית — זו שנדחתה", "credit": "הארכיון הלאומי של ארצות הברית, סניף קנזס סיטי (National Archives at Kansas City); מזהה ארכיוני NAID 167820368; הופץ דרך DPLA וויקישיתוף. נחלת הכלל (No Copyright – United States).", "source": "https://commons.wikimedia.org/wiki/File:Patent_Case_File_No._2,292,387,_Secret_Communication_System,_Inventors_Hedy_Kiesler_Markey_and_George_Antheil_-_DPLA_-_128f022cfd9421aa10de72958a7edf90_(page_38).jpg", "shot_when": "13 באוגוסט 1941", "caption_he": "פעולת הבוחן מ-13 באוגוסט 1941: התביעה השביעית נדחית משום שהיא מכוסה במלואה בשני פטנטים קודמים — ברוארטיס 1,869,659 משנת 1932 ובזקה 2,134,850 משנת 1938; התביעות 1–6, נכתב שם, נראות ראויות לאישור."}, {"url": "https://upload.wikimedia.org/wikipedia/commons/8/82/Patent_Case_File_No._2%2C292%2C387%2C_Secret_Communication_System%2C_Inventors_Hedy_Kiesler_Markey_and_George_Antheil_-_DPLA_-_128f022cfd9421aa10de72958a7edf90_%28page_39%29.jpg", "group": "התביעה השביעית — זו שנדחתה", "credit": "הארכיון הלאומי של ארצות הברית, סניף קנזס סיטי (National Archives at Kansas City); מזהה ארכיוני NAID 167820368; הופץ דרך DPLA וויקישיתוף. נחלת הכלל (No Copyright – United States).", "source": "https://commons.wikimedia.org/wiki/File:Patent_Case_File_No._2,292,387,_Secret_Communication_System,_Inventors_Hedy_Kiesler_Markey_and_George_Antheil_-_DPLA_-_128f022cfd9421aa10de72958a7edf90_(page_39).jpg", "shot_when": "31 באוקטובר 1941", "caption_he": "התיקון מ-31 באוקטובר 1941 שבו ביטלו עורכי הדין של לאמאר ואנתייל את התביעה השביעית שנדחתה, וכך אושר הפטנט עם שש תביעות בלבד."}, {"url": "https://upload.wikimedia.org/wikipedia/commons/8/83/Hedy_Lamarr_Publicity_Photo_for_The_Heavenly_Body_1944.jpg", "group": null, "credit": "תצלום פרסום של אולפני Metro-Goldwyn-Mayer, 1944. נחלת הכלל — תצלום פרסום שפורסם בארה\"ב ללא הודעת זכויות יוצרים.", "source": "https://commons.wikimedia.org/wiki/File:Hedy_Lamarr_Publicity_Photo_for_The_Heavenly_Body_1944.jpg", "shot_when": "1944", "caption_he": "תצלום פרסום של MGM לסרט The Heavenly Body, 1944. התמונה עומדת כאן לבדה ולא בתוך קבוצה, משום שהיא הצד השני של אותו סיפור: זו התדמית שבגללה אף אחד לא חיפש אצלה פטנט, בעוד שאר התמונות בדף הן המסמכים עצמם."}, {"url": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/be/Wiener_Zentralfriedhof_-_Gruppe_33_G_-_Grab_von_Hedy_Lamarr.jpg/1280px-Wiener_Zentralfriedhof_-_Gruppe_33_G_-_Grab_von_Hedy_Lamarr.jpg", "group": null, "credit": "צילום: Haeferl, ויקישיתוף, רישיון CC BY-SA 3.0.", "source": "https://commons.wikimedia.org/wiki/File:Wiener_Zentralfriedhof_-_Gruppe_33_G_-_Grab_von_Hedy_Lamarr.jpg", "shot_when": "26 במאי 2016", "caption_he": "אנדרטת קבר-הכבוד שהעניקה עיריית וינה להדי לאמאר בבית העלמין המרכזי, חלקה 33G — פסל של מוט ומעליו כדור, על מדשאה. הקבר הוענק ב-2014, ארבע-עשרה שנה אחרי מותה. התמונה עומדת לבדה כסיום של הדף. (הכיתוב על הלוחית בחזית אינו קריא בתצלום, ולכן אינו מצוטט כאן.)"}], "lead_image_basis": "verified_portrait"}, "dedup": null, "origin_story": "הידע הגיע ממקום לא צפוי. באוגוסט 1933, בגיל תשע-עשרה, נישאה הדוויג קיסלר לפריץ מנדל, מנהל מפעל התחמושת בהירטנברג שבאוסטריה. ארבע השנים שבהן הייתה אשתו עברו עליה בין פגישות עסקיות של יצרני נשק; לפי הודעת עיריית וינה, בחוגו הכירה גם את היטלר ומוסוליני. היכל התהילה הלאומי לממציאים בארצות הברית מנסח את התוצאה בפשטות: נישואיה ליצרן התחמושת הם שהניחו את הבסיס לידע שלה על מערכות נשק, ובכללן מערכות שליטה בטורפדו. כתבת Wired מ-1997 קראה לשנים האלה \"מה שהסתכם בחינוך בן ארבע שנים בייצור תחמושת\".\n\nב-1937 נמלטה מן הנישואים והגיעה להוליווד — ושם עשתה את הדבר שאיש לא ציפה לו משחקנית. היא לא למדה הנדסה מעולם; האקדמיה האמריקאית לאמנויות ולמדעים מתארת אותה כאוטודידקטית גמורה שהקדישה את זמנה הפנוי לתכנון ולשרטוט המצאות.\n\nהשותף השני הגיע מעולם רחוק אף יותר. ג'ורג' אנתייל היה מלחין אוונגרדי שכתב יצירות לפסנתרים מכניים מסונכרנים, והמנגנון שהביא מן העולם ההוא — סרט מנוקב שמכתיב לשני מכשירים לנוע יחד — הוא לב ההמצאה.", "origin_story_en": "The knowledge came from an unexpected place. In August 1933, at nineteen, Hedwig Kiesler married Fritz Mandl, director of the Hirtenberg munitions factory in Austria. The four years she spent as his wife were spent among the business meetings of arms manufacturers; according to the City of Vienna, it was in his circle that she also met Hitler and Mussolini. The National Inventors Hall of Fame puts the result plainly: her marriage to a munitions manufacturer gave her the foundation for her knowledge of weapons systems, including torpedo control systems. A 1997 Wired report called those years \"what amounted to a four-year-long education in munitions manufacturing.\"\n\nIn 1937 she fled the marriage and reached Hollywood — and there did the thing nobody expects of an actress. She never studied engineering; the American Academy of Arts and Sciences describes her as entirely self-taught, investing her spare time in designing and drafting inventions.\n\nThe second partner came from a world further still. George Antheil was an avant-garde composer who had written works for synchronised player pianos, and the mechanism he brought from that world — a perforated roll that keeps two machines moving together — is the heart of the invention.", "aftermath": "ואז לא קרה דבר. חיל הים האמריקאי לא אימץ את המערכת. ללאמאר נאמר, במקומה, למכור אגרות מלחמה — והיא עשתה זאת: במסע גיוס אחד ב-1942 גייסה 25 מיליון דולר.\n\nמדוע דחה חיל הים? הסיבה המדויקת אינה מתועדת בתיק, ושלוש גרסאות מתחרות: שהמנגנון היה מגושם וכבד מכדי להיכנס לגוף הטורפדו (כך המגזין העברי ניו-טק, וכך גם האקדמיה האמריקאית לאמנויות ולמדעים); שהקצונה, בעדותו של אנתייל, הבינה שהוא מבקש להכניס פסנתר מכני לתוך טורפדו; ושפשוט אמרו לשחקנית ללכת למכור אגרות מלחמה. מה שמתועד בוודאות הוא התוצאה: השיטה לא שימשה במלחמת העולם השנייה.\n\nהפטנט פקע ב-11 באוגוסט 1959, שבע-עשרה שנה אחרי שניתן. אנתייל מת באותה שנה.\n\nהשימוש המבצעי הגיע רק אחרי שהפטנט כבר לא היה שווה דבר. מערכת קפיצת תדרים אמריקאית נוסתה ב-1957 והותקנה ב-1963 על ספינת הדגל USS Mount McKinley, שם סיכלה בהצלחה ניסיונות שיבוש מכוונים — ככל הידוע מערכת קפיצת התדרים הראשונה שהופעלה בפועל. המוזיאון הלאומי למלחמת העולם השנייה כותב שעד משבר הטילים בקובה כבר היו לספינות אמריקאיות טורפדו בשליטת מערכות קפיצת תדרים.", "aftermath_en": "And then nothing happened. The US Navy did not adopt the system. Lamarr was told to sell war bonds instead — and she did: in a single 1942 fundraising drive she raised 25 million dollars.\n\nWhy did the Navy reject it? The exact reason is not documented in the file, and three versions compete: that the mechanism was too bulky and heavy to fit inside the torpedo (so the Hebrew magazine New-Tech, and so too the American Academy of Arts and Sciences); that the brass, on Antheil's own testimony, understood him to be asking to put a player piano inside a torpedo; and that they simply told the actress to go sell war bonds. What is documented for certain is the outcome: the method was not used in the Second World War.\n\nThe patent expired on 11 August 1959, seventeen years after it was granted. Antheil died that same year.\n\nOperational use arrived only once the patent was worthless. An American frequency-hopping system was tested by 1957 and installed in 1963 on the flagship USS Mount McKinley, where it successfully thwarted deliberate jamming — evidently the earliest frequency-hopping system put into action. The National WWII Museum writes that by the time of the Cuban Missile Crisis, American ships had torpedoes controlled by frequency-hopping systems.", "recognition": "הם לא קיבלו כלום. היכל התהילה הלאומי לממציאים כותב במפורש שלאמאר ואנתייל לא הפיקו רווח מן ההמצאה בימי חייהם — לא תמלוגים, לא רכישה, לא תשלום מן הצי.\n\nההכרה הציבורית הראשונה הגיעה כשהייתה בת 82. במרץ 1997 העניק לה ולאנתייל ארגון Electronic Frontier Foundation את פרס החלוץ; באותה שנה הייתה, לפי האקדמיה האמריקאית לאמנויות ולמדעים, האישה הראשונה שזכתה בפרס BULBIE Gnass, שכונה \"האוסקר של ההמצאה\". חמישים וחמש שנה עברו בין הפטנט לפרס הראשון.\n\nהיא נפטרה ב-2000. כמעט כל שאר הכבוד הגיע אחרי מותה: ב-2014 הוכנסה להיכל התהילה הלאומי לממציאים, ובאותה שנה החליטה עיריית וינה להעניק לה קבר-כבוד בבית העלמין המרכזי, בחלקה 33G. אוניברסיטת וינה והאקדמיה האוסטרית למדעים קראו על שמה טלסקופ לתקשורת קוונטית — \"בשם הזה אנו מכבדים ממציאה אוסטרית גדולה\", נאמר בהודעה. אסטרואיד מספר 32730 נושא את שמה, וכך גם לוויין ה-GPS III SV10 של חיל החלל האמריקאי.", "recognition_en": "They received nothing. The National Inventors Hall of Fame states outright that Lamarr and Antheil never profited from their invention during their lifetimes — no royalties, no purchase, no payment from the Navy.\n\nThe first public recognition came when she was 82. In March 1997 the Electronic Frontier Foundation gave her and Antheil its Pioneer Award; that same year she was, according to the American Academy of Arts and Sciences, the first woman to receive the BULBIE Gnass Spirit of Achievement Award, known as the \"Oscar of inventing.\" Fifty-five years passed between the patent and the first award.\n\nShe died in 2000. Almost all the remaining honours came after her death: in 2014 she was inducted into the National Inventors Hall of Fame, and that same year the City of Vienna resolved to grant her an honorary grave in the Central Cemetery, in Group 33G. The University of Vienna together with the Austrian Academy of Sciences named a quantum-communication telescope after her — \"with this naming we honour a great Austrian woman inventor,\" the announcement said. Asteroid 32730 carries her name, and so does the US Space Force's GPS III SV10 satellite.", "honors": [{"what": "פרס החלוץ (Pioneer Award) של ארגון Electronic Frontier Foundation, יחד עם ג'ורג' אנתייל", "year": 1997, "source": "https://www.eff.org/awards/past-winners"}, {"what": "פרס BULBIE Gnass Spirit of Achievement — האישה הראשונה שזכתה בו", "year": 1997, "source": "https://www.amacad.org/person/hedy-lamarr"}, {"what": "הכנסה להיכל התהילה הלאומי לממציאים בארצות הברית, לאחר מותה", "year": 2014, "source": "https://www.invent.org/inductees/hedy-lamarr"}, {"what": "קבר-כבוד מטעם עיריית וינה בבית העלמין המרכזי, חלקה 33G", "year": 2014, "source": "https://presse.wien.gv.at/presse/2014/11/07/hedy-lamarr-erhaelt-ehrengrab-der-stadt-wien"}, {"what": "טלסקופ לתקשורת קוונטית על שמה, אוניברסיטת וינה והאקדמיה האוסטרית למדעים", "year": 2014, "source": "https://austria-forum.org/af/Wissenssammlungen/Essays/Naturwissenschaften/Teleskop_f%C3%BCr_Hedy_Lamarr"}, {"what": "אסטרואיד 32730 Lamarr", "year": null, "source": "https://ssd-api.jpl.nasa.gov/sbdb.api?sstr=32730&discovery=1"}, {"what": "לוויין GPS III SV10 של חיל החלל האמריקאי נקרא על שמה", "year": 2021, "source": "https://www.lockheedmartin.com/en-us/news/features/2021/core-mate-complete-for-final-gps-iii-sv10.html"}], "summary_short": "ביוני 1941, חצי שנה לפני פרל הארבור, הגישו שחקנית הוליוודית ומלחין אוונגרדי בקשת פטנט על מערכת שתמנע מאויב לשבש טורפדו מונחה רדיו. הרעיון: המשדר והמקלט יקפצו יחד בין תדרים לפי אותה סדרה בדיוק, ומנגנון הסנכרון נלקח מגליל של פסנתר מכני — 88 שורות ניקוב, ולכן 88 תדרים. את הידע על מערכות נשק צברה הדי לאמאר בארבע שנות נישואים לפריץ מנדל, מנהל מפעל התחמושת בהירטנברג, בין פגישות עסקיות של יצרני נשק; הנדסה היא לא למדה מעולם. הפטנט ניתן ב-1942, חיל הים האמריקאי לא אימץ את המערכת, וללאמאר נאמר למכור אגרות מלחמה במקום — במסע גיוס אחד היא גייסה 25 מיליון דולר. אגורה מן ההמצאה לא ראתה, לא היא ולא אנתייל. ההכרה הציבורית הראשונה הגיעה כשהייתה בת 82, חמישים וחמש שנה אחרי הפטנט. ומה שמפעל ההנצחה נוטה להשמיט: תיק הבקשה מגלה שדווקא התביעה שניסחה את העיקרון הכללי של קפיצת תדרים נדחתה, משום שהעיקרון כבר היה ידוע.", "summary_short_en": "In June 1941, six months before Pearl Harbor, a Hollywood actress and an avant-garde composer filed a patent application for a system that would keep an enemy from jamming a radio-guided torpedo. The idea: transmitter and receiver hop between frequencies together, in exactly the same sequence, with the synchronising mechanism taken from a player-piano roll — 88 rows of perforations, and so 88 frequencies. Hedy Lamarr had picked up her knowledge of weapons systems over four years of marriage to Fritz Mandl, director of the Hirtenberg munitions factory, among the business meetings of arms manufacturers; she never studied engineering. The patent was granted in 1942, the US Navy did not adopt the system, and Lamarr was told to sell war bonds instead — in a single fundraising drive she raised 25 million dollars. Neither she nor Antheil ever earned a cent from the invention. Her first public recognition came when she was 82, fifty-five years after the patent. And here is what the commemoration industry tends to leave out: the case file shows that the one claim stating the general principle of frequency hopping was rejected, because the principle was already known."}, "changed": ["title", "description", "source_url", "source_label", "citations", "act", "ripple", "title_reasoning", "media_urls", "title_en", "description_en", "act_en", "ripple_en", "source_label_en", "location", "people", "deed_type", "actor_type", "beneficiary", "audit", "origin_story", "origin_story_en", "aftermath", "aftermath_en", "recognition", "recognition_en", "honors", "summary_short", "summary_short_en"], "m_before": {"citations": 2, "domains": 1, "images": 1, "people": 0, "videos": 0, "location": 0, "honors": 0, "chars": 490, "std": 17}, "m_after": {"citations": 40, "domains": 16, "images": 10, "people": 2, "videos": 0, "location": 1, "honors": 7, "chars": 5710, "std": 46}, "std_total": 46, "failing": []}, {"id": "10da5666-5b73-4e50-b572-ac3a9e077c92", "title": "ורבה וצלר נמלטו מאושוויץ והזהירו מראש מפני גירוש יהודי הונגריה", "year": 1944, "before": {"id": "10da5666-5b73-4e50-b572-ac3a9e077c92", "title": "שני אסירים נמלטו מאושוויץ וכתבו דוח שהזהיר את העולם מפני ההשמדה", "description": "באפריל 1944 נמלטו מאושוויץ-בירקנאו שני אסירים יהודים סלובקים, רודולף ורבה ואלפרד וצלר, וחיברו דוח מפורט על מבנה המחנה, תאי הגזים ושיטת ההשמדה. הדוח, המוכר כפרוטוקולי אושוויץ, הגיע לשווייץ ופורסם בעיתונות, ובעקבותיו פנו מנהיגי העולם לממשלת הונגריה בדרישה להפסיק את גירוש היהודים. הגירושים נעצרו ב-9 ביולי 1944.", "category": "היסטורי", "year": 1944, "media_type": "image", "media_url": "https://upload.wikimedia.org/wikipedia/commons/1/18/Telegram%2C_Vrba_and_Wetzler_escape%2C_Auschwitz%2C_8_April_1944.jpg", "source_url": "https://www.fdrlibrary.org/vrba-wetzler-report", "source_label": "ספריית הנשיא פרנקלין רוזוולט, ארכיון ועדת הפליטים למלחמה", "submitted_by": null, "status": "approved", "created_at": "2026-08-03 23:15:07.859555+00", "citations": [{"quote": "Two Slovakian Jewish prisoners of Auschwitz-Birkenau, Rudolf Vrba and Alfred Wetzler, escaped the camp in April 1944.", "source_url": "https://www.fdrlibrary.org/vrba-wetzler-report", "source_label": "Franklin D. Roosevelt Presidential Library and Museum"}, {"quote": "World leaders made direct appeals to the Hungarian Government to stop the deportation of Jews. The deportations were halted on 9 July.", "source_url": "https://hmd.org.uk/resource/rudolf-vrba", "source_label": "Holocaust Memorial Day Trust (UK)"}], "act": "רודולף ורבה ואלפרד וצלר נמלטו מאושוויץ-בירקנאו וחיברו דוח עדות מפורט שחשף לעולם את מנגנון ההשמדה במחנה.", "ripple": "הדוח פורסם בעיתונות השווייצרית ובתקשורת הבריטית והאמריקנית, מנהיגי העולם פנו לממשלת הונגריה, והגירושים לאושוויץ נעצרו ב-9 ביולי 1944.", "title_reasoning": "מי - שני אסירים שנמלטו מאושוויץ; מה עושים - כתבו דוח; למי - העולם שהוזהר מפני ההשמדה. בחרתי בניסוח הזהיר את העולם ולא עצר את הגירוש, כי המקורות מתארים שרשרת של פרסום ולחץ בינלאומי ולא סיבתיות ישירה. הקישור לעצירת הגירושים מופיע בתיאור ובגלי ההשפעה ומגובה בציטוט.", "media_urls": ["https://upload.wikimedia.org/wikipedia/commons/1/18/Telegram%2C_Vrba_and_Wetzler_escape%2C_Auschwitz%2C_8_April_1944.jpg", "https://upload.wikimedia.org/wikipedia/commons/d/d7/Vrba-Wetzler_report_sketch.JPG", "https://upload.wikimedia.org/wikipedia/commons/e/ea/Rough_ground_plan_of_Birkenau%2C_April_1944.jpeg"], "title_en": "Two Prisoners Escaped from Auschwitz and Wrote a Report That Warned the World About the Extermination", "description_en": "In April 1944, two Slovak Jewish prisoners, Rudolf Vrba and Alfred Wetzler, escaped from Auschwitz-Birkenau and compiled a detailed report on the camp's layout, gas chambers, and killing methods. The report, known as the Auschwitz Protocols, reached Switzerland and was published in the press; world leaders subsequently appealed to the Hungarian government demanding a halt to the deportations. The deportations stopped on July 9, 1944.", "act_en": "Rudolf Vrba and Alfred Wetzler escaped Auschwitz-Birkenau and compiled a detailed eyewitness report that exposed the camp's extermination machinery to the world", "ripple_en": "The report spread through the Swiss, British, and American press; world leaders pressed Hungary's government, and deportations to Auschwitz halted on July 9, 1944", "source_label_en": "Franklin D. Roosevelt Presidential Library, War Refugee Board Archive", "categories": null, "location": null, "people": null, "deed_type": null, "actor_type": null, "beneficiary": null, "audit": null, "dedup": null, "origin_story": null, "origin_story_en": null, "aftermath": null, "aftermath_en": null, "recognition": null, "recognition_en": null, "honors": null}, "after": {"id": "10da5666-5b73-4e50-b572-ac3a9e077c92", "title": "ורבה וצלר נמלטו מאושוויץ והזהירו מראש מפני גירוש יהודי הונגריה", "description": "באפריל 1944 נמלטו מאושוויץ-בירקנאו שני אסירים יהודים סלובקים, רודולף ורבה (ולטר רוזנברג) ואלפרד וצלר, אחרי כמעט שנתיים במחנה. בז'ילינה שבסלובקיה מסרו למועצה היהודית דוח בן כ-40 עמודים ובו מפת המחנה, מבנה תאי הגזים והקרמטוריומים ורשימת המשלוחים לפי מוצא ומספר — הכול מזיכרון. הדוח, שנודע כ\"פרוטוקולי אושוויץ\", היה המסמך הראשון על המחנה שהתקבל במערב כאמין. הוא נועד למנוע את גירוש יהודי הונגריה. הגירוש התרחש בכל זאת — כ-437,000 איש בין 15 במאי ל-7–8 ביולי 1944 — אך אחרי פרסום הדוח בעיתונות שווייץ הורה העוצר מיקלוש הורטי ב-7 ביולי להפסיקו, וכ-200,000 יהודי בודפשט לא גורשו במשלוחים ההם. עד כמה הדוח עצמו הכריע, היסטוריונים חלוקים עד היום.", "category": "היסטורי", "year": 1944, "media_type": "image", "media_url": "https://upload.wikimedia.org/wikipedia/commons/1/18/Telegram%2C_Vrba_and_Wetzler_escape%2C_Auschwitz%2C_8_April_1944.jpg", "source_url": "https://www.fdrlibrary.org/vrba-wetzler-report", "source_label": "ספריית ומוזיאון הנשיא פרנקלין ד' רוזוולט — ארכיון ועדת הפליטים למלחמה", "submitted_by": null, "status": "approved", "created_at": "2026-08-03 23:15:07.859555+00", "citations": [{"quote": "After Swiss press coverage of the report, some details began appearing in American and British newspapers in June 1944, catalyzing international pressure (including from FDR) on the Hungarian government to halt deportations of Jews to Auschwitz.", "locator": "Document Feature: Vrba-Wetzler Report and the Auschwitz Protocols — פסקה שלישית", "quote_he": "אחרי סיקור הדוח בעיתונות השווייצרית החלו פרטים להופיע בעיתונים אמריקניים ובריטיים ביוני 1944, והציתו לחץ בין-לאומי (ובכללו מצד רוזוולט) על ממשלת הונגריה להפסיק את גירוש היהודים לאושוויץ.", "published": "2016", "source_url": "https://www.fdrlibrary.org/vrba-wetzler-report", "source_label": "ספריית הנשיא פרנקלין רוזוולט — ארכיון ועדת הפליטים למלחמה", "source_label_en": "Franklin D. Roosevelt Presidential Library & Museum"}, {"quote": "The deportations temporarily stopped in July, but resumed in October.", "locator": "Document Feature — פסקה שלישית, המשפט שאחרי תיאור הלחץ הבין-לאומי", "quote_he": "הגירושים נעצרו זמנית ביולי, אך חודשו באוקטובר.", "published": "2016", "source_url": "https://www.fdrlibrary.org/vrba-wetzler-report", "source_label": "ספריית הנשיא פרנקלין רוזוולט — ארכיון ועדת הפליטים למלחמה", "source_label_en": "Franklin D. Roosevelt Presidential Library & Museum"}, {"quote": "Scholars debate how effectively they were used to influence American and Allied response to the Holocaust, but they were published nationwide on November 26, 1944, and later used as evidence in the Nuremberg trials.", "locator": "Document Feature — סוף פסקה שלישית", "quote_he": "חוקרים חלוקים עד כמה הדוחות שימשו ביעילות להשפיע על תגובת ארה\"ב ובעלות הברית לשואה, אך הם פורסמו ברחבי המדינה ב-26 בנובמבר 1944, ולימים שימשו ראיה במשפטי נירנברג.", "published": "2016", "source_url": "https://www.fdrlibrary.org/vrba-wetzler-report", "source_label": "ספריית הנשיא פרנקלין רוזוולט — ארכיון ועדת הפליטים למלחמה", "source_label_en": "Franklin D. Roosevelt Presidential Library & Museum"}, {"quote": "Two Jews from Slovakia, Rudolf Vrba (Walter Rosenberg in Auschwitz) and Alfred Wetzler, escaped in April 1944.", "locator": "History › Informing the world › Reports by Auschwitz escapees — פסקה 5", "quote_he": "שני יהודים מסלובקיה, רודולף ורבה (ולטר רוזנברג באושוויץ) ואלפרד וצלר, נמלטו באפריל 1944.", "published": "—", "source_url": "https://www.auschwitz.org/en/history/informing-the-world/reports-by-auschwitz-escapees/", "source_label": "מוזיאון המדינה אושוויץ-בירקנאו", "source_label_en": "Auschwitz-Birkenau State Museum"}, {"quote": "It was sent through various channels to Allied governments, the World Congress of Jews, the International Red Cross, and the Vatican.", "locator": "History › Informing the world › Reports by Auschwitz escapees — פסקה 5", "quote_he": "הוא נשלח בערוצים שונים לממשלות בעלות הברית, לקונגרס היהודי העולמי, לצלב האדום הבין-לאומי ולוותיקן.", "published": "—", "source_url": "https://www.auschwitz.org/en/history/informing-the-world/reports-by-auschwitz-escapees/", "source_label": "מוזיאון המדינה אושוויץ-בירקנאו", "source_label_en": "Auschwitz-Birkenau State Museum"}, {"quote": "They were separated and interviewed about their accounts of Auschwitz independently, so the two testimonies could be compared and verified.", "locator": "Rudolf Vrba — הפרק על ההגעה לסלובקיה וכתיבת הדוח", "quote_he": "הם הופרדו ונחקרו על עדויותיהם מאושוויץ בנפרד, כדי שאפשר יהיה להשוות ולאמת את שתי העדויות.", "published": "2015-09-07", "source_url": "https://hmd.org.uk/resource/rudolf-vrba/", "source_label": "הנאמנות ליום הזיכרון לשואה, בריטניה", "source_label_en": "Holocaust Memorial Day Trust (UK)"}, {"quote": "Vrba was appalled as 437,000 Jews from the Hungarian countryside were sent to Auschwitz and murdered between 15 May and 7 July 1944.", "locator": "Rudolf Vrba — הפרק על הנהגת יהדות הונגריה", "quote_he": "ורבה נחרד כאשר 437,000 יהודים מהפריפריה ההונגרית נשלחו לאושוויץ ונרצחו בין 15 במאי ל-7 ביולי 1944.", "published": "2015-09-07", "source_url": "https://hmd.org.uk/resource/rudolf-vrba/", "source_label": "הנאמנות ליום הזיכרון לשואה, בריטניה", "source_label_en": "Holocaust Memorial Day Trust (UK)"}, {"quote": "The deportations were halted on 9 July.", "locator": "Rudolf Vrba — הפסקה הפותחת ב-Despite not reaching most Hungarian Jews", "quote_he": "הגירושים נעצרו ב-9 ביולי.", "published": "2015-09-07", "source_url": "https://hmd.org.uk/resource/rudolf-vrba/", "source_label": "הנאמנות ליום הזיכרון לשואה, בריטניה", "source_label_en": "Holocaust Memorial Day Trust (UK)"}, {"quote": "On July 7 Horthy ordered a halt to the deportations from Hungary, which became effective only on July 9.", "locator": "Obituary, Rudolf Vrba — הפסקה על 'בומברדמנט' מצפונו של הורטי", "quote_he": "ב-7 ביולי הורה הורטי על עצירת הגירושים מהונגריה, שנכנסה לתוקף רק ב-9 ביולי.", "published": "2006-04-13", "source_url": "https://www.theguardian.com/news/2006/apr/13/guardianobituaries.secondworldwar", "source_label": "הגרדיאן — הספד על רודולף ורבה מאת רות לין", "source_label_en": "The Guardian — obituary of Rudolf Vrba by Ruth Linn"}, {"quote": "The Vrba-Wetzler report continues to generate historical debate to this day.", "locator": "Obituary, Rudolf Vrba — פתיחת הפסקה על הוויכוח ההיסטורי", "quote_he": "דוח ורבה-וצלר ממשיך לעורר ויכוח היסטורי עד עצם היום הזה.", "published": "2006-04-13", "source_url": "https://www.theguardian.com/news/2006/apr/13/guardianobituaries.secondworldwar", "source_label": "הגרדיאן — הספד על רודולף ורבה מאת רות לין", "source_label_en": "The Guardian — obituary of Rudolf Vrba by Ruth Linn"}, {"quote": "In June 1998, I succeeded in convincing my university, Haifa, to award Vrba an honorary doctorate in recognition of his heroic escape from Auschwitz and his contribution to Holocaust education.", "locator": "Obituary, Rudolf Vrba — עדותה האישית של רות לין", "quote_he": "ביוני 1998 הצלחתי לשכנע את האוניברסיטה שלי, חיפה, להעניק לוורבה דוקטורט לשם כבוד על בריחתו ההרואית מאושוויץ ועל תרומתו לחינוך על השואה.", "published": "2006-04-13", "source_url": "https://www.theguardian.com/news/2006/apr/13/guardianobituaries.secondworldwar", "source_label": "הגרדיאן — הספד על רודולף ורבה מאת רות לין", "source_label_en": "The Guardian — obituary of Rudolf Vrba by Ruth Linn"}, {"quote": "In April 1944, Rudolf Vrba and Alfred Wetzler escaped from Auschwitz and wrote a report providing some of the first reliable eyewitness accounts of the camp.", "locator": "Auschwitz Report — פסקת הרקע שאחרי כותרת האירוע", "quote_he": "באפריל 1944 נמלטו רודולף ורבה ואלפרד וצלר מאושוויץ וכתבו דוח שסיפק חלק מעדויות הראייה המהימנות הראשונות על המחנה.", "published": "—", "source_url": "https://encyclopedia.ushmm.org/content/en/timeline-event/holocaust/1942-1945/auschwitz-report", "source_label": "האנציקלופדיה של השואה, המוזיאון לזכר השואה של ארה\"ב", "source_label_en": "Holocaust Encyclopedia, USHMM"}, {"quote": "False showers are built into the walls of the gas chamber so as to give the impression of a very large washroom.", "locator": "Report by Alfred Wetzler and Rudolf Vrba (late April 1944) — תיאור קרמטוריום II/III; תרגום לאנגלית מ-NARA, RG 226, Entry 19, Box 119, File XL 8883", "quote_he": "מקלחות מדומות מותקנות בקירות תא הגזים כדי ליצור רושם של חדר רחצה גדול מאוד.", "published": "1944-04 (המסמך)", "source_url": "https://germanhistorydocs.org/en/nazi-germany-1933-1945/report-by-alfred-wetzler-and-rudolf-vrba-two-escapees-from-auschwitz-late-april-1944", "source_label": "German History in Documents and Images — נוסח הדוח עצמו", "source_label_en": "German History in Documents and Images"}, {"quote": "The publication of the report in the Swiss press, however, finally raised so much indignation abroad that, under political and military pressure from the Allies, the Hungarian Regent, Admiral Miklós Horthy, was forced to forbid further deportations in early July 1944.", "locator": "Report by Alfred Wetzler and Rudolf Vrba — מבוא העורכים, פסקה 2", "quote_he": "פרסום הדוח בעיתונות השווייצרית עורר בסופו של דבר זעם כה רב בחו\"ל, שתחת לחץ מדיני וצבאי מצד בעלות הברית נאלץ העוצר ההונגרי, האדמירל מיקלוש הורטי, לאסור על המשך הגירושים בתחילת יולי 1944.", "published": "—", "source_url": "https://germanhistorydocs.org/en/nazi-germany-1933-1945/report-by-alfred-wetzler-and-rudolf-vrba-two-escapees-from-auschwitz-late-april-1944", "source_label": "German History in Documents and Images — מבוא העורכים למסמך", "source_label_en": "German History in Documents and Images"}, {"quote": "The Executive Office of the President through the War Refugee Board today made public two eye-witness reports of the horrible and barbarous events which occurred in the two notorious extermination camps — Auschwitz (Oswiecim) and Brikenau — in Upper Silesia.", "locator": "War Refugee Board Releases Report... — פסקה פותחת (שגיאת הכתיב \"Brikenau\" במקור)", "quote_he": "הלשכה הביצועית של הנשיא, באמצעות ועדת הפליטים למלחמה, פרסמה היום שני דוחות עדי ראייה על המאורעות הנוראים והברבריים שהתרחשו בשני מחנות ההשמדה הידועים לשמצה — אושוויץ (אושפיצין) ובירקנאו — בשלזיה עילית.", "published": "1944-11-26", "source_url": "https://www.jta.org/archive/war-refugee-board-releases-report-on-extermination-of-millions-of-jews-in-nazi-camps", "source_label": "הסוכנות הטלגרפית היהודית (JTA), ארכיון — דיווח בן-הזמן", "source_label_en": "Jewish Telegraphic Agency archive — contemporary report"}, {"quote": "On the 8th of July, the transports were discontinued by Miklós Horthy, Hungary’s head of state.", "locator": "The timeline › Deportation of Hungarian Jews (#216)", "quote_he": "ב-8 ביולי הופסקו המשלוחים בידי מיקלוש הורטי, ראש המדינה ההונגרי.", "published": "—", "source_url": "https://www.annefrank.org/en/anne-frank/the-timeline/entire-timeline/#216", "source_label": "בית אנה פרנק, אמסטרדם", "source_label_en": "Anne Frank House, Amsterdam"}, {"quote": "the magnitude of his heroic actions during the Holocaust remained largely unrecognized in his adopted city", "locator": "VHEC and Community Erect Monument... — פסקה 4", "quote_he": "עוצמת מעשיו ההרואיים בתקופת השואה נותרה בלתי מוכרת ברובה בעיר שאימץ.", "published": "2025-11-17", "source_url": "https://www.vhec.org/vhec-and-community-erect-monument-to-honor-rudolf-vrbas-courage-and-legacy/", "source_label": "מרכז השואה של ונקובר לחינוך ולהנצחה", "source_label_en": "Vancouver Holocaust Education Centre"}, {"quote": "He cited historian Sir. Martin Gilbert’s assertion that Vrba was directly responsible for saving at least 100,000 Jewish lives.", "locator": "VHEC and Community Erect Monument... — פסקה 5, דבריו של ד\"ר רוברט קרל", "quote_he": "הוא הזכיר את קביעתו של ההיסטוריון סר מרטין גילברט שוורבה היה אחראי ישירות להצלת 100,000 חיי יהודים לפחות.", "published": "2025-11-17", "source_url": "https://www.vhec.org/vhec-and-community-erect-monument-to-honor-rudolf-vrbas-courage-and-legacy/", "source_label": "מרכז השואה של ונקובר לחינוך ולהנצחה", "source_label_en": "Vancouver Holocaust Education Centre"}, {"quote": "In April 1944, two Slovak Jewish prisoners – Alfréd Wetzler and Rudolf Vrba, born Walter Rosenberg, escaped from Birkenau.", "locator": "עמוד הבית — פסקת הפתיחה תחת \"March in the Footsteps of Heroes\"", "quote_he": "באפריל 1944 נמלטו מבירקנאו שני אסירים יהודים סלובקים — אלפרד וצלר ורודולף ורבה, יליד ולטר רוזנברג.", "published": "—", "source_url": "https://vrbawetzler.sk/", "source_label": "Vrba–Wetzler Memorial — צעדת הזיכרון השנתית, סלובקיה", "source_label_en": "Vrba–Wetzler Memorial, Slovakia"}], "act": "ב-7 באפריל 1944, בשעת אחר צהריים, נכנסו ורבה ווצלר למחבוא בערמת קורות בנייה בשטח שכונה \"מקסיקו\" בבירקנאו. סביב המחבוא פוזר טבק רוסי ספוג בנזין כדי לשבש את כלבי הגישוש. שלושה לילות שכבו שם בזמן שהחיפוש נמשך סביבם; ב-10 באפריל, כשהוסר הכיתור החיצוני, יצאו והלכו כאחד-עשר לילות דרומה, כ-130 קילומטרים מעבר להרי הבסקידים, עד לסלובקיה. בז'ילינה נחקרו בנפרד בידי המועצה היהודית, כדי שאפשר יהיה להצליב ולאמת את שתי העדויות זו מול זו. מהעדויות חובר דוח בן כ-40 עמודים בסלובקית ובגרמנית: תרשים המחנה, מבנה תאי הגזים והקרמטוריומים, ורשימה מפורטת של המשלוחים לפי ארץ מוצא ומספר — כולל אומדן של כ-1,765,000 יהודים שנרצחו בבירקנאו בין אפריל 1942 לאפריל 1944. הכול שוחזר מזיכרון, בלי פיסת נייר אחת שיצאה מהמחנה.", "ripple": "הדוח היה המסמך הראשון על אושוויץ שהגיע לעולם החופשי והתקבל כאמין, והוא שבר מחסום של ספקנות ואדישות שהתקיים עד אז. הוא נשלח בערוצים שונים לממשלות בעלות הברית, לקונגרס היהודי העולמי, לצלב האדום הבין-לאומי ולוותיקן. הדיפלומט הרומני פלוריאן מנוליו העביר עותק לג'ורג' מנדל-מנטלו, שהעתיק אותו, תרגם אותו, הפיץ אותו בקרב אנשי דת פרוטסטנטים בשווייץ ופתח קמפיין עיתונות עולמי. בסוף יוני 1944 פורסמו חלקים מהדוח בעיתונות השווייצרית, וביוני-יולי כבר דיווחו עליו כלי תקשורת בריטיים ואמריקניים. ב-18 בנובמבר 1944 הפיצה ועדת הפליטים למלחמה האמריקנית עשרות עותקים תחת הכותרת \"German Extermination Camps - Auschwitz and Birkenau\", וב-26 בנובמבר פורסם הדוח בעיתונות ברחבי ארצות הברית. לימים שימש ראיה במשפטי נירנברג.", "title_reasoning": "הכותרת הישנה, \"וכתבו דוח שהזהיר את העולם מפני ההשמדה\", נקראת כקשר סיבתי סגור — והמקור הראשי עצמו (ספריית רוזוולט) כותב במפורש ש\"חוקרים חלוקים\" עד כמה הדוח הופעל, וההספד ב'גרדיאן' קובע שהוויכוח נמשך. לפי כלל 72 כל מילה חייבת לשרוד מול המקור, ולכן הכותרת מתארת את מה שאין עליו מחלוקת: מי (ורבה ווצלר), מה עשו (נמלטו), ולמי כוונה האזהרה (יהודי הונגריה), ומתי (מראש — הדוח נמסר בז'ילינה בסוף אפריל, והגירושים החלו ב-15 במאי). \"מראש\" הוא הפרט שמרגש כאן, כי הוא מה שהופך את הסיפור מעדות לניסיון מניעה. 10 מילים, בטווח 6–12, בלי סימן קריאה.", "media_urls": ["https://upload.wikimedia.org/wikipedia/commons/1/18/Telegram%2C_Vrba_and_Wetzler_escape%2C_Auschwitz%2C_8_April_1944.jpg", "https://upload.wikimedia.org/wikipedia/commons/e/ea/Rough_ground_plan_of_Birkenau%2C_April_1944.jpeg", "https://upload.wikimedia.org/wikipedia/commons/f/f2/Vrba-Wetzler_report_sketch_%28crematoria%29.jpg", "https://upload.wikimedia.org/wikipedia/commons/2/25/Hungarian_jews_on_the_Birkenau_arrival_platform_-_Auschwitz.png", "https://upload.wikimedia.org/wikipedia/commons/e/ef/Jewish_women_from_Subcarpathian_Rus_who_have_been_selected_for_forced_labor_at_Auschwitz-Birkenau.jpg", "https://upload.wikimedia.org/wikipedia/commons/9/96/Female_prisoners_at_Birkenau.jpg", "https://upload.wikimedia.org/wikipedia/commons/0/01/Birkenau_Three_Jewish_men_holding_an_elderly_woman_looking_behind_her.jpg"], "title_en": "Vrba and Wetzler escaped Auschwitz and warned in advance of the Hungarian deportations", "description_en": "In April 1944 two Slovak Jewish prisoners, Rudolf Vrba (born Walter Rosenberg) and Alfréd Wetzler, escaped from Auschwitz-Birkenau after almost two years in the camp. In Žilina, Slovakia, they gave the Jewish Council a report of some 40 pages containing the camp's layout, the structure of the gas chambers and crematoria, and a list of transports by origin and number — all from memory. The report, known as the Auschwitz Protocols, was the first document about the camp accepted as credible in the West. It was meant to prevent the deportation of Hungary's Jews. The deportation happened anyway — about 437,000 people between 15 May and 7–8 July 1944 — but after the report was published in the Swiss press, Regent Miklós Horthy ordered it stopped on 7 July, and some 200,000 Jews of Budapest were not deported in those transports. How decisive the report itself was remains debated by historians to this day.", "act_en": "On the afternoon of 7 April 1944, Vrba and Wetzler crawled into a hollow inside a pile of construction lumber in the area of Birkenau nicknamed \"Mexico.\" Russian tobacco soaked in petrol was scattered around the hideout to defeat the search dogs. They lay there for three nights while the hunt went on around them; on 10 April, once the outer cordon was withdrawn, they left and walked south for about eleven nights, some 130 kilometres over the Beskid mountains into Slovakia. In Žilina the Jewish Council interviewed them separately so that the two testimonies could be compared and verified against each other. From those testimonies a report of some 40 pages was composed in Slovak and German: a plan of the camp, the structure of the gas chambers and crematoria, and a detailed list of transports by country of origin and number — including an estimate of about 1,765,000 Jews gassed at Birkenau between April 1942 and April 1944. All of it reconstructed from memory, without a single sheet of paper carried out of the camp.", "ripple_en": "The report was the first document about Auschwitz to reach the free world and be accepted as credible, breaking a barrier of scepticism and apathy that had held until then. It was sent through various channels to Allied governments, the World Jewish Congress, the International Red Cross and the Vatican. The Romanian diplomat Florian Manoliu passed a copy to George Mandel-Mantello, who recopied it, translated it, distributed it to Swiss Protestant clergy and launched a worldwide press campaign. Portions appeared in the Swiss press at the end of June 1944, and by June–July British and American media were reporting it. On 18 November 1944 the US War Refugee Board circulated dozens of copies under the title \"German Extermination Camps - Auschwitz and Birkenau,\" and on 26 November it was published in newspapers nationwide. It was later used as evidence at the Nuremberg trials.", "source_label_en": "Franklin D. Roosevelt Presidential Library & Museum — Records of the War Refugee Board", "categories": null, "location": {"lat": 50.0343, "lng": 19.178, "city": "אושוויץ (אושפיצין) — אושוויץ II-בירקנאו", "note": "נקודת המעש היא המחנה שממנו נמלטו. הדוח עצמו חובר בז'ילינה שבסלובקיה (49.2231, 18.7394) בסוף אפריל 1944.", "city_en": "Oświęcim — Auschwitz II-Birkenau", "country": "פולין", "precision": "site", "country_en": "Poland"}, "people": [{"en": "Rudolf Vrba (born Walter Rosenberg)", "he": "רודולף ורבה (נולד ולטר רוזנברג)", "role": "אסיר נמלט, מחבר הדוח", "years": "1924–2006"}, {"en": "Alfréd Wetzler", "he": "אלפרד וצלר", "role": "אסיר נמלט, מחבר הדוח", "years": "1918–1988"}, {"en": "Oscar Krasniansky", "he": "אוסקר קרסניאנסקי", "role": "תרגם והדפיס את הדוח לגרמנית מטעם המועצה היהודית בסלובקיה", "years": "—"}, {"en": "Gisela Steiner", "he": "גיזלה שטיינר", "role": "תרגמה והדפיסה את הדוח לגרמנית מטעם המועצה היהודית בסלובקיה", "years": "—"}, {"en": "George Mandel-Mantello", "he": "ג'ורג' מנדל-מנטלו", "role": "הפיץ את הדוח בשווייץ ופתח את קמפיין העיתונות", "years": "—"}, {"en": "Florian Manoliu", "he": "פלוריאן מנוליו", "role": "דיפלומט רומני שהעביר עותק של הדוח למנדל-מנטלו", "years": "—"}, {"en": "Miklós Horthy", "he": "מיקלוש הורטי", "role": "העוצר ההונגרי שהורה ב-7 ביולי 1944 להפסיק את הגירושים", "years": "1868–1957"}], "deed_type": ["זכויות אדם", "רפואה רקנאו, 27 במאי 1944: שלושה גברים יהודים תומכים באישה קשישה המביטה לאחור. מגטו טט שבהונגריה, אחד מ-151 המשלוחים שיצאו בין 15 במאי ל-8 ביולי.", "source_url": "https://commons.wikimedia.org/wiki/File:Birkenau_Three_Jewish_men_holding_an_elderly_woman_looking_behind_her.jpg", "photographer": "אנונימי, ככל הנראה צלמי ה-SS א' הופמן וב' ולטר", "published_in": "ארכיון התצלומים של יד ושם, 97836_31526"}], "lead_image_basis": "contemporary_artifact"}, "dedup": {"note": "נבדק מול רשימת הרישום המלאה. שש רשומות שכנות עוסקות בשואה, אך אף אחת אינה בריחה מאושוויץ, אינה מזכירה את ורבה או וצלר ואינה עוסקת בדוח. שלוש מהן (סנש, ביילסקי, פרייר) הן פעולות הצלה פיזיות ולא העברת מידע; שתיים (ויזל, ויזנטל) הן עדות ותביעה שלאחר המלחמה. אין כפילות ואין מה למזג.", "merged_from": [], "is_duplicate": false, "checked_against": ["שני אסירים נמלטו מאושוויץ וכתבו דוח שהזהיר את העולם מפני ההשמדה (הרשומה הזו עצמה)", "חנה סנש צונחת לאירופה הכבושה כדי לסייע בהצלת יהודים מהשמדה", "האחים ביילסקי הקימו קהילה ביער והצילו יותר מ-1,200 יהודים", "רחה פרייר הקימה את עליית הנוער והצילה 7,000 ילדים יהודים מגרמניה הנאצית", "אלי ויזל נשא עדות לשואה והפך את המאבק באדישות למאבק למען שלום", "שמעון ויזנטל, ניצול שואה, הקדיש את חייו להביא פושעים נאצים למשפט", "יאנוש קורצ'אק סירב לנטוש את יתומיו וליווה אותם עד מחנה ההשמדה טרבלינקה"]}, "origin_story": "ולטר רוזנברג, יליד טופולצ'אני שבסלובקיה, הגיע לאושוויץ ב-30 ביוני 1942 בגיל 18, ומספר 44070 קועקע על זרועו. כשנה עבד ביחידת \"קנדה\" שמיינה את חפצי הנרצחים, ועמד על רציף הסלקציה בהגעת רוב המשלוחים. משם למד את הדבר שיהפוך לרעיון המרכזי בחייו: כמה מעט ידעו המגיעים. מזוודותיהם הכילו בגדים לכל העונות וכלי בית — היערכות תמימה ל\"יישוב מחדש\" במזרח. מסקנתו הייתה שמכונת הרצח כולה נשענת על אי-הידיעה הזאת. בקיץ 1943 מונה רשם במחנה ההסגר וצבר גישה למספרים ולתאריכים. בתחילת 1944 ראה שנסללת מסילה נוספת עד הקרמטוריומים, ושמע אנשי SS מדברים על \"סלמי הונגרי\" — בסלנג שלהם, סימן למוצא המשלוח הבא, כשם שגבינה סימנה את הולנד וזיתים את יוון. הוא הבין שההיערכות היא לכמעט 800,000 יהודי הונגריה, ושמעתה \"זו כבר לא שאלה של דיווח על פשע אלא של מניעתו\". יחד עם אלפרד וצלר, אסיר ותיק ממנו, ניתח כל ניסיון בריחה קודם שנכשל כדי לתכנן אחד שיצליח.", "origin_story_en": "Walter Rosenberg, born in Topoľčany, Slovakia, arrived at Auschwitz on 30 June 1942 at the age of 18 and was tattooed with number 44070. For about a year he worked in the \"Canada\" detail sorting the belongings of the murdered, and stood at the selection ramp as most transports arrived. There he learned the idea that would define his life: how little the arrivals knew. Their luggage held clothes for every season and household utensils — a naive preparation for \"resettlement\" in the east. He concluded that the whole killing machine rested on that ignorance. In the summer of 1943 he was made registrar of the quarantine camp, gaining access to numbers and dates. In early 1944 he saw a new rail spur being laid to the crematoria and heard SS men speak of \"Hungarian salami\" — their slang marker for the origin of the next transport, just as cheese had marked the Netherlands and olives Greece. He understood that the preparations were for nearly 800,000 Hungarian Jews, and that it was \"no longer a question of reporting a crime but of preventing one.\" With Alfréd Wetzler he analysed every previous failed escape in order to plan one that would work.", "aftermath": "מה שהדוח נועד למנוע קרה בכל זאת. הוא היה בידי מנהיגי יהדות הונגריה כבר בסוף אפריל 1944, אך לא הועבר לציבור; ורבה טען כל חייו שההנהגה בבודפשט נמנעה מלפרסמו כדי לא לסכן משא ומתן שניהלה עם הגרמנים. בין 15 במאי ל-7–8 ביולי גורשו כ-437,000 יהודים מהפריפריה ההונגרית לאושוויץ, ורובם נרצחו מיד (המקורות נעים בין 437,000 ל\"כ-440,000\"). גם העצירה הייתה חלקית וזמנית: הורטי הורה עליה ב-7 ביולי, היא נכנסה לתוקף ב-9 ביולי — ואחרי הפיכת \"צלב החץ\" באוקטובר-נובמבר 1944 חודשה הרדיפה, ובבודפשט נרצחו עוד עשרות אלפים. מה שכן השתנה: יהודי בודפשט לא גורשו במשלוחים ההם. ההיסטוריון מרטין גילברט ייחס לוורבה הצלה של 100,000 נפש לפחות, ואחרים מדברים על עד 200,000. ומה שהיסטוריונים אומרים שלא השתנה: ספריית רוזוולט כותבת ש\"חוקרים חלוקים\" עד כמה הדוח הופעל ביעילות כדי להשפיע על תגובת ארה\"ב ובעלות הברית, וההספד ב'גרדיאן' קובע שהדוח \"ממשיך לעורר ויכוח היסטורי עד עצם היום הזה\". ורבה עצמו לא חדל לשאול, עד יומו האחרון, אם אפשר היה להציל יותר.", "aftermath_en": "What the report was meant to prevent happened anyway. It was in the hands of Hungarian Jewish leaders by late April 1944 but was not passed on to the public; Vrba maintained all his life that the Budapest leadership withheld it so as not to jeopardise its negotiations with the Germans. Between 15 May and 7–8 July about 437,000 Jews from the Hungarian countryside were deported to Auschwitz and most were murdered on arrival (sources range from 437,000 to \"approximately 440,000\"). The halt was partial and temporary too: Horthy ordered it on 7 July, it took effect on 9 July — and after the Arrow Cross putsch of October–November 1944 the persecution resumed, with tens of thousands more killed in Budapest. What did change: the Jews of Budapest were not deported in those transports. The historian Martin Gilbert credited Vrba with saving at least 100,000 lives; others speak of up to 200,000. And what historians say did not change: the Roosevelt Library writes that \"scholars debate\" how effectively the reports were used to influence the American and Allied response, and the Guardian obituary states that the report \"continues to generate historical debate to this day.\" Vrba himself never stopped asking, to his last day, whether more could have been saved.", "recognition": "ההכרה הגיעה מאוחר, בחלקה, ומחוץ לישראל. מיד אחרי הבריחה קיבל ולטר רוזנברג תעודות מזויפות על שם \"רודולף ורבה\" — והשם הזה נשאר שמו עד מותו; הוא אף החליף את תאריך לידתו ליום הבריחה. הוא הצטרף לפרטיזנים הצ'כוסלובקיים ועוטר על גבורה. אבל המחיר היה בעיקר מחיר של שייכות: ורבה האשים את הנהגת יהדות הונגריה שלא פרסמה את הדוח, עזב את ישראל אחרי כשנתיים (1958–1960) מפני שלא היה מוכן לחיות בקרב חלק מאותם מנהיגים, ועבר לבריטניה ואז לקנדה. בוונקובר עשה קריירה אקדמית כפרופסור לפרמקולוגיה — ולפי מרכז השואה של ונקובר, \"עוצמת מעשיו ההרואיים בתקופת השואה נותרה בלתי מוכרת ברובה בעיר שאימץ\". ספר הזיכרונות שלו יצא באנגלית ב-1963, אך בעברית ראה אור רק ב-1998, וגם אז — לפי רות לין, שיזמה את התואר — ניסו כמה חוקרים ישראלים ברגע האחרון להמעיט בערכו. ההכרה הממוסדת הראשונה הייתה הדוקטורט לשם כבוד מאוניברסיטת חיפה ביוני 1998, 54 שנים אחרי הבריחה. אלפרד וצלר, שנפטר ב-1988, זכה לפחות מכך.", "recognition_en": "Recognition came late, partially, and outside Israel. Immediately after the escape Walter Rosenberg received forged papers in the name \"Rudolf Vrba\" — the name he kept until his death; he even changed his birthday to the day of the escape. He joined the Czechoslovak partisans and was decorated for bravery. But the price he paid was one of belonging: Vrba blamed the Hungarian Jewish leadership for not publicising the report, left Israel after about two years (1958–1960) because he was unwilling to live among some of those leaders, and moved to Britain and then to Canada. In Vancouver he built an academic career as a professor of pharmacology — and according to the Vancouver Holocaust Education Centre, \"the magnitude of his heroic actions during the Holocaust remained largely unrecognized in his adopted city.\" His memoir appeared in English in 1963 but in Hebrew only in 1998, and even then — according to Ruth Linn, who initiated the award — some Israeli scholars made a last-minute attempt to belittle him. The first institutional recognition was the honorary doctorate from the University of Haifa in June 1998, 54 years after the escape. Alfréd Wetzler, who died in 1988, received even less.", "honors": [{"note": "הוענק \"על בריחתו ההרואית מאושוויץ ועל תרומתו לחינוך על השואה\", ביוזמת פרופ' רות לין.", "what": "דוקטור לשם כבוד, אוניברסיטת חיפה", "when": "יוני 1998", "where": "חיפה, ישראל", "what_en": "Honorary doctorate, University of Haifa", "source_url": "https://www.theguardian.com/news/2006/apr/13/guardianobituaries.secondworldwar"}, {"note": "הוקמה בשיתוף מרכז השואה של ונקובר; יותר מ-200 איש נכחו בטקס. על האנדרטה נחקק \"The long-time Vancouverite we know as Rudi\".", "what": "אנדרטה לזכר רודולף ורבה בבית העלמין שרה צדק", "when": "נחשפה ב-26 באוקטובר 2025", "where": "ונקובר, קנדה", "what_en": "Monument to Rudolf Vrba at Schara Tzedeck Cemetery", "source_url": "https://www.vhec.org/vhec-and-community-erect-monument-to-honor-rudolf-vrbas-courage-and-legacy/"}, {"note": "צעדה בת שישה ימים ו-130 קילומטרים בעקבות מסלול הבריחה.", "what": "צעדת הזיכרון Vrba–Wetzler Memorial", "when": "מסורת שנתית מאז 2014", "where": "מאושוויץ-בירקנאו לז'ילינה, פולין-סלובקיה", "what_en": "The Vrba–Wetzler Memorial march", "source_url": "https://vrbawetzler.sk/"}], "summary_short": "ולטר רוזנברג, שיהיה לימים רודולף ורבה, הגיע לאושוויץ בגיל 18 והוצב ביחידה שמיינה את חפצי הנרצחים; במזוודות הוא מצא בגדים לכל העונות וכלי בית — היערכות תמימה של אנשים שהאמינו שהם נוסעים ליישוב מחדש במזרח. מסקנתו הייתה שמכונת הרצח כולה נשענת על אי-הידיעה הזאת. בתחילת 1944, כששמע אנשי SS מדברים על \"סלמי הונגרי\" — הסלנג שלהם למוצא המשלוח הבא, כשם שגבינה סימנה את הולנד וזיתים את יוון — הבין שההיערכות היא לכמעט 800,000 יהודי הונגריה, ושמעתה \"זו כבר לא שאלה של דיווח על פשע אלא של מניעתו\". ב-7 באפריל 1944 נדחק יחד עם אלפרד וצלר לחלל בערמת קורות בנייה בבירקנאו, כשמסביב פוזר טבק רוסי ספוג בנזין נגד כלבי הגישוש; שלושה לילות שכבו שם בזמן שחיפשו אותם, ואחר כך הלכו אחד-עשר לילות, כ-130 קילומטרים מעבר להרי הבסקידים, עד סלובקיה. בז'ילינה שחזרו מהזיכרון, בלי פיסת נייר אחת שיצאה מהמחנה, דוח בן כ-40 עמודים ובו תרשים המחנה, מבנה תאי הגזים והקרמטוריומים ורשימת המשלוחים לפי ארץ מוצא ומספר. הגירוש התרחש בכל זאת — כ-437,000 יהודים מהפריפריה ההונגרית — אבל אחרי שהדוח פורסם בעיתונות השווייצרית הורה העוצר הורטי להפסיקו, וכ-200,000 יהודי בודפשט לא גורשו במשלוחים ההם. ורבה עצמו לא חדל לשאול, עד יומו האחרון, אם אפשר היה להציל יותר.", "summary_short_en": "Walter Rosenberg, who would later be known as Rudolf Vrba, arrived at Auschwitz at 18 and was put to work in the detail that sorted the belongings of the murdered; in the suitcases he found clothes for every season and household utensils — the naive packing of people who believed they were going to be resettled in the east. He concluded that the whole killing machine rested on that ignorance. In early 1944, when he heard SS men speak of \"Hungarian salami\" — their slang for the origin of the next transport, just as cheese marked the Netherlands and olives Greece — he understood that the preparations were for nearly 800,000 Hungarian Jews, and that it was \"no longer a question of reporting a crime but of preventing one\". On 7 April 1944 he and Alfréd Wetzler squeezed into a hollow in a pile of construction lumber in Birkenau, with Russian tobacco soaked in petrol scattered around them to defeat the search dogs; they lay there three nights while the hunt went on around them, then walked eleven nights, some 130 kilometres over the Beskid mountains, into Slovakia. In Žilina they reconstructed from memory, without a single sheet of paper carried out of the camp, a report of some 40 pages: a plan of the camp, the structure of the gas chambers and crematoria, and a list of the transports by country of origin and number. The deportation happened anyway — about 437,000 Jews from the Hungarian countryside — but after the report was published in the Swiss press, Regent Horthy ordered it stopped, and some 200,000 Jews of Budapest were not deported in those transports. Vrba himself never stopped asking, to his last day, whether more could have been saved."}, "changed": ["title", "description", "source_label", "citations", "act", "ripple", "title_reasoning", "media_urls", "title_en", "description_en", "act_en", "ripple_en", "source_label_en", "location", "people", "deed_type", "actor_type", "beneficiary", "audit", "dedup", "origin_story", "origin_story_en", "aftermath", "aftermath_en", "recognition", "recognition_en", "honors", "summary_short", "summary_short_en"], "m_before": {"citations": 2, "domains": 2, "images": 3, "people": 0, "videos": 0, "location": 0, "honors": 0, "chars": 545, "std": 18}, "m_after": {"citations": 19, "domains": 10, "images": 7, "people": 7, "videos": 0, "location": 1, "honors": 3, "chars": 4642, "std": 46}, "std_total": 46, "failing": []}, {"id": "9cdfb538-73a8-4c98-b0f3-9c28ce1a5679", "title": "יד שרה משאילה ציוד רפואי בחינם — כמעט מיליון פריטים בשנת 2025", "year": 1976, "before": {"id": "9cdfb538-73a8-4c98-b0f3-9c28ce1a5679", "title": "יד שרה משאילה ציוד רפואי בחינם — כמעט מיליון פריטים בשנת 2025", "description": "יד שרה היא אגודת המתנדבים הגדולה בישראל, והיא משאילה בחינם ציוד רפואי ושיקומי לכל פונה כדי שחולים, נכים וקשישים יוכלו להישאר בבתיהם במקום להתאשפז במוסד. הכול התחיל בגמ\"ח קטן בביתו של הרב אורי לופוליאנסקי, מורה ירושלמי צעיר שהתקשה להשיג מכשיר אדים לתינוקו, קנה כמה מכשירים והחל להשאיל אותם לשכנים; ב-1976 הפך את היוזמה לעמותה ארצית וקרא לה על שם סבתו, שרה לופוליאנסקי, שנספתה בשואה. מאז גדלה יד שרה ל-127 סניפים הפרוסים מהצפון ועד הדרום, ופועלים בה כ-7,000 מתנדבים לצד כ-350 עובדים בשכר. לפי דיווח הארגון (סיכום פעילות 2025 באתר יד שרה, פורסם 7.1.2026, נשלף 9.8.2026) הושאלו במהלך 2025 לא פחות מ-932,980 פריטי ציוד רפואי — מכיסאות גלגלים ומיטות אשפוז ועד ציוד שיקומי מתקדם — ובאותה שנה טופלו גם 106,204 קריאות במוקד המצוקה שפועל מסביב לשעון. ב-2023 מסר הארגון לג'רוזלם פוסט שהוא מסייע לכ-1,250,000 בני אדם בשנה, נוגע באחת מכל שתי משפחות בישראל, ושפעילותו חוסכת לציבור כ-5.5 מיליארד שקל בשנה בהוצאות בריאות. ב-1994 הוענק ליד שרה פרס ישראל. מייסדה, הרב לופוליאנסקי, הלך לעולמו בינואר 2026 בגיל 74, וחמישים שנות המפעל שהקים ממשיכות לפעול.", "category": "חסד", "year": 1976, "media_type": "image", "media_url": "https://upload.wikimedia.org/wikipedia/commons/9/96/Yad_Sarah_House_medical_equipment_lending_center.jpg", "source_url": "https://www.jpost.com/israel-news/article-745636", "source_label": "ג'רוזלם פוסט — Medical equipment lending saves Israeli healthcare billions annually", "submitted_by": null, "status": "approved", "created_at": "2026-07-26 23:11:06.272063+00", "citations": [{"quote": "Yad Sarah said it offers assistance to an estimated 1,250,000 people every year, thanks to its 7,000 volunteers and it impacts the lives of one out of every two Israeli families.", "locator": "כתבה מאת Judy Siegel-Itzkovich, 8.6.2023, פסקה הפותחת ב-'Popularly known in Israel'. נשלף 9.8.2026", "locator_en": "Article by Judy Siegel-Itzkovich, 8 June 2023, the paragraph beginning 'Popularly known in Israel'. Retrieved 9 Aug 2026", "source_url": "https://www.jpost.com/israel-news/article-745636", "source_label": "ג'רוזלם פוסט — Medical equipment lending saves Israeli healthcare billions annually", "source_label_en": "The Jerusalem Post"}, {"quote": "Yad Sarah, Israel’s leading volunteer organization that lends medical equipment to all and provides a wide variety of other services to the sick, injured, elderly and disabled, said on Thursday that it saves taxpayers NIS 5.5 billion in personal healthcare expenses every year.", "locator": "פסקת הפתיחה של הכתבה, 8.6.2023. הנתון מיוחס מפורשות לארגון עצמו ('said'). נשלף 9.8.2026", "locator_en": "The article's opening paragraph, 8 June 2023. The figure is explicitly attributed to the organization itself ('said'). Retrieved 9 Aug 2026", "source_url": "https://www.jpost.com/israel-news/article-745636", "source_label": "ג'רוזלם פוסט — Medical equipment lending saves Israeli healthcare billions annually", "source_label_en": "The Jerusalem Post"}, {"quote": "על פי הנתונים, במהלך השנה הושאלו לציבור לא פחות מ־ 932,980 פריטי ציוד רפואי – מכיסאות גלגלים ומיטות אשפוז ועד ציוד שיקומי מתקדם.", "locator": "פוסט 'סיכום פעילות יד שרה לשנת 2025', פורסם 7.1.2026 באתר הארגון בעברית — דיווח עצמי. נשלף 9.8.2026. (הרווח שאחרי המקף במקור נשמר כפי שהוא)", "quote_en": "According to the data, during the year no fewer than 932,980 medical equipment items were lent to the public — from wheelchairs and hospital beds to advanced rehabilitation equipment.", "locator_en": "The post 'Summary of Yad Sarah's activity for 2025', published 7 Jan 2026 on the organization's Hebrew site — self-reported. Retrieved 9 Aug 2026. (The space after the dash in the original is preserved as-is.)", "source_url": "https://yad-sarah.net/posts/%D7%A1%D7%99%D7%9B%D7%95%D7%9D-%D7%A4%D7%A2%D7%99%D7%9C%D7%95%D7%AA-%D7%99%D7%93-%D7%A9%D7%A8%D7%94-%D7%9C%D7%A9%D7%A0%D7%AA-2025", "source_label": "אתר יד שרה — סיכום פעילות 2025 (דיווח עצמי)", "source_label_en": "Yad Sarah official site — 2025 activity summary (self-reported)"}, {"quote": "The nonprofit was named for Uri’s grandmother, Sarah Lupolianski, who had died in the Holocaust.", "locator": "כתבה מאת Sheila Wilensky, AJP Associate Editor, 5.4.2013, בסעיף 'How did it all begin?'. נשלף 9.8.2026", "locator_en": "Article by Sheila Wilensky, AJP Associate Editor, 5 Apr 2013, in the section 'How did it all begin?'. Retrieved 9 Aug 2026", "source_url": "https://azjewishpost.com/2013/israel-at-65-yad-sarah-provides-lifeline-to-elderly-disabled", "source_label": "AZ Jewish Post — Israel at 65: Yad Sarah provides lifeline to elderly, disabled", "source_label_en": "Arizona Jewish Post"}, {"quote": "Lupolianski founded Yad Sarah in response to difficulties he encountered when trying to borrow a humidifier for his infant son.", "locator": "הספד מאת Avi Solomon, ינואר 2026, בסעיף 'Lupolianski fined, did service; built Yad Sarah'. נשלף 9.8.2026", "locator_en": "Obituary by Avi Solomon, January 2026, in the section 'Lupolianski fined, did service; built Yad Sarah'. Retrieved 9 Aug 2026", "source_url": "https://www.jpost.com/israel-news/article-882696", "source_label": "ג'רוזלם פוסט — הספד הרב אורי לופוליאנסקי", "source_label_en": "The Jerusalem Post"}, {"quote": "Yad Sarah was awarded the Israel Prize in 1994.", "locator": "סיום ההספד, ינואר 2026. נשלף 9.8.2026", "locator_en": "The closing of the obituary, January 2026. Retrieved 9 Aug 2026", "source_url": "https://www.jpost.com/israel-news/article-882696", "source_label": "ג'רוזלם פוסט — הספד הרב אורי לופוליאנסקי", "source_label_en": "The Jerusalem Post"}, {"quote": "Rabbi Uri Lupolianski, who built Yad Sarah into Israel’s largest volunteer network and later served as Jerusalem’s first ultra-Orthodox mayor, died just after midnight Thursday in the capital. He was 74.", "locator": "פסקת הפתיחה, The Media Line Staff, 08.01.2026. נשלף 9.8.2026", "locator_en": "Opening paragraph, The Media Line Staff, 8 Jan 2026. Retrieved 9 Aug 2026", "source_url": "https://themedialine.org/headlines/rabbi-uri-lupolianski-founder-of-yad-sarah-and-jerusalems-first-ultra-orthodox-mayor-dies-at-74", "source_label": "The Media Line — הספד לופוליאנסקי", "source_label_en": "The Media Line"}, {"quote": "What started as an individual lending out a few nebulizers blossomed into an organization with 350 paid staff and 7,000 volunteers", "locator": "סעיף '7,000 Volunteers' בכתבה, 2023. נשלף 9.8.2026", "locator_en": "The '7,000 Volunteers' section of the article, 2023. Retrieved 9 Aug 2026", "source_url": "https://www.jewishexponent.com/yad-sarah-provides-medical-equipment-for-israelis-in-need", "source_label": "Philadelphia Jewish Exponent — Yad Sarah Provides Medical Equipment for Israelis in Need", "source_label_en": "Philadelphia Jewish Exponent"}, {"quote": "127 סניפי יד שרה פרוסים מהצפון ועד הדרום, ומנגישים את אביזרי הסיוע הרפואי המושאלים בחינם לכל פונה.", "locator": "בלוק 'ציוד רפואי / סניפי יד שרה' בעמוד הבית של אתר הארגון בעברית — דיווח עצמי. נשלף 9.8.2026", "quote_en": "127 Yad Sarah branches are spread from north to south, making free-loan medical aid equipment accessible to all who apply.", "locator_en": "The 'Medical equipment / Yad Sarah branches' block on the homepage of the organization's Hebrew site — self-reported. Retrieved 9 Aug 2026", "source_url": "https://yad-sarah.net", "source_label": "אתר יד שרה (דיווח עצמי)", "source_label_en": "Yad Sarah official site (self-reported)"}, {"quote": "Founded in 1976, Yad Sarah has 127 branches throughout Israel staffed by more than 7,000 volunteers.", "locator": "בלוק 'YAD SARAH' בעמוד הבית של האתר האנגלי הרשמי — דיווח עצמי. נשלף 9.8.2026", "locator_en": "The 'YAD SARAH' block on the homepage of the official English site — self-reported. Retrieved 9 Aug 2026", "source_url": "https://yadsarah.org/", "source_label": "אתר יד שרה באנגלית (דיווח עצמי)", "source_label_en": "Yad Sarah official site (self-reported)"}, {"quote": "The organization is named after his Polish grandmother, who perished in the Holocaust.", "locator": "הספד, ינואר 2026, פסקה על הקמת יד שרה. נשלף 9.8.2026", "locator_en": "Obituary, January 2026, the paragraph on the founding of Yad Sarah. Retrieved 9 Aug 2026", "source_url": "https://israel.com/jerusalem/uri-lupolianski-former-jerusalem-mayor-and-champion-of-volunteerism-dies", "source_label": "Israel.com — הספד לופוליאנסקי", "source_label_en": "Israel.com"}, {"quote": "It is best known for its free loans of over 244,000 pieces of medical and rehabilitative home-care equipment annually,", "locator": "פסקת הפתיחה. זהו הנתון ההיסטורי שמקורו במאמר aish.com מ-20.12.2003 — נשמר כעוגן היסטורי בלבד; נשלף 9.8.2026", "locator_en": "Opening paragraph. This is the historical figure, originating in an aish.com article of 20 Dec 2003 — kept as a historical anchor only. Retrieved 9 Aug 2026", "source_url": "https://en.wikipedia.org/wiki/Yad_Sarah", "source_label": "ויקיפדיה האנגלית — Yad Sarah", "source_label_en": "Wikipedia"}], "act": "השאלה בחינם של ציוד רפואי ושיקומי לכל פונה, ב-127 סניפים מהצפון ועד הדרום, כדי שאפשר יהיה להחלים ולחיות בבית ולא במוסד.", "ripple": "בשנת 2025 לבדה הושאלו 932,980 פריטי ציוד וטופלו 106,204 קריאות מצוקה; הארגון מדווח על סיוע לכ-1.25 מיליון בני אדם בשנה, על נגיעה באחת מכל שתי משפחות בישראל ועל חיסכון של כ-5.5 מיליארד שקל בשנה בהוצאות הבריאות של הציבור. ב-1994 הוענק לו פרס ישראל.", "title_reasoning": "מי: יד שרה. פועל-פעולה: משאילה ציוד רפואי. הפרט שמכה: 'בחינם' + 'כמעט מיליון פריטים'. הכותרת הקודמת נקבה ב-244 אלף פריטים — נתון שמקורו בכתבת aish.com מ-2003 דרך ויקיפדיה, כלומר בן יותר מעשרים שנה. סיכום הפעילות של הארגון עצמו לשנת 2025 (פורסם 7.1.2026) אומר מילה-במילה '932,980 פריטי ציוד רפואי', והכותרת של הארגון עצמו היא 'כמעט מיליון פריטי ציוד רפואי הושאלו השנה' — לכן 'כמעט מיליון' הוא ניסוח המקור ולא עיגול שלי. הוספתי 'בשנת 2025' כי מספר גדול חייב תאריך. 'בחינם' מגובה גם באתר הארגון ('המושאלים בחינם לכל פונה') וגם בעיתונות ('all for free', AZ Jewish Post). 11 מילים, הווה (פעילות מתמשכת), בלי קליקבייט.", "media_urls": ["https://upload.wikimedia.org/wikipedia/commons/9/96/Yad_Sarah_House_medical_equipment_lending_center.jpg", "https://upload.wikimedia.org/wikipedia/commons/5/56/Yad_Sarah_House%2C_Jerusalem.jpg", "https://upload.wikimedia.org/wikipedia/commons/6/60/Yad_Sarah_signpost.jpg"], "title_en": "Yad Sarah Lends Medical Equipment Free of Charge — Nearly a Million Items in 2025", "description_en": "Yad Sarah is Israel's largest volunteer organization. It lends medical and rehabilitative equipment free of charge to anyone who asks, so that the sick, the disabled and the elderly can stay in their own homes instead of being institutionalized. It began as a small free-loan service in the home of Rabbi Uri Lupolianski, a young Jerusalem teacher who struggled to obtain a vaporizer for his baby, bought a few more and started lending them to neighbors; in 1976 he turned the initiative into a nationwide non-profit and named it after his grandmother, Sarah Lupolianski, who perished in the Holocaust. Yad Sarah has since grown to 127 branches spread from the north of the country to the south, staffed by some 7,000 volunteers alongside roughly 350 paid employees. According to the organization's own reporting (its 2025 activity summary, published 7 Jan 2026, retrieved 9 Aug 2026), no fewer than 932,980 pieces of medical equipment were lent out during 2025 — from wheelchairs and hospital beds to advanced rehabilitation equipment — and 106,204 calls were handled that year by its round-the-clock emergency call center. In 2023 the organization told The Jerusalem Post that it assists an estimated 1,250,000 people a year, touches one in every two Israeli families, and saves the public some NIS 5.5 billion a year in healthcare costs. Yad Sarah was awarded the Israel Prize in 1994. Its founder, Rabbi Lupolianski, died in January 2026 at the age of 74, and the enterprise he built fifty years ago carries on.", "act_en": "Lending medical and rehabilitative equipment free of charge to anyone who asks, through 127 branches from the north of Israel to the south, so people can recover and live at home rather than in an institution.", "ripple_en": "In 2025 alone 932,980 items of equipment were lent out and 106,204 emergency calls were handled; the organization reports helping some 1.25 million people a year, touching one in every two Israeli families, and saving the public around NIS 5.5 billion a year in healthcare costs. It received the Israel Prize in 1994.", "source_label_en": "The Jerusalem Post", "categories": null, "location": null, "people": null, "deed_type": null, "actor_type": null, "beneficiary": null, "audit": null, "dedup": null}, "after": {"id": "9cdfb538-73a8-4c98-b0f3-9c28ce1a5679", "title": "יד שרה משאילה ציוד רפואי בחינם — כמעט מיליון פריטים בשנת 2025", "description": "יד שרה היא אגודת המתנדבים הגדולה בישראל, והיא משאילה בחינם ציוד רפואי ושיקומי לכל פונה כדי שחולים, נכים וקשישים יוכלו להישאר בבתיהם במקום להתאשפז במוסד. הכול התחיל בגמ\"ח קטן בביתו של הרב אורי לופוליאנסקי, מורה ירושלמי צעיר שהתקשה להשיג מכשיר אדים לתינוקו, קנה כמה מכשירים והחל להשאיל אותם לשכנים; ב-1976 הפך את היוזמה לעמותה ארצית וקרא לה על שם סבתו, שרה לופוליאנסקי, שנספתה בשואה. מאז גדלה יד שרה ל-127 סניפים הפרוסים מהצפון ועד הדרום, ופועלים בה כ-7,000 מתנדבים לצד כ-350 עובדים בשכר. לפי דיווח הארגון (סיכום פעילות 2025 באתר יד שרה, פורסם 7.1.2026, נשלף 9.8.2026) הושאלו במהלך 2025 לא פחות מ-932,980 פריטי ציוד רפואי — מכיסאות גלגלים ומיטות אשפוז ועד ציוד שיקומי מתקדם — ובאותה שנה טופלו גם 106,204 קריאות במוקד המצוקה שפועל מסביב לשעון. ב-2023 מסר הארגון לג'רוזלם פוסט שהוא מסייע לכ-1,250,000 בני אדם בשנה, נוגע באחת מכל שתי משפחות בישראל, ושפעילותו חוסכת לציבור כ-5.5 מיליארד שקל בשנה בהוצאות בריאות. ב-1994 הוענק ליד שרה פרס ישראל. מייסדה, הרב לופוליאנסקי, הלך לעולמו בינואר 2026 בגיל 74, וחמישים שנות המפעל שהקים ממשיכות לפעול.", "category": "חסד", "year": 1976, "media_type": "image", "media_url": "https://upload.wikimedia.org/wikipedia/commons/9/96/Yad_Sarah_House_medical_equipment_lending_center.jpg", "source_url": "https://www.jpost.com/israel-news/article-745636", "source_label": "ג'רוזלם פוסט — Medical equipment lending saves Israeli healthcare billions annually", "submitted_by": null, "status": "approved", "created_at": "2026-07-26 23:11:06.272063+00", "citations": [{"lang": "en", "quote": "Yad Sarah said it offers assistance to an estimated 1,250,000 people every year, thanks to its 7,000 volunteers and it impacts the lives of one out of every two Israeli families.", "locator": "כתבה מאת Judy Siegel-Itzkovich, 8.6.2023, פסקה הפותחת ב-'Popularly known in Israel'. נשלף 9.8.2026", "published": "2023-06-08", "locator_en": "Article by Judy Siegel-Itzkovich, 8 June 2023, the paragraph beginning 'Popularly known in Israel'. Retrieved 9 Aug 2026", "source_url": "https://www.jpost.com/israel-news/article-745636", "source_label": "ג'רוזלם פוסט — Medical equipment lending saves Israeli healthcare billions annually", "source_label_en": "The Jerusalem Post"}, {"lang": "en", "quote": "Yad Sarah, Israel’s leading volunteer organization that lends medical equipment to all and provides a wide variety of other services to the sick, injured, elderly and disabled, said on Thursday that it saves taxpayers NIS 5.5 billion in personal healthcare expenses every year.", "locator": "פסקת הפתיחה של הכתבה, 8.6.2023. הנתון מיוחס מפורשות לארגון עצמו ('said'). נשלף 9.8.2026", "published": "2023-06-08", "locator_en": "The article's opening paragraph, 8 June 2023. The fi arah is Israel's largest volunteer organization. It lends medical and rehabilitative equipment free of charge to anyone who asks, so that the sick, the disabled and the elderly can stay in their own homes instead of being institutionalized. It began as a small free-loan service in the home of Rabbi Uri Lupolianski, a young Jerusalem teacher who struggled to obtain a vaporizer for his baby, bought a few more and started lending them to neighbors; in 1976 he turned the initiative into a nationwide non-profit and named it after his grandmother, Sarah Lupolianski, who perished in the Holocaust. Yad Sarah has since grown to 127 branches spread from the north of the country to the south, staffed by some 7,000 volunteers alongside roughly 350 paid employees. According to the organization's own reporting (its 2025 activity summary, published 7 Jan 2026, retrieved 9 Aug 2026), no fewer than 932,980 pieces of medical equipment were lent out during 2025 — from wheelchairs and hospital beds to advanced rehabilitation equipment — and 106,204 calls were handled that year by its round-the-clock emergency call center. In 2023 the organization told The Jerusalem Post that it assists an estimated 1,250,000 people a year, touches one in every two Israeli families, and saves the public some NIS 5.5 billion a year in healthcare costs. Yad Sarah was awarded the Israel Prize in 1994. Its founder, Rabbi Lupolianski, died in January 2026 at the age of 74, and the enterprise he built fifty years ago carries on.", "act_en": "Lending medical and rehabilitative equipment free of charge to anyone who asks, through 127 branches from the north of Israel to the south, so people can recover and live at home rather than in an institution.", "ripple_en": "In 2025 alone 932,980 items of equipment were lent out and 106,204 emergency calls were handled; the organization reports helping some 1.25 million people a year, touching one in every two Israeli families, and saving the public around NIS 5.5 billio , "caption_he": "גרם המדרגות בבית יד שרה בירושלים"}, {"url": "https://upload.wikimedia.org/wikipedia/commons/6/60/Yad_Sarah_signpost.jpg", "credit": "Yoninah, CC BY-SA 3.0", "source": "Wikimedia Commons — File:Yad Sarah signpost.jpg", "shot_when": "2010-12-22", "caption_he": "תמרור הכוונה לסניף יד שרה בשכונת רמות פולין, ירושלים"}]}, "dedup": null, "origin_story": null, "origin_story_en": null, "aftermath": null, "aftermath_en": null, "recognition": null, "recognition_en": null, "honors": null, "summary_short": "הכול התחיל כשמורה ירושלמי צעיר, הרב אורי לופוליאנסקי, התקשה להשיג מכשיר אדים לתינוקו, קנה כמה מכשירים והחל להשאיל אותם לשכניו. ב-1976 הפך את הגמ״ח הקטן שבביתו לעמותה ארצית וקרא לה על שם סבתו, שרה לופוליאנסקי, שנספתה בשואה. היום יד שרה היא אגודת המתנדבים הגדולה בישראל, עם 127 סניפים מהצפון ועד הדרום, כ-7,000 מתנדבים וכ-350 עובדים בשכר. בשנת 2025 לבדה הושאלו בה 932,980 פריטי ציוד רפואי, מכיסאות גלגלים ומיטות אשפוז ועד ציוד שיקומי מתקדם, ומוקד המצוקה שלה, הפועל מסביב לשעון, טיפל ב-106,204 קריאות. הכול ניתן בחינם ולכל פונה, כדי שחולים, נכים וקשישים יוכלו להישאר בבתיהם במקום להתאשפז במוסד. ב-2023 מסר הארגון לג'רוזלם פוסט שהוא מסייע לכ-1,250,000 בני אדם בשנה, נוגע באחת מכל שתי משפחות בישראל וחוסך לציבור כ-5.5 מיליארד שקל בשנה בהוצאות בריאות, וב-1994 הוענק לו פרס ישראל. לופוליאנסקי הלך לעולמו בינואר 2026 בגיל 74, וחמישים שנות המפעל שהקים ממשיכות לפעול.", "summary_short_en": "It began when a young Jerusalem teacher, Rabbi Uri Lupolianski, struggled to obtain a vaporizer for his baby, bought a few more and started lending them to his neighbors. In 1976 he turned the small free-loan service in his home into a nationwide non-profit and named it after his grandmother, Sarah Lupolianski, who perished in the Holocaust. Today Yad Sarah is Israel's largest volunteer organization, with 127 branches from the north of the country to the south, some 7,000 volunteers and roughly 350 paid employees. In 2025 alone it lent out 932,980 pieces of medical equipment, from wheelchairs and hospital beds to advanced rehabilitation equipment, and its round-the-clock emergency call center handled 106,204 calls. All of it is given free of charge to anyone who asks, so that the sick, the disabled and the elderly can stay in their own homes instead of being institutionalized. In 2023 the organization told The Jerusalem Post that it assists some 1,250,000 people a year, touches one in every two Israeli families and saves the public around 5.5 billion shekels a year in healthcare costs, and in 1994 it was awarded the Israel Prize. Lupolianski died in January 2026 at the age of 74, and the enterprise he built fifty years ago carries on."}, "changed": ["citations", "media_urls", "location", "people", "deed_type", "actor_type", "beneficiary", "audit", "summary_short", "summary_short_en"], "m_before": {"citations": 12, "domains": 8, "images": 3, "people": 0, "videos": 0, "location": 0, "honors": 0, "chars": 1399, "std": 20}, "m_after": {"citations": 13, "domains": 8, "images": 8, "people": 2, "videos": 5, "location": 1, "honors": 0, "chars": 1399, "std": 34}, "std_total": 46, "failing": [36, 42, 43, 48, 49, 57, 62, 64, 65, 66, 67, 77]}, {"id": "a8f55761-7678-4400-bf6c-33976755cabc", "title": "יונאס סאלק ויתר על הפטנט לחיסון הפוליו", "year": 1955, "before": {"id": "a8f55761-7678-4400-bf6c-33976755cabc", "title": "יונאס סאלק ויתר על הפטנט לחיסון הפוליו", "description": "ד\"ר יונאס סאלק, רופא יהודי-אמריקאי, פיתח ב-1955 את החיסון הראשון נגד שיתוק ילדים (פוליו) ששיתק מאות אלפי ילדים בשנה. כששאלו אותו למי שייך הפטנט, ענה: \"לאנשים. אין פטנט. האם היית מפטנט את השמש?\". הוויתור הציל מיליונים והנגיש את החיסון לעולם כולו בחינם.", "category": "חסד", "year": 1955, "media_type": "image", "media_url": "", "source_url": "https://he.wikipedia.org/wiki/%D7%92%27%D7%95%D7%A0%D7%90%D7%A1_%D7%A1%D7%90%D7%9C%D7%A7", "source_label": "ויקיפדיה — ג'ונאס סאלק", "submitted_by": null, "status": "approved", "created_at": "2026-06-19 00:00:01+00", "citations": [], "act": "", "ripple": "", "title_reasoning": "", "media_urls": [], "title_en": "Jonas Salk Gave Up the Patent for the Polio Vaccine", "description_en": "Dr. Jonas Salk, a Jewish-American physician, developed in 1955 the first vaccine against polio — a disease that paralyzed hundreds of thousands of children every year. When asked who owned the patent, he replied: \"The people. There is no patent. Could you patent the sun?\" His decision to forgo the patent saved millions of lives and made the vaccine freely available to the entire world.", "act_en": null, "ripple_en": null, "source_label_en": "Wikipedia — Jonas Salk", "categories": null, "location": null, "people": null, "deed_type": null, "actor_type": null, "beneficiary": null, "audit": null, "dedup": null}, "after": {"id": "a8f55761-7678-4400-bf6c-33976755cabc", "title": "יונאס סאלק ויתר על הפטנט לחיסון הפוליו", "description": "ד\"ר יונאס סאלק, רופא יהודי-אמריקאי, פיתח ב-1955 את החיסון הראשון נגד שיתוק ילדים (פוליו) שהותיר בארצות הברית לבדה כ-58,000 חולים בשנה ערב החיסון, אלפי הרוגים ורבבות נכים. כששאלו אותו למי שייך הפטנט, ענה: \"לאנשים. אין פטנט. האם היית מפטנט את השמש?\". הוויתור הציל מיליונים והנגיש את החיסון לעולם כולו בחינם.", "category": "חסד", "year": 1955, "media_type": "image", "media_url": "", "source_url": "https://www.who.int/news-room/spotlight/history-of-vaccination/history-of-polio-vaccination", "source_label": "ארגון הבריאות העולמי — היסטוריה של החיסון לפוליו", "submitted_by": null, "status": "approved", "created_at": "2026-06-19 00:00:01+00", "citations": [{"lang": "en", "quote": "Six pharmaceutical companies were licensed to produce IPV, and Salk did not profit from sharing the formulation or production processes.", "locator": "סעיף 'The first polio vaccine' — הפסקה על נגישות שוויונית לחיסון", "published": "2022", "source_url": "https://www.who.int/news-room/spotlight/history-of-vaccination/history-of-polio-vaccination", "source_label": "ארגון הבריאות העולמי — היסטוריה של החיסון לפוליו"}, {"lang": "en", "quote": "In a 1955 interview, when asked who owned the patent for IPV, he replied: “Well, the people, I would say. There is no patent. Could you patent the sun?”", "locator": "סעיף 'The first polio vaccine' — המשפט האחרון לפני התמונה של אלברט סייבין", "published": "2022", "source_url": "https://www.who.int/news-room/spotlight/history-of-vaccination/history-of-polio-vaccination", "source_label": "ארגון הבריאות העולמי — היסטוריה של החיסון לפוליו"}, {"lang": "en", "quote": "Jonas Salk’s decision not to patent the vaccine—famously stating, “Could you patent the sun?”—ensured its widespread distribution.", "locator": "הפסקה על ההכרזה באן ארבור, 12 באפריל 1955", "published": "2025-04-11", "source_url": "https://www.salk.edu/news-release/the-day-polio-met-its-match-celebrating-70-years-of-the-salk-vaccine/", "source_label": "מכון סאלק למחקר ביולוגי — 70 שנה לחיסון סאלק"}, {"lang": "en", "quote": "The attorneys concluded that the vaccine didn’t meet the novelty requirements for a patent, and the application would fail.", "locator": "הפסקה על מסמכי הארכיון שחשפה ג'יין ס' סמית'", "published": "2014-04-14", "source_url": "https://slate.com/technology/2014/04/the-real-reasons-jonas-salk-didnt-patent-the-polio-vaccine.html", "source_label": "Slate — The real reasons Jonas Salk didn't patent the polio vaccine"}, {"lang": "en", "quote": "Within one year, the deaths attributed to polio declined by 50 per cent, and this downward trend continues to the present when polio has been totally eradicated in most of the world.", "locator": "פסקת המבוא, לפני רשימת המסמכים הארכיוניים", "published": "2019", "source_url": "https://www.eisenhowerlibrary.gov/research/online-documents/jonas-salk-and-polio-vaccine", "source_label": "ספריית הנשיא אייזנהאואר (NARA) — Jonas Salk and the Polio Vaccine"}, {"lang": "he", "quote": "בראיון הכנראה מפורסם ביותר שלו, כאשר נשאל על ידי העיתונאי המוכר והבכיר אדוארד מורו (Edward R. Murrow) \"למי שייך החיסון?\", ענה סאלק: \"ובכן, לאנשים, הייתי אומר. אין פטנט. אפשר לרשום פטנט על //commons.wikimedia.org/wiki/File:Jonas_Salk_Congressional_Gold_Medal.jpg", "shot_when": "1955"}, {"url": "https://upload.wikimedia.org/wikipedia/commons/1/13/Jonas_Salk_1988.jpg", "credit": "CDC Public Health Image Library, photo ID #7356", "source": "https://commons.wikimedia.org/wiki/File:Jonas_Salk_1988.jpg", "shot_when": "1988"}]}, "dedup": null, "origin_story": null, "origin_story_en": null, "aftermath": null, "aftermath_en": null, "recognition": null, "recognition_en": null, "honors": null, "summary_short": "באפריל 1955 הוכרז באן ארבור שבמישיגן כי החיסון הראשון נגד שיתוק ילדים, שפיתח הרופא היהודי-אמריקאי יונאס סאלק, בטוח ויעיל. כששאל אותו העיתונאי אדוארד מורו למי שייך הפטנט, ענה סאלק: “ובכן, לאנשים, הייתי אומר. אין פטנט. אפשר לרשום פטנט על השמש?” שש חברות תרופות קיבלו רישיון לייצר את החיסון, וסאלק לא הרוויח דבר משיתוף הנוסחה ותהליכי הייצור. ערב החיסון נרשמו בארצות הברית לבדה כ-58,000 חולי פוליו בשנה, אלפי הרוגים ורבבות נכים; בתוך שנה אחת ירדו מקרי המוות מפוליו בכ-50 אחוזים, ועד 1957 צנח מספר המקרים השנתי בארצות הברית לכ-5,600. מאוחר יותר נחשף שגם עורכי הדין של הקרן הלאומית לשיתוק ילדים סברו שהחיסון אינו עומד בדרישת החדשנות לפטנט, אך סאלק עצמו סירב להפוך אותו לקניין פרטי, והחיסון הונגש לעולם כולו בחינם.", "summary_short_en": "In April 1955, Ann Arbor, Michigan, announced that the first vaccine against polio, developed by the Jewish-American physician Jonas Salk, was safe and effective. When the journalist Edward Murrow asked him who owned the patent, Salk answered: “Well, the people, I would say. There is no patent. Could you patent the sun?” Six pharmaceutical companies were licensed to produce the vaccine, and Salk made nothing from sharing the formulation and the production processes. Before the vaccine the United States alone recorded some 58,000 polio cases a year, thousands of deaths and tens of thousands left disabled; within a single year deaths from polio fell by about 50 percent, and by 1957 the annual number of cases in the United States had dropped to roughly 5,600. It later emerged that lawyers for the National Foundation for Infantile Paralysis had also concluded that the vaccine would not meet the novelty requirement for a patent, but Salk himself refused to make it private property, and the vaccine reached the whole world free of charge."}, "changed": ["description", "source_url", "source_label", "citations", "act", "ripple", "media_urls", "act_en", "ripple_en", "location", "people", "deed_type", "actor_type", "beneficiary", "audit", "summary_short", "summary_short_en"], "m_before": {"citations": 0, "domains": 0, "images": 0, "people": 0, "videos": 0, "location": 0, "honors": 0, "chars": 251, "std": 12}, "m_after": {"citations": 7, "domains": 5, "images": 9, "people": 2, "videos": 2, "location": 1, "honors": 0, "chars": 902, "std": 32}, "std_total": 46, "failing": [36, 42, 43, 44, 48, 49, 57, 62, 64, 65, 66, 67, 75, 77]}, {"id": "c1848f94-e0cd-4c00-8df7-e5ea1db698ba", "title": "סלמן וקסמן זוכה בנובל על הסטרפטומיצין — האנטיביוטיקה הראשונה שריפאה שחפת", "year": 1952, "before": {"id": "c1848f94-e0cd-4c00-8df7-e5ea1db698ba", "title": "סלמן וקסמן זוכה בנובל על הסטרפטומיצין — האנטיביוטיקה הראשונה שריפאה שחפת", "description": "הביוכימאי היהודי-אמריקאי סלמן וקסמן (1888–1973) הוביל את המחקר שהביא לגילוי הסטרפטומיצין, האנטיביוטיקה הראשונה שריפאה את מחלת השחפת שהרגה מיליונים. על תרומתו זו הוענק לו ב-1952 פרס נובל לרפואה.", "category": "תרומה לעולם", "year": 1952, "media_type": "image", "media_url": "https://upload.wikimedia.org/wikipedia/commons/3/33/Selman_Waksman_NYWTS.jpg", "source_url": "https://en.wikipedia.org/wiki/Selman_Waksman", "source_label": "ויקיפדיה — Selman Waksman", "submitted_by": null, "status": "approved", "created_at": "2026-06-24 23:08:27.676546+00", "citations": [{"quote": "Streptomycin was the first effective drug against gram-negative bacteria and the first antibiotic used to cure tuberculosis.", "source_url": "https://en.wikipedia.org/wiki/Selman_Waksman", "source_label": "ויקיפדיה — Selman
