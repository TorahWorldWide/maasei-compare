: "https://www.technion.ac.il/blog/2011/10/%d7%a4%d7%a8%d7%95%d7%a4%d7%a1%d7%95%d7%a8-%d7%9e%d7%97%d7%a7%d7%a8-%d7%93%d7%9f-%d7%a9%d7%9b%d7%98%d7%9e%d7%9f-%d7%9e%d7%94%d7%98%d7%9b%d7%a0%d7%99%d7%95%d7%9f-%d7%97%d7%aa%d7%9f-%d7%a4/"}, {"fact": "שכטמן היה לבדו במעבדה בזמן הניסוי המכריע", "source": "https://www.academy.ac.il/SystemFiles/21510.pdf"}, {"fact": "המחברים המלאים של מאמר 1984: שכטמן, בלך, גרסייה, קאהן", "source": "https://www.academy.ac.il/SystemFiles/21510.pdf"}, {"fact": "מ-2004 גם פרופסור למדע החומרים באוניברסיטת איווה", "source": "https://www.nist.gov/nist-and-nobel/dan-shechtman/prizes-legacy-dan-shechtman"}, {"fact": "הערכת הקהילה ביום ההכרזה: \"הוא הצית מהפכה מדעית\" (פט תיאל)", "source": "https://archive.inside.iastate.edu/2011/1006/nobel.php"}], "spinoff_leads": ["ג'ון קאהן (1928–2016) — מדען NBS/NIST, בעל משוואת קאהן-הילירד; סירב תחילה לממצא של שכטמן ואז נעשה תומכו. מעש נפרד בפני עצמו (nist.gov).", "דב לוין ופול שטיינהרדט — טבעו את המונח \"quasicrystal\" והעמידו את המסגרת התיאורטית בסוף 1984, לוין מהטכניון (physicstoday.aip.org, nist.gov).", "אן-פאנג צאי — גילוי הפאזה האיקוסהדרלית היציבה תרמודינמית ב-1987, שהוא נקודת המפנה בקבלת התחום (physicstoday.aip.org).", "שכטמן כמורה ליזמות: NIST מציין את פעילותו בקידום יזמות טכנולוגית בישראל — ליד לבדיקה עתידית מול מקורות ייעודיים (nist.gov)."], "domains_covered": ["academy.ac.il", "acs.org", "aip.org", "iastate.edu", "nature.com", "nist.gov", "nobelprize.org", "npr.org", "technion.ac.il"], "image_provenance": [{"url": "https://www.nist.gov/sites/default/files/images/2017/03/18/shechtman_notebook.jpg", "year": "1982", "group": "8 באפריל 1982 — הראיה עצמה", "group_en": "8 April 1982 — the evidence itself", "caption_en": "A page from Dan Shechtman's lab notebook at NBS (today NIST), recording the first observation of a crystal with tenfold symmetry. Against exposure 1725 he wrote three words and three question marks: \"10 Fold ???\".", "caption_he": "עמוד יומן המעבדה של דן שכטמן ב-NBS (היום NIST), שבו תועדה התצפית הראשונה בגביש בעל סימטריה של פי עשרה. בחשיפה מספר 1725 רשם שכטמן שלוש מילים וסימני שאלה: \"10 Fold ???\".", "source_url": "https://www.nist.gov/nist-and-nobel/dan-shechtman/nobel-moment-dan-shechtman", "credit_line": "Credit: Dan Shechtman", "photographer": "Dan Shechtman", "published_in": "NIST — The Nobel Moment: Dan Shechtman"}, {"url": "https://www.nist.gov/sites/default/files/images/2017/03/18/the_first_view_of_the_icosohedral_phase.jpg", "year": "1982", "group": "8 באפריל 1982 — הראיה עצמה", "group_en": "8 April 1982 — the evidence itself", "caption_en": "The first view of a crystal with icosahedral symmetry, produced by Shechtman: groups of atoms at the corners of a 20-sided icosahedron, joined in space by \"matching rules\" that require the sides to fit together. The alloy in question was aluminium and manganese.", "caption_he": "המראה הראשון של גביש בעל סימטריה איקוסהדרלית, כפי שהפיק אותו שכטמן: קבוצות אטומים בפינות של איקוסהדרון בן 20 פאות, מחוברות במרחב לפי \"כללי התאמה\" המחייבים את הפאות להשתלב זו בזו. הסגסוגת שנבדקה הייתה אלומיניום ומנגן.", "source_url": "https://www.nist.gov/nist-and-nobel/dan-shechtman/nobel-moment-dan-shechtman", "credit_line": "Credit: Dan Shechtman", "photographer": "Dan Shechtman", "published_in": "NIST — The Nobel Moment: Dan Shechtman"}, {"url": "https://www.nist.gov/sites/default/files/images/2019/07/02/shechtman_quasicrystals_hr.jpg", "year": "1985", "group": "האנשים במעבדה", "group_en": "The people in the laboratory", "caption_en": "NIST, 1985: Shechtman (left) discusses the atomic structure of quasicrystals with colleagues — left to right — Frank Biancaniello, Denis Gratias, John Cahn, Leonid Bendersky and Robert Schaefer. Biancaniello produced the alloy in which the discovery was made; Gratias and Cahn were co-authors of the 1984 paper.", "caption_he": "NIST, 1985: שכטמן (משמאל) דן במבנה האטומי של הגבישים הקוואזי-מחזוריים עם עמיתיו — משמאל לימין — פרנק ביאנקנילו, דני גרסייה, ג'ון קאהן, ליאוניד בנדרסקי ורוברט שפר. ביאנקנילו הוא שייצר את הסגסוגת שבה נעשה הגילוי; גרסייה וקאהן היו שותפים למאמר ב-1984.", "source_url": "https://www.nist.gov/nist-and-nobel/dan-shechtman/nobel-moment-dan-shechtman", "credit_line": "Credit: H. Mark Helfer/NIST", "photographer": "H. Mark Helfer", "published_in": "NIST — The Nobel Moment: Dan Shechtman"}, {"url": "https://www.nist.gov/sites/default/files/images/2017/04/03/john_cahn_dan_shechtman_and_denis_gratias.jpg", "year": "שנות ה-80", "group": "האנשים במעבדה", "group_en": "The people in the laboratory", "caption_en": "John Cahn, Dan Shechtman and Denis Gratias at NIST in the 1980s. Cahn, who hosted Shechtman, at first rejected the finding (\"Go away, Danny. These are twins\") and later became his supporter and co-author.", "caption_he": "ג'ון קאהן, דן שכטמן ודני גרסייה ב-NIST בשנות השמונים. קאהן, שאירח את שכטמן, דחה את הממצא בתחילה (\"לך מכאן, דני. אלה תאומים\") ולימים נעשה לתומכו ולשותפו למאמר.", "source_url": "https://www.nist.gov/nist-and-nobel/dan-shechtman/context-discovery-dan-shechtman", "credit_line": "Credit: NIST", "photographer": "NIST", "published_in": "NIST — Context of a Discovery: Dan Shechtman"}, {"url": "https://www.nist.gov/sites/default/files/images/2019/07/30/dsc_0831_schechtman.jpg", "year": "לא צוין בעמוד; פורסם ב-2019", "group": "האנשים במעבדה", "group_en": "The people in the laboratory", "caption_en": "Shechtman alongside one of his key research tools, the transmission electron microscope — the type of instrument through which the 1982 observation was made.", "caption_he": "שכטמן לצד אחד מכלי המחקר המרכזיים שלו — המיקרוסקופ האלקטרוני החודר. זהו סוג המכשיר שדרכו נעשתה התצפית ב-1982.", "source_url": "https://www.nist.gov/nist-and-nobel/dan-shechtman/person-behind-nobel-prize-dan-shechtman", "credit_line": "Credit: Photo by Bob Elbert / Iowa State University", "photographer": "Bob Elbert", "published_in": "NIST — The Person behind the Nobel Prize: Dan Shechtman"}, {"url": "https://www.nist.gov/sites/default/files/images/2017/03/18/quasicrystal1.jpg", "year": "לא צוין בעמוד; פורסם ב-2017", "group": "מה זה גביש קוואזי-מחזורי", "group_en": "What a quasicrystal is", "caption_en": "Atomic model of an aluminium-palladium-manganese quasicrystal surface. The phase Shechtman discovered in 1982 was metastable; stable phases such as this one were found only later.", "caption_he": "מודל אטומי של פני שטח של גביש קוואזי-מחזורי מאלומיניום-פלדיום-מנגן. הפאזה שגילה שכטמן ב-1982 הייתה מטא-יציבה; פאזות יציבות כמו זו התגלו רק מאוחר יותר.", "source_url": "https://www.nist.gov/nist-and-nobel/dan-shechtman/prizes-legacy-dan-shechtman", "credit_line": "Credit: J.W. Evans, The Ames Laboratory, US Department of Energy", "photographer": "J.W. Evans", "published_in": "NIST — The Prize's Legacy: Dan Shechtman"}, {"url": "https://www.nobelprize.org/uploads/2022/04/fig1-fig2-popular-chemistryprize2011.jpg", "year": "2011", "group": "מה זה גביש קוואזי-מחזורי", "group_en": "What a quasicrystal is", "caption_en": "Figure 1: Shechtman's diffraction pattern was tenfold — turning it a tenth of a full circle (36 degrees) gives the same pattern. Figure 2: light passing through a diffraction grating is scattered, and the resulting waves interfere to give a diffraction pattern.", "caption_he": "איור 1: תבנית העקיפה של שכטמן הייתה בעלת סימטריה של פי עשרה — סיבוב של עשירית מעגל (36 מעלות) מחזיר את אותה תבנית בדיוק. איור 2: אור שעובר דרך סורג עקיפה מתפזר, והגלים הנוצרים מתאבכים זה בזה ויוצרים את תבנית העקיפה.", "source_url": "https://www.nobelprize.org/prizes/chemistry/2011/popular-information/", "credit_line": "© Johan Jarnestad/The Royal Swedish Academy of Sciences", "photographer": "Johan Jarnestad", "published_in": "Popular information, The Nobel Committee for Chemistry 2011"}, {"url": "https://www.nobelprize.org/uploads/2022/04/fig3-popular-chemistryprize2011.jpg", "year": "2011", "group": "מה זה גביש קוואזי-מחזורי", "group_en": "What a quasicrystal is", "caption_en": "Figure 3: different kinds of symmetry in crystals. The pattern inside the crystal with fivefold symmetry will never repeat itself — precisely why the textbooks forbade it.", "caption_he": "איור 3: סוגי סימטריה שונים בגבישים. התבנית שבתוך הגביש בעל סימטריה של פי חמישה לעולם לא תחזור על עצמה — וזו בדיוק הסיבה שספרי הקריסטלוגרפיה אסרו אותה.", "source_url": "https://www.nobelprize.org/prizes/chemistry/2011/popular-information/", "credit_line": "© Johan Jarnestad/The Royal Swedish Academy of Sciences", "photographer": "Johan Jarnestad", "published_in": "Popular information, The Nobel Committee for Chemistry 2011"}, {"url": "https://www.nobelprize.org/images/shechtman-15174-portrait-medium.jpg", "year": "2011", "group": "נובל 2011", "group_en": "Nobel 2011", "caption_en": "The official portrait of Dan Shechtman as the 2011 Nobel Laureate in Chemistry. Prize share: 1/1 — he received it alone, 29 years after the observation.", "caption_he": "הדיוקן הרשמי של דן שכטמן כזוכה פרס נובל לכימיה 2011. חלקו בפרס: 1/1 — הוא קיבל אותו לבדו, 29 שנים אחרי התצפית.", "source_url": "https://www.nobelprize.org/prizes/chemistry/2011/shechtman/facts/", "credit_line": "© The Nobel Foundation. Photo: U. Montan", "photographer": "U. Montan", "published_in": "Dan Shechtman – Facts, NobelPrize.org"}, {"url": "https://www.nobelprize.org/images/shechtman-15174-landscape-medium.jpg", "year": "2011", "group": "נובל 2011", "group_en": "Nobel 2011", "caption_en": "The same official photograph of Shechtman in landscape format, as it appears at the head of the laureate pages on the Nobel Foundation site.", "caption_he": "אותו צילום רשמי של שכטמן בפריסה לרוחב, כפי שהוא מופיע בראש עמודי הזוכה באתר קרן נובל.", "source_url": "https://www.nobelprize.org/prizes/chemistry/2011/shechtman/facts/", "credit_line": "© The Nobel Foundation. Photo: U. Montan", "photographer": "U. Montan", "published_in": "Dan Shechtman – Facts, NobelPrize.org"}], "lead_image_basis": "contemporary_artifact"}, "dedup": {"note": "נסרקה רשימת הרישום המלאה. ההתאמה המלאה היחידה היא השורה הקיימת של המעש הזה עצמו, והיא זו שנבנית כאן מחדש — אין שורה שנייה למזג. ההתאמות החלקיות נקראו לעומק (כלל 80): צ'חנובר-הרשקו הוא נובל לכימיה מהטכניון אך בביוכימיה של החלבון; ורשל-לויט וקון הם כימיה חישובית ותיאוריה, לא תצפית ניסויית; נאמן ובקנשטיין הם פיזיקה תיאורטית. פרוזינר הוא הקרוב ביותר במבנה הסיפור — גילוי שנחשב לכפירה — אך הוא ביולוגיה, אדם אחר ומעש אחר, ואינו כפילות. אין מיזוג ואין מחיקה.", "merged_from": [], "is_duplicate": false, "checked_against": ["דן שכטמן גילה קריסטלים שנחשבו בלתי אפשריים — ושינה את תפיסת מדע החומרים (הרשומה הזו עצמה)", "צ'חנובר והרשקו מהטכניון גילו את מנגנון פירוק החלבונים בתא — וזכו בפרס נובל", "אריה ורשל ומייקל לויט זכו בנובל לכימיה על מודלים ממוחשבים למולקולות", "וולטר קון פיתח את תורת פונקציונל הצפיפות המשמשת מדעני חומרים בעולם", "יובל נאמן מסווג את חלקיקי היסוד בשיטת השמיניות — קצין צה\"ל שנעשה פיזיקאי", "יעקב בקנשטיין — הפיזיקאי שגילה ראשון שלחורים שחורים יש אנטרופיה", "סטנלי פרוזינר מגלה את הפריונים אף שרעיונו נחשב לכפירה מדעית", "פרנסואה אנגלר, שהסתתר כילד יהודי בשואה, ניבא את מנגנון היגס וזכה בנובל לפיזיקה"]}, "origin_story": "שכטמן הגיע לארצות הברית ב-1981. רשמית המינוי שלו היה באוניברסיטת ג'ונס הופקינס שבבולטימור, אבל בפועל אירח אותו ג'ון קאהן והוא עבד בקמפוס NBS בגייתרסברג, מרילנד. המחקר מומן על ידי DARPA, סוכנות המחקר המתקדם של משרד ההגנה האמריקאי, ונועד לפתח סגסוגות של אלומיניום עם מתכות מעבר עבור תעופה וחלל. \"DARPA רצתה שאפתח סגסוגות שימושיות, וכך עשיתי\", אמר שכטמן, \"אבל הכנתי גם סגסוגות שלא היו שימושיות — אבל היו מעניינות\". התצפית שנכנסה להיסטוריה נעשתה באחת מהאחרונות.\n\nב-8 באפריל 1982 בדק שכטמן סגסוגת של 86 אחוזי אטומי אלומיניום ו-14 אחוזי אטומי מנגן, שפרנק ביאנקנילו מהמעבדה של ויליאם בוטינגר ייצר בשיטת התכה וקירור-בזק (melt spinning). תבנית העקיפה שהתקבלה נראתה כבעלת סימטריית סיבוב של פי עשרה: עשירית מסיבוב מלא, 36 מעלות, ואותה תבנית בדיוק חוזרת. \"אני זוכר שספרתי את פסגות העקיפה עם כיוון השעון, אחת-אחת עד עשר, וחשבתי שזה לא ייתכן\", סיפר. \"אז ספרתי בכיוון ההפוך, נגד כיוון השעון. עדיין עשר!\". ביומן המעבדה, ליד חשיפה מספר 1725, הוא רשם: \"10 Fold ???\". לעצמו אמר בעברית שלוש מילים שוועדת נובל טרחה לתעתק בהודעתה: \"אין חיה כזו\".\n\nמאחורי הסימטריה של פי עשרה עמד ציר של פי חמישה, וציר כזה אסור בגביש מחזורי — זו הייתה אקסיומה של קריסטלוגרפיה, לא סברה. ההסבר המקובל לתבניות חריגות כאלה היה תיאום גבישים (twinning): כמה גבישים רגילים שנצמדו זה לזה בזוויות שיוצרות אשליה של סימטריה אסורה. שכטמן לא הסתפק בכך. עוד באותו יום הפיק סדרת תמונות שדה-אפל וביצע ניסוי אלומה מתכנסת, ואלה הראו שהסימטריה האיקוסהדרלית אינה תוצאה של תיאום אלא קיימת בקנה המידה האטומי עצמו. \"עד סוף אותו יום ידעתי שיש בידי משהו מיוחד\", אמר. \"לא ידעתי מה זה, אבל ידעתי מה זה לא. וזה לא היה תיאום\".\n\nכשהביא את התוצאות לקאהן, האיש שאירח אותו, קיבל דחייה. \"התגובה הראשונה שלי הייתה: 'לך מכאן, דני. אלה תאומים וזה לא מעניין במיוחד'\", נזכר קאהן לימים. לפי איגרת האקדמיה הלאומית הישראלית למדעים, בזמן הניסוי המכריע שלו היה שכטמן לבדו במעבדה — וכך גם נשאר בשנים שאחריו.", "origin_story_en": "Shechtman came to the United States in 1981. His appointment was technically at Johns Hopkins University in Baltimore, but in practice he was hosted by John Cahn and worked at the NBS campus in Gaithersburg, Maryland. The study was sponsored by DARPA, the US Defense Advanced Research Projects Agency, and was designed to develop aluminium–transition metal alloys for aerospace applications. \"DARPA wanted me to develop useful alloys, and I did,\" Shechtman said, \"but I also prepared alloys that were not useful, but were interesting.\" The observation that entered history was made in one of the latter.\n\nOn 8 April 1982 Shechtman was studying an alloy of 86 percent aluminium atoms and 14 percent manganese atoms, produced by Frank Biancaniello of William Boettinger's lab using melt spinning. The diffraction pattern appeared to have tenfold rotational symmetry: a tenth of a full circle, 36 degrees, and the identical pattern returns. \"I remember counting the diffraction peaks clockwise, one by one up to 10, and thinking that it couldn't be,\" he recalled. \"So I counted the other way, counterclockwise. Still 10!\" In the notebook, against exposure 1725, he wrote: \"10 Fold ???\". To himself he said three words in Hebrew that the Nobel Committee took the trouble to transliterate in its announcement: \"Eyn chaya kazo\" — there can be no such creature.\n\nBehind the tenfold symmetry stood a fivefold axis, and such an axis is forbidden in a periodic crystal — this was an axiom of crystallography, not an opinion. The accepted explanation for such anomalous patterns was twinning: ordinary crystals joined at angles that create the illusion of a forbidden symmetry. Shechtman did not stop there. That same day he generated a series of dark-field images and performed a convergent-beam experiment, and these showed that the icosahedral symmetry was not due to twinning but was present on the atomic scale itself. \"By the end of that day, I knew that I had something special,\" he said. \"I did not know what it was, but I knew what it was not. And it was not twinning.\"\n\nWhen he took the results to Cahn, the man hosting him, he was rebuffed. \"My initial reaction was, 'Go away, Danny. These are twins and that's not terribly interesting,'\" Cahn later recalled. According to the Bulletin of the Israel Academy of Sciences and Humanities, during his decisive experiment Shechtman was alone in the laboratory — and alone he largely remained in the years that followed.", "aftermath": "הדרך מהתצפית לפרסום ארכה שנתיים וחצי. בקיץ 1984 השיבו עורכי Journal of Applied Physics את כתב היד עם נימוק שנעשה מפורסם: \"המאמר לא יעניין פיסיקאים. אנו ממליצים לשלוח אותו לעיתון של מטלורגים (חוקרי מתכות)\". המאמר — של שכטמן, אילן בלך, דני גרסייה וג'ון קאהן — פורסם לבסוף ב-Physical Review Letters ב-12 בנובמבר 1984, כרך 53, עמודים 1951–1953. זמן קצר אחר כך, בערב חג המולד, פורסם באותו כתב עת מאמרם של פול שטיינהרדט ודב לוין שהעמיד את הממצא בהקשר תיאורטי רחב — Physics Today כותב שישה שבועות, NIST כותב חמישה.\n\nההתנגדות לא הייתה אקדמית בלבד. \"במשך זמן רב זה היה אני מול העולם. הייתי מושא ללעג ולהרצאות על יסודות הקריסטלוגרפיה\", סיפר שכטמן. לפי Chemical & Engineering News, כשהחל להציג את ממצאיו בכנסים הושיטו לו עמיתים ספרי לימוד ואמרו שאם ילמד אותם יבין שטענותיו בלתי אפשריות. \"אמרתי לכל מי שהיה מוכן להקשיב שיש לי חומר עם סימטריה מחומשת. אנשים פשוט צחקו עליי\". בסופו של דבר ביקש ממנו ראש הקבוצה לעזוב.\n\nהמתנגד הבולט האחרון היה לינוס פאולינג, חתן פרס נובל כפול. באוקטובר 1985 פרסם ב-Nature מכתב שכותרתו \"הסימטריה האיקוסהדרלית לכאורה נובעת מתיאום מכוון של גבישים קוביים\", ובו כתב: \"התקשיתי להאמין שגביש יחיד בעל צירי פי-חמישה יכול לתת תבניות עקיפה חדות למדי, הדומות לאלה שנותנים גבישים, ולא שוכנעתי אחרת על ידי הדיונים התיאורטיים בעניין שפורסמו\". פאולינג נודע גם באמירה החריפה יותר: \"אין גבישים קוואזי-מחזוריים, יש רק מדענים קוואזי\". הוא מת ב-1994 בלי שקיבל אי פעם את הגילוי, ולפי איגרת האקדמיה הלאומית הישראלית למדעים היה לחסידיו קל יותר לקבל את רעיונו של שכטמן אחרי מותו.\n\nהמפנה המדעי הגיע ב-1987, כשאן-פאנג צאי מאוניברסיטת טוהוקו שביפן ועמיתיו גילו פאזה איקוסהדרלית יציבה תרמודינמית — כלומר חומר שאינו מתפרק בחימום, שאפשר לגדל ממנו גבישים גדולים ולחקור אותם בנחת. אחריו הגיע השינוי המוסדי: ועדה של האיגוד הבינלאומי לקריסטלוגרפיה הגישה דין וחשבון ובו הגדרה חדשה — \"בגביש אנו מתכוונים לכל מוצק בעל דיאגרמת עקיפה בדידה במהותה, ובגביש א-מחזורי אנו מתכוונים לכל גביש שבו אפשר לראות את המחזוריות הסריגית התלת-ממדית כנעדרת\". NIST מתארך את הדוח ל-1991; ועדת נובל כותבת שההגדרה שונתה ב-1992. בכל מקרה, בתוך עשור הפכה התצפית שנחשבה בלתי אפשרית לחלק מהגדרת היסוד של התחום. פרס נובל הגיע רק ב-2011, 29 שנים אחרי הבוקר ההוא.", "aftermath_en": "The road from observation to publication took two and a half years. In the summer of 1984 the editors of the Journal of Applied Physics returned the manuscript with a reason that became famous: \"The paper will not interest physicists. We recommend sending it to a metallurgists' journal.\" The paper — by Shechtman, Ilan Blech, Denis Gratias and John Cahn — was finally published in Physical Review Letters on 12 November 1984, volume 53, pages 1951–1953. Shortly afterwards, on Christmas Eve, the same journal carried the paper of Paul Steinhardt and Dov Levine placing the finding in a broad theoretical context — Physics Today says six weeks later, NIST says five.\n\nThe opposition was not merely academic. \"For a long time, it was me against the world. I was a subject of ridicule and lectures about the basics of crystallography,\" Shechtman said. According to Chemical & Engineering News, when he began reporting his findings at meetings, colleagues handed him textbooks and told him that if he studied them he would realise his claims were impossible. \"I told everyone who was ready to listen that I had material with pentagonal symmetry. People just laughed at me.\" In the end the head of his group asked him to leave.\n\nThe last prominent opponent was Linus Pauling, a double Nobel laureate. In October 1985 he published a letter in Nature titled \"Apparent icosahedral symmetry is due to directed multiple twinning of cubic crystals,\" writing: \"I have found it hard to believe that any single crystal with 5-fold axes could give reasonably sharp diffraction patterns, resembling those given by crystals, and I have not been convinced to the contrary by the theoretical discussions of this possibility that have been published.\" Pauling was also known for a sharper line: \"There are no quasicrystals, only quasi-scientists.\" He died in 1994 having never accepted quasicrystals, and according to the Bulletin of the Israel Academy of Sciences and Humanities his followers found it easier to accept Shechtman's idea after his death.\n\nThe scientific turning point came in 1987, when An-Pang Tsai of Tohoku University in Japan and colleagues discovered a thermodynamically stable icosahedral phase — a material that does not decompose on heating, from which large crystals can be grown and studied at leisure. Then came the institutional change: a committee of the International Union of Crystallography presented a report with a new definition — \"By crystal we mean any solid having an essentially discrete diffraction diagram, and by aperiodic crystal we mean any crystal in which three-dimensional lattice periodicity can be considered to be absent.\" NIST dates the report to 1991; the Nobel Committee writes that the definition was altered in 1992. Either way, within a decade the observation that had been deemed impossible became part of the field's founding definition. The Nobel Prize came only in 2011, 29 years after that morning.", "recognition": "שכטמן קיבל את פרס נובל לכימיה 2011 לבדו. חלקו בפרס רשום באתר קרן נובל כ-1/1, והנימוק הוא ארבע מילים: \"על גילוי הגבישים הקוואזי-מחזוריים\". ב-8 בדצמבר 2011 נשא את הרצאת הנובל שלו באולה מגנה של אוניברסיטת שטוקהולם, תחת הכותרת \"חומרים קוואזי-מחזוריים — שינוי פרדיגמה בקריסטלוגרפיה\". לפני נובל כבר הגיעה ההכרה בהדרגה: הפרס הבינלאומי לחומרים חדשים של האגודה האמריקאית לפיזיקה (1988), פרס רוטשילד בהנדסה (1990), פרס ויצמן למדע (1993), פרס ישראל בפיזיקה (1998), פרס וולף בפיזיקה (1999), פרס גרגורי אמינוף של האקדמיה המלכותית השוודית (2000), פרס אמת בכימיה (2002) ופרס יובל ה-25 של האגודה האירופית לחקר חומרים (2008).\n\nומה לא קיבל. הוא לא קיבל את השנים. בין 1982 ל-1987 היה \"אני מול העולם\", מאמרו נדחה מכתב עת אחד, עמיתים הושיטו לו ספרי לימוד בכנסים, וראש קבוצת המחקר ביקש ממנו לעזוב — כלומר המחיר על העמידה בממצא היה מקומו בקבוצה. הוא גם לא קיבל תמלוגים ולא בעלות מסחרית על הגילוי: הפאזה שגילה הייתה מטא-יציבה ולא הולידה מוצר, וכדברי בוטינגר אין לחומר \"יישום קטלני\". ההכרה שקיבל היא הכרה מדעית בלבד. ולבסוף, המאמר מ-1984 נשא ארבעה שמות — שכטמן, בלך, גרסייה וקאהן — ופרס נובל ניתן לאחד.", "recognition_en": "Shechtman received the 2011 Nobel Prize in Chemistry alone. The Nobel Foundation site records his prize share as 1/1, and the motivation is five words: \"for the discovery of quasicrystals.\" On 8 December 2011 he delivered his Nobel Lecture at Aula Magna, Stockholm University, titled \"Quasi-Periodic Materials – A Paradigm Shift in Crystallography.\" Recognition had already been arriving gradually before the Nobel: the American Physical Society's International Award for New Materials (1988), the Rothschild Prize in Engineering (1990), the Weizmann Science Award (1993), the Israel Prize in Physics (1998), the Wolf Prize in Physics (1999), the Gregori Aminoff Prize of the Royal Swedish Academy of Sciences (2000), the EMET Prize in Chemistry (2002) and the European Materials Research Society's 25th Anniversary Award (2008).\n\nAnd what he did not receive. He did not get the years back. Between 1982 and 1987 it was \"me against the world\": his paper was rejected by one journal, colleagues handed him textbooks at conferences, and the head of his research group asked him to leave — the price of standing by the finding was his place in the group. Nor did he receive royalties or commercial ownership: the phase he discovered was metastable and produced no product, and in Boettinger's words the material has no \"killer application.\" The recognition he received is scientific recognition only. Finally, the 1984 paper carried four names — Shechtman, Blech, Gratias and Cahn — and the Nobel Prize was given to one.", "honors": [{"note": "זהו הכבוד היחיד שנמצא במקורות שנבדקו שבו שמו הוצמד לדבר עצמו: \"בישראל הוצמד שם לחומר בעל המבנה החדש – 'שכטמנית'\".", "what": "\"שכטמנית\" — שמו של החומר בעל המבנה החדש בישראל", "when": "לא צוין בהודעה; ההודעה מ-5.10.2011 מתארת זאת כעובדה קיימת", "where": "ישראל", "what_en": "\"Shechtmanite\" — the name given in Israel to the material with the new structure", "source_url": "https://www.technion.ac.il/blog/2011/10/%d7%a4%d7%a8%d7%95%d7%a4%d7%a1%d7%95%d7%a8-%d7%9e%d7%97%d7%a7%d7%a8-%d7%93%d7%9f-%d7%a9%d7%9b%d7%98%d7%9e%d7%9f-%d7%9e%d7%94%d7%98%d7%9b%d7%a0%d7%99%d7%95%d7%9f-%d7%97%d7%aa%d7%9f-%d7%a4/"}, {"note": "מתוך סעיף Membership in Academies בעמוד הסגל שלו בפקולטה למדע והנדסה של חומרים בטכניון.", "what": "חבר נבחר באקדמיה הלאומית הישראלית למדעים", "when": "1996", "where": "ירושלים, ישראל", "what_en": "Elected member of the Israel Academy of Sciences and Humanities", "source_url": "https://materials.technion.ac.il/en/team/distinguished-prof-emeritus-dan-shechtman/"}, {"note": "מתוך סעיף Membership in Academies בעמוד הסגל בטכניון.", "what": "חבר נבחר באקדמיה הלאומית האמריקאית להנדסה", "when": "2000", "where": "וושינגטון, ארצות הברית", "what_en": "Elected member of the American National Academy of Engineering", "source_url": "https://materials.technion.ac.il/en/team/distinguished-prof-emeritus-dan-shechtman/"}, {"note": "מתוך סעיף Membership in Academies בעמוד הסגל בטכניון.", "what": "חבר נבחר באקדמיה האירופית למדעים", "when": "2004", "where": "אירופה", "what_en": "Elected member of the European Academy of Sciences", "source_url": "https://materials.technion.ac.il/en/team/distinguished-prof-emeritus-dan-shechtman/"}, {"note": "חבר הכבוד הוא דווקא באגודה של התחום שדחה אותו — 17 שנים אחרי התצפית.", "what": "חבר כבוד באגודה הישראלית לקריסטלוגרפיה", "when": "1999", "where": "ישראל", "what_en": "Elected Honorary Member of the Israel Crystallographic Association", "source_url": "https://materials.technion.ac.il/en/team/distinguished-prof-emeritus-dan-shechtman/"}, {"note": "לא פרס אלא מינוי, ונרשם כאן משום שהוא הכבוד המוסדי המתמשך שנשא אחרי הגילוי.", "what": "פרופסור למדע החומרים באוניברסיטת איווה, לצד משרתו בטכניון", "when": "מ-2004", "where": "איימס, איווה, ארצות הברית", "what_en": "Professor of materials science at Iowa State University, alongside his Technion post", "source_url": "https://www.nist.gov/nist-and-nobel/dan-shechtman/prizes-legacy-dan-shechtman"}], "summary_short": "בבוקר 8 באפריל 1982 ספר דן שכטמן את נקודות העקיפה על מסך המיקרוסקופ האלקטרוני, אחת-אחת עד עשר, וידע שזה לא ייתכן: ספרי הקריסטלוגרפיה אסרו סימטריה כזו בגביש מחזורי. הוא ספר שוב בכיוון ההפוך, ושוב יצאו עשר. ביומן המעבדה רשם \"10 Fold\" ואחריו שלושה סימני שאלה, ולעצמו אמר בעברית \"אין חיה כזו\". החוקר שאירח אותו שלח אותו מעל פניו — \"לך מכאן, דני, אלה תאומים וזה לא מעניין במיוחד\" — וכתב עת החזיר לו את המאמר בנימוק שלא יעניין פיסיקאים ומוטב לשלוח אותו לעיתון של מטלורגים. בכנסים הושיטו לו עמיתים ספרי לימוד כדי שילמד מדוע טענותיו בלתי אפשריות, ולינוס פאולינג, חתן פרס נובל כפול, קבע ש\"אין גבישים קוואזי-מחזוריים, יש רק מדענים קוואזי\". בסופו של דבר ביקש ממנו ראש קבוצת המחקר לעזוב, והמחיר על העמידה בממצא היה מקומו בקבוצה. שכטמן לא זז, ובתוך עשור שינה האיגוד הבינלאומי לקריסטלוגרפיה את עצם ההגדרה של המילה גביש. פרס נובל לכימיה הגיע ב-2011, לו לבדו, 29 שנים אחרי אותו בוקר.", "summary_short_en": "On the morning of 8 April 1982 Dan Shechtman counted the diffraction spots on the screen of an electron microscope, one by one up to ten, and knew it could not be: the crystallography textbooks forbade such symmetry in a periodic crystal. He counted again the other way round, and again there were ten. In the lab notebook he wrote \"10 Fold\" followed by three question marks, and said to himself in Hebrew, \"there is no such creature\". The researcher hosting him waved him off — \"Go away, Danny, these are twins and that's not terribly interesting\" — and a journal sent his paper back on the grounds that it would not interest physicists and was better suited to a metallurgists' journal. At conferences colleagues handed him textbooks so that he would learn why his claims were impossible, and Linus Pauling, a double Nobel laureate, declared that \"there are no quasicrystals, only quasi-scientists\". In the end the head of his research group asked him to leave, and the price of standing by the finding was his place in the group. Shechtman did not budge, and within a decade the International Union of Crystallography changed the very definition of the word crystal. The Nobel Prize in Chemistry came in 2011, to him alone, 29 years after that morning."}, "changed": ["title", "description", "media_type", "media_url", "source_url", "source_label", "citations", "act", "ripple", "title_reasoning", "media_urls", "title_en", "description_en", "act_en", "ripple_en", "source_label_en", "location", "people", "deed_type", "actor_type", "beneficiary", "audit", "dedup", "origin_story", "origin_story_en", "aftermath", "aftermath_en", "recognition", "recognition_en", "honors", "summary_short", "summary_short_en"], "m_before": {"citations": 2, "domains": 1, "images": 0, "people": 0, "videos": 0, "location": 0, "honors": 0, "chars": 667, "std": 16}, "m_after": {"citations": 48, "domains": 11, "images": 10, "people": 11, "videos": 0, "location": 1, "honors": 6, "chars": 6462, "std": 46}, "std_total": 46, "failing": []}, {"id": "347192a7-eafd-402f-9216-fb7d27795bd2", "title": "הדי לאמאר ואנתייל רשמו פטנט להכוונת טורפדו בקפיצת תדרים, ולא קיבלו אגורה", "year": 1942, "before": {"id": "347192a7-eafd-402f-9216-fb7d27795bd2", "title": "שחקנית הוליווד הדי לאמאר שותפה בהמצאת קפיצת-התדרים שבבסיס ה-Wi-Fi", "description": "הדי לאמאר, שחקנית הוליווד ילידת וינה ממשפחה יהודית, פיתחה יחד עם המלחין ג'ורג' אנתייל מערכת הכוונה אלחוטית לטורפדו של בעלות הברית במלחמת העולם השנייה. השיטה, המבוססת על קפיצה מהירה בין תדרים, נועדה למנוע שיבוש שידורים בידי מדינות הציר. עקרונותיה משמשים כיום ברשתות אלחוטיות מאובטחות, בהן בלוטות' וגרסאות מוקדמות של Wi-Fi.", "category": "המצאה מדעית", "year": 1942, "media_type": "image", "media_url": "https://upload.wikimedia.org/wikipedia/commons/8/83/Hedy_Lamarr_Publicity_Photo_for_The_Heavenly_Body_1944.jpg", "source_url": "https://en.wikipedia.org/wiki/Hedy_Lamarr", "source_label": "Wikipedia — Hedy Lamarr", "submitted_by": null, "status": "approved", "created_at": "2026-07-29 23:10:35.228669+00", "citations": [{"quote": "Lamarr co-invented a radio guidance system for Allied torpedoes that used spread spectrum and frequency hopping technology to defeat the threat of radio jamming by the Axis powers", "source_url": "https://en.wikipedia.org/wiki/Hedy_Lamarr", "source_label": "Wikipedia — Hedy Lamarr"}, {"quote": "Its principles are utilized for secure wireless networking, including Bluetooth and early versions of Wi-Fi", "source_url": "https://en.wikipedia.org/wiki/Hedy_Lamarr", "source_label": "Wikipedia — Hedy Lamarr"}], "act": "המצאה משותפת של מערכת הכוונה אלחוטית מבוססת קפיצת-תדרים לטורפדו של בעלות הברית.", "ripple": "עקרונות ההמצאה משמשים כיום בתקשורת אלחוטית מאובטחת, כולל בלוטות' וגרסאות מוקדמות של Wi-Fi.", "title_reasoning": "הפרט שמכה: שחקנית קולנוע מפורסמת שהיא גם ממציאה. 'שותפה בהמצאת' ולא 'ממציאה' כי המקור אומר co-invented עם ג'ורג' אנתייל. Wi-Fi נכלל כי המקור מזכיר אותו מפורשות.", "media_urls": ["https://upload.wikimedia.org/wikipedia/commons/8/83/Hedy_Lamarr_Publicity_Photo_for_The_Heavenly_Body_1944.jpg"], "title_en": "Hollywood Actress Hedy Lamarr Co-Invented Frequency Hopping, the Technology Behind Wi-Fi", "description_en": "Hedy Lamarr, a Vienna-born Hollywood actress from a Jewish family, co-developed with composer George Antheil a radio-guided torpedo system for the Allied forces during World War II. The method, based on rapid switching between radio frequencies, was designed to prevent jamming by Axis powers. Its principles are used today in secure wireless networks, including Bluetooth and early versions of Wi-Fi.", "act_en": "Co-invented a frequency-hopping radio guidance system for Allied torpedoes", "ripple_en": "The invention's principles underpin today's secure wireless communications, including Bluetooth and early Wi-Fi", "source_label_en": null, "categories": null, "location": null, "people": null, "deed_type": null, "actor_type": null, "beneficiary": null, "audit": null, "dedup": null, "origin_story": null, "origin_story_en": null, "aftermath": null, "aftermath_en": null, "recognition": null, "recognition_en": null, "honors": null}, "after": {"id": "347192a7-eafd-402f-9216-fb7d27795bd2", "title": "הדי לאמאר ואנתייל רשמו פטנט להכוונת טורפדו בקפיצת תדרים, ולא קיבלו אגורה", "description": "הדי לאמאר (הדוויג אווה מריה קיסלר; וינה 1914 – פלורידה 2000) הייתה שחקנית קולנוע ובת להורים ממוצא יהודי: אביה אמיל קיסלר היה מנהל בנק, אמה גרטרוד הייתה פסנתרנית שהמירה את דתה לקתוליות כדי להיטמע בחברה האוסטרית, והדי עצמה המירה את דתה לקראת נישואיה. ב-10 ביוני 1941, חצי שנה לפני פרל הארבור, הגישה יחד עם המלחין ג'ורג' אנתייל בקשת פטנט על \"מערכת תקשורת סודית\": משדר ומקלט המחליפים תדר בו-זמנית לפי סרט מנוקב מסוג גליל של פסנתר מכני, כדי שאויב לא יוכל לשבש את שידור ההכוונה של טורפדו. הפטנט, מספר 2,292,387, ניתן ב-11 באוגוסט 1942. חיל הים האמריקאי לא אימץ את המערכת, ללאמאר נאמר למכור אגרות מלחמה במקום, ושני הממציאים לא ראו מן ההמצאה אגורה.", "category": "המצאה מדעית", "year": 1942, "media_type": "image", "media_url": "https://upload.wikimedia.org/wikipedia/commons/8/83/Hedy_Lamarr_Publicity_Photo_for_The_Heavenly_Body_1944.jpg", "source_url": "https://patents.google.com/patent/US2292387A/en", "source_label": "פטנט אמריקאי 2,292,387, \"Secret Communication System\" — טקסט הפטנט המלא", "submitted_by": null, "status": "approved", "created_at": "2026-07-29 23:10:35.228669+00", "citations": [{"lang": "en", "quote": "This invention relates broadly to secret communication systems involving the use of carrier waves of different frequencies, and is especially useful in the remote control of dirigible craft, such as torpedoes.", "locator": "גוף הפטנט, המשפט הפותח של התיאור", "published": "1942-08-11", "source_url": "https://patents.google.com/patent/US2292387A/en", "source_label": "פטנט אמריקאי 2,292,387, \"Secret Communication System\" — טקסט הפטנט המלא ב-Google Patents"}, {"lang": "en", "quote": "In a conventional player piano record there may be 88 rows of perforations, and in our system such a record would permit the use of 88 different carrier frequencies, from one to another of which both the transmitting and receiving station would be changed at intervals.", "locator": "גוף הפטנט, תיאור מנגנון גליל הפסנתר המכני", "published": "1942-08-11", "source_url": "https://patents.google.com/patent/US2292387A/en", "source_label": "פטנט אמריקאי 2,292,387, \"Secret Communication System\" — טקסט הפטנט המלא ב-Google Patents"}, {"lang": "en", "quote": "without knowledge of the records an enemy would be unable to determine at what frequency a controlling impulse would be sent", "locator": "גוף הפטנט, הסבר עמידות ההמצאה בפני שיבוש", "published": "1942-08-11", "source_url": "https://patents.google.com/patent/US2292387A/en", "source_label": "פטנט אמריקאי 2,292,387, \"Secret Communication System\" — טקסט הפטנט המלא ב-Google Patents"}, {"lang": "en", "quote": "1959-08-11", "locator": "לוח הנתונים, שדה Anticipated expiration (מועד פקיעת הפטנט)", "published": "1942-08-11", "source_url": "https://patents.google.com/patent/US2292387A/en", "source_label": "פטנט אמריקאי 2,292,387 — נתוני תוקף הפטנט ב-Google Patents"}, {"lang": "en", "quote": "Patented Aug. 11, 1942", "locator": "ראש עמוד השער של הפטנט המודפס", "published": "1942-08-11", "source_url": "https://patentimages.storage.googleapis.com/e0/dd/4e/0e04d56d1d7604/US2292387.pdf", "source_label": "הסריקה הרשמית של פטנט 2,292,387 (קובץ PDF של לשכת הפטנטים האמריקאית)"}, {"lang": "en", "quote": "National Archives Identifier: 167820368", "locator": "דף התיאור של הקובץ, שורת מקור הפריט", "published": "2023-01-01", "source_url": "https://commons.wikimedia.org/wiki/File:Patent_Case_File_No._2,292,387,_Secret_Communication_System,_Inventors_Hedy_Kiesler_Markey_and_George_Antheil_-_DPLA_-_128f022cfd9421aa10de72958a7edf90_(page_6).jpg", "source_label": "דף התיאור של סריקת תיק הפטנט — מזהה הארכיון הלאומי האמריקאי (NARA)"}, {"lang": "en", "quote": "7. In a radio communication system comprising a radio transmitter tunable to any one of a plurality of frequencies and a radio receiver tunable to any one of said plurality of frequencies, the method of effecting secret communication between said stations which comprises simultaneously changing the tuning of the transmitter and receiver according to an arbitrary, nonrecurring pattern.", "locator": "ציטוט מלא של סעיף 7 מתוך בקשת הפטנט כפי שהוגשה", "published": "2024-03-15", "source_url": "https://www.americanscientist.org/blog/the-long-view/the-seventh-claim", "source_label": "טוני רות'מן, \"The Seventh Claim\", American Scientist"}, {"lang": "en", "quote": "But the examiner rejected claim 7 on the grounds that frequency hopping was already known.", "locator": "פסקת דחיית הסעיף השביעי", "published": "2024-03-15", "source_url": "https://www.americanscientist.org/blog/the-long-view/the-seventh-claim", "source_label": "טוני רות'מן, \"The Seventh Claim\", American Scientist"}, {"lang": "en", "quote": "As evidence, the examiner cited two earlier patents that fully covered the claim. The first was U.S. patent 1,869,659 granted to Willem Broertjes in 1932, and a second was U.S. Patent 2,134,850, granted in 1938 to Martin Baesecke of the German firm Siemens and Halske.", "locator": "פירוט הפטנטים הקודמים שציטט הבוחן", "published": "2024-03-15", "source_url": "https://www.americanscientist.org/blog/the-long-view/the-seventh-claim", "source_label": "טוני רות'מן, \"The Seventh Claim\", American Scientist"}, {"lang": "en", "quote": "The published Lamarr–Antheil patent makes six claims regarding the operation of their specific device.", "locator": "תיאור הפטנט כפי שאושר בסופו של דבר", "published": "2024-03-15", "source_url": "https://www.americanscientist.org/blog/the-long-view/the-seventh-claim", "source_label": "טוני רות'מן, \"The Seventh Claim\", American Scientist"}, {"lang": "en", "quote": "Irvin’s findings prove that Lamarr and Antheil did not invent frequency hopping.", "locator": "מסקנת המאמר בעקבות גילוי תיק הבקשה", "published": "2024-03-15", "source_url": "https://www.americanscientist.org/blog/the-long-view/the-seventh-claim", "source_label": "טוני רות'מן, \"The Seventh Claim\", American Scientist"}, {"lang": "en", "quote": "Antheil made strenuous lobbying efforts to get the invention adopted by the Navy, but it was shelved. According to George, the Navy brass thought he wanted to put a player piano in a torpedo.", "locator": "הפרק על גורל ההמצאה בחיל הים", "published": "2019-01-01", "source_url": "https://www.americanscientist.org/article/random-paths-to-frequency-hopping", "source_label": "טוני רות'מן, \"Random Paths to Frequency Hopping\", American Scientist, כרך 107 גיליון 1"}, {"lang": "en", "quote": "Bluetooth technology does employ frequency hopping, but its inventor, Jaap Haartsen, tells me that he was unaware of the Lamarr-Antheil patent when he was working on the system at Ericsson in the 1990s.", "locator": "הפרק על הקשר הנטען לבלוטות' ול-Wi-Fi", "published": "2019-01-01", "source_url": "https://www.americanscientist.org/article/random-paths-to-frequency-hopping", "source_label": "טוני רות'מן, \"Random Paths to Frequency Hopping\", American Scientist, כרך 107 גיליון 1"}, {"lang": "en", "quote": "Haartsen also points out that Wi-Fi abandoned frequency hopping early on, because it provided insufficient bandwidth.", "locator": "הפרק על הקשר הנטען לבלוטות' ול-Wi-Fi", "published": "2019-01-01", "source_url": "https://www.americanscientist.org/article/random-paths-to-frequency-hopping", "source_label": "טוני רות'מן, \"Random Paths to Frequency Hopping\", American Scientist, כרך 107 גיליון 1"}, {"lang": "en", "quote": "He told me that he came away convinced that she had heard the idea in her husband’s boardroom", "locator": "עדות על מקור הידע של לאמאר, מפי מי שראיין אותה", "published": "2019-01-01", "source_url": "https://www.americanscientist.org/article/random-paths-to-frequency-hopping", "source_label": "טוני רות'מן, \"Random Paths to Frequency Hopping\", American Scientist, כרך 107 גיליון 1"}, {"lang": "en", "quote": "It was tested by 1957 and in 1963 it was installed on the flagship U.S.S. Mount McKinley, where it successfully thwarted intentional jamming efforts. Evidently it was the earliest frequency-hopping system put into action.", "locator": "הפרק על מערכת BLADES ועל השימוש המבצעי הראשון בקפיצת תדרים", "published": "2019-01-01", "source_url": "https://www.americanscientist.org/article/random-paths-to-frequency-hopping", "source_label": "טוני רות'מן, \"Random Paths to Frequency Hopping\", American Scientist, כרך 107 גיליון 1"}, {"lang": "en", "quote": "Although Lamarr and Antheil never profited from their invention during their lifetime, it was acknowledged by the Electronic Frontier Foundation in 1997 as an important development in wireless communications. When the patent was issued in 1942, it listed her maiden and married name at the time, Hedy Kiesler Markey.", "locator": "דף המושבעת, פסקת ההכרה בהמצאה", "published": "2014-01-01", "source_url": "https://www.invent.org/inductees/hedy-lamarr", "source_label": "היכל התהילה הלאומי לממציאים בארה\"ב (National Inventors Hall of Fame) — דף הדי לאמאר"}, {"lang": "en", "quote": "Born in Austria, Lamarr had at one time been married to a munitions manufacturer, giving her the foundation for her knowledge of weapons systems, including torpedo control systems.", "locator": "דף המושבעת, פסקת הרקע", "published": "2014-01-01", "source_url": "https://www.invent.org/inductees/hedy-lamarr", "source_label": "היכל התהילה הלאומי לממציאים בארה\"ב (National Inventors Hall of Fame) — דף הדי לאמאר"}, {"lang": "en", "quote": "1997: Hedy Lamarr, Johan Helsingius, and Marc Rotenberg", "locator": "רשימת הזוכים, שנת 1997", "published": "1997-03-01", "source_url": "https://www.eff.org/awards/past-winners", "source_label": "Electronic Frontier Foundation — רשימת זוכי פרס החלוץ (Pioneer Award)"}, {"lang": "en", "quote": "In 1997, Lamarr and Antheil were jointly honored with the Electronic Frontier Foundation’s Pioneer Award, and Lamarr was the first woman to receive the Invention Convention’s BULBIE Gnass Spirit of Achievement Award, known as the “Oscar of inventing.” She was posthumously inducted into the National Inventors Hall of Fame in 2014.", "locator": "פסקת ההוקרה והפרסים", "published": "2022-01-01", "source_url": "https://www.amacad.org/person/hedy-lamarr", "source_label": "האקדמיה האמריקאית לאמנויות ולמדעים (American Academy of Arts and Sciences) — דף הדי לאמאר"}, {"lang": "en", "quote": "Entirely self-taught, she invested her spare time in designing and drafting inventions", "locator": "פסקת הרקע, על היותה אוטודידקטית", "published": "2022-01-01", "source_url": "https://www.amacad.org/person/hedy-lamarr", "source_label": "האקדמיה האמריקאית לאמנויות ולמדעים (American Academy of Arts and Sciences) — דף הדי לאמאר"}, {"lang": "en", "quote": "When the United States went to war in 1941, Lamarr wanted to join the anti-Nazi effort by putting her weapons knowledge to work for the National Inventors Council in Washington, DC. She was told to sell war bonds instead.", "locator": "גוף הכתבה, על סירוב הממסד האמריקאי", "published": "1997-03-11", "source_url": "https://www.wired.com/1997/03/privacy-implications-of-hedy-lamarrs-idea/", "source_label": "Wired, דיווח בן-הזמן על הענקת פרס החלוץ ללאמאר"}, {"lang": "en", "quote": "Married from 1933 to 1937 to an Austrian arms maker, Lamarr got what amounted to a four-year-long education in munitions manufacturing.", "locator": "גוף הכתבה, על מקור הידע הצבאי שלה", "published": "1997-03-11", "source_url": "https://www.wired.com/1997/03/privacy-implications-of-hedy-lamarrs-idea/", "source_label": "Wired, דיווח בן-הזמן על הענקת פרס החלוץ ללאמאר"}, {"lang": "en", "quote": "However, the Navy rejected usage of their patent, and Lamarr was essentially told to instead use her celebrity status to sell war bonds to help the war effort.", "locator": "הפרק על דחיית ההמצאה", "published": "2025-04-23", "source_url": "https://www.nationalww2museum.org/war/articles/hedy-lamarrs-wwii-invention-helped-shape-modern-tech", "source_label": "המוזיאון הלאומי למלחמת העולם השנייה, ניו אורלינס"}, {"lang": "en", "quote": "Her parents, Emil and Gertrud Kiesler, were assimilated Jews, although her mother had converted to Catholicism.", "locator": "הפרק על ילדותה בווינה", "published": "2025-04-23", "source_url": "https://www.nationalww2museum.org/war/articles/hedy-lamarrs-wwii-invention-helped-shape-modern-tech", "source_label": "המוזיאון הלאומי למלחמת העולם השנייה, ניו אורלינס"}, {"lang": "en", "quote": "In August 1933, the two married at the Karlskirche in Vienna; for the wedding, Lamarr converted to Christianity.", "locator": "הפרק על נישואיה לפריץ מנדל", "published": "2025-04-23", "source_url": "https://www.nationalww2museum.org/war/articles/hedy-lamarrs-wwii-invention-helped-shape-modern-tech", "source_label": "המוזיאון הלאומי למלחמת העולם השנייה, ניו אורלינס"}, {"lang": "en", "quote": "during one period of fundraising in 1942, she raised $25 million in war bonds", "locator": "הפרק על מכירת אגרות המלחמה", "published": "2025-04-23", "source_url": "https://www.nationalww2museum.org/war/articles/hedy-lamarrs-wwii-invention-helped-shape-modern-tech", "source_label": "המוזיאון הלאומי למלחמת העולם השנייה, ניו אורלינס"}, {"lang": "en", "quote": "by the time of the Cuban Missile Crisis, American ships had torpedoes controlled by frequency-hopping systems", "locator": "הפרק על השימוש המאוחר בטכנולוגיה", "published": "2025-04-23", "source_url": "https://www.nationalww2museum.org/war/articles/hedy-lamarrs-wwii-invention-helped-shape-modern-tech", "source_label": "המוזיאון הלאומי למלחמת העולם השנייה, ניו אורלינס"}, {"lang": "en", "quote": "in 2014, a memorial to Lamarr was erected in Vienna’s Central Cemetery, where the remainder of her ashes were buried", "locator": "הפרק על הנצחתה", "published": "2025-04-23", "source_url": "https://www.nationalww2museum.org/war/articles/hedy-lamarrs-wwii-invention-helped-shape-modern-tech", "source_label": "המוזיאון הלאומי למלחמת העולם השנייה, ניו אורלינס"}, {"lang": "de", "quote": "Von 1933 bis 1937 war sie mit Fritz Mandl, dem Direktor der Hirtenberger Munitionsfabrik, verheiratet, in dessen Umgebung sie auch Hitler und Mussolini kennen lernte.", "locator": "גוף ההודעה, פסקת הביוגרפיה", "quote_en": "From 1933 to 1937 she was married to Fritz Mandl, the director of the Hirtenberg munitions factory, in whose circle she also came to know Hitler and Mussolini.", "published": "2014-11-07", "source_url": "https://presse.wien.gv.at/presse/2014/11/07/hedy-lamarr-erhaelt-ehrengrab-der-stadt-wien", "source_label": "הודעת דוברות עיריית וינה: קבר-כבוד להדי לאמאר"}, {"lang": "de", "quote": "Das von ihr mitentwickelte Frequenzsprungverfahren hatte sie unentgeltlich für den Kampf gegen die NS-Diktatur zur Verfügung gestellt", "locator": "גוף ההודעה, נימוק ההנצחה", "quote_en": "The frequency-hopping method she co-developed she made available free of charge for the fight against the Nazi dictatorship.", "published": "2014-11-07", "source_url": "https://presse.wien.gv.at/presse/2014/11/07/hedy-lamarr-erhaelt-ehrengrab-der-stadt-wien", "source_label": "הודעת דוברות עיריית וינה: קבר-כבוד להדי לאמאר"}, {"lang": "de", "quote": "wird sie am Zentralfriedhof in einem Ehrengrab der Stadt Wien bestattet", "locator": "גוף ההודעה, החלטת ההנצחה", "quote_en": "she will be buried at the Central Cemetery in an honorary grave of the City of Vienna.", "published": "2014-11-07", "source_url": "https://presse.wien.gv.at/presse/2014/11/07/hedy-lamarr-erhaelt-ehrengrab-der-stadt-wien", "source_label": "הודעת דוברות עיריית וינה: קבר-כבוד להדי לאמאר"}, {"lang": "de", "quote": "Trotz der Bewilligung als US-Patent im Jahr 1942 kam das Frequenzsprungverfahren während des Zweiten Weltkriegs nicht mehr zur Anwendung.", "locator": "גוף ההודעה, פסקת הרקע ההיסטורי", "quote_en": "Despite being granted as a US patent in 1942, the frequency-hopping method was no longer put to use during the Second World War.", "published": "2014-12-12", "source_url": "https://austria-forum.org/af/Wissenssammlungen/Essays/Naturwissenschaften/Teleskop_f%C3%BCr_Hedy_Lamarr", "source_label": "הודעה משותפת של אוניברסיטת וינה והאקדמיה האוסטרית למדעים על קריאת טלסקופ קוונטי על שמה (מובאת ב-Austria-Forum של הטכניון בגראץ)"}, {"lang": "de", "quote": "Mit dieser Namensgebung ehren wir eine große österreichische Erfinderin", "locator": "ציטוט מדברי נציג האקדמיה בהודעה", "quote_en": "With this naming we honour a great Austrian woman inventor.", "published": "2014-12-12", "source_url": "https://austria-forum.org/af/Wissenssammlungen/Essays/Naturwissenschaften/Teleskop_f%C3%BCr_Hedy_Lamarr", "source_label": "הודעה משותפת של אוניברסיטת וינה והאקדמיה האוסטרית למדעים על קריאת טלסקופ קוונטי על שמה (מובאת ב-Austria-Forum של הטכניון בגראץ)"}, {"lang": "en", "quote": "Hedy Lamarr’s honorary grave is located in Group 33G", "locator": "דף הקבר באתר הרשמי של בתי העלמין", "published": "2019-01-01", "source_url": "https://www.friedhoefewien.at/hedy-lamarr-s-grave", "source_label": "בתי העלמין של העיר וינה (Friedhöfe Wien) — דף קבר הכבוד של הדי לאמאר"}, {"lang": "en", "quote": "Hedy Lamarr (1914-2000) was a Austrian-American inventor and actress. Along with George Antheil, she developed technology for a radio guidance system to assist the Allied war effort in WWII. These technologies are used in current Bluetooth systems.", "locator": "שדה citation ברשומת האסטרואיד (אושר על ידי המרכז לכוכבי לכת מזעריים)", "published": "2019-08-27", "source_url": "https://ssd-api.jpl.nasa.gov/sbdb.api?sstr=32730&discovery=1", "source_label": "מסד הנתונים של גופים קטנים במערכת השמש, נאס\"א/JPL — נימוק שם האסטרואיד 32730 Lamarr"}, {"lang": "en", "quote": "recognizes the famous Hollywood actress and inventor who in 1941 patented frequency-hopping technology that laid the foundation for secure Wi-Fi, GPS and Bluetooth technologies used by billions worldwide today.", "locator": "גוף ההודעה, נימוק שם הלוויין", "published": "2021-12-07", "source_url": "https://www.lockheedmartin.com/en-us/news/features/2021/core-mate-complete-for-final-gps-iii-sv10.html", "source_label": "לוקהיד מרטין — הודעה על השלמת הרכבת לוויין GPS III SV10 וקריאתו על שם הדי לאמאר"}, {"lang": "he", "quote": "הפטנט אמנם נרשם אך חיל הים האמריקאי לא מיהר להשתמש בו, בטענה שהמימוש המעשי של מנגנון סינכרון התדרים יהיה מגושם וכבד ולא ייכנס לתוך טיל הטורפדו.", "locator": "גוף הכתבה, על דחיית ההמצאה בידי חיל הים", "quote_en": "The patent was indeed registered, but the US Navy was in no hurry to use it, arguing that the practical implementation of the frequency-synchronisation mechanism would be bulky and heavy and would not fit inside the torpedo.", "published": "2013-03-01", "source_url": "https://www.new-techonline.com/2013/03/%d7%94%d7%93%d7%99-%d7%9c%d7%90%d7%9e%d7%90%d7%a8-%d7%a9%d7%97%d7%a7%d7%a0%d7%99%d7%aa-%d7%a7%d7%95%d7%9c%d7%a0%d7%95%d7%a2-%d7%96%d7%95%d7%94%d7%a8%d7%aa-%d7%95%d7%9e%d7%94%d7%a0%d7%93%d7%a1%d7%aa/", "source_label": "ניו-טק מגזין (עברית) — \"הדי לאמאר: שחקנית קולנוע זוהרת ומהנדסת\""}, {"lang": "he", "quote": "הדי לאמאר היתה נוכחת במספר דיונים שהתנהלו בין בעלה הראשון, פריץ מנדל, לבין בכירי המדענים הנאציים.", "locator": "גוף הכתבה, על מקור הידע הטכני שלה", "quote_en": "Hedy Lamarr was present at several discussions held between her first husband, Fritz Mandl, and senior Nazi scientists.", "published": "2013-03-01", "source_url": "https://www.new-techonline.com/2013/03/%d7%94%d7%93%d7%99-%d7%9c%d7%90%d7%9e%d7%90%d7%a8-%d7%a9%d7%97%d7%a7%d7%a0%d7%99%d7%aa-%d7%a7%d7%95%d7%9c%d7%a0%d7%95%d7%a2-%d7%96%d7%95%d7%94%d7%a8%d7%aa-%d7%95%d7%9e%d7%94%d7%a0%d7%93%d7%a1%d7%aa/", "source_label": "ניו-טק מגזין (עברית) — \"הדי לאמאר: שחקנית קולנוע זוהרת ומהנדסת\""}, {"lang": "en", "quote": "She was not religiously observant, nor were her parents; her mother had converted to Catholicism to better assimilate into Austrian society.", "locator": "גוף המאמר, על זהותה היהודית", "published": "2020-05-25", "source_url": "https://www.jewishbookcouncil.org/pb-daily/frequency-hopping-the-jewish-identity-of-hedy-lamarr-in-childrens-books", "source_label": "Jewish Book Council — \"Frequency Hopping: The Jewish Identity of Hedy Lamarr\""}], "act": "הבעיה הייתה פשוטה וקטלנית. טורפדו המונחה ברדיו משדר בתדר אחד; אויב שמאתר את התדר יכול לשבש אותו ולהסיט את הטורפדו מן המטרה.\n\nהפתרון שלאמאר ואנתייל ניסחו: שהמשדר והמקלט יקפצו יחד בין תדרים, לפי אותה סדרה בדיוק, כך שבלי הכרת הסרטים המנקבים לא יוכל אויב לדעת באיזה תדר יישלח פולס הפיקוד הבא — כלשון הפטנט עצמו. את מנגנון הסנכרון הביא אנתייל: הפטנט מציין שבגליל של פסנתר מכני רגיל יש 88 שורות ניקוב, ולכן מערכת כזו תאפשר שימוש ב-88 תדרים שונים. ההמצאה עצמה מוגדרת בפטנט כשימושית במיוחד לשליטה מרחוק בכלים מונחים, ובראשם טורפדו.\n\nהבקשה הוגשה ללשכת הפטנטים ב-10 ביוני 1941, חצי שנה לפני פרל הארבור, כשארצות הברית עוד לא הייתה במלחמה. תיק הבקשה שרד בשלמותו בארכיון הלאומי האמריקאי, והוא מתעד את כל הדרך: שבע תביעות פטנט ואגרת הגשה של שלושים דולר; תצהיר שעליו חתמה בכתב ידה בלוס אנג'לס ב-5 ביוני 1941; פעולת בוחן מ-13 באוגוסט 1941; תיקון מ-31 באוקטובר; הודעת קיבול מ-13 בנובמבר 1941 עם שש תביעות; ותשלום האגרה הסופית במאי 1942. הפטנט, מספר 2,292,387, ניתן ב-11 באוגוסט 1942 על שמה החוקי דאז — Hedy Kiesler Markey.\n\nלפי עיריית וינה, את השיטה שפיתחה העמידה לרשות המאבק בדיקטטורה הנאצית ללא תמורה.", "ripple": "מה באמת נשאר מן הפטנט הזה — וכאן צריך לומר את מה שמפעל ההנצחה נוטה להשמיט, כי המקורות חלוקים.\n\nהאם היא המציאה את קפיצת התדרים? לא, והראיה נמצאת בתיק הבקשה שלה עצמה. התביעה השביעית, היחידה שניסחה את העיקרון הכללי של שינוי תדר בו-זמנית במשדר ובמקלט לפי דפוס שרירותי ולא חוזר, נדחתה ב-13 באוגוסט 1941 בנימוק שהעיקרון כבר ידוע; הבוחן ציטט שני פטנטים קודמים — של וילם ברוארטיס מ-1932 ושל מרטין בזקה מחברת סימנס והלסקה הגרמנית מ-1938. עורכי הדין של לאמאר ואנתייל מחקו את התביעה, והפטנט אושר עם שש תביעות בלבד, כולן על המכשיר הספציפי שלהם ולא על העיקרון. טוני רות'מן, שפרסם את הממצאים ב-American Scientist, מסכם שהם מוכיחים שלאמאר ואנתייל לא המציאו את קפיצת התדרים.\n\nמן הצד השני, מוסדות ממשיכים לייחס לה את הבסיס ל-Wi-Fi, ל-GPS ולבלוטות': כך נאס\"א/JPL בנימוק שם האסטרואיד, וכך לוקהיד מרטין בהודעה על הלוויין. אלא שאותו רות'מן מדווח שממציא הבלוטות', יאפ הארטסן, אמר לו שכלל לא הכיר את הפטנט של לאמאר ואנתייל כשפיתח את המערכת באריקסון בשנות התשעים, ושה-Wi-Fi זנח את קפיצת התדרים בשלב מוקדם משום שרוחב הפס לא הספיק.\n\nהדף הזה, לכן, אינו טוען שהיא \"המציאה את ה-Wi-Fi\". מה שכן מתועד, ואינו זקוק להגזמה: שתיים מן הדמויות הפחות צפויות במלחמה — שחקנית ומלחין — זיהו בעיה צבאית אמיתית בזמן אמת, ניסחו לה פתרון עובד ובר-פטנט, הגישו אותו מרצונן חודשים לפני שארצות הברית נכנסה למלחמה, ולא ביקשו עליו דבר.", "title_reasoning": "כל מילה בכותרת נבדקה מול מקור ראשוני. \"1942\" — תאריך ההענקה, מופיע על עמוד השער של הפטנט המודפס (\"Patented Aug. 11, 1942\") ועל כריכת התיק בארכיון. \"הכוונת טורפדו\" — לשון הפטנט עצמו: \"especially useful in the remote control of dirigible craft, such as torpedoes\". \"קפיצת תדרים\" — השם שנותנים לשיטה גם רות'מן ב-American Scientist וגם היכל התהילה לממציאים. \"לא קיבלו עליו אגורה\" — היכל התהילה: \"never profited from their invention during their lifetime\". הכותרת נמנעת בכוונה מ-Wi-Fi ומבלוטות', בניגוד לכותרת הקודמת ואף בניגוד להצעת הכותרת של בעל האתר, משום שהמקורות דורשים זאת: רות'מן מדווח שממציא הבלוטות' לא הכיר את הפטנט ושה-Wi-Fi זנח קפיצת תדרים מוקדם. הקישור לתקשורת המודרנית נשאר בגוף הדף, עם המחלוקת, ולא בכותרת. הכותרת גם נמנעת מ\"המציאו\" ומצמדת ל\"רשמו פטנט\" — שזו הטענה היחידה שהמסמכים תומכים בה במלואה. הכותרת קוצרה ל-12 מילים כדי לעמוד בכלל 73 (6–12 מילים): שנת 1942 ירדה מן הכותרת משום שהיא מוצגת ממילא כשנת המעשה, ואף טענה לא נפגעה.", "media_urls": ["https://upload.wikimedia.org/wikipedia/commons/8/83/Hedy_Lamarr_Publicity_Photo_for_The_Heavenly_Body_1944.jpg", "https://upload.wikimedia.org/wikipedia/commons/7/7b/Patent_Case_File_No._2%2C292%2C387%2C_Secret_Communication_System%2C_Inventors_Hedy_Kiesler_Markey_and_George_Antheil_-_DPLA_-_128f022cfd9421aa10de72958a7edf90_%28page_6%29.jpg", "https://upload.wikimedia.org/wikipedia/commons/a/a7/Patent_Case_File_No._2%2C292%2C387%2C_Secret_Communication_System%2C_Inventors_Hedy_Kiesler_Markey_and_George_Antheil_-_DPLA_-_128f022cfd9421aa10de72958a7edf90_%28page_7%29.jpg", "https://upload.wikimedia.org/wikipedia/commons/8/8c/Patent_Case_File_No._2%2C292%2C387%2C_Secret_Communication_System%2C_Inventors_Hedy_Kiesler_Markey_and_George_Antheil_-_DPLA_-_128f022cfd9421aa10de72958a7edf90_%28page_2%29.jpg", "https://upload.wikimedia.org/wikipedia/commons/7/7f/Patent_Case_File_No._2%2C292%2C387%2C_Secret_Communication_System%2C_Inventors_Hedy_Kiesler_Markey_and_George_Antheil_-_DPLA_-_128f022cfd9421aa10de72958a7edf90_%28page_14%29.jpg", "https://upload.wikimedia.org/wikipedia/commons/a/a3/Patent_Case_File_No._2%2C292%2C387%2C_Secret_Communication_System%2C_Inventors_Hedy_Kiesler_Markey_and_George_Antheil_-_DPLA_-_128f022cfd9421aa10de72958a7edf90_%28page_34%29.jpg", "https://upload.wikimedia.org/wikipedia/commons/0/07/Patent_Case_File_No._2%2C292%2C387%2C_Secret_Communication_System%2C_Inventors_Hedy_Kiesler_Markey_and_George_Antheil_-_DPLA_-_128f022cfd9421aa10de72958a7edf90_%28page_33%29.jpg", "https://upload.wikimedia.org/wikipedia/commons/e/e2/Patent_Case_File_No._2%2C292%2C387%2C_Secret_Communication_System%2C_Inventors_Hedy_Kiesler_Markey_and_George_Antheil_-_DPLA_-_128f022cfd9421aa10de72958a7edf90_%28page_38%29.jpg", "https://upload.wikimedia.org/wikipedia/commons/8/82/Patent_Case_File_No._2%2C292%2C387%2C_Secret_Communication_System%2C_Inventors_Hedy_Kiesler_Markey_and_George_Antheil_-_DPLA_-_128f022cfd9421aa10de72958a7edf90_%28page_39%29.jpg", "https://upload.wikimedia.org/wikipedia/commons/thumb/b/be/Wiener_Zentralfriedhof_-_Gruppe_33_G_-_Grab_von_Hedy_Lamarr.jpg/1280px-Wiener_Zentralfriedhof_-_Gruppe_33_G_-_Grab_von_Hedy_Lamarr.jpg"], "title_en": "Hedy Lamarr and Antheil patented frequency-hopping torpedo guidance — and were never paid a cent", "description_en": "Hedy Lamarr (Hedwig Eva Maria Kiesler; Vienna 1914 – Florida 2000) was a film actress and the daughter of parents of Jewish origin: her father Emil Kiesler was a bank director, her mother Gertrud a pianist who had converted to Catholicism in order to assimilate into Austrian society, and Hedy herself converted before her marriage. On 10 June 1941, six months before Pearl Harbor, she filed together with the composer George Antheil a patent application for a \"Secret Communication System\": a transmitter and receiver that change frequency simultaneously according to a perforated roll of the player-piano type, so that an enemy could not jam a torpedo's guidance signal. The patent, number 2,292,387, was granted on 11 August 1942. The US Navy did not adopt the system, Lamarr was told to sell war bonds instead, and neither inventor ever earned a cent from it.", "act_en": "The problem was simple and lethal. A radio-guided torpedo transmits on a single frequency; an enemy who finds that frequency can jam it and push the torpedo off target.\n\nThe solution Lamarr and Antheil formulated: have the transmitter and receiver hop between frequencies together, in exactly the same sequence, so that without knowledge of the perforated records an enemy could not tell on which frequency the next control impulse would be sent — in the patent's own words. The synchronisation mechanism came from Antheil: the patent notes that a conventional player-piano record has 88 rows of perforations, and so such a system would permit the use of 88 different carrier frequencies. The patent itself defines the invention as especially useful in the remote control of dirigible craft, such as torpedoes.\n\nThe application was filed at the Patent Office on 10 June 1941, six months before Pearl Harbor, while the United States was still out of the war. The case file survived intact in the US National Archives and documents the whole road: seven patent claims and a thirty-dollar filing fee; an oath she signed in her own hand in Los Angeles on 5 June 1941; an examiner's action of 13 August 1941; an amendment of 31 October; a notice of allowance of 13 November 1941 with six claims; and payment of the final fee in May 1942. The patent, number 2,292,387, was granted on 11 August 1942 under her legal name at the time, Hedy Kiesler Markey.\n\nAccording to the City of Vienna, she made the method she had co-developed available free of charge for the fight against the Nazi dictatorship.", "ripple_en": "What actually remains of this patent — and here the thing the commemoration industry tends to leave out must be said, because the sources disagree.\n\nDid she invent frequency hopping? No, and the evidence is in her own case file. Claim 7, the only one that stated the general principle of simultaneously changing the tuning of transmitter and receiver according to an arbitrary, nonrecurring pattern, was rejected on 13 August 1941 on the grounds that the principle was already known; the examiner cited two earlier patents — Willem Broertjes's of 1932 and Martin Baesecke's of the German firm Siemens and Halske of 1938. Lamarr and Antheil's attorneys cancelled the claim, and the patent was allowed with six claims only, all of them on their specific device and not on the principle. Tony Rothman, who published the findings in American Scientist, concludes that they prove Lamarr and Antheil did not invent frequency hopping.\n\nOn the other side, institutions keep crediting her as the foundation of Wi-Fi, GPS and Bluetooth: so NASA/JPL in the asteroid naming citation, and so Lockheed Martin in the satellite announcement. Yet the same Rothman reports that Bluetooth's inventor, Jaap Haartsen, told him he was unaware of the Lamarr–Antheil patent when he developed the system at Ericsson in the 1990s, and that Wi-Fi abandoned frequency hopping early on because the bandwidth was insufficient.\n\nThis page therefore does not claim that she \"invented Wi-Fi.\" What is documented, and needs no exaggeration: two of the least expected figures of the war — an actress and a composer — identified a real military problem in real time, formulated a working and patentable solution to it, filed it of their own accord months before the United States entered the war, and asked for nothing in return.", "source_label_en": "US Patent 2,292,387, \"Secret Communication System\" — full patent text", "categories": null, "location": {"lat": 34.0522, "lng": -118.2437, "city": "לוס אנג'לס", "note": "התצהיר בתיק הפטנט נחתם בלוס אנג'לס ב-5 ביוני 1941, ושם גם התגוררו לאמאר ואנתייל בזמן הפיתוח. אין למקורות כתובת מדויקת, ולכן precision גבוה מ-city יהיה המצאה.", "city_en": "Los Angeles", "country": "ארצות הברית", "precision": "city", "country_en": "United States"}, "people": [{"aka_en": "Hedwig Eva Maria Kiesler; on the patent — Hedy Kiesler Markey", "aka_he": "הדוויג אווה מריה קיסלר; בפטנט — Hedy Kiesler Markey", "name_en": "Hedy Lamarr", "name_he": "הדי לאמאר", "role_he": "ממציאה שותפה ובעלת הרעיון של קפיצת התדרים להכוונת טורפדו"}, {"name_en": "George Antheil", "name_he": "ג'ורג' אנתייל", "role_he": "ממציא שותף; המלחין שהביא את מנגנון הסנכרון מן הפסנתרים המכניים"}], "deed_type": ["המצאה מדעית"], "actor_type": "אדם יחיד", "beneficiary": ["לזרים"], "audit": {"at": "2026-08-10T20:07:33+00:00", "by": "standard-pass/opus-5", "pre": {"act": "המצאה משותפת של מערכת הכוונה אלחוטית מבוססת קפיצת-תדרים לטורפדו של בעלות הברית.", "title": "שחקנית הוליווד הדי לאמאר שותפה בהמצאת קפיצת-התדרים שבבסיס ה-Wi-Fi", "ripple": "עקרונות ההמצאה משמשים כיום בתקשורת אלחוטית מאובטחת, כולל בלוטות' וגרסאות מוקדמות של Wi-Fi.", "media_url": "https://upload.wikimedia.org/wikipedia/commons/8/83/Hedy_Lamarr_Publicity_Photo_for_The_Heavenly_Body_1944.jpg", "source_url": "https://en.wikipedia.org/wiki/Hedy_Lamarr", "description": "הדי לאמאר, שחקנית הוליווד ילידת וינה ממשפחה יהודית, פיתחה יחד עם המלחין ג'ורג' אנתייל מערכת הכוונה אלחוטית לטורפדו של בעלות הברית במלחמת העולם השנייה. השיטה, המבוססת על קפיצה מהירה בין תדרים, נועדה למנוע שיבוש שידורים בידי מדינות הציר. עקרונותיה משמשים כיום ברשתות אלחוטיות מאובטחות, בהן בלוטות' וגרסאות מוקדמות של Wi-Fi."}, "notes": "1) אימות ציטוטים: כל 40 הציטטות נשלפו מן הדף החי (curl עם User-Agent של דפדפן), הומרו לטקסט והושוו במחרוזת מדויקת. 40/40 עברו. הנרמול היחיד שהופעל: הסרת soft hyphen (U+00AD), המרת NBSP לרווח, וקיבול גרש מסולסל מול גרש ישר. שני מקורות חייבו את הנרמול הזה במפורש: jewishbookcouncil.org (soft hyphens בתוך מילים) ו-americanscientist.org (גרש מסולסל).\n2) דפים שלא ניתן היה לשלוף ולכן לא צוטטו: catalog.archives.gov (רשומת NA orge_Antheil_-_DPLA_-_128f022cfd9421aa10de72958a7edf90_(page_6).jpg", "shot_when": "1942 (השרטוט הוגש ביוני 1941)", "caption_he": "גיליון השרטוט הראשון של הפטנט: איורים 1–3 של \"מערכת תקשורת סודית\". בתחתית העמוד מופיעות חתימותיהם בפקסימיליה — Hedy Kiesler Markey ו-George Antheil — ולצידן שם עורכי הפטנטים Lyon & Lyon."}, {"url": "https://upload.wikimedia.org/wikipedia/commons/a/a7/Patent_Case_File_No._2%2C292%2C387%2C_Secret_Communication_System%2C_Inventors_Hedy_Kiesler_Markey_and_George_Antheil_-_DPLA_-_128f022cfd9421aa10de72958a7edf90_%28page_7%29.jpg", "group": "גיליונות השרטוט של פטנט 2,292,387", "credit": "הארכיון הלאומי של ארצות הברית, סניף קנזס סיטי (National Archives at Kansas City); מזהה ארכיוני NAID 167820368; הופץ דרך DPLA וויקישיתוף. נחלת הכלל (No Copyright – United States).", "source": "https://commons.wikimedia.org/wiki/File:Patent_Case_File_No._2,292,387,_Secret_Communication_System,_Inventors_Hedy_Kiesler_Markey_and_George_Antheil_-_DPLA_-_128f022cfd9421aa10de72958a7edf90_(page_7).jpg", "shot_when": "1942 (השרטוט הוגש ביוני 1941)", "caption_he": "גיליון השרטוט השני של אותו פטנט: איורים 4–7. בראש העמוד חותמת לשכת הפטנטים — \"רכוש לשכת הפטנטים של ארצות הברית, אין להוציא מן התיקים\"."}, {"url": "https://upload.wikimedia.org/wikipedia/commons/8/8c/Patent_Case_File_No._2%2C292%2C387%2C_Secret_Communication_System%2C_Inventors_Hedy_Kiesler_Markey_and_George_Antheil_-_DPLA_-_128f022cfd9421aa10de72958a7edf90_%28page_2%29.jpg", "group": "תיק הבקשה בלשכת הפטנטים האמריקאית", "credit": "הארכיון הלאומי של ארצות הברית, סניף קנזס סיטי (National Archives at Kansas City); מזהה ארכיוני NAID 167820368; הופץ דרך DPLA וויקישיתוף. נחלת הכלל (No Copyright – United States).", "source": "https://commons.wikimedia.org/wiki/File:Patent_Case_File_No._2,292,387,_Secret_Communication_System,_Inventors_Hedy_Kiesler_Markey_and_George_Antheil_-_DPLA_-_128f022cfd9421aa10de72958a7edf90_(page_2).jpg", "shot_when": "1941–1942", "caption_he": "כריכת תיק הבקשה: מספר הפטנט 2,292,387, התאר
