<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מעשי ישראל — לפני ואחרי</title>
<style>
:root{
  --bg:#f5f5f7; --card:#fff; --ink:#1d1d1f; --dim:#6e6e73; --line:#e3e3e6;
  --before:#a1a1a6; --after:#0071e3; --good:#1d8a4e; --warn:#b25000;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:20;background:rgba(245,245,247,.86);
  backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
h1{font-size:20px;font-weight:600;margin:14px 0 10px;letter-spacing:-.01em}
h1 small{font-weight:400;color:var(--dim);font-size:13px;margin-inline-start:8px}
nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:999px;padding:7px 14px;font-size:13.5px;cursor:pointer;transition:.15s}
nav button:hover{border-color:#c9c9cf}
nav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{max-width:1180px;margin:0 auto;padding:20px 18px 60px}
.scoreboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-bottom:22px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile .lbl{font-size:11.5px;color:var(--dim);letter-spacing:.02em}
.tile .val{font-size:22px;font-weight:600;margin-top:4px;display:flex;align-items:baseline;gap:7px}
.tile .was{font-size:13px;color:var(--before);font-weight:400}
.tile .up{font-size:12px;color:var(--good);font-weight:500}
.modes{display:flex;gap:6px;margin:0 0 16px}
.modes button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:9px;
  padding:6px 13px;font-size:13px;cursor:pointer;color:var(--dim)}
.modes button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.cols.single{grid-template-columns:1fr}
.pane{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.pane>h2{margin:0;padding:12px 18px;font-size:13px;font-weight:600;letter-spacing:.03em;
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.pane.b>h2{color:var(--before)} .pane.a>h2{color:var(--after)}
.pane>h2 em{font-style:normal;font-size:11.5px;color:var(--dim);font-weight:400}
.body{padding:6px 18px 18px}
section{padding:14px 0;border-bottom:1px solid #f0f0f2}
section:last-child{border-bottom:0}
.k{font-size:11.5px;color:var(--dim);letter-spacing:.03em;margin-bottom:6px;
  display:flex;align-items:center;gap:7px}
.chg{background:#e8f2ff;color:var(--after);border-radius:5px;padding:1px 6px;font-size:10.5px}
.txt{font-size:15px;white-space:pre-wrap}
.empty{color:#c4c4c8;font-size:14px;font-style:italic}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
figure{margin:0}
figure img{width:100%;height:104px;object-fit:cover;border-radius:10px;background:#eaeaec;display:block;
  border:1px solid var(--line)}
figcaption{font-size:11.5px;color:var(--dim);margin-top:5px;line-height:1.45}
figcaption .cred{color:#a1a1a6;font-size:10.5px;display:block;margin-top:2px}
figcaption .flag{color:var(--warn);display:block;margin-top:2px}
ol.src{margin:0;padding-inline-start:20px;font-size:13.5px}
ol.src li{margin-bottom:11px}
ol.src .lbl{font-weight:500}
ol.src .q{color:var(--dim);display:block;margin-top:2px}
ol.src .meta{color:#a1a1a6;font-size:11.5px;display:block;margin-top:2px}
ul.honors{margin:0;padding-inline-start:20px;font-size:14px}
ul.honors li{margin-bottom:6px}
a{color:var(--after);text-decoration:none}
a:hover{text-decoration:underline}
.vid{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.vid .t{font-size:14px;font-weight:500}
.vid .c{font-size:11.5px;color:var(--dim);margin-top:3px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:#f2f2f4;border-radius:7px;padding:3px 9px;font-size:12.5px;color:#3a3a3c}
.decide{background:#fff;border:1px solid var(--line);border-left:3px solid var(--warn);
  border-radius:14px;padding:16px 18px;margin-bottom:14px}
.decide h3{margin:0 0 6px;font-size:15px}
.decide p{margin:0 0 8px;font-size:14px;color:#3a3a3c}
.decide .opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.decide .opts img{width:100%;height:150px;object-fit:contain;background:#f2f2f4;border-radius:10px}
@media(max-width:820px){
  .cols{grid-template-columns:1fr}
  .decide .opts{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>מעשי ישראל — לפני ואחרי <small id="stamp"></small></h1>
  <nav id="tabs"></nav>
</div></header>
<main>
  <div class="scoreboard" id="score"></div>
  <div class="modes">
    <button data-mode="both" class="on">זה לצד זה</button>
    <button data-mode="before">רק לפני</button>
    <button data-mode="after">רק אחרי</button>
  </div>
  <div class="cols" id="cols"></div>
  <div id="decisions" style="margin-top:34px"></div>
</main>

ט על 45 העובדים", "published": "2025-07-02", "source_url": "https://www.industrylinqs.com/chemicals/2025/07/new-ubq-plastics-plant-in-bergen-op-zoom-the-invention-of-the-century-and-no-one-knows-it/", "source_label": "Industrylinqs — New UBQ Plastics Plant in Bergen op Zoom: 'The Invention of the Century, and No One Knows It'"}, {"lang": "en", "quote": "UBQ's first industrial-scale facility is set to open in January in the Netherlands, where it plans to divert 104,600 metric tons of trash from landfills annually.", "locator": "ערך UBQ ברשימת 200 ההמצאות הטובות של 2023 — המשפט האחרון בערך", "published": "2023-10-24", "source_url": "https://time.com/collections/best-inventions-2023/6326972/ubq/", "source_label": "TIME — The 200 Best Inventions of 2023: UBQ"}, {"lang": "en", "quote": "Rabbi Yehuda Pearl, the businessman who introduced the United States to hummus, is now looking to bring that same business acumen to his newest venture: turning trash into a plastic-like material.", "locator": "פסקת הפתיחה של הכתבה, מאת מלאני לידמן", "published": "2019-09-04", "source_url": "https://www.timesofisrael.com/sabra-hummus-founder-says-plastic-is-the-perfect-way-to-upcycle-waste/", "source_label": "The Times of Israel — Sabra hummus founder says plastic is the perfect way to upcycle waste"}, {"lang": "en", "quote": "While the actual process remains proprietary, the basic idea is that the waste is deconstructed into an almost molecular level, and then reconstituted or rebuilt into a composite material that resembles plastic.", "locator": "גוף הכתבה, הפסקה שמסבירה את התהליך", "published": "2019-09-04", "source_url": "https://www.timesofisrael.com/sabra-hummus-founder-says-plastic-is-the-perfect-way-to-upcycle-waste/", "source_label": "The Times of Israel — Sabra hummus founder says plastic is the perfect way to upcycle waste"}, {"lang": "en", "quote": "UBQ Materials says it can turn landfill-destined municipal solid waste, including all organics, into recyclable plastic substitute.", "locator": "גוף הכתבה, הפסקה השלישית", "published": "2021-12-15", "source_url": "https://techcrunch.com/2021/12/15/ubq-materials-plastic-replacement-product-attracts-170m-from-impact-investor-tpg-rise/", "source_label": "TechCrunch — UBQ Materials' plastic replacement product attracts $170M from impact investor TPG Rise"}, {"lang": "en", "quote": "The company is vague on how it achieves all this but we will be following its claims with interest.", "locator": "המשפט האחרון בכתבה, מיד אחרי הציטוט של Steve Ellis מ-The Rise Funds", "published": "2021-12-15", "source_url": "https://techcrunch.com/2021/12/15/ubq-materials-plastic-replacement-product-attracts-170m-from-impact-investor-tpg-rise/", "source_label": "TechCrunch — UBQ Materials' plastic replacement product attracts $170M from impact investor TPG Rise"}], "act": "פיתוח תהליך מוגן פטנט שמפרק את החלק האורגני של אשפה ביתית מעורבת לליגנין, תאית, סיבים וסוכרים, ובונה מהם מטריצה שאליה נמס הפלסטיק המלוכלך שנותר — עד לגרגר תרמופלסטי אחיד שאפשר להזריק במכונה רגילה.", "ripple": "כל טונה שנכנסת לתהליך היא טונה שלא נקברת ולא נשרפת, ובישראל שבה יותר מ-80% מהאשפה הוטמנה זו לא שאלה תיאורטית. המהלך מציע לתעשייה חומר גלם שאינו מבוסס נפט ואינו דורש שינוי במכונות הקיימות, ובכך מוריד את מחסום הכניסה שהכשיל חומרים ירוקים קודמים. בהולנד, שבה נשרפים כשלושה מיליון טונות פסולת בשנה, יושב היום מפעל שממיר חלק מהם לחומר במקום לעשן. מעבר לכך, המעש הזה בחן בפומבי טענה שכימאים ותיקים ראו כאלכימיה — ובכך הפך למקרה מבחן חי לשאלה עד כמה אפשר לדחוס את הכלכלה המעגלית אל תוך הפח האפור.", "title_reasoning": "הכותרת הישנה אמרה 'פסולת ביתית מעורבת לחומר תרמופלסטי מרוכב' — נכון אבל חסר את הדבר היחיד שמבדיל את המעש הזה ממיחזור פלסטיק רגיל: שהחומר האורגני נכנס פנימה. כל ממחזר בעולם לוקח פלסטיק נקי; UBQ לוקחת גם שאריות מזון, קרטון רטוב וחיתולים. בדיוק על זה נסבה הספקנות המקצועית ב-2018 ובדיוק על זה נסב ההסבר הטכני ב-2025. לכן 'כולל שאריות מזון' נכנס לכותרת. 11 מילים. אין סופרלטיב ואין 'הראשונה בעולם' — הכותרת לא טוענת יותר ממה שהמקורות תומכים בו: מה החברה עושה, ממה, ולמה. 'גרגרים תרמופלסטיים' ולא 'פלסטיק', כי המקורות מקפידים על ההבחנה (thermoplastic / plastic-like pellets) ואנחנו מקפידים איתם.", "media_urls": ["https://pic1.calcalist.co.il/picserver3/crop_images/2022/04/13/B1mq4y8NE9/B1mq4y8NE9_0_0_1185_790_0_x-large.jpg", "https://images1.ynet.co.il/PicServer5/2018/03/22/8424592/84245900100891183103no.jpg", "https://www.industrylinqs.com/wp-content/uploads/2025/07/IMG_7511-scaled-1.jpg", "https://www.industrylinqs.com/wp-content/uploads/2025/07/UBQ-Materials-97-e1750745942196.jpg", "https://www.industrylinqs.com/wp-content/uploads/2025/07/MRG_7713-resize-2-scaled-e1750746251273.jpg", "https://www.industrylinqs.com/wp-content/uploads/2025/07/MRG_7021-resize-scaled-1.jpg", "https://www.industrylinqs.com/wp-content/uploads/2025/07/IMG_7488-scaled-1.jpg"], "title_en": "Israel's UBQ turns mixed household waste, food scraps included, into thermoplastic pellets", "description_en": "UBQ Materials was founded in Israel in 2012 by Yehuda Pearl (co-founder of the American-Israeli hummus brand Sabra), lawyer and El Al pilot Eran Lev, and cleantech entrepreneur Jack (Tato) Bigio. At its facility at Kibbutz Tze'elim in the western Negev the company intercepts household waste bound for landfill, removes metals, minerals and glass — which would damage the equipment — and takes everything else, including food scraps, cardboard, paper, textiles, used diapers and dirty plastics, dries and mills it into a powder and feeds it into a reaction chamber. There the organic fraction is broken down into its basic components — lignin, cellulose, fibres and sugars — and formed into a matrix into which the residual plastic melts, producing a uniform composite thermoplastic. The output is pellets sold to industry that run on existing injection-moulding and extrusion machinery without modification. In 2018 the Tze'elim site was a pilot processing one ton of waste per hour; in 2021 the company raised $170 million led by TPG Rise; an industrial-scale plant in Bergen op Zoom, the Netherlands — 45 employees, 80,000 tons a year of capacity — has been operational since 2023. Sources disagree on the size of the climate benefit: a contemporaneous 2018 report gave the company's figure of 3 to 30 tons of CO2 avoided per ton of material, Calcalist reported 12 tons over 20 years in 2022, and the 2025 report from the Dutch plant gave over one kilogram per kilogram of material. The claims have also drawn explicit professional scepticism.", "act_en": "Developing a patented process that breaks the organic fraction of mixed household waste down into lignin, cellulose, fibres and sugars and builds them into a matrix into which the residual dirty plastic melts — yielding a uniform thermoplastic pellet that can be moulded on ordinary machinery.", "ripple_en": "Every ton that enters the process is a ton not buried and not burned, and in Israel, where over 80% of waste was landfilled, that is not a theoretical question. The approach offers industry a feedstock that is not petroleum-based and requires no change to existing machinery, lowering the entry barrier that defeated earlier green materials. In the Netherlands, where some three million tons of waste are incinerated each year, there now stands a plant converting part of that into material instead of smoke. Beyond that, this deed publicly tested a claim that veteran chemists regarded as alchemy — making it a live test case for how far the circular economy can be pushed into the grey bin.", "source_label_en": "Calcalist CTech — UBQ Materials: The alchemist turning waste into reusable plastic", "categories": null, "location": {"lat": 31.2019, "lng": 34.5325, "city": "קיבוץ צאלים, הנגב המערבי", "city_en": "Kibbutz Tze'elim, Western Negev", "country": "ישראל", "precision": "settlement", "country_en": "Israel"}, "people": [{"name_en": "Yehuda Pearl", "name_he": "יהודה פרל", "role_he": "ממייסדי החברה; קודם לכן ממייסדי מותג החומוס סברה"}, {"name_en": "Jack (Tato) Bigio", "name_ ns_covered": 6, "image_provenance": [{"url": "https://pic1.calcalist.co.il/picserver3/crop_images/2022/04/13/B1mq4y8NE9/B1mq4y8NE9_0_0_1185_790_0_x-large.jpg", "group": null, "credit": "צילום: UBQ Materials. פורסם בכלכליסט CTech, 18.4.2022, בכתבה 'UBQ Materials: The alchemist turning waste into reusable plastic'", "source": "https://www.calcalistech.com/ctechnews/article/sygd2ucn9", "shot_when": "2022", "caption_he": "ג'ק (טאטו) ביג'יו, ממייסדי UBQ Materials ומנכ\"ל החברה — כפי שהכתבה מזהה אותו בכיתוב התמונה שלה.", "photographer": "UBQ Materials (חומר יח\"צ של החברה)", "published_in": "Calcalist CTech"}, {"url": "https://images1.ynet.co.il/PicServer5/2018/03/22/8424592/84245900100891183103no.jpg", "group": null, "credit": "Photo: AP — כיתוב המקור בדף: 'Garbage pile near the UBQ factory in Kibbutz Zeelim'", "source": "https://www.ynetnews.com/articles/0,7340,L-5189644,00.html", "shot_when": "2018-03", "caption_he": "ערמת האשפה ליד מפעל UBQ בקיבוץ צאלים, 2018 — חומר הגלם עצמו, בשלב שבו המתקן היה עדיין פיילוט שעיבד טון פסולת בשעה.", "photographer": "Associated Press", "published_in": "Ynetnews"}, {"url": "https://www.industrylinqs.com/wp-content/uploads/2025/07/IMG_7511-scaled-1.jpg", "group": "המפעל התעשייתי בברגן אופ זום, הולנד", "credit": "Photo: UBQ. פורסם ב-Industrylinqs, 2.7.2025, בכתבת בארט פאלס", "source": "https://www.industrylinqs.com/chemicals/2025/07/new-ubq-plastics-plant-in-bergen-op-zoom-the-invention-of-the-century-and-no-one-knows-it/", "shot_when": "2025", "caption_he": "המפעל בברגן אופ זום שבהולנד — 45 עובדים וכושר ייצור של 80 אלף טונות בשנה, פועל מאז 2023. זהו הכיתוב שנתן לתמונה המגזין עצמו.", "photographer": "UBQ Materials", "published_in": "Industrylinqs"}, {"url": "https://www.industrylinqs.com/wp-content/uploads/2025/07/UBQ-Materials-97-e1750745942196.jpg", "group": "המפעל התעשייתי בברגן אופ זום, הולנד", "credit": "Photo: UBQ. פורסם ב-Industrylinqs, 2.7.2025, בכתבת בארט פאלס", "source": "https://www.industrylinqs.com/chemicals/2025/07/new-ubq-plastics-plant-in-bergen-op-zoom-the-invention-of-the-century-and-no-one-knows-it/", "shot_when": "2025", "caption_he": "המפעל בברגן אופ זום כולו נבנה בכסף פרטי — כך כותרת המגזין לתמונה. אין כאן תמיכה ציבורית מלבד מענק ייעול של חמישה מיליון יורו.", "photographer": "UBQ Materials", "published_in": "Industrylinqs"}, {"url": "https://www.industrylinqs.com/wp-content/uploads/2025/07/MRG_7713-resize-2-scaled-e1750746251273.jpg", "group": "החומר עצמו — הגרגר התרמופלסטי", "credit": "Photo: UBQ. פורסם ב-Industrylinqs, 2.7.2025, בכתבת בארט פאלס", "source": "https://www.industrylinqs.com/chemicals/2025/07/new-ubq-plastics-plant-in-bergen-op-zoom-the-invention-of-the-century-and-no-one-knows-it/", "shot_when": "2025", "caption_he": "התוצר: UBQ מסופק כגרגירים, והיצרן מחליט כמה מהם לשלב במוצר שלו. זהו הכיתוב שנתן המגזין לתמונה.", "photographer": "UBQ Materials", "published_in": "Industrylinqs"}, {"url": "https://www.industrylinqs.com/wp-content/uploads/2025/07/MRG_7021-resize-scaled-1.jpg", "group": "החומר עצמו — הגרגר התרמופלסטי", "credit": "Photo: UBQ. פורסם ב-Industrylinqs, 2.7.2025, בכתבת בארט פאלס", "source": "https://www.industrylinqs.com/chemicals/2025/07/new-ubq-plastics-plant-in-bergen-op-zoom-the-invention-of-the-century-and-no-one-knows-it/", "shot_when": "2025", "caption_he": "החומר שמתחרה בכל פלסטיק בתולי בכל מחיר נפט — הכיתוב שנתן המגזין לתמונה, בפסקה שמסבירה למה זו טענה כלכלית ולא רק סביבתית.", "photographer": "UBQ Materials", "published_in": "Industrylinqs"}, {"url": "https://www.industrylinqs.com/wp-content/uploads/2025/07/IMG_7488-scaled-1.jpg", "group": null, "credit": "Photo: IL / BP (Industrielinqs / בארט פאלס) — תמונת הפתיחה של הכתבה", "source": "https://www.industrylinqs.com/chemicals/2025/07/new-ubq-plastics-plant-in-bergen-op-zoom-the-invention-of-the-century-and-no-one-knows-it/", "shot_when": "2025-07", "caption_he": "אלברט דואר, מנכ\"ל UBQ, במפעל ההולנדי — התמונה שמתחתיה נכתב שהוא ממתין חודשים להזמנות גדולות בזמן שהטכנולוגיה כבר עובדת. חורגת מהקבוצות משום שזו התמונה היחידה כאן שצולמה בידי המגזין ולא סופקה בידי החברה.", "photographer": "בארט פאלס, Industrielinqs", "published_in": "Industrylinqs"}], "lead_image_basis": "verified_portrait"}, "dedup": {"exact_match": "השורה 'חברת UBQ הישראלית הופכת פסולת ביתית מעורבת לחומר תרמופלסטי מרוכב' ברישום היא המעש הזה עצמו — לא כפילות אלא הרשומה שאותה אני בונה מחדש.", "merged_from": [], "checked_against": "deed-registry.md כפי שצורף לתדריך (כלל 24, כלל 80, כלל 81)", "partial_matches_read_in_full": ["'אדיטל אלע הקימה חברה ישראלית שמייצרת חומרי בנייה דלי-פחמן ממינרלים ממוחזרים' — נקרא לעומק: מינרלים ממוחזרים לחומרי בנייה, לא פסולת ביתית מעורבת ולא תרמופלסטי. חברה אחרת, אדם אחר, טכנולוגיה אחרת. אינו כפילות.", "'דפנה ניסנבאום מקימה בישראל אריזות מתכלות לחלוטין שמחליפות פלסטיק חד-פעמי' — נקרא לעומק: TIPA, אריזות מתכלות ביולוגית מפולימרים, לא המרת פסולת. אינו כפילות.", "'רננה קרבס פיתחה בחברת אלגאינג צבעי טקסטיל לא רעילים מאצות' — נקרא לעומק: צבעים מאצות. אינו כפילות."]}, "origin_story": "בישראל של תחילת שנות ה-2010 הסתיים כמעט כל פח אשפה באותו מקום. ב-2016 ייצרה המדינה 5.3 מיליון טונות אשפה, יותר מ-80% ממנה נקברה במטמנות הולכות ומתמלאות, ושליש מהאשפה המוטמנת היה שאריות מזון שנרקבות ופולטות מתאן. במקביל הציע המשרד להגנת הסביבה לצמצם ב-20% את כמות הפסולת הנקברת. הרעיון ב-2012 לא היה למחזר טוב יותר את מה שכבר ניתן למיחזור, אלא לקחת דווקא את מה שנשאר אחרי שכל הממחזרים לקחו את שלהם — מה שמנכ\"ל החברה אלברט דואר כינה שנים אחר כך 'האשפה של האשפה'. שלושת האנשים שיצאו לדרך לא באו מתעשיית הפסולת: יהודה פרל, איש העסקים שהכניס את החומוס אל המקרר האמריקאי דרך מותג סברה; ערן לב, עורך דין וטייס אל על; וג'ק (טאטו) ביג'יו, יזם קלינטק סדרתי. פרל סיפר ב-2019 שהמוצר המסחרי הראשון שבחרו לייצר מהחומר היה דווקא פחי מיחזור — כשהצליחו לייצר מוצר בר-מכירה, אמר, לא היה דבר מעניין יותר מפח אשפה שעשוי מאשפה. הפיתוח עצמו ארך חמש שנים לפני שהמתקן בצאלים עלה לאוויר, ובכל אותן שנים התהליך נשמר כפטנט סגור.", "origin_story_en": "In Israel of the early 2010s almost every bin ended up in the same place. In 2016 the country generated 5.3 million metric tons of garbage, over 80% of it buried in increasingly crowded landfills, and a third of that landfilled waste was food scraps that decompose and release methane. At the same time the Environmental Ministry proposed cutting the amount of buried waste by 20%. The idea in 2012 was not to recycle better what was already recyclable, but to take precisely what remains after every recycler has had its share — what CEO Albert Douer would years later call 'the garbage of the garbage'. The three people who set out were not from the waste industry: Yehuda Pearl, the businessman who put hummus into the American refrigerator through the Sabra brand; Eran Lev, a lawyer and El Al pilot; and Jack (Tato) Bigio, a serial cleantech entrepreneur. Pearl recounted in 2019 that the first commercial product they chose to make from the material was recycling bins — once they could produce a commercially viable product, he said, nothing was more interesting than waste bins made of waste. Development itself took five years before the Tze'elim facility came online, and throughout those years the process was kept as a closely guarded patent.", "aftermath": "בין ההוכחה במעבדה לייצור תעשייתי עברו כ-12 שנה, והמכשול לא היה הטכנולוגיה אלא האימוץ. ב-2018 עדיין היה המתקן בצאלים פיילוט שעיבד טון פסולת בשעה — כמות שלא הייתה מספיקה אפילו לעיר בינונית — והחברה סירבה לנקוב בשמות לקוחות שאיתם ניהלה מגעים. עד 2022 כבר עבדו איתה מרצדס-בנץ, מיינטי וארקוס דוראדוס (מפעילת מקדונלד'ס באמריקה הלטינית), ובישראל קבוצת כתר וכרמל אולפינים; TIME כללה את החומר ב-2023 ברשימת ההמצאות הטובות של השנה וציינה גם את נסטלה ואת פפסיקו. הכסף הגיע לפניהם: 30 מיליון דולר ממשקיעים פרטיים עד 2018, ו-170 מיליון דולר בדצמבר 2021 בהובלת TPG Rise. המפעל התעשייתי בברגן אופ זום שבהולנד פועל מאז 2023 עם 45 עובדים וכושר 80 אלף טונות בשנה, אך ביולי 2025 הוא עדיין רץ על חלק קטן מכושרו. מרצדס משתמשת בחומר לבטנות כנפי גלגלים ומקדונלד'ס למגשים שאינם באים במגע עם מזון, אבל בענף הבנייה מוצר חדש נדרש לעיתים לשהות שנה שלמה על גג לפני שהוא מאושר, והמנכ\"ל אלברט דואר תיאר ב-2025 המתנה של חודשים להזמנות גדולות בזמן שהטכנולוגיה כבר מוכנה. הספקנות לא נעלמה: דואן פרידי, מנכ\"ל Plastic Expert Group ומדען ראשי לשעבר בדאו כימיקלס, כינה ב-2018 את הטענות 'טובות מכדי להיות אמיתיות' והשווה אותן לאלכימיה, וטקראנץ' ציין ב-2021 שהחברה מעורפלת בשאלה איך בדיוק היא משיגה את כל זה. מ-2025 מתוכננים מפעלים נוספים באיחוד האמירויות ובארצות הברית.", "aftermath_en": "Roughly 12 years passed between laboratory proof and industrial production, and the obstacle was adoption rather than technology. In 2018 the Tze'elim site was still a pilot processing one ton of waste per hour — not enough for even a midsize city — and the company declined to name the customers it was negotiating with. By 2022 it was working with Mercedes-Benz, Mainetti and Arcos Dorados (McDonald's operator in Latin America), and in Israel with the Keter Group and Carmel Olefins; TIME included the material in its 2023 Best Inventions list and also named Nestle and PepsiCo. The money arrived before the customers: $30 million from private investors by 2018, and $170 million in December 2021 led by TPG Rise. The industrial plant in Bergen op Zoom, the Netherlands has been operational since 2023 with 45 employees and 80,000 tons a year of capacity, yet in July 2025 it was still running at a fraction of that. Mercedes uses the material for wheel arch liners and McDonald's for trays not used for food packaging, but in construction a new product sometimes has to sit on a rooftop for a year before approval, and CEO Albert Douer described in 2025 waiting months for large orders while the technology was already working. The scepticism did not disappear: Duane Priddy, chief executive of the Plastic Expert Group and a former principal scientist at Dow Chemical, called the claims 'too good to be true' in 2018 and likened them to alchemy, and TechCrunch noted in 2021 that the company is vague about how it achieves all this. As of 2025 further plants are planned in the UAE and the United States.", "recognition": "המעש נעשה בתוך חברה מסחרית, ולכן ה'שכר' שלו הוא בעלות ותמורה עסקית ולא הכרה אישית: התהליך מוגן בפטנט של החברה, המייסדים מחזיקים במניותיה, והחברה גייסה 30 מיליון דולר עד 2018 ו-170 מיליון דולר בדצמבר 2021 בהובלת TPG Rise. ההכרה הפומבית הגיעה לחומר ולא לאדם — UBQ נכללה באוקטובר 2023 ברשימת ההמצאות הטובות של השנה של מגזין TIME. מה שלא התקבל, ובמפורש: באף אחד מששת המקורות שנמשכו לא נמצא פרס אישי, תמלוג אישי או אות כבוד שהוענק ליהודה פרל, לערן לב או לג'ק ביג'יו על ההמצאה. המפעל ההולנדי כולו נבנה בכסף פרטי בלי תמיכה ציבורית, למעט מענק של חמישה מיליון יורו מקרן המעבר הצודק של האיחוד האירופי שיועד לייעול התהליך ולפיתוח מוצרים ולא להקמת המפעל. גם ההכרה המקצועית לא הייתה חד-משמעית: לצד מועצה מייעצת שכללה את חתן פרס נובל לכימיה רוג'ר קורנברג, את הביוכימאי עודד שוסיוב מהאוניברסיטה העברית ואת נציבת האקלים האירופית לשעבר קוני הדגור, עמדה דחייה מפורשת מצד מומחי פלסטיק. ומעל הכל, לפי דואר עצמו ב-2025, הפער הגדול ביותר אינו בפרסים אלא בתשומת לב: שרים לא הגיעו למפעל, ולדבריו איש כמעט אינו יודע שהוא קיים.", "recognition_en": "The deed was done inside a commercial company, so its 'reward' is ownership and business return rather than personal recognition: the process is protected by the company's patent, the founders hold its shares, and the company raised $30 million by 2018 and $170 million in December 2021 led by TPG Rise. Public recognition went to the material, not the person — UBQ was included in TIME magazine's Best Inventions of 2023 in October 2023. What was explicitly not received: none of the six sources pulled records any personal prize, personal royalty or honour awarded to Yehuda Pearl, Eran Lev or Jack Bigio for the invention. The entire Dutch plant was built with private money and no public support, apart from a five-million-euro grant from the EU Just Transition Fund earmarked for optimising the process and developing products rather than for building the plant. Professional recognition was not unanimous either: alongside an advisory board that included Nobel chemistry laureate Roger Kornberg, Hebrew University biochemist Oded Shoseyov and former European climate commissioner Connie Hedegaard, there stood explicit rejection from plastics experts. And above all, according to Douer himself in 2025, the biggest gap is not in prizes but in attention: ministers did not come to the plant, and in his words almost nobody knows it exists.", "honors": [{"to": "החומר UBQ (לחברה, לא לאדם)", "what": "נכללה ברשימת ההמצאות הטובות של 2023 של מגזין TIME", "year": 2023, "what_en": "Named to TIME magazine's Best Inventions of 2023", "source_url": "https://time.com/collections/best-inventions-2023/6326972/ubq/"}], "summary_short": "שלושת האנשים שיצאו ב-2012 להפוך אשפה ביתית לחומר גלם לא באו מתעשיית הפסולת: יהודה פרל, שהכניס את החומוס אל המקרר האמריקאי דרך מותג סברה, ערן לב, עורך דין וטייס אל על, וג'ק (טאטו) ביג'יו, יזם קלינטק. הם לא ניסו למחזר טוב יותר את מה שכבר ניתן למיחזור, אלא לקחת דווקא את מה שנשאר אחרי שכל הממחזרים לקחו את שלהם — שאריות מזון, קרטון, טקסטיל, חיתולים משומשים ופלסטיק מלוכלך, מה שמנכ\"ל החברה אלברט דואר כינה 'האשפה של האשפה'. במתקן שבקיבוץ צאלים מוציאים מהאשפה מתכות, זכוכית ומינרלים, מייבשים וטוחנים את כל השאר לאבקה, ומפרקים את החלק האורגני לליגנין, תאית, סיבים וסוכרים שמהם נבנית מטריצה שאליה נמס הפלסטיק שנותר, עד לגרגר תרמופלסטי שרץ על מכונות הזרקה קיימות בלי שינוי. המוצר המסחרי הראשון שבחרו לייצר מהחומר היה דווקא פחי מיחזור — לדברי פרל, ברגע שהצליחו לייצר מוצר בר-מכירה לא היה דבר מעניין יותר מפח אשפה שעשוי מאשפה. מומחי פלסטיק לא התרשמו: דואן פרידי, מנכ\"ל Plastic Expert Group ומדען ראשי לשעבר בדאו כימיקלס, כינה ב-2018 את הטענות 'טובות מכדי להיות אמיתיות' והשווה אותן לאלכימיה. בין ההוכחה במעבדה לייצור התעשייתי עברו כ-12 שנה, והמכשול לא היה הטכנולוגיה אלא האימוץ: מרצדס-בנץ מייצרת מהחומר בטנות כנפי גלגלים ומקדונלד'ס מגשים שאינם באים במגע עם מזון, אבל המפעל בהולנד עדיין רץ ביולי 2025 על חלק קטן מכושרו. לפי דואר, הפער הגדול אינו בפרסים אלא בתשומת לב: שרים לא הגיעו למפעל, וכמעט איש אינו יודע שהוא קיים.", "summary_short_en": "The three people who set out in 2012 to turn household waste into raw material did not come from the waste industry: Yehuda Pearl, who put hummus into the American refrigerator through the Sabra brand, Eran Lev, a lawyer and El Al pilot, and Jack (Tato) Bigio, a cleantech entrepreneur. They were not trying to recycle better what was already recyclable, but to take precisely what remains after every recycler has had its share — food scraps, cardboard, textiles, used diapers and dirty plastics, what the company's CEO Albert Douer called 'the garbage of the garbage'. At the facility at Kibbutz Tze'elim metals, glass and minerals are pulled out, everything else is dried and milled into a powder, and the organic fraction is broken down into lignin, cellulose, fibres and sugars that form a matrix into which the residual plastic melts, yielding a thermoplastic pellet that runs on existing injection-moulding machines without modification. The first commercial product they chose to make from the material was recycling bins — once they could produce something sellable, Pearl said, nothing was more interesting than a waste bin made of waste. Plastics experts were unimpressed: Duane Priddy, chief executive of the Plastic Expert Group and a former principal scientist at Dow Chemical, called the claims 'too good to be true' in 2018 and likened them to alchemy. Roughly 12 years passed between laboratory proof and industrial production, and the obstacle was adoption rather than technology: Mercedes-Benz makes wheel arch liners out of the material and McDonald's trays that never touch food, yet in July 2025 the plant in the Netherlands was still running at a fraction of its capacity. According to Douer the biggest gap is not in prizes but in attention: ministers did not come to the plant, and almost nobody knows it exists."}, "changed": ["title", "description", "media_type", "media_url", "source_url", "source_label", "citations", ia Mendes Nasi", "source_label_en": "English Wikipedia, entry: Dona Gracia Mendes Nasi"}, {"quote": "Starting in Antwerp, she began to develop an escape network that helped hundreds of fellow crypto-Jews flee Habsburg Spain and Portugal", "source_url": "https://en.wikipedia.org/wiki/Do%C3%B1a_Gracia_Mendes_Nasi", "source_label": "ויקיפדיה האנגלית, ערך Dona Gracia Mendes Nasi", "source_label_en": "English Wikipedia, entry: Dona Gracia Mendes Nasi"}], "act": "בנתה מאנטוורפן רשת בריחה מסועפת שהוציאה מאות אנוסים מספרד ומפורטוגל אל ארצות מקלט.", "ripple": "מאות משפחות ניצלו ממאסר ומשריפה, וקהילות יהודיות באיטליה ובאימפריה העות'מאנית התחזקו בזכות הפליטים שהגיעו.", "title_reasoning": "מי (דונה גרסיה), מה עשתה (רשת מילוט), למי (מאות אנוסים), מפני מה (האינקוויזיציה). כל מילה נשענת על הציטוט.", "media_urls": ["https://upload.wikimedia.org/wikipedia/commons/9/9c/Gracianasimedal.jpg", "https://upload.wikimedia.org/wikipedia/commons/9/9e/PikiWiki_Israel_11851_dona_gracia_lookout_tiberias.jpg"], "title_en": "Dona Gracia Mendes Nasi Builds an Escape Network That Saves Hundreds of Conversos from the Inquisition", "description_en": "A 16th-century Jewish businesswoman of Portuguese origin who managed an international trading house. She used her family's trade network to smuggle hundreds of Conversos out of Spain and Portugal and beyond the reach of the Inquisition. She also funded printing houses and Jewish communities in Constantinople.", "act_en": "From Antwerp, she built a far-reaching escape network that brought hundreds of Conversos from Spain and Portugal to lands of refuge", "ripple_en": "Hundreds of families were saved from imprisonment and burning, and Jewish communities in Italy and the Ottoman Empire were strengthened by the refugees who arrived", "source_label_en": "English Wikipedia, entry: Dona Gracia Mendes Nasi", "categories": null, "location": null, "people": null, "deed_type": null, "actor_type": null, "beneficiary": null, "audit": null, "dedup": null}, "after": {" '", "published": "2025-01-30", "source_url": "https://blog.nli.org.il/en/dona_gracia/", "source_label": "הבלוג של הספרייה הלאומית של ישראל: \"האם היהודייה שהביסה את הקיסר קרל החמישי\"", "source_label_en": "The Librarians, National Library of Israel blog: \"The Jewish Mother Who Defeated Emperor Charles V\""}], "act": "בנתה מאנטוורפן רשת בריחה מסועפת שהוציאה מאות אנוסים מספרד ומפורטוגל אל ארצות מקלט.", "ripple": "מאות משפחות ניצלו ממאסר ומשריפה, וקהילות יהודיות באיטליה ובאימפריה העות'מאנית התחזקו בזכות הפליטים שהגיעו.", "title_reasoning": "מי (דונה גרסיה), מה עשתה (רשת מילוט), למי (מאות אנוסים), מפני מה (האינקוויזיציה). כל מילה נשענת על הציטוט.", "media_urls": ["https://upload.wikimedia.org/wikipedia/commons/9/9c/Gracianasimedal.jpg", "https://upload.wikimedia.org/wikipedia/commons/a/a8/Nezi.jpg", "https://upload.wikimedia.org/wikipedia/commons/d/d6/Consolasam_samuel_usque.jpg", "https://upload.wikimedia.org/wikipedia/commons/d/d1/Ferrara_Bible.jpg", "https://upload.wikimedia.org/wikipedia/commons/7/7c/Genesis_ferrara_bible.jpg", "https://upload.wikimedia.org/wikipedia/commons/f/fa/Inquisition_and_the_Jews_Tiberias.JPG", "https://upload.wikimedia.org/wikipedia/commons/e/e9/PikiWiki_Israel_77873_dona_gracia_wall_in_tiberias.jpg", "https://upload.wikimedia.org/wikipedia/commons/9/9e/PikiWiki_Israel_11851_dona_gracia_lookout_tiberias.jpg", "https://upload.wikimedia.org/wikipedia/commons/0/0c/Dona_Gracia_Hotel_and_Museum_Tiberias_01.jpg", "https://www.youtube.com/watch?v=Rq30Ikq4S20", "https://www.youtube.com/watch?v=i8nrvAyiXkI", "https://www.youtube.com/watch?v=pDYqIH8LP5o"], "title_en": "Dona Gracia Mendes Nasi Builds an Escape Network That Saves Hundreds of Conversos from the Inquisition", "description_en": "A 16th-century Jewish businesswoman of Portuguese origin who managed an international trading house. She used her family's trade network to smuggle hundreds of Conversos out of Spain and Portugal and beyond the reach of the Inquisition. She also funded printing houses and Jewish communities in Constantinople.", "act_en": "From Antwerp, she built a far-reaching escape network that brought hundreds of Conversos from Spain and Portugal to lands of refuge", "ripple_en": "Hundreds of families were saved from imprisonment and burning, and Jewish communities in Italy and the Ottoman Empire were strengthened by the refugees who arrived", "source_label_en": "Miriam Bodian, \"Doña Gracia Nasi\", Shalvi/Hyman Encyclopedia of Jewish Women, Jewish Women's Archive", "categories": null, "location": {"lat": 51.2194, "lng": 4.4025, "city": "אנטוורפן", "note": "אנטוורפן היא נקודת הפיקוד של רשת המילוט — 'Starting in Antwerp, she began to develop an escape network' (הציטוט שכבר היה בשורה), ושכטר וספריית הלאומי מאשרים שמשם הופעלה ההברחה. המעש עצמו חוצה יבשות (ליסבון → אנטוורפן → מעבר האלפים → ונציה/פרארה → קונסטנטינופול), ולכן precision גבוה מ-city יהיה המצאה. אין למקורות כתובת.", "city_en": "Antwerp", "country": "בלגיה", "precision": "city", "country_en": "Belgium"}, "people": [{"aka_en": "Beatriz de Luna Miques", "aka_he": "ביאטריס דה לונה", "name_en": "Doña Gracia Mendes Nasi", "name_he": "דונה גרציה נשיא", "role_he": "ראש רשת המילוט; בעלת בית המסחר מנדס"}, {"name_en": "Diogo Mendes", "name_he": "דיוגו מנדס", "role_he": "גיסה ושותפה באנטוורפן; לפי הביוגרפית אנדרה ברוקס — מי שסיפק לבורחים ניירות והוראות המשך"}, {"aka_en": "João Micas", "name_en": "Joseph Nasi", "name_he": "יוסף נשיא", "role_he": "אחיינה ויד ימינה; שותף לחרם אנקונה ולפרויקט טבריה"}, {"name_en": "Samuel Usque", "name_he": "", "role_he": "בן-הזמן שתיעד את מאמצי החילוץ שלה בספרו 'תנחומות לתלאות ישראל' (פרארה 1553) — המקור הראשוני שעליו נשענים החוקרים"}], "deed_type": ["חסד וצדקה", "זכויות אדם"], "actor_type": "אדם יחיד", "beneficiary": ["לזרים"], "audit": {"at": "2026-08-10T10:00:13+00:00", "by": "standard-pass/opus-5", "state": "complete", "videos": [{"url": "https://www.youtube.com/watch?v=Rq30Ikq4S20", "why": "סרטון-על: שיחה של מוזיאון המורשת היהודית בניו יורק עם אנדרה אליון ב ל המקורות העבריים שמשכתי — מכון שכטר, גלובס — כותבים 'גרציה' ו'נשיא'. הכתיב שבשורה ('גרסיה', 'נסי') הוא תעתיק מאנגלית ולא הכתיב המקובל בעברית.", "field": "title / people spelling", "evidence_url": "https://schechter.ac.il/article/dona-gracia/"}], "domains_covered": 5, "image_provenance": [{"url": "https://upload.wikimedia.org/wikipedia/commons/9/9c/Gracianasimedal.jpg", "credit": "מדליה מאת Pastorino di Giovan Michele de' Pastorini, אוסף The Jewish Museum. נחלת הכלל.", "source": "https://commons.wikimedia.org/wiki/File:Gracianasimedal.jpg", "warning": "לא דיוקן מאומת של דונה גרסיה — לא ידוע על דיוקן מהחיים שלה עצמה.", "shot_when": "1558", "caption_he": "מדליית ארד, איטליה של המאה ה-16 (מיוחסת לפסטורינו דה' פסטוריני). הכתובת מימין — A·Æ·XVIII — אומרת שהמצולמת בת 18, ולכן זו גרציה נשיא הצעירה, אחייניתה וכלתה של דונה גרסיה, ולא דונה גרסיה עצמה שהייתה אז כבת ארבעים."}, {"url": "https://upload.wikimedia.org/wikipedia/commons/a/a8/Nezi.jpg", "credit": "תחריט מתוך William Miller, The Latins in the Levant: a history of Frankish Greece (1204-1566), London 1908. נחלת הכלל.", "source": "https://commons.wikimedia.org/wiki/File:Nezi.jpg", "warning": "לא דיוקן מאומת של דונה גרסיה — לא ידוע על דיוקן מהחיים שלה עצמה.", "shot_when": "1908 (הדפסת התחריט); הדמות המתוארת — דונה גרציה מנדס", "caption_he": "תחריט קו מספר היסטוריה משנת 1908 — העתק מצויר של אותה מדליה בדיוק: אותו פרופיל שמאלה, אותה מסגרת חרוזים, אותה כתובת עברית ואותו A·Æ·XVIII. לכן גם הוא מתאר את גרציה נשיא הצעירה."}, {"url": "https://upload.wikimedia.org/wikipedia/commons/d/d6/Consolasam_samuel_usque.jpg", "credit": "שער המהדורה של 'Consolacam as tribulacoens de Israel' מאת שמואל אושקי, דפוס אברהם אושקי, פרארה 1553. נחלת הכלל.", "source": "https://commons.wikimedia.org/wiki/File:Consolasam_samuel_usque.jpg", "shot_when": "1553", "caption_he": "שער הספר שהוקדש לדונה גרציה — המקור בן-הזמן שמתעד את מאמצי החילוץ שלה, וזה שהציטוט מ-JWA מתייחס אליו."}, {"url": "https://upload.wikimedia.org/wikipedia/commons/d/d1/Ferrara_Bible.jpg", "credit": "תנ\"ך פרארה, אברהם אושקי ויום-טוב אטיאס, 1553. אוסף המוזיאון היהודי של אמסטרדם. נחלת הכלל.", "source": "https://commons.wikimedia.org/wiki/File:Ferrara_Bible.jpg", "shot_when": "1553", "caption_he": "שער תנ\"ך פרארה — התרגום לספרדית שדונה גרציה מימנה עבור אנוסים ששכחו עברית."}, {"url": "https://upload.wikimedia.org/wikipedia/commons/7/7c/Genesis_ferrara_bible.jpg", "credit": "תנ\"ך פרארה, אברהם אושקי ויום-טוב אטיאס, 1553. באדיבות Museum of the Inquisition, Mexico City. נחלת הכלל.", "source": "https://commons.wikimedia.org/wiki/File:Genesis_ferrara_bible.jpg", "shot_when": "1553", "caption_he": "עמוד ספר בראשית מתוך תנ\"ך פרארה."}, {"url": "https://upload.wikimedia.org/wikipedia/commons/f/fa/Inquisition_and_the_Jews_Tiberias.JPG", "credit": "צילום: Team Venture, עבודה עצמית, CC BY-SA 4.0. התצוגה 'האינקוויזיציה והיהודים' במוזיאון בית דונה גרציה, טבריה.", "source": "https://commons.wikimedia.org/wiki/File:Inquisition_and_the_Jews_Tiberias.JPG", "shot_when": "2014-11-18", "caption_he": "תצוגת האינקוויזיציה במוזיאון בית דונה גרציה בטבריה."}, {"url": "https://upload.wikimedia.org/wikipedia/commons/e/e9/PikiWiki_Israel_77873_dona_gracia_wall_in_tiberias.jpg", "credit": "צילום: נחום סיון וצביקה סחייק, שימור מורשת טבריה והסביבה, דרך פיקיוויקי, CC BY 2.5.", "source": "https://commons.wikimedia.org/wiki/File:PikiWiki_Israel_77873_dona_gracia_wall_in_tiberias.jpg", "shot_when": "2021-02-13", "caption_he": "שריד 'חומת דונה גרציה' בטבריה — החומה שמימונה מיוחס לה."}, {"url": "https://upload.wikimedia.org/wikipedia/commons/9/9e/PikiWiki_Israel_11851_dona_gracia_lookout_tiberias.jpg", "credit": "צילום: ד\"ר אבישי טייכר, דרך פיקיוויקי, CC BY 2.5.", "source": "https://commons.wikimedia.org/wiki/File:PikiWiki_Israel_11851_dona_gracia_lookout_tiberias.jpg", "shot_when": "2011-02-07", "caption_he": "מצפה דונה גרציה בטבריה."}, {"url": "https://upload.wikimedia.org/wikipedia/commons/0/0c/Dona_Gracia_Hotel_and_Museum_Tiberias_01.jpg", "credit": "צילום: Hoshvilim, עבודה עצמית, CC BY-SA 4.0.", "source": "https://commons.wikimedia.org/wiki/File:Dona_Gracia_Hotel_and_Museum_Tiberias_01.jpg", "shot_when": "2013-10-15", "caption_he": "מלון ומוזיאון דונה גרציה בטבריה."}]}, "dedup": null, "origin_story": null, "origin_story_en": null, "aftermath": null, "aftermath_en": null, "recognition": null, "recognition_en": null, "honors": null, "summary_short": "דונה גרסיה מנדס נסי ניהלה במאה ה-16 בית מסחר בין-לאומי, ואת רשת הסחר המשפחתית הפעילה מאנטוורפן גם כקו מילוט: דרכה יצאו מאות אנוסים מספרד ומפורטוגל אל ארצות מקלט, מחוץ להישג ידה של האינקוויזיציה. מאות משפחות ניצלו כך ממאסר ומשריפה, והקהילות היהודיות באיטליה ובאימפריה העות'מאנית התחזקו בזכות הפליטים שהגיעו אליהן. במקביל להברחות מימנה בתי דפוס וקהילות יהודיות בקונסטנטינופול.", "summary_short_en": "Doña Gracia Mendes Nasi ran an international trading house in the 16th century, and from Antwerp she worked her family's trade network as an escape line as well: along it hundreds of Conversos left Spain and Portugal for lands of refuge, beyond the reach of the Inquisition. Hundreds of families were saved from imprisonment and burning, and the Jewish communities of Italy and the Ottoman Empire were strengthened by the refugees who reached them. Alongside the smuggling she funded printing houses and Jewish communities in Constantinople."}, "changed": ["source_url", "source_label", "citations", "media_urls", "source_label_en", "location", "people", "deed_type", "actor_type", "beneficiary", "audit", "summary_short", "summary_short_en"], "m_before": {"citations": 2, "domains": 1, "images": 2, "people": 0, "videos": 0, "location": 0, "honors": 0, "chars": 421, "std": 17}, "m_after": {"citations": 5, "domains": 5, "images": 9, "people": 4, "videos": 3, "location": 1, "honors": 0, "chars": 421, "std": 34}, "std_total": 46, "failing": [36, 42, 43, 48, 49, 57, 62, 64, 65, 66, 67, 77]}, {"id": "988815b9-3564-4d60-9fcc-3f41bff6de29", "title": "דן שכטמן ראה סימטריה אסורה, ספג לעג — ושינה את הגדרת הגביש", "year": 1982, "before": {"id": "988815b9-3564-4d60-9fcc-3f41bff6de29", "title": "דן שכטמן גילה קריסטלים שנחשבו בלתי אפשריים — ושינה את תפיסת מדע החומרים", "description": "ב-1982 גילה פרופסור דן שכטמן מהטכניון דפוס הפזה שסתר את כל חוקי הגבישנות המקובלים. עמיתיו לעגו לו, ואחד מהם ביקשו לעזוב את הקבוצה. שכטמן דבק בממצאיו. ב-2011 הכריז ועד פרס נובל שהם צדקו: הוא זכה בפרס נובל לכימיה לבדו על גילוי קריסטלים מעין-תקופתיים — קווזי-קריסטלים.", "category": "המצאה מדעית", "year": 1982, "media_type": "video_embed", "media_url": "https://www.youtube.com/watch?v=z3oKhYhOVSk", "source_url": "https://www.nobelprize.org/prizes/chemistry/2011/shechtman/facts/", "source_label": "NobelPrize.org", "submitted_by": null, "status": "approved", "created_at": "2026-06-21 02:40:16.258573+00", "citations": [{"quote": "for the discovery of quasicrystals", "locator": "Prize motivation", "source_url": "https://www.nobelprize.org/prizes/chemistry/2011/shechtman/facts/", "source_label": "NobelPrize.org", "source_label_en": "NobelPrize.org"}, {"quote": "In 1982, when Dan Shechtman was studying what are known as diffraction patterns, which occur when x-rays are passed through the crystals, he discovered a regular diffraction pattern that did not match any periodically repeated structure. This showed that there are crystal structures that are mathematically regular, but that do not repeat themselves.", "locator": "Work section", "source_url": "https://www.nobelprize.org/prizes/chemistry/2011/shechtman/facts/", "source_label": "NobelPrize.org", "source_label_en": "NobelPrize.org"}], "act": "ב-1982 ישב דן שכטמן מהטכניון מול המיקרוסקופ האלקטרוני וראה דבר שלא יכול להתקיים לפי כל ספרי הפיזיקה: סדר מתמטי מוחלט ללא חזרה תקופתית. עמיתיו לעגו, ומנהל קבוצתו ביקשו לעזוב. הוא קיבל את ממצאיו ודבק בהם במשך שנים.", "ripple": "ב-2011, כמעט שלושים שנה מאוחר יותר, הכריז ועד פרס נובל: גילוי הקווזי-קריסטלים שינה ביסודו את תפיסת המדענים לגבי מה שמוצק יכול להיות. שכטמן קיבל את הפרס לבדו — ומדע החומרים לא יהיה עוד כשהיה.", "title_reasoning": "הכותרת שמה את השם (דן שכטמן) קודם עם הפועל (גילה), ואז מזכירה את הבלתי אפשריים — פרט אנושי שמעביר את ההתנגדות שפגש. החלק השני מסכם את ההשפעה בלי להגיד נובל (זה בתיאור). לא נכנסנו לעדה יונת שכבר קיימת — שכטמן הוא דמות ותחום שונה לגמרי.", "media_urls": [], "title_en": "Dan Shechtman Discovered Crystals Thought to Be Impossible — Transforming the Science of Materials", "description_en": "In 1982, Professor Dan Shechtman of the Technion discovered a diffraction pattern that contradicted all accepted laws of crystallography. His colleagues mocked him, and one of them asked him to leave the research group. Shechtman stood by his findings. In 2011, the Nobel committee declared he was right: he was awarded the Nobel Prize in Chemistry — alone — for the discovery of quasicrystals.", "act_en": "In 1982, Dan Shechtman of the Technion sat at an electron microscope and saw something that could not exist according to any physics textbook: perfect mathematical order without periodic repetition. His colleagues scoffed, and his group leader asked him to leave. He accepted his findings and stood by them for years.", "ripple_en": "In 2011, nearly three decades later, the Nobel committee declared: the discovery of quasicrystals fundamentally changed scientists' understanding of what a solid can be. Shechtman received the prize alone — and the science of materials would never be the same.", "source_label_en": "NobelPrize.org", "categories": null, "location": null, "people": null, "deed_type": null, "actor_type": null, "beneficiary": null, "audit": null, "dedup": null, "origin_story": null, "origin_story_en": null, "aftermath": null, "aftermath_en": null, "recognition": null, "recognition_en": null, "honors": null}, "after": {"id": "988815b9-3564-4d60-9fcc-3f41bff6de29", "title": "דן שכטמן ראה סימטריה אסורה, ספג לעג — ושינה את הגדרת הגביש", "description": "בבוקר 8 באפריל 1982, במעבדה של לשכת התקנים האמריקאית (NBS, היום NIST) בגייתרסברג שבמרילנד, הביט דן שכטמן — חוקר מהטכניון שיצא לשבתון — במיקרוסקופ האלקטרוני וראה תבנית עקיפה בעלת סימטריה של פי עשרה. ספרי הקריסטלוגרפיה קבעו שסימטריה כזו אסורה בגביש מחזורי. הוא ספר את הנקודות עם כיוון השעון, ספר שוב נגדו, רשם ביומן המעבדה \"10 Fold ???\" ואמר לעצמו בעברית: \"אין חיה כזו\". שנתיים וחצי לא הצליח לפרסם, עמיתים הושיטו לו ספרי לימוד ולעגו לו, וראש קבוצת המחקר ביקש ממנו לעזוב. ב-2011 קיבל לבדו את פרס נובל לכימיה \"על גילוי הגבישים הקוואזי-מחזוריים\", ובעקבות התגלית שינה האיגוד הבינלאומי לקריסטלוגרפיה את עצם ההגדרה של המילה \"גביש\".", "category": "המצאה מדעית", "year": 1982, "media_type": "image", "media_url": "https://www.nist.gov/sites/default/files/images/2017/03/18/shechtman_notebook.jpg", "source_url": "https://www.nobelprize.org/prizes/chemistry/2011/press-release/", "source_label": "הודעת הפרס של האקדמיה המלכותית השוודית למדעים — פרס נובל לכימיה 2011", "submitted_by": null, "status": "approved", "created_at": "2026-06-21 02:40:16.258573+00", "citations": [{"quote": "for the discovery of quasicrystals", "locator": "נימוק הפרס, בראש ההודעה, מתחת לשם הזוכה ולשיוך \"Technion – Israel Institute of Technology, Haifa, Israel\"", "published": "2011-10-05", "source_url": "https://www.nobelprize.org/prizes/chemistry/2011/press-release/", "source_label": "הודעת הפרס של האקדמיה המלכותית השוודית למדעים — פרס נובל לכימיה 2011", "source_label_en": "Press release, The Royal Swedish Academy of Sciences — Nobel Prize in Chemistry 2011"}, {"quote": "On the morning of 8 April 1982, an image counter to the laws of nature appeared in Dan Shechtman's electron microscope.", "locator": "פסקה ראשונה של גוף ההודעה, מתחת לכותרת המשנה", "published": "2011-10-05", "source_url": "https://www.nobelprize.org/prizes/chemistry/2011/press-release/", "source_label": "הודעת הפרס של האקדמיה המלכותית השוודית למדעים — פרס נובל לכימיה 2011", "source_label_en": "Press release, The Royal Swedish Academy of Sciences — Nobel Prize in Chemistry 2011"}, {"quote": "His discovery was extremely controversial. In the course of defending his findings, he was asked to leave his research group.", "locator": "גוף ההודעה, מיד אחרי ההסבר על התבנית שאינה חוזרת", "published": "2011-10-05", "source_url": "https://www.nobelprize.org/prizes/chemistry/2011/press-release/", "source_label": "הודעת הפרס של האקדמיה המלכותית השוודית למדעים — פרס נובל לכימיה 2011", "source_label_en": "Press release, The Royal Swedish Academy of Sciences — Nobel Prize in Chemistry 2011"}, {"quote": "In the notebook from Dan Shechtman recording his electron microscopy session on 8 April 1982, the entry for exposure 1725 has the comment: 10 Fold ???", "locator": "עמוד 3, הפסקה שמעל איור 3 (\"The notebook of Dan Shechtman dating the discovery of quasicrystals to 8 April 1982\")", "published": "2011-10-05", "source_url": "https://www.nobelprize.org/uploads/2018/06/advanced-chemistryprize2011-1.pdf", "source_label": "הרקע המדעי לפרס נובל לכימיה 2011, ועדת נובל לכימיה (PDF)", "source_label_en": "Scientific Background on the Nobel Prize in Chemistry 2011, The Nobel Committee for Chemistry (PDF)"}, {"quote": "The achievement of Dan Shechtman is clearly not only the discovery of quasicrystals, but the realization of the importance of this result and the determination to communicate it to a skeptical scientific community.", "locator": "עמוד 4, הפסקה החותמת את הדיון בגילוי", "published": "2011-10-05", "source_url": "https://www.nobelprize.org/uploads/2018/06/advanced-chemistryprize2011-1.pdf", "source_label": "הרקע המדעי לפרס נובל לכימיה 2011, ועדת נובל לכימיה (PDF)", "source_label_en": "Scientific Background on the Nobel Prize in Chemistry 2011, The Nobel Committee for Chemistry (PDF)"}, {"quote": "“Eyn chaya kazo”, Dan Shechtman said to himself. “There can be no such creature” in Hebrew. It was the morning of 8 April 1982.", "locator": "פתיחת הפרק \"Crystals of golden proportions\"", "published": "2011-10-05", "source_url": "https://www.nobelprize.org/prizes/chemistry/2011/popular-information/", "source_label": "המידע הפופולרי של ועדת נובל — פרס נובל לכימיה 2011", "source_label_en": "Popular information, The Nobel Committee for Chemistry 2011"}, {"quote": "All the commotion finally led his boss to ask him to leave the research group, as Schechtman himself recalled later.", "locator": "פרק \"Wrong according to the textbook\", מיד אחרי המשפט על ספר הקריסטלוגרפיה שנתן לו ראש המעבדה", "published": "2011-10-05", "source_url": "https://www.nobelprize.org/prizes/chemistry/2011/popular-information/", "source_label": "המידע הפופולרי של ועדת נובל — פרס נובל לכימיה 2011", "source_label_en": "Popular information, The Nobel Committee for Chemistry 2011"}, {"quote": "In 1992, this realization led the International Union of Crystallography to alter its definition of what a crystal is.", "locator": "פרק \"Aperiodic mosaics\", לפני ציטוט שתי ההגדרות", "published": "2011-10-05", "source_url": "https://www.nobelprize.org/prizes/chemistry/2011/popular-information/", "source_label": "המידע הפופולרי של ועדת נובל — פרס נובל לכימיה 2011", "source_label_en": "Popular information, The Nobel Committee for Chemistry 2011"}, {"quote": "Dan Shechtman delivered his Nobel Lecture on 8 December 2011, at Aula Magna, Stockholm University, where he was introduced by Professor Lars Thelander, Chairman of the Nobel Committee for Chemistry.", "locator": "משפט התיאור מתחת לנגן הווידאו; כותרת ההרצאה \"Quasi-Periodic Materials – A Paradigm Shift in Crystallography\"", "published": "2011-12-08", "source_url": "https://www.nobelprize.org/prizes/chemistry/2011/shechtman/lecture/", "source_label": "הרצאת נובל של דן שכטמן — NobelPrize.org", "source_label_en": "Dan Shechtman's Nobel Lecture — NobelPrize.org"}, {"quote": "Prize motivation: “for the discovery of quasicrystals” Prize share: 1/1", "locator": "ראש עמוד העובדות, מתחת לשיוך המוסדי", "published": "2011", "source_url": "https://www.nobelprize.org/prizes/chemistry/2011/shechtman/facts/", "source_label": "עמוד העובדות של דן שכטמן — NobelPrize.org", "source_label_en": "Dan Shechtman – Facts, NobelPrize.org"}, {"quote": "In 1982, when Dan Shechtman was studying what are known as diffraction patterns, which occur when x-rays are passed through the crystals, he discovered a regular diffraction pattern that did not match any periodically repeated structure.", "locator": "סעיף \"Work\" — מובא כאן כדי לתעד שגיאה בעמוד עצמו: העקיפה הייתה של אלקטרונים, לא של קרני רנטגן (ראה corrections)", "published": "2011", "source_url": "https://www.nobelprize.org/prizes/chemistry/2011/shechtman/facts/", "source_label": "עמוד העובדות של דן שכטמן — NobelPrize.org", "source_label_en": "Dan Shechtman – Facts, NobelPrize.org"}, {"quote": "His study, sponsored by the Defense Advanced Research Projects Agency, was designed to develop aluminum-transition metal alloys for aerospace applications.", "locator": "פסקה שנייה, אחרי המשפט על עבודתו ב-NBS", "published": "2016-09-28", "source_url": "https://www.nist.gov/nist-and-nobel/dan-shechtman", "source_label": "NIST — דן שכטמן, עמוד הפתיחה בסדרת 'NIST והנובל'", "source_label_en": "NIST — Dan Shechtman, 'NIST and the Nobel'"}, {"quote": "Though his appointment was technically at Johns Hopkins University in Baltimore, Maryland, Shechtman was hosted by Cahn and worked at NIST’s Gaithersburg, Maryland, campus.", "locator": "החלק המתאר את הגעתו לארצות הברית ב-1981", "published": "2016-09-28", "source_url": "https://www.nist.gov/nist-and-nobel/dan-shechtman/person-behind-nobel-prize-dan-shechtman", "source_label": "NIST — האדם שמאחורי פרס נובל: דן שכטמן", "source_label_en": "NIST — The Person behind the Nobel Prize: Dan Shechtman"}, {"quote": "“DARPA wanted me to develop useful alloys, and I did,” Shechtman says. “But I also prepared alloys that were not useful, but were interesting.”", "locator": "החלק המתאר את פרויקט הסגסוגות במעבדתו של ויליאם בוטינגר", "published": "2016-09-28", "source_url": "https://www.nist.gov/nist-and-nobel/dan-shechtman/context-discovery-dan-shechtman", "source_label": "NIST — ההקשר של הגילוי: דן שכטמן", "source_label_en": "NIST — Context of a Discovery: Dan Shechtman"}, {"quote": "On April 8, 1982, Shechtman was studying an alloy containing 86 percent aluminum atoms and 14 percent manganese atoms, which Boettinger lab member Frank Biancaniello had produced using melt spinning.", "locator": "פסקת הפתיחה של \"The Nobel Moment\"", "published": "2016-09-30", "source_url": "https://www.nist.gov/nist-and-nobel/dan-shechtman/nobel-moment-dan-shechtman", "source_label": "NIST — רגע הנובל: דן שכטמן", "source_label_en": "NIST — The Nobel Moment: Dan Shechtman"}, {"quote": "He remembers, “I said to myself in Hebrew, ‘There ain’t no such animal,’”", "locator": "החלק המתאר את רגע התצפית, לפני ההסבר על תאומי גבישים", "published": "2016-09-30", "source_url": "https://www.nist.gov/nist-and-nobel/dan-shechtman/nobel-moment-dan-shechtman", "source_label": "NIST — רגע הנובל: דן שכטמן", "source_label_en": "NIST — The Nobel Moment: Dan Shechtman"}, {"quote": "My initial reaction was, ‘Go away, Danny. These are twins and that’s not terribly interesting,’", "locator": "ציטוט של ג'ון כהאן בדיעבד, מיד אחרי \"Shechtman then took his results to Cahn\"", "published": "2016-09-30", "source_url": "https://www.nist.gov/nist-and-nobel/dan-shechtman/nobel-moment-dan-shechtman", "source_label": "NIST — רגע הנובל: דן שכטמן", "source_label_en": "NIST — The Nobel Moment: Dan Shechtman"}, {"quote": "The committee presented its report in 1991, with the following definition: “By crystal we mean any solid having an essentially discrete diffraction diagram, and by aperiodic crystal we mean any crystal in which three-dimensional lattice periodicity can be considered to be absent.”", "locator": "החלק על פנייתו של שכטמן לאיגוד הבינלאומי לקריסטלוגרפיה — ראה disputes: 1991 מול 1992", "published": "2016-09-30", "source_url": "https://www.nist.gov/nist-and-nobel/dan-shechtman/nobel-moment-dan-shechtman", "source_label": "NIST — רגע הנובל: דן שכטמן", "source_label_en": "NIST — The Nobel Moment: Dan Shechtman"}, {"quote": "Just five weeks after the Shechtman paper came out, Steinhardt, along with physicist Dov Levine at the Technion, published a paper , also in PRL , putting the results into a larger theoretical context", "locator": "החלק על פול שטיינהרדט שסקר את כתב היד — ראה disputes: חמישה שבועות מול שישה", "published": "2016-09-30", "source_url": "https://www.nist.gov/nist-and-nobel/dan-shechtman/nobel-moment-dan-shechtman", "source_label": "NIST — רגע הנובל: דן שכטמן", "source_label_en": "NIST — The Nobel Moment: Dan Shechtman"}, {"quote": "He even reportedly said at one point, “There are no quasicrystals, only quasi-scientists.”", "locator": "הפסקה על לינוס פאולינג, אחרי \"only one prominent opponent to quasicrystals remained\"", "published": "2016-09-30", "source_url": "https://www.nist.gov/nist-and-nobel/dan-shechtman/nobel-moment-dan-shechtman", "source_label": "NIST — רגע הנובל: דן שכטמן", "source_label_en": "NIST — The Nobel Moment: Dan Shechtman"}, {"quote": "Pauling died in 1994, having never accepted quasicrystals.", "locator": "הפסקה החותמת את הדיון בפאולינג", "published": "2016-09-30", "source_url": "https://www.nist.gov/nist-and-nobel/dan-shechtman/nobel-moment-dan-shechtman", "source_label": "NIST — רגע הנובל: דן שכטמן", "source_label_en": "NIST — The Nobel Moment: Dan Shechtman"}, {"quote": "“there’s no killer application for this material that revolutionized anything.” The revolution has been conceptual, rather than commercial.", "locator": "החלק על יישומים, ציטוט של ויליאם בוטינגר מ-NIST", "published": "2016-09-28", "source_url": "https://www.nist.gov/nist-and-nobel/dan-shechtman/prizes-legacy-dan-shechtman", "source_label": "NIST — מורשת הפרס: דן שכטמן", "source_label_en": "NIST — The Prize's Legacy: Dan Shechtman"}, {"quote": "While he still holds his position at Technion, since 2004, he has also been a professor of materials science at Iowa State University in Ames, Iowa.", "locator": "הפסקה החותמת את החלק על עבודתו אחרי הגבישים הקוואזי-מחזוריים", "published": "2016-09-28", "source_url": "https://www.nist.gov/nist-and-nobel/dan-shechtman/prizes-legacy-dan-shechtman", "source_label": "NIST — מורשת הפרס: דן שכטמן", "source_label_en": "NIST — The Prize's Legacy: Dan Shechtman"}, {"quote": "I have found it hard to believe that any single crystal with 5-fold axes could give reasonably sharp diffraction patterns, resembling those given by crystals, and I have not been convinced to the contrary by the theoretical discussions of this possibility that have been published", "locator": "Abstract, המשפט השני; Letter, Nature 317, 512–514, שהתקבל 4.9.1985 ופורסם 1.10.1985", "published": "1985-10-01", "source_url": "https://www.nature.com/articles/317512a0", "source_label": "לינוס פאולינג, מכתב ב-Nature 317, 512–514 — המסמך בן-הזמן של ההתנגדות", "source_label_en": "Linus Pauling, Letter, Nature 317, 512–514 — the contemporary document of the opposition"}, {"quote": "“I remember counting the diffraction peaks clockwise, one by one up to 10, and thinking that it couldn’t be,” says Shechtman. “So I counted the other way, counterclockwise. Still 10!”", "locator": "החלק המתאר את 8 באפריל 1982", "published": "2011-12-01", "source_url": "https://physicstoday.aip.org/news/nobel-prize-in-chemistry-honors-the-discovery-of-quasicrystals", "source_label": "Physics Today — פרס נובל לכימיה על גילוי הגבישים הקוואזי-מחזוריים", "source_label_en": "Physics Today — Nobel Prize in Chemistry honors the discovery of quasicrystals"}, {"quote": "“By the end of that day, I knew that I had something special,” recalls Shechtman. “I did not know what it was, but I knew what it was not. And it was not twinning.”", "locator": "אותו חלק, אחרי תיאור ניסויי הבדיקה של אותו יום", "published": "2011-12-01", "source_url": "https://physicstoday.aip.org/news/nobel-prize-in-chemistry-honors-the-discovery-of-quasicrystals", "source_label": "Physics Today — פרס נובל לכימיה על גילוי הגבישים הקוואזי-מחזוריים", "source_label_en": "Physics Today — Nobel Prize in Chemistry honors the discovery of quasicrystals"}, {"quote": "Shechtman and colleagues’ paper detailing the discovery of the icosahedral phase was published in Physical Review Letters on 12 November 1984. Six weeks later, on Christmas Eve, Steinhardt and Levine’s work on quasiperiodicity appeared in the same journal.", "locator": "סוף החלק על הפרסום, לפני הפרק \"Critical review\"", "published": "2011-12-01", "source_url": "https://physicstoday.aip.org/news/nobel-prize-in-chemistry-honors-the-discovery-of-quasicrystals", "source_label": "Physics Today — פרס נובל לכימיה על גילוי הגבישים הקוואזי-מחזוריים", "source_label_en": "Physics Today — Nobel Prize in Chemistry honors the discovery of quasicrystals"}, {"quote": "A turning point was the 1987 discovery by An-Pang Tsai (Tohoku University, Japan) and colleagues of a thermodynamically stable icosahedral phase", "locator": "פרק \"Critical review\", הפסקה על נקודת המפנה", "published": "2011-12-01", "source_url": "https://physicstoday.aip.org/news/nobel-prize-in-chemistry-honors-the-discovery-of-quasicrystals", "source_label": "Physics Today — פרס נובל לכימיה על גילוי הגבישים הקוואזי-מחזוריים", "source_label_en": "Physics Today — Nobel Prize in Chemistry honors the discovery of quasicrystals"}, {"quote": "His pathbreaking work on crystallinity, greeted initially with derision and skepticism, came to upend basic notions in science about the atomic structure of matter.", "locator": "פסקת הפתיחה של הכתבה, כרך 89 גיליון 41, 10 באוקטובר 2011", "published": "2011-10-10", "source_url": "https://cen.acs.org/articles/89/i41/Nobel-Prize-Chemistry.html", "source_label": "Chemical & Engineering News, כרך 89 גיליון 41", "source_label_en": "Chemical & Engineering News, vol. 89 issue 41"}, {"quote": "told C&EN in 1999 that when he began reporting his findings at meetings, colleagues handed him textbooks and told him that if he studied them, he would realize his claims were impossible", "locator": "גוף הכתבה, הפסקה על קבלת הפנים הביקורתית — מפנה לראיון C&EN עם שכטמן מ-1999", "published": "2011-10-10", "source_url": "https://cen.acs.org/articles/89/i41/Nobel-Prize-Chemistry.html", "source_label": "Chemical & Engineering News, כרך 89 גיליון 41", "source_label_en": "Chemical & Engineering News, vol. 89 issue 41"}, {"quote": "For a long time, it was me against the world. I was a subject of ridicule and lectures about the basics of crystallography.", "locator": "ציטוט מודגש בגוף הכתבה, תחת הכותרת \"Quasicrystal flag bearer\"", "published": "2011-10-06", "source_url": "https://archive.inside.iastate.edu/2011/1006/nobel.php", "source_label": "Inside Iowa State — עיתון אוניברסיטת איווה, 6 באוקטובר 2011", "source_label_en": "Inside Iowa State — Iowa State University, 6 October 2011"}, {"quote": "In his notebook that day, Shechtman wrote \"(10 Fold ???).\" Later, he found the pattern was really a five-fold rotation, but that didn't show up in the first experiments.", "locator": "החלק \"The experiment\"", "published": "2011-10-06", "source_url": "https://archive.inside.iastate.edu/2011/1006/nobel.php", "source_label": "Inside Iowa State — עיתון אוניברסיטת איווה, 6 באוקטובר 2011", "source_label_en": "Inside Iowa State — Iowa State University, 6 October 2011"}, {"quote": "“What Danny did was fantastic science,” she said. “He instigated a scientific revolution.”", "locator": "ציטוט של פרופ' פט תיאל, אוניברסיטת איווה ומעבדת איימס, ביום ההכרזה", "published": "2011-10-06", "source_url": "https://archive.inside.iastate.edu/2011/1006/nobel.php", "source_label": "Inside Iowa State — עיתון אוניברסיטת איווה, 6 באוקטובר 2011", "source_label_en": "Inside Iowa State — Iowa State University, 6 October 2011"}, {"quote": "A fivefold axis is, however, forbidden in a periodic crystal.", "locator": "סעיף Information, הפסקה שאחרי תיאור הגילוי", "published": "2011", "source_url": "https://www.engineering.iastate.edu/people/profile/dannys/", "source_label": "עמוד הסגל של דן שכטמן, הפקולטה להנדסה, אוניברסיטת איווה", "source_label_en": "Dan Shechtman's faculty profile, College of Engineering, Iowa State University"}, {"quote": "He generated a series of dark-field images, and also performed a convergent-beam experiment. These showed that the icosahedral symmetry was not due to twinning, but rather was present on the atomic scale.", "locator": "סעיף Information, הפסקה על פסילת השערת התאומים", "published": "2011", "source_url": "https://www.engineering.iastate.edu/people/profile/dannys/", "source_label": "עמוד הסגל של דן שכטמן, הפקולטה להנדסה, אוניברסיטת איווה", "source_label_en": "Dan Shechtman's faculty profile, College of Engineering, Iowa State University"}, {"quote": "עורכי ה-Journal of Applied Physics כתבו: “המאמר לא יעניין פיסיקאים. אנו ממליצים לשלוח אותו לעיתון של מטלורגים (חוקרי מתכות)”", "locator": "גוף ההודעה, הפסקה על דחיית המאמר בקיץ 1984", "quote_en": "The editors of the Journal of Applied Physics wrote: “The paper will not interest physicists. We recommend sending it to a metallurgists' journal.”", "published": "2011-10-05", "source_url": "https://www.technion.ac.il/blog/2011/10/%d7%a4%d7%a8%d7%95%d7%a4%d7%a1%d7%95%d7%a8-%d7%9e%d7%97%d7%a7%d7%a8-%d7%93%d7%9f-%d7%a9%d7%9b%d7%98%d7%9e%d7%9f-%d7%9e%d7%94%d7%98%d7%9b%d7%a0%d7%99%d7%95%d7%9f-%d7%97%d7%aa%d7%9f-%d7%a4/", "source_label": "הודעת הטכניון, 5 באוקטובר 2011", "source_label_en": "Technion announcement, 5 October 2011"}, {"quote": "בעקבות התגלית ואישושה שינתה האגודה הבינלאומית של מדעני הקריסטלוגרפיה את הגדרת הגביש מיסודה", "locator": "הפסקה שלפני האחרונה בגוף ההודעה, אחרי המשפט על 40 הספרים המדעיים", "quote_en": "Following the discovery and its confirmation, the International Union of Crystallography changed the definition of a crystal from its foundations", "published": "2011-10-05", "source_url": "https://www.technion.ac.il/blog/2011/10/%d7%a4%d7%a8%d7%95%d7%a4%d7%a1%d7%95%d7%a8-%d7%9e%d7%97%d7%a7%d7%a8-%d7%93%d7%9f-%d7%a9%d7%9b%d7%98%d7%9e%d7%9f-%d7%9e%d7%94%d7%98%d7%9b%d7%a0%d7%99%d7%95%d7%9f-%d7%97%d7%aa%d7%9f-%d7%a4/", "source_label": "הודעת הטכניון, 5 באוקטובר 2011", "source_label_en": "Technion announcement, 5 October 2011"}, {"quote": "בישראל הוצמד שם לחומר בעל המבנה החדש –”שכטמנית”", "locator": "המשפט האחרון בגוף ההודעה", "quote_en": "In Israel the material with the new structure was given a name — “Shechtmanite”", "published": "2011-10-05", "source_url": "https://www.technion.ac.il/blog/2011/10/%d7%a4%d7%a8%d7%95%d7%a4%d7%a1%d7%95%d7%a8-%d7%9e%d7%97%d7%a7%d7%a8-%d7%93%d7%9f-%d7%a9%d7%9b%d7%98%d7%9e%d7%9f-%d7%9e%d7%94%d7%98%d7%9b%d7%a0%d7%99%d7%95%d7%9f-%d7%97%d7%aa%d7%9f-%d7%a4/", "source_label": "הודעת הטכניון, 5 באוקטובר 2011", "source_label_en": "Technion announcement, 5 October 2011"}, {"quote": "In 1981-l983 he was on Sabbatical at the Johns Hopkins University, where he studied rapidly solidified aluminum transition metal alloys (joint program with NBS). During this study he discovered the Icosahedral Phase which opened the new field of quasiperiodic crystals.", "locator": "סעיף CV בראש העמוד (מודפס במקור עם שגיאת הקלדה: \"1981-l983\", באות L קטנה במקום הספרה 1)", "published": "2011", "source_url": "https://materials.technion.ac.il/en/team/distinguished-prof-emeritus-dan-shechtman/", "source_label": "עמוד הסגל של דן שכטמן, הפקולטה למדע והנדסה של חומרים, הטכניון", "source_label_en": "Dan Shechtman's faculty page, Department of Materials Science and Engineering, Technion"}, {"quote": "1999 Wolf Prize in Physics 1998 Israel Prize in Physics 1993 Weizmann Science Award 1990 Rothschild Prize in Engineering", "locator": "סעיף Prizes, ארבע השורות הרצופות שמתחת ל-\"2000 Gregori Aminoff Prize of the Royal Swedish Academy of Sciences.\"", "published": "2011", "source_url": "https://materials.technion.ac.il/en/team/distinguished-prof-emeritus-dan-shechtman/", "source_label": "עמוד הסגל של דן שכטמן, הפקולטה למדע והנדסה של חומרים, הטכניון", "source_label_en": "Dan Shechtman's faculty page, Department of Materials Science and Engineering, Technion"}, {"quote": "2011 Nobel Prize in Chemistry 2008 European Materials Research Society (E-MRS) 25th Anniversary Award 2002 EMET Prize in Chemistry", "locator": "סעיף Prizes, שלוש השורות הראשונות", "published": "2011", "source_url": "https://materials.technion.ac.il/en/team/distinguished-prof-emeritus-dan-shechtman/", "source_label": "עמוד הסגל של דן שכטמן, הפקולטה למדע והנדסה של חומרים, הטכניון", "source_label_en": "Dan Shechtman's faculty page, Department of Materials Science and Engineering, Technion"}, {"quote": "2004 Elected member of the European Academy of Sciences. 2000 Elected member of the American National Academy of Engineering. 1996 Elected member of the Israel Academy of Sciences.", "locator": "סעיף Membership in Academies, שלוש השורות", "published": "2011", "source_url": "https://materials.technion.ac.il/en/team/distinguished-prof-emeritus-dan-shechtman/", "source_label": "עמוד הסגל של דן שכטמן, הפקולטה למדע והנדסה של חומרים, הטכניון", "source_label_en": "Dan Shechtman's faculty page, Department of Materials Science and Engineering, Technion"}, {"quote": "1999 Elected Honorary Member of the Israel Crystallographic Association", "locator": "סעיף Honorary Membership in Professional Societies, השורה השלישית", "published": "2011", "source_url": "https://materials.technion.ac.il/en/team/distinguished-prof-emeritus-dan-shechtman/", "source_label": "עמוד הסגל של דן שכטמן, הפקולטה למדע והנדסה של חומרים, הטכניון", "source_label_en": "Dan Shechtman's faculty page, Department of Materials Science and Engineering, Technion"}, {"quote": "בזמן הניסוי המכריע שלו היה שכטמן לבדו במעבדה", "locator": "עמ' 22, הפסקה על הבדידות שאחרי הגילוי", "quote_en": "During his decisive experiment Shechtman was alone in the laboratory", "published": "2011-12", "source_url": "https://www.academy.ac.il/SystemFiles/21510.pdf", "source_label": "איגרת האקדמיה הלאומית הישראלית למדעים, כסלו תשע\"ב — מאמר של פרופ' אישטוון הרגיטאי", "source_label_en": "Bulletin of the Israel Academy of Sciences and Humanities, Kislev 5772 — article by Prof. István Hargittai"}, {"quote": "זאת למרות הלחץ מצד עמיתים שבא בדמות עצה ידידותית ואף כלעג לא ידידותי כלל", "locator": "עמ' 20, הטור הימני, אחרי הציטוט מלואי פסטר", "quote_en": "This despite the pressure from colleagues, which came as friendly advice and even as decidedly unfriendly mockery", "published": "2011-12", "source_url": "https://www.academy.ac.il/SystemFiles/21510.pdf", "source_label": "איגרת האקדמיה הלאומית הישראלית למדעים, כסלו תשע\"ב — מאמר של פרופ' אישטוון הרגיטאי", "source_label_en": "Bulletin of the Israel Academy of Sciences and Humanities, Kislev 5772 — article by Prof. István Hargittai"}, {"quote": "לחסידיו של פאולינג היה קל יותר לקבל את הרעיון החדש של שכטמן לאחר מותו של פאולינג", "locator": "עמ' 24, הפסקה על לינוס פאולינג", "quote_en": "Pauling's followers found it easier to accept Shechtman's new idea after Pauling's death", "published": "2011-12", "source_url": "https://www.academy.ac.il/SystemFiles/21510.pdf", "source_label": "איגרת האקדמיה הלאומית הישראלית למדעים, כסלו תשע\"ב — מאמר של פרופ' אישטוון הרגיטאי", "source_label_en": "Bulletin of the Israel Academy of Sciences and Humanities, Kislev 5772 — article by Prof. István Hargittai"}, {"quote": "Shechtman D, Blech I, Gratias D, Cahn JW (1984) Phys Rev Lett 53: 1951–1953.", "locator": "רשימת המקורות, עמ' 25, פריט 2", "quote_en": "Shechtman D, Blech I, Gratias D, Cahn JW (1984) Phys Rev Lett 53: 1951–1953.", "published": "2011-12", "source_url": "https://www.academy.ac.il/SystemFiles/21510.pdf", "source_label": "איגרת האקדמיה הלאומית הישראלית למדעים, כסלו תשע\"ב — מאמר של פרופ' אישטוון הרגיטאי", "source_label_en": "Bulletin of the Israel Academy of Sciences and Humanities, Kislev 5772 — article by Prof. István Hargittai"}, {"quote": "I told everyone who was ready to listen that I had material with pentagonal symmetry. People just laughed at me,", "locator": "גוף הידיעה — ציטוט של שכטמן מתוך תיאור עבודתו שהפיץ הטכניון ביום ההכרזה", "published": "2011-10-05", "source_url": "https://www.npr.org/2011/10/05/141070380/israeli-chemist-wins-nobel-prize-for-quasicrystals", "source_label": "NPR, 5 באוקטובר 2011 (על בסיס חומר של Associated Press)", "source_label_en": "NPR, 5 October 2011 (based on Associated Press material)"}], "act": "ב-8 באפריל 1982, מול המיקרוסקופ האלקטרוני בגייתרסברג, ראה דן שכטמן תבנית עקיפה שספרי הקריסטלוגרפיה אסרו — והאמין לתבנית במקום לספרים.", "ripple": "המשמעות הרחבה של הגילוי אינה מסחרית אלא מושגית. ויליאם בוטינגר מ-NIST, שבמעבדתו נעשה המחקר, אמר שנים אחר כך ש\"אין יישום קטלני לחומר הזה ששינה משהו\" — \"המהפכה הייתה מושגית, לא מסחרית\". מה שהשתנה הוא ההגדרה עצמה של מהו חומר מוצק מסודר: בעקבות התגלית ואישושה שינה האיגוד הבינלאומי לקריסטלוגרפיה את הגדרת הגביש מיסודה, וגביש נמדד מאז לפי דיאגרמת העקיפה שלו ולא לפי מחזוריות סריגית. ועדת נובל לכימיה ניסחה את זה בדיוק: ההישג של שכטמן אינו רק גילוי הגבישים הקוואזי-מחזוריים, אלא ההבנה שהתוצאה חשובה והנחישות להעביר אותה לקהילה מדעית ספקנית. פרופ' פט תיאל מאוניברסיטת איווה סיכמה זאת ביום ההכרזה: \"מה שדני עשה היה מדע פנטסטי. הוא הצית מהפכה מדעית\". בישראל הוצמד לחומר בעל המבנה החדש שם משלו — \"שכטמנית\".", "title_reasoning": "12 מילים, בנוסחת [מי] [פעולה] — [הפרט שמרגש]. כל מילה נבדקה מול המקור הראשי ומול המקורות שמתחתיו: \"סימטריה אסורה\" נשען על עמוד הסגל של אוניברסיטת איווה — \"A fivefold axis is, however, forbidden in a periodic crystal\"; \"ספג לעג\" נשען על הודעת נובל (\"His discovery was extremely controversial... he was asked to leave his research group\") ועל ציטוטו שלו ב-Inside Iowa State (\"I was a subject of ridicule\"); \"שינה את הגדרת הגביש\" נשען על המידע הפופולרי של ועדת נובל (שינוי ההגדרה על ידי IUCr) ועל הודעת הטכניון. הכותרת הקודמת, \"...ושינה את תפיסת מדע החומרים\", נכשלה פעמיים: 13 מילים (המקף נספר כמילה), והיא טוענת טענה רכה ובלתי מדידה במקום הטענה החדה שהמקורות באמת תומכים בה — שההגדרה הפורמלית של \"גביש\" שונתה. לא הוכנס לכותרת \"נובל\", כדי שהכותרת תתאר את המעש ולא את הפרס.", "media_urls": ["https://www.nist.gov/sites/default/files/images/2017/03/18/shechtman_notebook.jpg", "https://www.nist.gov/sites/default/files/images/2017/03/18/the_first_view_of_the_icosohedral_phase.jpg", "https://www.nist.gov/sites/default/files/images/2019/07/02/shechtman_quasicrystals_hr.jpg", "https://www.nist.gov/sites/default/files/images/2017/04/03/john_cahn_dan_shechtman_and_denis_gratias.jpg", "https://www.nist.gov/sites/default/files/images/2019/07/30/dsc_0831_schechtman.jpg", "https://www.nist.gov/sites/default/files/images/2017/03/18/quasicrystal1.jpg", "https://www.nobelprize.org/uploads/2022/04/fig1-fig2-popular-chemistryprize2011.jpg", "https://www.nobelprize.org/uploads/2022/04/fig3-popular-chemistryprize2011.jpg", "https://www.nobelprize.org/images/shechtman-15174-portrait-medium.jpg", "https://www.nobelprize.org/images/shechtman-15174-landscape-medium.jpg"], "title_en": "Dan Shechtman saw a forbidden symmetry, endured ridicule — and changed the definition of a crystal", "description_en": "On the morning of 8 April 1982, in a laboratory of the US National Bureau of Standards (NBS, today NIST) in Gaithersburg, Maryland, Dan Shechtman — a Technion researcher on sabbatical — looked into an electron microscope and saw a diffraction pattern with tenfold symmetry. The crystallography textbooks held that such symmetry is forbidden in a periodic crystal. He counted the spots clockwise, counted again counter-clockwise, wrote \"10 Fold ???\" in his lab notebook and said to himself in Hebrew: \"there is no such creature.\" For two and a half years he could not publish; colleagues handed him textbooks and mocked him, and the head of his research group asked him to leave. In 2011 he received the Nobel Prize in Chemistry alone \"for the discovery of quasicrystals,\" and in the wake of the discovery the International Union of Crystallography changed the very definition of the word \"crystal.\"", "act_en": "On 8 April 1982, at the electron microscope in Gaithersburg, Dan Shechtman saw a diffraction pattern that the crystallography textbooks forbade — and believed the pattern rather than the books.", "ripple_en": "The broad meaning of the discovery is conceptual, not commercial. William Boettinger of NIST, in whose lab the research was done, said years later that \"there's no killer application for this material that revolutionized anything\" — \"the revolution has been conceptual, rather than commercial.\" What changed is the definition of what an ordered solid is: following the discovery and its confirmation the International Union of Crystallography changed the definition of a crystal from its foundations, and a crystal has since been judged by its diffraction diagram rather than by lattice periodicity. The Nobel Committee for Chemistry put it precisely: Shechtman's achievement is not only the discovery of quasicrystals, but the realization of the importance of this result and the determination to communicate it to a skeptical scientific community. Professor Pat Thiel of Iowa State University summed it up on the day of the announcement: \"What Danny did was fantastic science. He instigated a scientific revolution.\" In Israel the material with the new structure was given a name of its own — \"Shechtmanite.\"", "source_label_en": "Press release, The Royal Swedish Academy of Sciences — Nobel Prize in Chemistry 2011", "categories": null, "location": {"lat": 39.1352, "lng": -77.2166, "city": "גייתרסברג, מרילנד — קמפוס לשכת התקנים האמריקאית (NBS, היום NIST)", "note": "נקודת המעש היא המעבדה שבה נעשתה התצפית ב-8.4.1982. שכטמן היה אז בשבתון: מינויו הרשמי היה באוניברסיטת ג'ונס הופקינס בבולטימור, אך הוא עבד בקמפוס NBS בגייתרסברג בהזמנת ג'ון קאהן. מוסד האם שלו, שאליו חזר ושבשמו קיבל את פרס נובל, הוא הטכניון בחיפה (32.7775, 35.0231).", "city_en": "Gaithersburg, Maryland — the campus of the National Bureau of Standards (NBS, today NIST)", "country": "ארצות הברית", "precision": "site", "country_en": "United States"}, "people": [{"en": "Dan Shechtman", "he": "דן שכטמן", "role": "המגלה; פרופסור מחקר בטכניון, ומ-2004 גם פרופסור למדע החומרים באוניברסיטת איווה", "years": "נולד ב-1941"}, {"en": "John W. Cahn", "he": "ג'ון קאהן", "role": "המארח ב-NBS; דחה את הממצא בתחילה ולימים היה שותף למאמר 1984", "years": "1928–2016"}, {"en": "Ilan Blech", "he": "אילן בלך", "role": "שותף למאמר ב-Physical Review Letters, 1984", "years": "—"}, {"en": "Denis Gratias", "he": "דני גרסייה", "role": "שותף למאמר ב-Physical Review Letters, 1984", "years": "—"}, {"en": "Frank Biancaniello", "he": "פרנק ביאנקנילו", "role": "ייצר בקירור-בזק את סגסוגת האלומיניום-מנגן שבה נעשה הגילוי", "years": "—"}, {"en": "William Boettinger", "he": "ויליאם בוטינגר", "role": "ראש המעבדה ב-NBS שבה נערך המחקר", "years": "—"}, {"en": "Linus Pauling", "he": "לינוס פאולינג", "role": "המתנגד הבולט האחרון; פרסם ב-Nature ב-1985 את הסבר התיאום", "years": "1901–1994"}, {"en": "Paul Steinhardt", "he": "פול שטיינהרדט", "role": "סקר את כתב היד ופרסם עם דב לוין את המסגרת התיאורטית לקוואזי-מחזוריות", "years": "—"}, {"en": "Dov Levine", "he": "דב לוין", "role": "פיזיקאי בטכניון, שותפו של שטיינהרדט למאמר התיאורטי מסוף 1984", "years": "—"}, {"en": "An-Pang Tsai", "he": "אן-פאנג צאי", "role": "גילה ב-1987 את הפאזה האיקוסהדרלית היציבה תרמודינמית — נקודת המפנה", "years": "—"}, {"en": "Pat Thiel", "he": "פט תיאל", "role": "כימאית באוניברסיטת איווה ובמעבדת איימס; \"הוא הצית מהפכה מדעית\"", "years": "—"}], "deed_type": ["המצאה מדעית"], "actor_type": "אדם יחיד", "beneficiary": ["לאנושות כולה"], "audit": {"at": "2026-08-11T06:08:40+00:00", "by": "standard-pass/opus-5", "pre": {"act": "ב-1982 ישב דן שכטמן מהטכניון מול המיקרוסקופ האלקטרוני וראה דבר שלא יכול להתקיים לפי כל ספרי הפיזיקה: סדר מתמטי מוחלט ללא חזרה תקופתית. עמיתיו לעגו, ומנהל קבוצתו ביקשו לעזוב. הוא קיבל את ממצאיו ודבק בהם במשך שנים.", "title": "דן שכטמן גילה קריסטלים שנחשבו בלתי אפשריים — ושינה את תפיסת מדע החומרים", "ripple": "ב-2011, כמעט שלושים שנה מאוחר יותר, הכריז ועד פרס נובל: גילוי הקווזי-קריסטלים שינה ביסודו את תפיסת המדענים לגבי מה שמוצק יכול להיות. שכטמן קיבל את הפרס לבדו — ומדע החומרים לא יהיה עוד כשהיה.", "media_url":
